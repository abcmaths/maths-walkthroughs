<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Classes (Nouns, Verbs, Adjectives, Adverbs) — Bridge English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Bridge English: Word Classes (Nouns, Verbs, Adjectives, Adverbs)</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is a noun?", "teach": ["A noun is a word for a person, place, thing, or idea.", "Example: 'dog', 'Lagos', 'happiness', and 'teacher' are all nouns.", "Nouns are usually the 'who' or 'what' of a sentence."], "yt_prompt": "Find the noun in this sentence:"}, {"title": "What is a verb?", "teach": ["A verb is a 'doing' or 'being' word \u2014 it shows an action or a state.", "Example: 'ran', 'is', 'thinks', and 'jumped' are all verbs.", "Every complete sentence needs at least one verb."], "yt_prompt": "Find the verb in this sentence:"}, {"title": "What is an adjective?", "teach": ["An adjective describes a noun \u2014 it tells you more about what something is like.", "Example: in 'the happy dog', 'happy' is the adjective describing the dog.", "Adjectives usually answer the question: what kind? how many? which one?"], "yt_prompt": "Find the adjective in this sentence:"}, {"title": "What is an adverb?", "teach": ["An adverb describes a verb (or sometimes an adjective) \u2014 it tells you how, when, or where something happens.", "Example: in 'she ran quickly', 'quickly' describes how she ran.", "Many adverbs end in '-ly', but not all of them (e.g. 'fast', 'soon')."], "yt_prompt": "Find the adverb in this sentence:"}, {"title": "Identifying multiple word classes in a sentence", "teach": ["A sentence usually contains several word classes working together \u2014 nouns, verbs, adjectives, and adverbs.", "Example: 'The tall boy ran quickly.' \u2014 'boy' (noun), 'ran' (verb), 'tall' (adjective), 'quickly' (adverb).", "Practice spotting each word class separately before trying to identify them all at once."], "yt_prompt": "What word class is 'quickly' in this sentence: 'The tall boy ran quickly.'?"}, {"title": "Common nouns vs proper nouns", "teach": ["A common noun names a general thing (dog, city, teacher). A proper noun names a specific thing and starts with a capital letter (Rex, Lagos, Mrs Bello).", "Example: 'dog' is common, but 'Rex' (a specific dog's name) is proper.", "This connects to the capital letters rule you learned earlier \u2014 proper nouns always need a capital letter."], "yt_prompt": "Is this a common noun or a proper noun? Type 'common' or 'proper':"}, {"title": "Verbs showing different tenses", "teach": ["Verbs change form to show when something happens \u2014 past, present, or future.", "Example: 'walk' (present), 'walked' (past), 'will walk' (future).", "Being consistent with tense throughout a piece of writing is really important for clarity."], "yt_prompt": "What tense is this verb? Type 'past', 'present', or 'future':"}, {"title": "Choosing a strong adjective", "teach": ["Strong, specific adjectives create a clearer picture than vague ones like 'nice' or 'good'.", "Example: instead of 'a nice house', try 'a spacious house' or 'a crumbling house' \u2014 much more descriptive.", "When editing your writing, look for vague adjectives you could replace with stronger, more specific ones."], "yt_prompt": "Which adjective is more specific and descriptive \u2014 type 'nice' or 'ancient':"}, {"title": "Choosing a strong verb", "teach": ["Strong, specific verbs are more powerful than vague ones like 'went' or 'said'.", "Example: instead of 'she went quickly', try 'she dashed' or 'she sprinted' \u2014 much more vivid.", "Strong verbs can often replace a verb + adverb combination entirely."], "yt_prompt": "Which single strong verb could replace 'walked slowly and sadly'?"}, {"title": "Mixed practice \u2014 word classes", "teach": ["You've now covered nouns, verbs, adjectives, adverbs, tenses, and choosing stronger words.", "Being confident identifying word classes helps with everything from grammar rules to improving your own writing style.", "This final question brings a few of these ideas together."], "yt_prompt": "What word class is the underlined-style word 'brightly' in: 'The sun shone brightly.'?"}];
function ytGen_0() { const sentences=[['The dog barked loudly.','dog'],['Ade went to school.','school'],['Happiness filled the room.','Happiness'],['The teacher smiled.','teacher']]; const p=sentences[Math.floor(Math.random()*sentences.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_1() { const sentences=[['The dog barked loudly.','barked'],['Ade ran to school.','ran'],['She is happy.','is'],['The teacher smiled.','smiled']]; const p=sentences[Math.floor(Math.random()*sentences.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_2() { const sentences=[['The happy dog barked.','happy'],['She wore a red dress.','red'],['It was a cold morning.','cold'],['He is a tall boy.','tall']]; const p=sentences[Math.floor(Math.random()*sentences.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_3() { const sentences=[['She ran quickly.','quickly'],['He spoke softly.','softly'],['The dog barked loudly.','loudly'],['They arrived early.','early']]; const p=sentences[Math.floor(Math.random()*sentences.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_4() { return {q:'The tall boy ran quickly. What word class is "quickly"?', answer:'adverb'}; }
function ytGen_5() { const opts=[['Lagos','proper'],['city','common'],['Amara','proper'],['teacher','common']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_6() { const opts=[['She walked to school.','past'],['She walks to school.','present'],['She will walk to school.','future'],['He played football.','past']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_7() { return {q:'Which adjective paints a clearer picture: "a nice castle" or "an ancient castle"?', answer:'ancient'}; }
function ytGen_8() { return {q:'Which single word means "walked slowly and sadly"? (trudged/ran/skipped)', answer:'trudged'}; }
function ytGen_9() { return {q:'The sun shone brightly. What word class is "brightly"?', answer:'adverb'}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = '<div class="teach"><strong>Well done — topic complete!</strong><br>You can mark this as complete below.</div>';
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) window.markComplete();
}

render();
</script>
