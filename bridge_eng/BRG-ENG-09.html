<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrative Structure (Opening, Build-up, Climax, Resolution) — Bridge English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Bridge English: Narrative Structure (Opening, Build-up, Climax, Resolution)</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is narrative structure?", "teach": ["A narrative (story) is usually organised into stages: opening, build-up, climax, and resolution.", "Each stage has a specific job to do \u2014 introducing, developing, peaking, and concluding the story.", "Understanding this structure helps you both read stories more deeply and write your own more effectively."], "yt_prompt": "Which comes first in a typical story structure \u2014 'climax' or 'opening'?"}, {"title": "The opening", "teach": ["The opening introduces the setting, characters, and often hints at what the story will be about.", "Example: 'Amara had walked past the canoe every day, but today something made her stop.' \u2014 this introduces character and setting, and hints at something unusual about to happen.", "A strong opening grabs the reader's attention and sets up everything that follows."], "yt_prompt": "Does this sentence work well as a story opening? Type 'yes' or 'no': 'The old house stood silent at the end of the road, its windows dark.'"}, {"title": "The build-up", "teach": ["The build-up develops the story, adding detail, tension, or complications as events unfold.", "Example: after Amara notices the canoe, the build-up might describe her growing curiosity as she investigates it further.", "This stage usually makes up the largest part of a story, gradually leading toward the most exciting moment."], "yt_prompt": "Which sentence sounds more like build-up than an opening? Type 'A' or 'B':"}, {"title": "The climax", "teach": ["The climax is the most exciting, tense, or important moment in the story \u2014 often where the main problem is faced directly.", "Example: the moment Amara finally opens the rusted tin box and discovers what's inside is a climax moment.", "Everything in the build-up leads towards this key turning point."], "yt_prompt": "Which sentence sounds like a climax moment? Type 'A' or 'B':"}, {"title": "The resolution", "teach": ["The resolution wraps up the story, showing how the main problem is solved or how things end for the characters.", "Example: after finding the mysterious paper, the resolution might show Amara deciding to research its history at the library.", "A satisfying resolution usually connects back to what happened during the climax."], "yt_prompt": "Which sentence sounds like a resolution? Type 'A' or 'B':"}, {"title": "Putting the stages in order", "teach": ["A typical story follows this order: opening \u2192 build-up \u2192 climax \u2192 resolution.", "Being able to identify which stage a section of text belongs to helps you understand the overall shape of a story.", "Some stories play with this order for effect, but most follow this basic pattern, especially in shorter stories."], "yt_prompt": "Put these in the correct order (type numbers separated by commas, e.g. 1,2,3,4): Climax, Opening, Resolution, Build-up"}, {"title": "Using descriptive detail in the opening", "teach": ["A strong opening often uses descriptive detail to set the scene and create atmosphere.", "Example: 'The wooden hull was cracked and grey, half-buried in the sand' creates a vivid, slightly mysterious image.", "Choosing specific, sensory details (sight, sound, smell) makes an opening much more engaging than vague description."], "yt_prompt": "Which is more descriptive and engaging? Type 'A' or 'B':"}, {"title": "Building tension in the build-up", "teach": ["Tension can be built through short sentences, hinting at danger, or slowing down key moments.", "Example: 'She stepped closer. Something glinted. Her heart raced.' \u2014 short sentences speed up the pace and build excitement.", "Notice how varying sentence length affects the feeling of tension in a passage."], "yt_prompt": "Which creates more tension? Type 'A' or 'B':"}, {"title": "Linking the climax to the resolution", "teach": ["A good resolution should follow logically from what happened in the climax \u2014 it shouldn't feel random or disconnected.", "Example: if the climax is discovering an old letter, the resolution should relate to what happens as a result of that discovery.", "Check your own story endings: does the resolution actually follow from the climax, or does it feel unconnected?"], "yt_prompt": "Does this resolution logically follow the climax? Type 'yes' or 'no'. Climax: she opens a box and finds an old coin. Resolution: she decides to research the coin's history."}, {"title": "Mixed practice \u2014 narrative structure", "teach": ["You've now covered all four stages of narrative structure: opening, build-up, climax, and resolution.", "Understanding this shape helps you both analyse stories in comprehension questions and plan your own creative writing more effectively.", "This final question checks you can identify each stage confidently."], "yt_prompt": "Which stage is this: 'With one final effort, she pulled the lid free, and light spilled onto the old paper inside'? Type 'opening', 'build-up', 'climax', or 'resolution':"}];
function ytGen_0() { return {q:'Which comes first in a story: climax or opening?', answer:'opening'}; }
function ytGen_1() { return {q:'The old house stood silent at the end of the road, its windows dark. Good opening?', answer:'yes'}; }
function ytGen_2() { return {q:'A) Amara noticed something strange about the canoe and stepped closer to investigate. B) Once upon a time, there was a small village by the river.', answer:'A'}; }
function ytGen_3() { return {q:'A) She walked to the market as usual. B) With trembling hands, she finally forced the box open.', answer:'B'}; }
function ytGen_4() { return {q:'A) Amara decided to find out the full story behind the old paper. B) The canoe sat half-buried in the sand.', answer:'A'}; }
function ytGen_5() { return {q:'Climax, Opening, Resolution, Build-up — put in story order (type as e.g. 2,4,1,3)', answer:'2,4,1,3'}; }
function ytGen_6() { return {q:'A) There was a boat on the beach. B) The wooden hull was cracked and grey, half-buried in the pale sand.', answer:'B'}; }
function ytGen_7() { return {q:'A) She walked over to the box slowly and carefully picked it up, feeling quite curious about it. B) She stepped closer. Something glinted. Her heart raced.', answer:'B'}; }
function ytGen_8() { return {q:'Climax: she opens a box and finds an old coin. Resolution: she decides to research the coin\'s history. Does this follow logically?', answer:'yes'}; }
function ytGen_9() { return {q:'With one final effort, she pulled the lid free, and light spilled onto the old paper inside. Which stage is this?', answer:'climax'}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = '<div class="teach"><strong>Well done — topic complete!</strong><br>You can mark this as complete below.</div>';
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) window.markComplete();
}

render();
</script>
