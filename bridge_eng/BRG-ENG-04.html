<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech Marks & Direct Speech — Bridge English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Bridge English: Speech Marks & Direct Speech</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What are speech marks?", "teach": ["Speech marks (\" \") show the exact words someone says out loud.", "Example: Amara said, \"I am going to the market.\"", "Everything the person actually says goes inside the speech marks \u2014 nothing outside them is spoken aloud."], "yt_prompt": "Which words go inside the speech marks? Type just the spoken words:"}, {"title": "Capital letter at the start of speech", "teach": ["The first word inside the speech marks always starts with a capital letter, even in the middle of a sentence.", "Example: Amara said, \"I am going to the market.\" \u2014 'I' is capitalised because it starts the spoken words.", "This is true even if the reporting clause (Amara said) comes first."], "yt_prompt": "Is the capital letter correctly placed? Type 'yes' or 'no':"}, {"title": "Punctuation inside speech marks", "teach": ["The punctuation for the spoken sentence (full stop, question mark, exclamation mark) goes inside the speech marks.", "Example: She asked, \"Where are you going?\" \u2014 the question mark is inside, not after the closing speech mark.", "This is a very common mistake \u2014 always check the punctuation sits inside, right before the closing speech mark."], "yt_prompt": "Is the punctuation correctly placed? Type 'yes' or 'no':"}, {"title": "Comma before speech", "teach": ["When the reporting clause comes before the speech, use a comma just before the opening speech mark.", "Example: Amara said, \"I am going to the market.\"", "Don't use a full stop here \u2014 a comma is needed to link the reporting clause to the speech."], "yt_prompt": "Is the comma correctly placed? Type 'yes' or 'no':"}, {"title": "New line for a new speaker", "teach": ["Each time a different person starts speaking, start a new paragraph (new line).", "Example: \"Hello,\" said Ade. / \"Hi,\" replied Chidi. \u2014 these are on separate lines because two different people are speaking.", "This makes dialogue much easier to follow, especially in longer conversations."], "yt_prompt": "Should this dialogue be on the same line or separate lines? Type 'same' or 'separate':"}, {"title": "Speech before the reporting clause", "teach": ["When speech comes first, the reporting clause follows after the closing speech mark, often starting with a lowercase letter.", "Example: \"I am going home,\" said Amara. \u2014 note the comma inside the speech marks, and 'said' is lowercase.", "The reporting clause only gets a capital letter if it's a name at the very start of a new sentence structure."], "yt_prompt": "Is this correctly punctuated? Type 'yes' or 'no':"}, {"title": "Reported speech vs direct speech", "teach": ["Direct speech uses the exact words spoken, inside speech marks. Reported speech describes what was said, without speech marks.", "Example: Direct: Amara said, \"I am tired.\" Reported: Amara said that she was tired.", "Notice how reported speech often changes the pronoun (I \u2192 she) and sometimes the tense."], "yt_prompt": "Is this direct speech or reported speech? Type 'direct' or 'reported':"}, {"title": "Choosing strong speech verbs", "teach": ["Instead of always using 'said', choose verbs that show how something was said \u2014 like 'whispered', 'shouted', or 'muttered'.", "Example: 'shouted' shows loud, urgent speech, while 'whispered' shows quiet, secretive speech.", "Strong speech verbs help the reader picture the scene and the character's tone."], "yt_prompt": "Which verb best fits a character speaking quietly and secretly?"}, {"title": "Punctuating a full line of dialogue", "teach": ["Put together everything you've learned: capital letter, comma or full stop placement, and correct speech marks.", "Example: 'stop shouting she said angrily' becomes: \"Stop shouting,\" she said angrily.", "Work through each rule step by step rather than trying to fix everything at once."], "yt_prompt": "Punctuate this line of dialogue correctly:"}, {"title": "Mixed practice \u2014 speech punctuation", "teach": ["You've now covered speech marks, capital letters, punctuation placement, new lines for new speakers, and speech verbs.", "Dialogue punctuation is one of the trickiest areas of writing to get exactly right \u2014 well done for working through it.", "This final question brings several of these rules together."], "yt_prompt": "Punctuate this line of dialogue correctly:"}];
function ytGen_0() { const sentences=[['Chidi said, I am hungry.','I am hungry'],['She shouted, Watch out!','Watch out!'],['He whispered, Be quiet.','Be quiet.']]; const p=sentences[Math.floor(Math.random()*sentences.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_1() { const opts=[['She said, "the sun is hot."','no'],['She said, "The sun is hot."','yes'],['He shouted, "run!"','no'],['He shouted, "Run!"','yes']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_2() { const opts=[['He said, "I am tired".','no'],['He said, "I am tired."','yes'],['She asked, "Are you coming"?','no'],['She asked, "Are you coming?"','yes']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_3() { const opts=[['She said "I am ready."','no'],['She said, "I am ready."','yes'],['He shouted "Stop!"','no'],['He shouted, "Stop!"','yes']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_4() { return {q:'"Hello," said Ade. "Hi," replied Chidi.', answer:'separate'}; }
function ytGen_5() { const opts=[['"I am tired," said Ade.','yes'],['"I am tired" said Ade.','no'],['"Stop!" shouted the teacher.','yes'],['"Stop" Shouted the teacher.','no']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_6() { const opts=[['Ade said, "I am hungry."','direct'],['Ade said that he was hungry.','reported'],['"It is cold today," said Chidi.','direct'],['Chidi said it was cold that day.','reported']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_7() { return {q:'Choose the best verb: "Meet me here at midnight," she ___. (shouted/whispered/laughed)', answer:'whispered'}; }
function ytGen_8() { return {q:'watch out he shouted', answer:'"Watch out!" he shouted.'}; }
function ytGen_9() { return {q:'i am going home now said amara', answer:'"I am going home now," said Amara.'}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = '<div class="teach"><strong>Well done — topic complete!</strong><br>You can mark this as complete below.</div>';
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) window.markComplete();
}

render();
</script>

</body>
