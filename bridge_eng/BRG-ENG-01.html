<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple, Compound & Complex Sentences — Bridge English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Bridge English: Simple, Compound & Complex Sentences</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is a simple sentence?", "teach": ["A simple sentence has one main idea and one verb \u2014 it makes complete sense on its own.", "Example: 'Amara ran to school.' \u2014 one subject (Amara), one verb (ran).", "Simple doesn't mean short and boring \u2014 it just means one complete idea."], "yt_prompt": "Is this a simple sentence? Type 'yes' or 'no':"}, {"title": "What is a compound sentence?", "teach": ["A compound sentence joins two simple sentences using a connective like 'and', 'but', or 'or'.", "Example: 'Amara ran to school, but she was still late.' \u2014 two complete ideas joined together.", "Each half of a compound sentence could stand alone as its own simple sentence."], "yt_prompt": "Which connective would best join these two ideas: 'It was raining' + 'we stayed inside'?"}, {"title": "Identifying compound sentences", "teach": ["Look for two complete ideas joined by 'and', 'but', 'or', or 'so' \u2014 both halves must be able to stand alone.", "Example: 'I like rice and I like beans' is compound \u2014 both halves work as sentences on their own.", "'I like rice and beans' is NOT compound \u2014 'beans' alone isn't a full sentence."], "yt_prompt": "Is this sentence compound? Type 'yes' or 'no':"}, {"title": "What is a complex sentence?", "teach": ["A complex sentence joins a main idea with a subordinate (less important) idea, using words like 'because', 'although', 'when', or 'if'.", "Example: 'Amara was late because the bus broke down.' \u2014 the main idea (Amara was late) is joined with a reason.", "Unlike compound sentences, the subordinate part usually can't stand alone as a full sentence."], "yt_prompt": "Which word could start the subordinate clause here: '___ it was raining, we still went outside.'"}, {"title": "Identifying complex sentences", "teach": ["Look for a subordinating word (because, although, when, if, since, while) joining two parts of the sentence.", "Example: 'When the bell rang, everyone ran outside.' \u2014 'when' signals a complex sentence.", "The subordinate clause can come at the start or the end of the sentence."], "yt_prompt": "Is this sentence complex? Type 'yes' or 'no':"}, {"title": "Choosing the right connective for compound sentences", "teach": ["'And' adds information, 'but' shows contrast, 'or' shows a choice, 'so' shows a result.", "Example: 'She studied hard, so she passed the exam.' \u2014 'so' shows the result of studying.", "Choosing the right connective changes the meaning of the sentence."], "yt_prompt": "Which connective fits best: 'He was hungry, ___ he ate a snack.'"}, {"title": "Choosing the right subordinating word", "teach": ["'Because' shows a reason, 'although' shows contrast, 'when' shows time, 'if' shows a condition.", "Example: 'You will pass the test if you revise.' \u2014 'if' shows the condition needed.", "Picking the right subordinating word makes your writing much clearer."], "yt_prompt": "Which word fits best: '___ you revise, you will pass the test.'"}, {"title": "Combining two simple sentences into a compound sentence", "teach": ["Join two simple sentences with 'and', 'but', 'or', or 'so' to make one compound sentence.", "Example: 'I was tired. I kept working.' \u2192 'I was tired, but I kept working.'", "Choose the connective that best matches the relationship between the two ideas."], "yt_prompt": "Which connective best joins these: 'She wanted cake.' + 'She wanted ice cream.' (they had a choice)"}, {"title": "Combining two ideas into a complex sentence", "teach": ["Turn one of the two ideas into a subordinate clause using 'because', 'although', 'when', or 'if'.", "Example: 'The match was cancelled. It was raining.' \u2192 'The match was cancelled because it was raining.'", "Choose the subordinating word that best expresses the relationship \u2014 reason, time, contrast, or condition."], "yt_prompt": "Which word best joins these: 'The match was cancelled.' + 'It was raining.' (reason)"}, {"title": "Mixed practice \u2014 sentence types", "teach": ["You've now covered simple, compound, and complex sentences \u2014 the three main sentence types used in writing.", "Varying your sentence types makes writing more interesting and shows control over language, which examiners look for.", "This final question checks you can identify the type correctly."], "yt_prompt": "What type of sentence is this? Type 'simple', 'compound', or 'complex':"}];
function ytGen_0() { const opts=[['The dog barked.','yes'],['The dog barked and the cat ran.','no'],['She sang.','yes'],['He left because it was late.','no']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_1() { const opts=[['so','because it was raining, that is why they stayed inside — so shows result'],['and','and just adds two ideas together'],['because','because gives a reason']]; return {q:'It was raining ___ we stayed inside.', answer:'so'}; }
function ytGen_2() { const opts=[['I opened the door and I saw my friend.','yes'],['I opened the door and window.','no'],['She was tired but she kept working.','yes'],['She ate rice and beans.','no']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_3() { const opts=['Although','Because','And']; return {q:'___ it was raining, we still went outside. (choose: Although, Because, or And)', answer:'Although'}; }
function ytGen_4() { const opts=[['Because it was hot, we went swimming.','yes'],['We went swimming and it was fun.','no'],['Although she was tired, she finished her homework.','yes'],['She was tired but she carried on.','no']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_5() { return {q:'He was hungry, ___ he ate a snack. (and/but/or/so)', answer:'so'}; }
function ytGen_6() { return {q:'___ you revise, you will pass the test. (because/although/if/when)', answer:'if'}; }
function ytGen_7() { return {q:'She wanted cake. She wanted ice cream. (and/but/or)', answer:'or'}; }
function ytGen_8() { return {q:'The match was cancelled ___ it was raining. (because/although/when)', answer:'because'}; }
function ytGen_9() { const opts=[['The sun was shining.','simple'],['I ran fast, but I still lost the race.','compound'],['Although I was scared, I jumped anyway.','complex']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = '<div class="teach"><strong>Well done — topic complete!</strong><br>You can mark this as complete below.</div>';
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) window.markComplete();
}

render();
</script>
