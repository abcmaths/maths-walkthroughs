<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commas & Apostrophes — Bridge English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Bridge English: Commas & Apostrophes</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Commas in a list", "teach": ["When listing three or more items, separate each one with a comma (except before 'and' at the end).", "Example: 'I bought apples, bananas, oranges and bread.'", "Commas in a list make it much easier for the reader to see where each item starts and ends."], "yt_prompt": "Add commas to this list \u2014 type the corrected sentence:"}, {"title": "Commas after a fronted adverbial", "teach": ["When a sentence starts with a phrase describing time, place, or manner, add a comma after it before the main sentence.", "Example: 'After school, we went to the market.'", "Common fronted adverbials include 'Later that day,', 'In the morning,', and 'Suddenly,'."], "yt_prompt": "Add a comma in the correct place \u2014 type the corrected sentence:"}, {"title": "Commas in compound sentences", "teach": ["When joining two complete ideas with 'and', 'but', or 'so', add a comma just before the connective.", "Example: 'I wanted to go outside, but it was raining.'", "Not every 'and' needs a comma \u2014 only when it's joining two full sentences, not just two words."], "yt_prompt": "Add a comma in the correct place \u2014 type the corrected sentence:"}, {"title": "Apostrophes for contractions", "teach": ["An apostrophe shows where letters have been missed out when two words are joined together (a contraction).", "Example: 'do not' becomes 'don't' \u2014 the apostrophe replaces the missing 'o'.", "Common contractions: 'can't' (cannot), 'it's' (it is), 'they're' (they are)."], "yt_prompt": "Write the contraction for these two words:"}, {"title": "Apostrophes for singular possession", "teach": ["An apostrophe + 's' shows something belongs to one person or thing.", "Example: 'the dog's bone' means the bone belonging to one dog.", "Always ask: does this belong to just one person/thing? If yes, use apostrophe + s."], "yt_prompt": "Add the possessive apostrophe correctly \u2014 type the corrected phrase:"}, {"title": "Apostrophes for plural possession", "teach": ["When something belongs to more than one person, put the apostrophe after the 's' at the end of the plural word.", "Example: 'the students' books' means books belonging to several students.", "If the plural doesn't already end in 's' (like 'children'), you still add apostrophe + s: 'the children's toys'."], "yt_prompt": "Add the possessive apostrophe correctly \u2014 type the corrected phrase:"}, {"title": "Common apostrophe mistake: it's vs its", "teach": ["'It's' (with an apostrophe) always means 'it is'. 'Its' (no apostrophe) shows possession, like 'his' or 'her'.", "Example: 'The dog wagged its tail' (possession) vs 'It's a sunny day' (it is).", "This is one of the most commonly confused pairs in English \u2014 always check if you mean 'it is' before adding the apostrophe."], "yt_prompt": "Which is correct \u2014 type 'its' or \"it's\":"}, {"title": "Commas to separate extra information", "teach": ["Commas can be used to add extra information in the middle of a sentence, without changing its main meaning.", "Example: 'My brother, who is twelve, loves football.' \u2014 the comma-wrapped part is extra detail.", "If you can remove the section between the commas and the sentence still makes sense, the commas are used correctly."], "yt_prompt": "Add commas around the extra information \u2014 type the corrected sentence:"}, {"title": "Commas in direct address", "teach": ["When speaking directly to someone by name, use a comma to separate their name from the rest of the sentence.", "Example: 'Chidi, please close the door.'", "This applies whether the name comes at the start, middle, or end of the sentence."], "yt_prompt": "Add the comma correctly \u2014 type the corrected sentence:"}, {"title": "Mixed practice \u2014 commas and apostrophes", "teach": ["You've now covered commas in lists, fronted adverbials, compound sentences, and apostrophes for contractions and possession.", "These small punctuation marks make a big difference to how clearly your writing reads.", "This final question brings a couple of these rules together."], "yt_prompt": "Fix this sentence \u2014 type the corrected version:"}];
function ytGen_0() { const lists=[['I bought rice beans and yam.','I bought rice, beans and yam.'],['She likes reading writing and drawing.','She likes reading, writing and drawing.']]; const p=lists[Math.floor(Math.random()*lists.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_1() { const sentences=[['After school we went home.','After school, we went home.'],['Later that night she heard a noise.','Later that night, she heard a noise.']]; const p=sentences[Math.floor(Math.random()*sentences.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_2() { const sentences=[['I was hungry but there was no food.','I was hungry, but there was no food.'],['She studied hard so she passed the test.','She studied hard, so she passed the test.']]; const p=sentences[Math.floor(Math.random()*sentences.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_3() { const pairs=[['do not',"don't"],['can not',"can't"],['it is',"it's"],['they are',"they're"],['I am',"I'm"],['we will',"we'll"]]; const p=pairs[Math.floor(Math.random()*pairs.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_4() { const pairs=[["the girls bag","the girl's bag"],["Ades book","Ade's book"],["the cats tail","the cat's tail"]]; const p=pairs[Math.floor(Math.random()*pairs.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_5() { const pairs=[["the students books","the students' books"],["the teachers cars","the teachers' cars"],["the girls shoes","the girls' shoes"]]; const p=pairs[Math.floor(Math.random()*pairs.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_6() { const opts=[['The cat licked ___ paw.','its'],['___ raining outside.',"it's"],['___ time to go home.',"it's"],['The bird built ___ nest.','its']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_7() { return {q:'My sister who is ten years old loves to dance.', answer:'My sister, who is ten years old, loves to dance.'}; }
function ytGen_8() { const sentences=[['Ada please pass the salt.','Ada, please pass the salt.'],['Thank you Tunde for your help.','Thank you, Tunde, for your help.']]; const p=sentences[Math.floor(Math.random()*sentences.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_9() { return {q:"After the match Ades team celebrated but they were tired.", answer:"After the match, Ade's team celebrated, but they were tired."}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = '<div class="teach"><strong>Well done — topic complete!</strong><br>You can mark this as complete below.</div>';
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) window.markComplete();
}

render();
</script>

</body>
</html>
