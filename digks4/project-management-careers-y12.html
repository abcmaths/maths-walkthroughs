<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Management & Careers in Computing — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Project Management & Careers in Computing</div>
    <div class="strand">Digital Technologies · Business & Careers</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Project Management Fundamentals',teach:'<p>Project management involves planning, executing, and closing a project within defined constraints.</p><p>The "triple constraint" balances scope, time, and cost against each other.</p><p>Clear objectives and success criteria are essential from a project\'s outset.</p><p>Strong project management skills are valuable in nearly every computing career.</p>',q:'What does the "triple constraint" in project management balance?',opts:["Scope, time, and cost", "Colour, font, and layout", "Speed, volume, and pitch", "Only staff holidays"],correct:0,expl:'The triple constraint refers to the balance between a project\'s scope, time, and cost — changing one typically affects the others.'},
  {ey:'Q2',ti:'Project Planning Tools',teach:'<p>Gantt charts visually display a project\'s tasks and timeline.</p><p>Critical path analysis identifies the sequence of tasks that determines a project\'s minimum duration.</p><p>Task dependencies show which tasks must be completed before others can begin.</p><p>Good planning tools help teams stay organised and on schedule.</p>',q:'What does a Gantt chart visually display?',opts:["A project's tasks and timeline", "Only a company's financial statements", "Only network cabling layouts", "Only staff photographs"],correct:0,expl:'A Gantt chart provides a visual timeline showing a project\'s tasks and how they are scheduled over time.'},
  {ey:'Q3',ti:'Managing Project Risk',teach:'<p>Risk management identifies potential problems and plans responses in advance.</p><p>Risks can be avoided, reduced, transferred, or accepted, depending on the situation.</p><p>Regularly reviewing risks throughout a project keeps the plan realistic and current.</p><p>Effective risk management significantly improves the likelihood of overall project success.</p>',q:'What are the four common responses to identified project risks?',opts:["Avoid, reduce, transfer, or accept", "Ignore, hide, deny, or forget", "Print, delete, encrypt, or share", "Only ever accept every risk, always"],correct:0,expl:'The four common risk responses are to avoid, reduce, transfer, or accept a given risk, depending on its nature and severity.'},
  {ey:'Q4',ti:'Leadership and Team Management',teach:'<p>Effective leaders communicate clearly, delegate appropriately, and support their team.</p><p>Conflict resolution skills help address disagreements constructively within a team.</p><p>Motivated, well-supported teams tend to be more productive and produce higher quality work.</p><p>Leadership skills complement technical skills throughout a computing career.</p>',q:'What do effective leaders typically do regarding team tasks?',opts:["Delegate appropriately", "Attempt to do every task personally, alone", "Ignore all team input entirely", "Avoid any communication with the team"],correct:0,expl:'Effective leaders delegate tasks appropriately, trusting team members while maintaining clear communication and support.'},
  {ey:'Q5',ti:'Careers in Software Development',teach:'<p>Roles include front-end developer, back-end developer, full-stack developer, and mobile developer.</p><p>Portfolios showcasing real projects are highly valued by employers in this field.</p><p>Continuous learning is essential, since tools and best practices evolve constantly.</p><p>Strong problem-solving skills matter as much as specific technical knowledge.</p>',q:'What is highly valued by employers when hiring software developers?',opts:["A portfolio showcasing real projects", "Only formal certificates, with no practical evidence", "Handwriting quality", "Personal social media follower count"],correct:0,expl:'A portfolio demonstrating real, completed projects is highly valued by employers, showing practical skill beyond formal qualifications.'},
  {ey:'Q6',ti:'Careers in Data and AI',teach:'<p>Roles include data analyst, data scientist, machine learning engineer, and AI researcher.</p><p>Strong statistics, programming, and critical thinking skills support success in this field.</p><p>Demand for data and AI skills continues to grow rapidly across many industries.</p><p>Practical projects demonstrating real data analysis strengthen job applications significantly.</p>',q:'What skills particularly support success in data and AI careers?',opts:["Statistics, programming, and critical thinking", "Only artistic drawing ability", "Only physical fitness", "Only public speaking, with no technical skill"],correct:0,expl:'Strong skills in statistics, programming, and critical thinking are particularly valuable for careers in data and AI.'},
  {ey:'Q7',ti:'Careers in Cybersecurity',teach:'<p>Roles include security analyst, penetration tester, security architect, and incident responder.</p><p>Certifications (like CompTIA Security+ or CEH) can support entry into this field.</p><p>Hands-on practice, such as capture-the-flag challenges, builds practical cybersecurity skill.</p><p>Demand for cybersecurity professionals continues to significantly outpace supply globally.</p>',q:'What kind of hands-on practice can build practical cybersecurity skill?',opts:["Capture-the-flag challenges", "Only reading textbooks with no practical exercises", "Only watching unrelated videos", "Ignoring all technical practice entirely"],correct:0,expl:'Capture-the-flag challenges provide hands-on, practical exercises that build genuine cybersecurity skills in a safe environment.'},
  {ey:'Q8',ti:'Careers in Networking and Infrastructure',teach:'<p>Roles include network engineer, systems administrator, and cloud infrastructure engineer.</p><p>Certifications (like CCNA or cloud provider certifications) demonstrate recognised expertise.</p><p>These roles are essential for keeping organisations\' digital infrastructure running reliably.</p><p>Strong troubleshooting skills are central to success in these career paths.</p>',q:'What is central to success in networking and infrastructure careers?',opts:["Strong troubleshooting skills", "Only artistic design ability", "Only sales experience", "Only unrelated administrative paperwork"],correct:0,expl:'Strong troubleshooting skills are central to networking and infrastructure roles, which focus on keeping systems running reliably.'},
  {ey:'Q9',ti:'Preparing a Career Pathway',teach:'<p>Identifying personal interests and strengths helps guide a suitable career direction in computing.</p><p>Building a portfolio of projects demonstrates real, practical skill to employers.</p><p>Internships and work experience provide valuable real-world exposure.</p><p>Continuous learning remains essential throughout any long-term computing career.</p>',q:'What helps guide a suitable career direction within computing?',opts:["Identifying personal interests and strengths", "Randomly choosing any available job with no thought", "Ignoring personal interests entirely", "Only following what a friend chooses, regardless of fit"],correct:0,expl:'Identifying one\'s own genuine interests and strengths helps guide a suitable and sustainable career direction within computing.'},
  {ey:'Q10',ti:'Reflecting on the Digital Technologies Journey',teach:'<p>This course has covered foundations, programming, networks, data, security, and emerging technology.</p><p>Reflecting on this journey highlights significant personal and technical growth.</p><p>These skills provide a strong foundation for further study or direct entry into a computing career.</p><p>Digital technology will continue evolving — staying curious and adaptable remains essential.</p>',q:'What remains essential given that digital technology will continue evolving?',opts:["Staying curious and adaptable", "Assuming nothing will ever need to be learned again", "Avoiding all future technology entirely", "Relying solely on knowledge from JS1"],correct:0,expl:'Because digital technology continues to evolve rapidly, staying curious and adaptable remains essential for long-term success.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
