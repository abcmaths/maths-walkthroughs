<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerging Technologies — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Emerging Technologies</div>
    <div class="strand">Digital Technologies · Emerging Technology</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What Makes a Technology "Emerging"?',teach:'<p>Emerging technologies are new, rapidly developing, and not yet fully mainstream.</p><p>They often carry significant uncertainty about their eventual impact and adoption.</p><p>Studying emerging technology builds adaptability for an ever-changing tech landscape.</p><p>Not every emerging technology succeeds — many fade while others transform industries.</p>',q:'What generally characterises an "emerging" technology?',opts:["It is new, rapidly developing, and not yet fully mainstream", "It has existed unchanged for over 50 years", "It is guaranteed to succeed commercially", "It requires no further development at all"],correct:0,expl:'Emerging technologies are characterised by being new, rapidly evolving, and not yet widely adopted or mainstream.'},
  {ey:'Q2',ti:'Quantum Computing (Overview)',teach:'<p>Quantum computers use quantum bits (qubits), which can represent multiple states simultaneously.</p><p>This could allow certain calculations to be performed dramatically faster than classical computers.</p><p>Quantum computing remains an emerging, largely experimental field.</p><p>Potential applications include cryptography, drug discovery, and complex optimisation problems.</p>',q:'What can a qubit represent, unlike a classical bit?',opts:["Multiple states simultaneously", "Only a single fixed value of 0", "Only a single fixed value of 1", "Nothing at all"],correct:0,expl:'Unlike a classical bit (0 or 1), a qubit can represent multiple states simultaneously, a property central to quantum computing.'},
  {ey:'Q3',ti:'Extended Reality (VR/AR/MR)',teach:'<p>Virtual Reality (VR) creates fully immersive digital environments.</p><p>Augmented Reality (AR) overlays digital content onto the real world.</p><p>Mixed Reality (MR) blends real and virtual elements that can interact with each other.</p><p>These technologies are expanding into gaming, education, training, and design.</p>',q:'What does Augmented Reality (AR) do?',opts:["Overlays digital content onto the real world", "Creates a fully separate, entirely virtual world", "Removes all visual content from a device", "Only works without any screen at all"],correct:0,expl:'Augmented Reality overlays digital content onto a user\'s view of the real world, rather than replacing it entirely.'},
  {ey:'Q4',ti:'Blockchain Technology',teach:'<p>A blockchain is a distributed, tamper-resistant digital ledger of transactions.</p><p>Data is stored in linked "blocks", each referencing the previous one cryptographically.</p><p>Applications include cryptocurrencies, supply chain tracking, and secure record-keeping.</p><p>Blockchain\'s decentralised nature is both its main strength and a source of challenges.</p>',q:'What does a blockchain provide, thanks to its structure?',opts:["A distributed, tamper-resistant digital ledger", "A single centralised, easily editable database", "A type of physical hardware only", "A type of image compression"],correct:0,expl:'A blockchain provides a distributed and tamper-resistant ledger, where data is secured through linked, cryptographically connected blocks.'},
  {ey:'Q5',ti:'The Internet of Things Revisited',teach:'<p>IoT continues to expand into more devices, from wearables to industrial sensors.</p><p>5G networks are enabling faster, more responsive IoT applications.</p><p>Edge computing processes IoT data closer to its source, reducing latency.</p><p>Security remains a major, ongoing challenge as IoT adoption grows.</p>',q:'What does edge computing do for IoT data?',opts:["Processes it closer to its source, reducing latency", "Deletes it immediately after collection", "Sends it exclusively via postal mail", "Prevents it from ever being processed"],correct:0,expl:'Edge computing processes IoT data closer to where it is generated, reducing the latency involved in sending it to distant servers.'},
  {ey:'Q6',ti:'Advanced Robotics',teach:'<p>Robots are becoming more autonomous, adaptable, and capable of complex tasks.</p><p>Soft robotics uses flexible materials to interact more safely with humans and delicate objects.</p><p>Collaborative robots ("cobots") work alongside humans in shared workspaces.</p><p>Advances in AI are significantly accelerating robotics capabilities.</p>',q:'What does a "cobot" refer to?',opts:["A collaborative robot that works alongside humans", "A robot with no sensors at all", "A purely software-based virtual assistant", "A type of database"],correct:0,expl:'A "cobot" (collaborative robot) is designed to work safely and effectively alongside humans in shared workspaces.'},
  {ey:'Q7',ti:'Biotechnology and Digital Convergence',teach:'<p>Digital technology increasingly intersects with biotechnology, such as in genetic data analysis.</p><p>Wearable health devices generate large amounts of biometric data for analysis.</p><p>AI assists in analysing complex biological and medical datasets.</p><p>This convergence raises important questions about data privacy and consent.</p>',q:'What does biometric data from wearable devices typically require careful consideration of?',opts:["Data privacy and consent", "Nothing at all — it requires no special consideration", "Only device battery life", "Only Wi-Fi signal strength"],correct:0,expl:'Biometric data raises important privacy and consent considerations, given its sensitive, personal nature.'},
  {ey:'Q8',ti:'Sustainable and Green Technology',teach:'<p>Green technology aims to reduce the environmental impact of digital systems.</p><p>Energy-efficient data centres and hardware reduce overall carbon footprints.</p><p>Renewable energy increasingly powers large-scale computing infrastructure.</p><p>Sustainability is becoming an important consideration throughout the technology industry.</p>',q:'What does green technology aim to reduce?',opts:["The environmental impact of digital systems", "The total amount of available data storage", "The number of connected devices worldwide", "The speed of internet connections"],correct:0,expl:'Green technology aims to reduce the environmental impact — such as energy use and carbon emissions — of digital systems.'},
  {ey:'Q9',ti:'Evaluating Emerging Technologies',teach:'<p>Not every emerging technology becomes widely successful or adopted.</p><p>Critical evaluation considers feasibility, cost, ethical implications, and genuine usefulness.</p><p>Hype cycles often exaggerate short-term impact while underestimating long-term change.</p><p>Developing critical evaluation skills helps navigate technology trends wisely.</p>',q:'What do "hype cycles" often do regarding new technologies?',opts:["Exaggerate short-term impact while underestimating long-term change", "Accurately predict every outcome perfectly", "Have no effect on public perception at all", "Only ever apply to failed technologies"],correct:0,expl:'Hype cycles often exaggerate a technology\'s short-term impact while underestimating its eventual, longer-term significance.'},
  {ey:'Q10',ti:'Preparing for a Future of Emerging Technology',teach:'<p>Staying curious and adaptable helps navigate an unpredictable technological future.</p><p>Strong foundational skills (problem-solving, critical thinking) transfer across changing technologies.</p><p>Continuous learning is essential, since specific tools and technologies will keep evolving.</p><p>This mindset connects directly to lifelong success in any digital technology career.</p>',q:'What kind of skills transfer well across constantly changing technologies?',opts:["Foundational skills like problem-solving and critical thinking", "Only skills tied to one single specific tool, forever", "No skills transfer between technologies at all", "Only skills learned before the year 2000"],correct:0,expl:'Foundational skills like problem-solving and critical thinking transfer well, remaining valuable even as specific technologies change.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
