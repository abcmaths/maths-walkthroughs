<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Application Development — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Mobile Application Development</div>
    <div class="strand">Digital Technologies · Web & Mobile</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Introduction to Mobile Development',teach:'<p>Mobile apps run natively on smartphones/tablets or as cross-platform hybrid apps.</p><p>Native apps are built specifically for one platform (like Android or iOS).</p><p>Cross-platform frameworks (like React Native, Flutter) let one codebase target multiple platforms.</p><p>Choosing an approach depends on performance needs, budget, and target audience.</p>',q:'What is a native mobile app built specifically for?',opts:["One specific platform, like Android or iOS", "Every platform equally, with no distinction", "Only desktop computers", "Only web browsers"],correct:0,expl:'A native app is built specifically for one platform, using that platform\'s own tools and languages.'},
  {ey:'Q2',ti:'Mobile App Design Principles',teach:'<p>Mobile interfaces must work well on smaller screens with touch input.</p><p>Clear navigation and simple layouts improve mobile usability.</p><p>Consistent design patterns (like tab bars, swipe gestures) meet user expectations.</p><p>Good mobile design considers one-handed use and varying screen sizes.</p>',q:'What input method must mobile app design primarily accommodate?',opts:["Touch input", "Only keyboard and mouse", "Only voice commands", "Only physical buttons"],correct:0,expl:'Mobile apps are primarily designed around touch input, given the nature of smartphones and tablets.'},
  {ey:'Q3',ti:'Mobile App Development Tools',teach:'<p>Android Studio is commonly used for native Android development.</p><p>Xcode is used for native iOS development.</p><p>Cross-platform tools like Flutter and React Native use a single codebase for multiple platforms.</p><p>Choosing the right tool depends on target platforms and available development skills.</p>',q:'Which tool is commonly used for native iOS app development?',opts:["Xcode", "Android Studio", "Notepad", "Excel"],correct:0,expl:'Xcode is Apple\'s official development environment used for building native iOS applications.'},
  {ey:'Q4',ti:'Mobile App Data Storage',teach:'<p>Mobile apps often store data locally on the device and/or remotely via the cloud.</p><p>Local storage allows apps to work offline, syncing when a connection is available.</p><p>Cloud storage allows data to sync across multiple devices for the same user.</p><p>Balancing local and cloud storage affects app performance and reliability.</p>',q:'What advantage does local data storage provide for a mobile app?',opts:["It allows the app to work offline", "It requires no data storage at all", "It guarantees perfect security automatically", "It eliminates the need for any user interface"],correct:0,expl:'Local storage allows a mobile app to continue functioning even without an active internet connection.'},
  {ey:'Q5',ti:'Mobile App Permissions and Privacy',teach:'<p>Mobile apps often request permissions (camera, location, contacts) to function properly.</p><p>Users should be able to review and control which permissions an app has.</p><p>Requesting only necessary permissions builds user trust and follows good practice.</p><p>App stores review permission requests as part of their approval processes.</p>',q:'What is good practice regarding app permission requests?',opts:["Requesting only permissions that are genuinely necessary", "Requesting every possible permission regardless of need", "Never requesting any permissions, even when required", "Hiding permission requests from users entirely"],correct:0,expl:'Good practice involves requesting only the permissions genuinely necessary for the app\'s functionality, respecting user privacy.'},
  {ey:'Q6',ti:'Testing Mobile Applications',teach:'<p>Testing on real devices reveals issues emulators might miss.</p><p>Different screen sizes and OS versions must be tested for compatibility.</p><p>Performance testing checks app responsiveness and battery usage.</p><p>User testing gathers real feedback on usability before wide release.</p>',q:'Why is testing on real devices important, alongside emulators?',opts:["Real devices can reveal issues emulators might miss", "Emulators are always more accurate than real devices", "Testing is never necessary before release", "Only one device type ever needs testing"],correct:0,expl:'Testing on real physical devices can reveal performance and compatibility issues that emulators sometimes miss.'},
  {ey:'Q7',ti:'Publishing Mobile Apps',teach:'<p>Apps are typically published through app stores like Google Play or the Apple App Store.</p><p>Each store has its own review process and guidelines that apps must meet.</p><p>App store optimisation (ASO) helps improve an app\'s visibility in search results.</p><p>Updates can be pushed to users through the same app store distribution channels.</p>',q:'What helps improve an app\'s visibility in app store search results?',opts:["App store optimisation (ASO)", "Ignoring all store guidelines", "Removing the app's description entirely", "Publishing with no icon at all"],correct:0,expl:'App store optimisation (ASO) involves techniques to improve how easily users can find an app in store search results.'},
  {ey:'Q8',ti:'Monetisation Strategies',teach:'<p>Common mobile app monetisation methods include ads, in-app purchases, and subscriptions.</p><p>Freemium models offer basic features free, with paid upgrades for more functionality.</p><p>Choosing a monetisation strategy depends on the app\'s purpose and target audience.</p><p>Balancing monetisation with good user experience is an ongoing design challenge.</p>',q:'What does a "freemium" model typically offer?',opts:["Basic features free, with paid upgrades available", "Everything entirely free, with absolutely no paid options", "Everything paid upfront, with no free option at all", "No functionality at all until payment"],correct:0,expl:'A freemium model provides basic functionality for free while charging for additional premium features or upgrades.'},
  {ey:'Q9',ti:'Mobile Apps in the Nigerian Market',teach:'<p>Nigeria has a large and growing mobile-first user base, given widespread smartphone adoption.</p><p>Fintech, e-commerce, and entertainment apps have found particular success locally.</p><p>Designing for varying network conditions and device capabilities matters in the Nigerian market.</p><p>Understanding local user needs supports building genuinely successful mobile apps.</p>',q:'What has been particularly successful among mobile apps in the Nigerian market?',opts:["Fintech, e-commerce, and entertainment apps", "Only apps that require constant high-speed internet", "Only apps built exclusively for desktop use", "Only apps with no local relevance at all"],correct:0,expl:'Fintech, e-commerce, and entertainment apps have found particular success within Nigeria\'s growing mobile-first market.'},
  {ey:'Q10',ti:'Building a Mobile App Project',teach:'<p>Applying design, development and testing skills together produces a genuine mobile app project.</p><p>Starting with a clear, achievable scope avoids an overly ambitious first project.</p><p>Iterating based on testing feedback improves the final result significantly.</p><p>This project connects directly to the broader SS2/SS3 software development skillset.</p>',q:'What is a sensible approach when starting a first mobile app project?',opts:["Starting with a clear, achievable scope", "Attempting the most complex possible app immediately", "Skipping all testing entirely", "Avoiding any design planning beforehand"],correct:0,expl:'Starting with a clear, achievable scope helps ensure a first mobile app project can be completed successfully.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
