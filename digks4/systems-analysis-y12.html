<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Systems Analysis — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Systems Analysis</div>
    <div class="strand">Digital Technologies · Software Engineering</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Systems Analysis?',teach:'<p>Systems analysis involves studying an existing system to understand how it works and where it could improve.</p><p>Analysts investigate current processes, requirements, and pain points before proposing solutions.</p><p>This structured approach reduces the risk of building the wrong solution.</p><p>Systems analysis bridges business needs and technical implementation.</p>',q:'What does systems analysis primarily involve?',opts:["Studying an existing system to understand it and identify improvements", "Only writing final code", "Only designing a company logo", "Only formatting documents"],correct:0,expl:'Systems analysis involves studying an existing system in depth to understand how it works and identify opportunities for improvement.'},
  {ey:'Q2',ti:'Investigating Current Systems',teach:'<p>Techniques include interviews, observation, questionnaires, and document review.</p><p>Combining multiple techniques provides a more complete, accurate picture.</p><p>Understanding both what a system does and how users actually use it is essential.</p><p>Poor investigation often leads to solutions that miss real user needs.</p>',q:'Why is combining multiple investigation techniques valuable?',opts:["It provides a more complete, accurate picture of the current system", "It guarantees zero further work is needed", "It always makes the process slower with no benefit", "It replaces the need for any analysis at all"],correct:0,expl:'Using multiple techniques together, such as interviews and observation, provides a more complete and accurate understanding.'},
  {ey:'Q3',ti:'Data Flow Diagrams',teach:'<p>A Data Flow Diagram (DFD) shows how data moves through a system.</p><p>DFDs use standard symbols for processes, data stores, external entities, and data flows.</p><p>They help both technical and non-technical stakeholders understand a system visually.</p><p>DFDs are a valuable tool for planning and communicating system designs.</p>',q:'What does a Data Flow Diagram show?',opts:["How data moves through a system", "The exact programming language used", "The cost of a project", "The company's marketing strategy"],correct:0,expl:'A Data Flow Diagram visually represents how data moves between processes, data stores, and external entities within a system.'},
  {ey:'Q4',ti:'Entity-Relationship Modelling',teach:'<p>Entity-relationship (ER) diagrams model the data entities in a system and their relationships.</p><p>ER modelling supports database design, connecting directly to earlier SQL/database units.</p><p>Clear entity relationships prevent confusing or inconsistent database structures.</p><p>This modelling step typically precedes actual database implementation.</p>',q:'What does entity-relationship modelling support?',opts:["Database design, by modelling entities and their relationships", "Only visual page layout", "Only network cabling", "Only software licensing"],correct:0,expl:'Entity-relationship modelling supports database design by clearly defining data entities and the relationships between them.'},
  {ey:'Q5',ti:'Feasibility Studies',teach:'<p>A feasibility study assesses whether a proposed system is practical and worthwhile.</p><p>Technical feasibility considers whether the required technology exists and is achievable.</p><p>Economic feasibility considers whether the costs are justified by the expected benefits.</p><p>Feasibility studies help avoid investing in projects unlikely to succeed.</p>',q:'What does a feasibility study primarily assess?',opts:["Whether a proposed system is practical and worthwhile", "The exact colour scheme for the interface", "The programming language syntax only", "The physical office layout"],correct:0,expl:'A feasibility study evaluates whether a proposed system is realistically achievable and worth the required investment.'},
  {ey:'Q6',ti:'Requirements Specification',teach:'<p>A requirements specification formally documents what a system must do.</p><p>It typically includes functional requirements, non-functional requirements, and constraints.</p><p>This document becomes a key reference throughout design, development, and testing.</p><p>Ambiguous requirements often lead to costly misunderstandings later in a project.</p>',q:'What does a requirements specification formally document?',opts:["What a system must do", "The final source code", "The marketing budget", "The staff holiday schedule"],correct:0,expl:'A requirements specification formally documents the functional and non-functional requirements a system must meet.'},
  {ey:'Q7',ti:'Systems Design',teach:'<p>Systems design translates requirements into a detailed technical plan.</p><p>This includes designing the user interface, database structure, and system architecture.</p><p>Design decisions balance user needs, technical constraints, and available resources.</p><p>Good design significantly reduces problems encountered later during development.</p>',q:'What does systems design translate requirements into?',opts:["A detailed technical plan", "A finished, deployed product immediately", "A marketing campaign", "A staff training schedule"],correct:0,expl:'Systems design takes documented requirements and translates them into a detailed technical plan for implementation.'},
  {ey:'Q8',ti:'Change Management',teach:'<p>Introducing a new system often requires managing organisational change alongside technical change.</p><p>Staff training and clear communication support smoother system adoption.</p><p>Resistance to change is common and should be anticipated and addressed thoughtfully.</p><p>Successful systems projects manage both the technical and human sides of change.</p>',q:'What does successful systems implementation need to manage, alongside technical change?',opts:["Organisational/human change", "Only the budget, with nothing else", "Only the server hardware", "Only the internet connection speed"],correct:0,expl:'Successful systems implementation requires managing both technical change and the human/organisational side of adopting something new.'},
  {ey:'Q9',ti:'Legacy Systems',teach:'<p>Legacy systems are older systems still in use, sometimes difficult or costly to replace.</p><p>Migrating away from legacy systems requires careful planning to avoid disrupting operations.</p><p>Understanding legacy constraints helps analysts propose realistic, practical solutions.</p><p>Many real-world organisations must balance innovation with legacy system realities.</p>',q:'What is a "legacy system"?',opts:["An older system still in use, sometimes difficult to replace", "A brand new, unreleased system", "A system with no data stored at all", "A type of programming language"],correct:0,expl:'A legacy system is an older system that remains in active use, often because replacing it is costly or complex.'},
  {ey:'Q10',ti:'Systems Analysis in Practice',teach:'<p>Applying systems analysis to a real, chosen scenario builds genuine practical skill.</p><p>Producing clear diagrams and documentation demonstrates thorough analytical understanding.</p><p>Presenting findings to stakeholders practises real-world professional communication.</p><p>This work connects directly to the SS3 software development project.</p>',q:'What does applying systems analysis to a real scenario help build?',opts:["Genuine, practical analytical skill", "Only theoretical knowledge with no practical value", "A finished, deployed application automatically", "A marketing plan only"],correct:0,expl:'Applying systems analysis techniques to a real, chosen scenario helps build genuine, practical analytical skills.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
