<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object-Oriented Programming — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Object-Oriented Programming</div>
    <div class="strand">Digital Technologies · Programming & Software</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'OOP Concepts Revisited',teach:'<p>Object-oriented programming (OOP) organises code around objects that bundle data and behaviour together.</p><p>The four pillars of OOP are encapsulation, abstraction, inheritance, and polymorphism.</p><p>OOP helps manage complexity in large software projects.</p><p>This unit builds on the SS1 introduction to classes and objects.</p>',q:'What are the four pillars of OOP?',opts:["Encapsulation, abstraction, inheritance and polymorphism", "Printing, saving, loading and deleting", "Typing, clicking, scrolling and zooming", "Storage, memory, cache and registers"],correct:0,expl:'The four pillars of object-oriented programming are encapsulation, abstraction, inheritance, and polymorphism.'},
  {ey:'Q2',ti:'Encapsulation',teach:'<p>Encapsulation bundles data and the methods that operate on it within a single object.</p><p>It restricts direct access to some of an object\'s internal details, protecting data integrity.</p><p>"Private" attributes can only be accessed through defined methods, not directly.</p><p>Encapsulation makes code more modular and easier to maintain safely.</p>',q:'What does encapsulation primarily protect?',opts:["An object's internal data from unintended direct access", "The CPU from overheating", "The internet connection from hackers", "The monitor from screen burn"],correct:0,expl:'Encapsulation protects an object\'s internal data by restricting direct access, requiring interaction through defined methods.'},
  {ey:'Q3',ti:'Inheritance',teach:'<p>Inheritance allows a new class (child) to inherit attributes and methods from an existing class (parent).</p><p>This promotes code reuse, avoiding rewriting shared functionality repeatedly.</p><p>A child class can override or extend inherited behaviour as needed.</p><p>Inheritance models "is-a" relationships, like a "Car" being a type of "Vehicle".</p>',q:'What relationship does inheritance typically model?',opts:["An \"is-a\" relationship between classes", "A \"has-a\" relationship only", "No relationship at all", "A purely random relationship"],correct:0,expl:'Inheritance models "is-a" relationships, such as a Car being a specific type of Vehicle.'},
  {ey:'Q4',ti:'Polymorphism',teach:'<p>Polymorphism allows different classes to be treated through a common interface.</p><p>The same method name can behave differently depending on the object calling it.</p><p>This allows flexible, general code that works with multiple related object types.</p><p>Polymorphism is especially useful when working with collections of related objects.</p>',q:'What does polymorphism allow different object types to share?',opts:["A common interface/method name that behaves differently per class", "Identical, unchangeable behaviour always", "No shared behaviour whatsoever", "Only shared file formats"],correct:0,expl:'Polymorphism allows different classes to share a common method name while each implements its own specific behaviour.'},
  {ey:'Q5',ti:'Abstraction in OOP',teach:'<p>Abstraction hides complex implementation details behind a simpler interface.</p><p>Users of a class interact with its public methods, without needing to know internal workings.</p><p>Abstract classes can define a template that other classes must follow.</p><p>Good abstraction makes complex systems easier to use correctly.</p>',q:'What does abstraction hide from users of a class?',opts:["Complex internal implementation details", "The class name entirely", "All public methods", "The programming language used"],correct:0,expl:'Abstraction hides complex internal implementation details, exposing only a simpler interface for users to interact with.'},
  {ey:'Q6',ti:'Designing Classes',teach:'<p>Good class design groups related data and behaviour logically together.</p><p>Class diagrams (like UML) help visually plan classes before coding them.</p><p>Naming conventions (like capitalising class names) improve code readability.</p><p>Well-designed classes are reusable across different parts of a program or project.</p>',q:'What can help visually plan classes before coding them?',opts:["A UML class diagram", "A spreadsheet formula", "A network cable diagram", "A colour palette"],correct:0,expl:'UML (Unified Modeling Language) class diagrams help developers visually plan class structures before writing code.'},
  {ey:'Q7',ti:'Constructors',teach:'<p>A constructor initialises a new object\'s attributes when it is created.</p><p>In Python, the constructor method is named __init__.</p><p>Constructors often accept parameters to set initial attribute values.</p><p>Well-designed constructors ensure objects start in a valid, usable state.</p>',q:'In Python, what is the special method used as a constructor?',opts:["__init__", "__start__", "__main__", "__create__"],correct:0,expl:'In Python, the __init__ method is the special constructor method used to initialise new objects.'},
  {ey:'Q8',ti:'Composition vs Inheritance',teach:'<p>Composition builds complex objects by combining simpler objects ("has-a" relationships).</p><p>Inheritance builds new classes from existing ones ("is-a" relationships).</p><p>Choosing composition over inheritance can sometimes lead to more flexible designs.</p><p>Understanding both approaches helps choose the most appropriate design for a problem.</p>',q:'What kind of relationship does composition typically model?',opts:["A \"has-a\" relationship", "An \"is-a\" relationship only", "No relationship at all", "A purely temporary relationship"],correct:0,expl:'Composition models "has-a" relationships, where an object is built by combining other, simpler objects.'},
  {ey:'Q9',ti:'OOP in Real Software',teach:'<p>Most modern software (games, apps, websites) uses OOP principles extensively.</p><p>OOP supports building large, maintainable codebases with many collaborating developers.</p><p>Popular languages supporting OOP include Python, Java, C++, and C#.</p><p>Understanding OOP is essential for many professional software development roles.</p>',q:'Which of these languages commonly supports object-oriented programming?',opts:["Java", "HTML only", "CSS only", "Plain text files"],correct:0,expl:'Java is a widely used language that strongly supports object-oriented programming principles.'},
  {ey:'Q10',ti:'Building an OOP Project',teach:'<p>Applying OOP to a real project (like a simple game or booking system) builds practical skill.</p><p>Planning classes and their relationships before coding avoids messy, tangled code later.</p><p>Testing individual classes separately makes debugging more manageable.</p><p>This foundation prepares students for larger software development projects in SS3.</p>',q:'What is a benefit of testing individual classes separately during development?',opts:["It makes debugging more manageable", "It guarantees the whole program never has bugs", "It removes the need for planning entirely", "It automatically writes documentation"],correct:0,expl:'Testing classes separately isolates problems to a smaller area of code, making debugging more manageable.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
