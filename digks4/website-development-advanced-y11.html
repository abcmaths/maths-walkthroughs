<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Development (Advanced) — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Website Development (Advanced)</div>
    <div class="strand">Digital Technologies · Web & Mobile</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Full-Stack Web Development',teach:'<p>Full-stack development covers both front-end (client-side) and back-end (server-side) work.</p><p>Front-end technologies include HTML, CSS, and JavaScript frameworks.</p><p>Back-end technologies include server languages (like Python, Node.js) and databases.</p><p>Understanding both sides helps build complete, functional web applications.</p>',q:'What does "full-stack" web development typically cover?',opts:["Both front-end and back-end development", "Only visual design", "Only database administration", "Only network cabling"],correct:0,expl:'Full-stack development involves working across both the front-end (client-side) and back-end (server-side) of a web application.'},
  {ey:'Q2',ti:'Front-End Frameworks',teach:'<p>Frameworks like React, Vue, or Angular help build complex, interactive user interfaces.</p><p>They provide reusable components, reducing repetitive coding.</p><p>Frameworks often use a "component-based" approach to structuring an interface.</p><p>Learning a framework builds on core HTML, CSS, and JavaScript knowledge.</p>',q:'What do front-end frameworks commonly provide to reduce repetitive coding?',opts:["Reusable components", "Server hosting only", "Database storage only", "Physical hardware"],correct:0,expl:'Front-end frameworks provide reusable components that developers can combine to build interfaces more efficiently.'},
  {ey:'Q3',ti:'Back-End Development Basics',teach:'<p>Back-end code handles data processing, business logic, and database interactions.</p><p>A web server receives requests and sends appropriate responses back to the client.</p><p>Popular back-end languages include Python, JavaScript (Node.js), and PHP.</p><p>Back-end development is essential for dynamic, data-driven websites.</p>',q:'What does back-end code typically handle?',opts:["Data processing and database interactions", "Only visual styling", "Only image editing", "Only font selection"],correct:0,expl:'Back-end code manages data processing, business logic, and interactions with databases behind the scenes.'},
  {ey:'Q4',ti:'RESTful APIs',teach:'<p>A REST API provides a standardised way for a front-end to communicate with a back-end.</p><p>REST APIs commonly use HTTP methods: GET, POST, PUT, and DELETE.</p><p>Data is often exchanged in JSON format between client and server.</p><p>Understanding REST APIs is essential for connecting front-end and back-end systems.</p>',q:'Which HTTP method is commonly used to retrieve data from a REST API?',opts:["GET", "ERASE", "FORMAT", "PRINT"],correct:0,expl:'GET is the standard HTTP method used to retrieve (read) data from a REST API.'},
  {ey:'Q5',ti:'Authentication and Authorisation',teach:'<p>Authentication verifies a user\'s identity, often via username and password.</p><p>Authorisation determines what an authenticated user is allowed to do.</p><p>Secure authentication uses hashed passwords, never storing plain text passwords.</p><p>Session tokens or JWTs (JSON Web Tokens) help maintain a user\'s logged-in state securely.</p>',q:'What does authentication primarily verify?',opts:["A user's identity", "A user's exact location", "A user's internet speed", "A user's favourite colour"],correct:0,expl:'Authentication is the process of verifying a user\'s claimed identity, typically through credentials like a password.'},
  {ey:'Q6',ti:'Web Hosting and Deployment',teach:'<p>Deploying a website makes it accessible to the public over the internet.</p><p>Hosting platforms range from simple static hosting to full cloud server management.</p><p>Domain names and DNS settings must correctly point to the hosting server.</p><p>Testing a deployed site thoroughly avoids embarrassing live errors.</p>',q:'What must domain names and DNS settings correctly do?',opts:["Point to the correct hosting server", "Delete old website versions automatically", "Encrypt all website traffic automatically", "Format all website text"],correct:0,expl:'DNS settings must correctly direct a domain name to the appropriate hosting server so visitors reach the right website.'},
  {ey:'Q7',ti:'Mobile-Responsive and Progressive Web Apps',teach:'<p>Progressive Web Apps (PWAs) combine website flexibility with app-like features.</p><p>PWAs can work offline and be added to a phone\'s home screen like a native app.</p><p>Responsive design remains essential, since users access sites from many device types.</p><p>PWAs are an increasingly popular way to reach mobile users without building separate native apps.</p>',q:'What is a key feature that distinguishes a Progressive Web App (PWA)?',opts:["It can work offline and behave like a native app", "It only works on desktop computers", "It cannot be added to a home screen", "It requires no internet connection ever, even initially"],correct:0,expl:'PWAs can work offline and be added to a home screen, giving them app-like behaviour while remaining web-based.'},
  {ey:'Q8',ti:'Testing and Debugging Web Applications',teach:'<p>Browser developer tools help inspect, debug, and troubleshoot web applications.</p><p>Automated testing checks that code continues to work correctly as it changes.</p><p>Cross-browser testing ensures consistent behaviour across different browsers.</p><p>Thorough testing before launch reduces the risk of costly post-launch bugs.</p>',q:'What do browser developer tools primarily help with?',opts:["Inspecting, debugging and troubleshooting web applications", "Only changing the desktop wallpaper", "Only printing documents", "Only managing email accounts"],correct:0,expl:'Browser developer tools provide facilities to inspect, debug, and troubleshoot issues within a web application.'},
  {ey:'Q9',ti:'Web Application Security',teach:'<p>Common web vulnerabilities include SQL injection, cross-site scripting (XSS), and CSRF.</p><p>Validating and sanitising all user input helps prevent many common attacks.</p><p>Keeping frameworks and dependencies updated closes known security holes.</p><p>Security should be considered throughout development, not just at the end.</p>',q:'What does sanitising user input help prevent?',opts:["Common web application attacks", "Faster loading times only", "Better visual design only", "Increased server storage"],correct:0,expl:'Sanitising user input helps prevent common attacks like SQL injection and cross-site scripting (XSS).'},
  {ey:'Q10',ti:'Building a Complete Web Application',teach:'<p>Combining front-end, back-end, database and security skills creates a genuinely complete web application.</p><p>Agile development practices help manage complex projects through iterative progress.</p><p>Documenting code and decisions supports future maintenance and collaboration.</p><p>This capstone-style project connects directly to the SS3 software development unit.</p>',q:'What development approach helps manage complex projects through iterative progress?',opts:["Agile development practices", "Ignoring all planning entirely", "Building the entire project in one single step with no testing", "Working alone with zero documentation"],correct:0,expl:'Agile development practices break complex projects into iterative stages, helping manage complexity and change over time.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

    }, { onConflict: 'student_id,topic_id' });

</script>
</body>
</html>
