<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Development — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Web Development</div>
    <div class="strand">Digital Technologies · Web & Software</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Reviewing Web Foundations',teach:'<p>This unit builds on JS3 web technologies with deeper HTML, CSS and JavaScript skills.</p><p>Students move from simple static pages toward more structured, styled, interactive sites.</p><p>Good web development balances structure (HTML), style (CSS), and behaviour (JavaScript).</p><p>Real-world web development also considers performance, accessibility, and maintainability.</p>',q:'What three technologies does web development typically balance?',opts:["HTML, CSS, and JavaScript", "Only Python and SQL", "Only Excel and Word", "Only PowerPoint and PDF"],correct:0,expl:'Web development typically balances HTML (structure), CSS (style), and JavaScript (behaviour) together.'},
  {ey:'Q2',ti:'Semantic HTML',teach:'<p>Semantic HTML uses tags that describe their meaning, like <header>, <nav>, <article>, <footer>.</p><p>This improves accessibility for screen readers and clarity for other developers.</p><p>Semantic tags also help search engines better understand page content.</p><p>Using generic <div> tags for everything is considered poor modern practice.</p>',q:'What is an advantage of semantic HTML tags like <header> and <footer>?',opts:["They improve accessibility and clarity of meaning", "They make pages load slower", "They remove the need for CSS", "They automatically translate content"],correct:0,expl:'Semantic tags describe their content\'s meaning, improving accessibility for screen readers and clarity for developers and search engines.'},
  {ey:'Q3',ti:'CSS Layout: Flexbox',teach:'<p>Flexbox is a modern CSS layout method for arranging items in rows or columns.</p><p>It makes aligning and distributing space among items much easier than older methods.</p><p>Flexbox is widely used for navigation bars, card layouts, and centring content.</p><p>Understanding Flexbox is a key modern web development skill.</p>',q:'What is Flexbox primarily used for in CSS?',opts:["Arranging and aligning items in rows or columns", "Encrypting website data", "Connecting to a database", "Writing server-side code"],correct:0,expl:'Flexbox is a CSS layout method specifically designed for arranging and aligning items along rows or columns.'},
  {ey:'Q4',ti:'Responsive Design in Practice',teach:'<p>Media queries apply different CSS rules based on screen size.</p><p>A "mobile-first" approach designs for small screens before scaling up.</p><p>Flexible units (like %, vw, vh) help layouts adapt to different screen sizes.</p><p>Testing on multiple device sizes ensures a genuinely responsive design.</p>',q:'What does a CSS media query allow a developer to do?',opts:["Apply different styles based on screen size", "Only change font colour", "Only add images", "Only connect to a database"],correct:0,expl:'A media query lets developers apply different CSS rules depending on conditions like screen width, enabling responsive design.'},
  {ey:'Q5',ti:'JavaScript DOM Manipulation',teach:'<p>The DOM (Document Object Model) represents a webpage\'s structure as objects JavaScript can access.</p><p>JavaScript can select elements and change their content, style, or behaviour dynamically.</p><p>Event listeners let JavaScript respond to user actions, like clicks or form submissions.</p><p>DOM manipulation is what makes webpages feel interactive rather than static.</p>',q:'What does the DOM represent?',opts:["A webpage's structure as objects JavaScript can access", "A type of database", "A type of image format", "A type of server"],correct:0,expl:'The DOM represents a webpage\'s structure as a tree of objects that JavaScript can access and manipulate.'},
  {ey:'Q6',ti:'Forms and User Input',teach:'<p>HTML forms collect user input through fields like text boxes, checkboxes, and buttons.</p><p>JavaScript can validate form input before it is submitted.</p><p>Server-side validation is also essential, since client-side checks can be bypassed.</p><p>Good form design improves usability and reduces user errors.</p>',q:'Why is server-side validation still necessary even with JavaScript validation?',opts:["Because client-side checks can be bypassed", "Because JavaScript cannot validate anything", "Because forms never need validation", "Because server-side validation is always automatic"],correct:0,expl:'Client-side JavaScript validation can be bypassed by a user, so server-side validation is still essential for security and data integrity.'},
  {ey:'Q7',ti:'Client-Side vs Server-Side',teach:'<p>Client-side code (like JavaScript in a browser) runs on the user\'s device.</p><p>Server-side code runs on a remote server, often handling data storage and business logic.</p><p>Full-stack development involves working with both client-side and server-side code.</p><p>Understanding this distinction is essential for building complete web applications.</p>',q:'Where does client-side code typically run?',opts:["On the user's own device", "Only on a remote server", "Only inside a database", "Nowhere — it never actually runs"],correct:0,expl:'Client-side code, such as JavaScript running in a browser, executes directly on the user\'s own device.'},
  {ey:'Q8',ti:'APIs and Fetching Data',teach:'<p>An API (Application Programming Interface) lets different software systems communicate.</p><p>JavaScript\'s fetch() function can request data from an API, often in JSON format.</p><p>APIs allow websites to display dynamic, up-to-date data from external sources.</p><p>Understanding APIs is essential for building modern, data-driven web applications.</p>',q:'What does an API allow different software systems to do?',opts:["Communicate with each other", "Only display static text", "Only store passwords", "Only change font colour"],correct:0,expl:'An API (Application Programming Interface) provides a defined way for different software systems to communicate and exchange data.'},
  {ey:'Q9',ti:'Web Performance and Optimisation',teach:'<p>Optimising images and code reduces page load times.</p><p>Minifying CSS/JavaScript removes unnecessary characters to reduce file size.</p><p>Caching allows browsers to store and reuse resources instead of re-downloading them.</p><p>Fast-loading websites improve user experience and search engine rankings.</p>',q:'What does "minifying" CSS/JavaScript code do?',opts:["Removes unnecessary characters to reduce file size", "Adds more comments for clarity", "Increases the number of files", "Deletes all functionality"],correct:0,expl:'Minifying code removes unnecessary characters (like whitespace and comments) to reduce file size and improve loading speed.'},
  {ey:'Q10',ti:'Building a Complete Webpage Project',teach:'<p>Combining semantic HTML, responsive CSS and interactive JavaScript creates a complete, professional webpage.</p><p>Testing across devices and browsers ensures consistent behaviour for all users.</p><p>Version control (like Git) helps manage changes during development.</p><p>This project-based approach connects directly to real-world web development practice.</p>',q:'What tool helps developers manage changes during a web development project?',opts:["Version control, such as Git", "A calculator only", "A printer", "A single unshared text file with no history"],correct:0,expl:'Version control systems like Git help developers track and manage changes throughout a web development project.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
