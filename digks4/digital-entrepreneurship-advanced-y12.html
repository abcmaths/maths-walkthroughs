<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Entrepreneurship (Advanced) — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Digital Entrepreneurship (Advanced)</div>
    <div class="strand">Digital Technologies · Business & Careers</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'From Idea to Business Plan',teach:'<p>A business plan formally documents a venture\'s goals, market, strategy, and finances.</p><p>Market analysis identifies target customers, competitors, and genuine demand.</p><p>A clear value proposition explains why customers would choose this product or service.</p><p>Investors and partners often expect a well-prepared, realistic business plan.</p>',q:'What does a value proposition explain?',opts:["Why customers would choose this product or service", "The exact office location", "The founder's personal biography only", "The company's internal staff structure"],correct:0,expl:'A value proposition clearly explains why a customer would choose a particular product or service over alternatives.'},
  {ey:'Q2',ti:'Funding a Digital Startup',teach:'<p>Funding sources include personal savings, loans, angel investors, venture capital, and grants.</p><p>Different funding types come with different expectations around control and repayment.</p><p>Nigeria\'s startup ecosystem has attracted significant investment in fintech and e-commerce.</p><p>Choosing appropriate funding depends on a business\'s stage, goals, and risk tolerance.</p>',q:'What is one funding source available to digital startups?',opts:["Angel investors", "Only government-issued paper currency printed specifically for startups", "Only inherited family businesses", "Only lottery winnings"],correct:0,expl:'Angel investors are individuals who provide capital to startups, typically in exchange for equity or convertible debt.'},
  {ey:'Q3',ti:'Scaling a Digital Business',teach:'<p>Scaling means growing a business\'s revenue and reach without proportionally increasing costs.</p><p>Automation and efficient processes support scalable growth.</p><p>Digital businesses often scale faster than traditional ones, due to lower marginal costs.</p><p>Poor planning during rapid growth can create serious operational challenges.</p>',q:'What does "scaling" a business generally mean?',opts:["Growing revenue and reach without proportionally increasing costs", "Making a business smaller and more local", "Removing all customers deliberately", "Reducing all technology use"],correct:0,expl:'Scaling means growing a business\'s revenue and reach efficiently, without costs increasing at the same rate.'},
  {ey:'Q4',ti:'Digital Marketing Strategy',teach:'<p>A digital marketing strategy defines target audience, channels, messaging, and goals.</p><p>Data analytics help measure what marketing approaches are actually working.</p><p>Content marketing, social media, and SEO are common digital marketing components.</p><p>A coherent strategy avoids wasted effort across disconnected marketing activities.</p>',q:'What helps measure whether digital marketing approaches are actually working?',opts:["Data analytics", "Guessing based on personal feelings only", "Ignoring all customer data entirely", "Random selection with no measurement"],correct:0,expl:'Data analytics provide measurable evidence of which marketing approaches are effective, guiding better strategic decisions.'},
  {ey:'Q5',ti:'E-commerce Operations at Scale',teach:'<p>Inventory management, logistics, and customer service all become more complex as e-commerce grows.</p><p>Automation tools help manage orders, shipping, and customer communications efficiently.</p><p>Customer trust and satisfaction remain essential, even as operations scale up.</p><p>Operational excellence often distinguishes successful e-commerce businesses from failing ones.</p>',q:'What tends to help manage growing e-commerce complexity efficiently?',opts:["Automation tools", "Manually processing every single order individually forever", "Ignoring customer service entirely", "Removing all inventory tracking"],correct:0,expl:'Automation tools help manage the increasing complexity of orders, shipping, and customer communications as e-commerce businesses grow.'},
  {ey:'Q6',ti:'Legal and Regulatory Considerations',teach:'<p>Digital businesses must comply with relevant laws: data protection, consumer rights, taxation.</p><p>Understanding intellectual property protects a business\'s own innovations.</p><p>Terms of service and privacy policies set clear expectations with customers.</p><p>Legal compliance protects both the business and its customers from harm.</p>',q:'What do terms of service and privacy policies help set with customers?',opts:["Clear expectations", "No expectations at all", "Only marketing promises with no legal standing", "Only technical specifications"],correct:0,expl:'Terms of service and privacy policies set clear, documented expectations between a business and its customers.'},
  {ey:'Q7',ti:'Building a Team',teach:'<p>As a digital business grows, hiring and managing a team becomes increasingly important.</p><p>Clear roles and communication help a growing team work effectively together.</p><p>Company culture significantly affects staff retention and overall performance.</p><p>Balancing technical and business skills within a team supports sustainable growth.</p>',q:'What significantly affects staff retention in a growing business?',opts:["Company culture", "Only the exact office paint colour", "Only the brand of computer used", "Nothing measurable at all"],correct:0,expl:'Company culture significantly influences whether staff choose to stay with and remain engaged in a growing business.'},
  {ey:'Q8',ti:'Measuring Business Success',teach:'<p>Key Performance Indicators (KPIs) track progress toward specific business goals.</p><p>Metrics like revenue growth, customer acquisition cost, and retention rate matter for digital businesses.</p><p>Regularly reviewing KPIs helps a business adapt its strategy as needed.</p><p>Choosing the right KPIs focuses attention on what genuinely matters for success.</p>',q:'What do Key Performance Indicators (KPIs) help track?',opts:["Progress toward specific business goals", "Only the office temperature", "Only the number of emails sent", "Only unrelated personal hobbies"],correct:0,expl:'KPIs (Key Performance Indicators) are specific, measurable values that track progress toward defined business goals.'},
  {ey:'Q9',ti:'Failure and Resilience in Entrepreneurship',teach:'<p>Many startups fail, often due to poor market fit, cash flow problems, or team issues.</p><p>Learning from failure is a normal, valuable part of the entrepreneurial process.</p><p>Resilience and adaptability help entrepreneurs recover from setbacks and try again.</p><p>A realistic understanding of risk helps set appropriate expectations for new ventures.</p>',q:'What is often a normal, valuable part of the entrepreneurial process?',opts:["Learning from failure", "Guaranteed success on the very first attempt, always", "Avoiding all risk completely", "Never starting a business at all"],correct:0,expl:'Learning from failure is widely recognised as a normal and valuable part of the entrepreneurial journey.'},
  {ey:'Q10',ti:'The Future of Digital Entrepreneurship in Nigeria',teach:'<p>Nigeria\'s young population and growing digital infrastructure support continued entrepreneurial growth.</p><p>Government and private initiatives increasingly support tech startups and innovation hubs.</p><p>Challenges remain, including funding access, infrastructure, and regulatory clarity.</p><p>Understanding this landscape helps aspiring entrepreneurs plan realistically for the future.</p>',q:'What supports continued digital entrepreneurial growth in Nigeria, according to current trends?',opts:["A young population and growing digital infrastructure", "A shrinking population with no digital access", "A complete absence of any government involvement", "No interest in technology whatsoever"],correct:0,expl:'Nigeria\'s young population and expanding digital infrastructure are cited as key factors supporting continued entrepreneurial growth.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
