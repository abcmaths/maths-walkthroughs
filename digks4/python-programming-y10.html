<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Programming — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Python Programming</div>
    <div class="strand">Digital Technologies · Programming & Algorithms</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Reviewing and Extending Python',teach:'<p>SS1 Python builds on JS3 foundations with more advanced structures and problem-solving.</p><p>Programs now combine multiple functions, data structures, and control flow together.</p><p>Good coding style (clear names, comments, consistent formatting) becomes increasingly important.</p><p>This unit prepares students for more advanced software development work ahead.</p>',q:'What does SS1 Python programming build on?',opts:["JS3 Python foundations, with more advanced structures", "Nothing — it starts completely from scratch", "Only Scratch block programming", "Only spreadsheet formulas"],correct:0,expl:'SS1 Python content extends the foundational Python concepts introduced in JS3 with more advanced structures and problem-solving.'},
  {ey:'Q2',ti:'Working with Strings',teach:'<p>Strings can be sliced, concatenated, and searched using built-in methods.</p><p>Common string methods include .upper(), .lower(), .split(), and .replace().</p><p>String formatting (like f-strings) makes combining text and variables easier.</p><p>Careful string handling is essential for processing user input and text data.</p>',q:'Which Python method converts a string to uppercase?',opts:[".upper()", ".split()", ".replace()", ".lower()"],correct:0,expl:'The .upper() method converts all characters in a string to uppercase.'},
  {ey:'Q3',ti:'Lists and List Methods',teach:'<p>Lists can be modified using methods like .append(), .remove(), and .sort().</p><p>List slicing lets you access a subset of items, e.g. my_list[1:3].</p><p>List comprehensions provide a concise way to build new lists from existing ones.</p><p>Mastering lists is essential for handling collections of data efficiently.</p>',q:'Which method adds an item to the end of a Python list?',opts:[".append()", ".remove()", ".sort()", ".pop()"],correct:0,expl:'The .append() method adds a new item to the end of a Python list.'},
  {ey:'Q4',ti:'Dictionaries',teach:'<p>A dictionary stores data as key-value pairs, e.g. {{"name": "Ada"}}.</p><p>Values are accessed using their corresponding key, not a numeric index.</p><p>Dictionaries are useful for representing structured, labelled data.</p><p>Understanding dictionaries prepares students for more advanced data handling, like JSON.</p>',q:'How is data accessed in a Python dictionary?',opts:["Using its corresponding key", "Using only a numeric index", "Randomly", "It cannot be accessed"],correct:0,expl:'Dictionary values are accessed using their associated key, rather than a numeric index like in a list.'},
  {ey:'Q5',ti:'Functions and Scope',teach:'<p>Functions can return multiple values and accept default parameter values.</p><p>Variable scope determines where in a program a variable can be accessed.</p><p>Local variables exist only within their function; global variables exist throughout the program.</p><p>Understanding scope prevents confusing bugs related to variable access.</p>',q:'What does variable "scope" determine?',opts:["Where in a program a variable can be accessed", "The colour of the variable", "The exact value of a variable at all times", "How fast the CPU runs"],correct:0,expl:'Scope determines the region of a program where a particular variable can be accessed or modified.'},
  {ey:'Q6',ti:'Error Handling with Try/Except',teach:'<p>"Try/except" blocks let a program handle errors gracefully instead of crashing.</p><p>Common exceptions include ValueError, TypeError, and ZeroDivisionError.</p><p>Handling errors properly improves the reliability and user experience of a program.</p><p>Good error handling anticipates likely problems, like invalid user input.</p>',q:'What does a try/except block help a program do?',opts:["Handle errors gracefully instead of crashing", "Run faster automatically", "Delete all variables", "Connect to a network"],correct:0,expl:'Try/except blocks allow a program to catch and handle errors gracefully, rather than crashing unexpectedly.'},
  {ey:'Q7',ti:'File Handling in Python',teach:'<p>Python can read from and write to files using functions like open(), .read(), and .write().</p><p>Files should be properly closed after use, or opened using a "with" statement.</p><p>File handling enables programs to save and load data between sessions.</p><p>Understanding file modes (read, write, append) is essential for correct file handling.</p>',q:'What Python statement helps ensure a file is properly closed after use?',opts:["A \"with\" statement", "A \"print\" statement", "A \"for\" loop", "An \"import\" statement"],correct:0,expl:'Using a "with" statement automatically ensures a file is properly closed after its block of code finishes.'},
  {ey:'Q8',ti:'Object-Oriented Programming: Introduction',teach:'<p>A class is a blueprint for creating objects with shared properties and behaviours.</p><p>An object is a specific instance created from a class.</p><p>Attributes store an object\'s data; methods define its behaviours.</p><p>This introduces the object-oriented concepts explored more deeply in SS2.</p>',q:'What is a "class" in Python?',opts:["A blueprint for creating objects", "A type of loop", "A type of file", "A type of error message"],correct:0,expl:'A class defines a blueprint — the structure and behaviour — from which individual objects can be created.'},
  {ey:'Q9',ti:'Algorithms: Searching and Sorting in Python',teach:'<p>Python can implement both linear and binary search algorithms directly in code.</p><p>Sorting algorithms like bubble sort can be implemented and analysed for efficiency.</p><p>Comparing algorithm performance introduces the idea of computational efficiency.</p><p>This connects programming practice directly to earlier computational thinking work.</p>',q:'Which Python search algorithm requires the data to already be sorted?',opts:["Binary search", "Linear search", "Neither requires sorted data", "Both require sorted data"],correct:0,expl:'A binary search requires the data to be sorted, since it works by repeatedly halving the search range.'},
  {ey:'Q10',ti:'Building a Complete Python Program',teach:'<p>Combining strings, lists, dictionaries, functions and error handling builds substantial programs.</p><p>Planning with pseudocode or flowcharts remains valuable even for larger Python projects.</p><p>Testing thoroughly, including edge cases, ensures reliability.</p><p>This prepares students for the more advanced OOP and web development work ahead.</p>',q:'What remains valuable even for larger, more advanced Python projects?',opts:["Planning with pseudocode or flowcharts", "Skipping all testing", "Avoiding all functions", "Ignoring error handling entirely"],correct:0,expl:'Careful planning, such as using pseudocode or flowcharts, remains valuable even as Python projects become more advanced and complex.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
