<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockchain & Cloud Services — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Blockchain & Cloud Services</div>
    <div class="strand">Digital Technologies · Emerging Technology</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Blockchain in Depth',teach:'<p>A blockchain distributes copies of its ledger across many participants, rather than one central authority.</p><p>Consensus mechanisms (like proof-of-work or proof-of-stake) agree on valid new blocks.</p><p>This decentralisation makes blockchains resistant to single points of failure or tampering.</p><p>Understanding these mechanisms clarifies both blockchain\'s strengths and its limitations.</p>',q:'What does a blockchain consensus mechanism help achieve?',opts:["Agreement among participants on valid new blocks", "A single central authority controlling everything", "Guaranteed instant transactions with zero delay", "Complete elimination of any computing power needed"],correct:0,expl:'Consensus mechanisms allow distributed participants to agree on which new blocks are valid, without needing a central authority.'},
  {ey:'Q2',ti:'Cryptocurrencies',teach:'<p>Cryptocurrencies are digital currencies secured using cryptography and blockchain technology.</p><p>Bitcoin was the first major cryptocurrency, introduced in 2009.</p><p>Cryptocurrency values can be highly volatile compared to traditional currencies.</p><p>Understanding both potential and risks is important before engaging with cryptocurrency.</p>',q:'What technology secures cryptocurrencies?',opts:["Cryptography and blockchain technology", "Only traditional bank vaults", "Only paper certificates", "Only physical coins"],correct:0,expl:'Cryptocurrencies are secured using cryptographic techniques combined with blockchain technology.'},
  {ey:'Q3',ti:'Smart Contracts',teach:'<p>A smart contract is self-executing code that runs automatically when agreed conditions are met.</p><p>Smart contracts can automate agreements without needing a traditional intermediary.</p><p>They are commonly built on blockchain platforms like Ethereum.</p><p>Errors in smart contract code can have serious, sometimes irreversible, consequences.</p>',q:'What triggers a smart contract to execute?',opts:["Agreed conditions being met", "A phone call to a lawyer", "A postal letter arriving", "Nothing — they never execute automatically"],correct:0,expl:'A smart contract automatically executes its code once its predefined conditions have been met.'},
  {ey:'Q4',ti:'Blockchain Beyond Currency',teach:'<p>Supply chain tracking uses blockchain to verify the authenticity and journey of goods.</p><p>Digital identity systems can use blockchain to give people more control over personal data.</p><p>Voting systems have been explored as a potential (though debated) blockchain application.</p><p>Blockchain\'s core strength — trustworthy, shared records — applies well beyond just currency.</p>',q:'What blockchain application helps verify the authenticity and journey of goods?',opts:["Supply chain tracking", "Only cryptocurrency trading", "Only video streaming", "Only email delivery"],correct:0,expl:'Blockchain-based supply chain tracking helps verify and record the authentic journey of goods from origin to destination.'},
  {ey:'Q5',ti:'Cloud Service Models Revisited',teach:'<p>IaaS, PaaS, and SaaS represent increasing levels of managed service and decreasing customer control.</p><p>Choosing a service model depends on technical expertise, cost, and control needs.</p><p>Multi-cloud strategies use more than one cloud provider to reduce dependency risk.</p><p>Understanding these models supports informed technology and business decisions.</p>',q:'What does a "multi-cloud" strategy help reduce?',opts:["Dependency risk on a single cloud provider", "The total number of available features", "The need for any internet connection", "The overall cost to zero, always"],correct:0,expl:'A multi-cloud strategy uses multiple providers, reducing an organisation\'s dependency and risk if one provider experiences issues.'},
  {ey:'Q6',ti:'Serverless Computing',teach:'<p>Serverless computing lets developers run code without managing the underlying servers directly.</p><p>Code runs in response to events, automatically scaling as needed.</p><p>This can reduce operational overhead and cost for certain types of applications.</p><p>Despite the name, servers are still involved — just managed entirely by the cloud provider.</p>',q:'What does serverless computing free developers from managing directly?',opts:["The underlying servers", "All application code entirely", "The need for any cloud provider", "The internet itself"],correct:0,expl:'Serverless computing frees developers from directly managing the underlying servers, letting the cloud provider handle that infrastructure.'},
  {ey:'Q7',ti:'Data Sovereignty and Cloud Regulation',teach:'<p>Data sovereignty concerns where data is physically stored and which laws apply to it.</p><p>Some countries and industries require data to be stored within specific jurisdictions.</p><p>Cloud providers now offer regional data centres to help meet these requirements.</p><p>Understanding data sovereignty is increasingly important for global cloud usage.</p>',q:'What does "data sovereignty" concern?',opts:["Where data is stored and which laws apply to it", "Only the speed of a cloud service", "Only the visual design of an app", "Only the cost of cloud storage"],correct:0,expl:'Data sovereignty concerns the physical location of stored data and which country\'s laws govern its use and protection.'},
  {ey:'Q8',ti:'Blockchain and Cloud Integration',teach:'<p>Blockchain-as-a-Service offerings let organisations use blockchain via cloud platforms without managing infrastructure themselves.</p><p>This combination lowers the barrier to experimenting with blockchain technology.</p><p>Major cloud providers increasingly offer managed blockchain services.</p><p>Understanding this integration reflects how emerging and established technologies often combine.</p>',q:'What does Blockchain-as-a-Service allow organisations to do?',opts:["Use blockchain via cloud platforms without managing infrastructure themselves", "Avoid using blockchain entirely, permanently", "Delete all blockchain data instantly", "Replace all cloud services completely"],correct:0,expl:'Blockchain-as-a-Service lets organisations use blockchain technology through cloud platforms, without needing to manage the underlying infrastructure themselves.'},
  {ey:'Q9',ti:'Evaluating Blockchain and Cloud Solutions',teach:'<p>Not every problem requires blockchain — traditional databases are often simpler and more efficient.</p><p>Cost, complexity, and genuine need should guide technology choice, not just trends.</p><p>Critical evaluation prevents adopting complex solutions for problems that don\'t require them.</p><p>This evaluative mindset is valuable across many areas of digital technology.</p>',q:'What should guide technology choice, rather than just following trends?',opts:["Cost, complexity, and genuine need", "Only what seems most exciting or fashionable", "Only what competitors are doing, regardless of fit", "Nothing — trends alone should always decide"],correct:0,expl:'Genuine need, along with cost and complexity considerations, should guide technology choices — not simply following current trends.'},
  {ey:'Q10',ti:'The Business Case for Blockchain and Cloud',teach:'<p>Businesses must weigh the costs and benefits of adopting blockchain or advanced cloud services.</p><p>Case studies show both successful implementations and costly failures.</p><p>A clear business case connects technology choices to real organisational goals.</p><p>This critical, business-aware perspective supports responsible technology adoption.</p>',q:'What should a clear business case connect technology choices to?',opts:["Real organisational goals", "Only the latest technology trends, regardless of purpose", "Nothing measurable at all", "Only personal preference of one single employee"],correct:0,expl:'A clear business case connects a technology decision directly to real, measurable organisational goals and benefits.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

    }, { onConflict: 'student_id,topic_id' });

</script>
</body>
</html>
