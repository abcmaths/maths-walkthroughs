<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity Management — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Cybersecurity Management</div>
    <div class="strand">Digital Technologies · Software Engineering</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Cybersecurity Governance',teach:'<p>Governance defines how an organisation makes and enforces security-related decisions.</p><p>Clear roles and responsibilities ensure accountability for security outcomes.</p><p>Leadership commitment is essential for a genuinely effective security culture.</p><p>Good governance aligns security practices with overall business objectives.</p>',q:'What does cybersecurity governance primarily define?',opts:["How an organisation makes and enforces security decisions", "The exact colour of security software", "The specific brand of firewall used", "The office furniture layout"],correct:0,expl:'Cybersecurity governance defines the structures and processes an organisation uses to make and enforce security-related decisions.'},
  {ey:'Q2',ti:'Risk Assessment',teach:'<p>Risk assessment identifies potential threats and evaluates their likelihood and impact.</p><p>Prioritising risks helps allocate limited security resources effectively.</p><p>Regular reassessment is needed as threats and systems continue to evolve.</p><p>A thorough risk assessment underpins effective, evidence-based security planning.</p>',q:'What does risk assessment evaluate about potential threats?',opts:["Their likelihood and impact", "Only their exact geographic origin", "Only their colour coding in a report", "Only their alphabetical order"],correct:0,expl:'Risk assessment evaluates both how likely a threat is to occur and how significant its impact would be if it did.'},
  {ey:'Q3',ti:'Security Frameworks and Standards',teach:'<p>Frameworks like ISO 27001 and NIST provide structured approaches to managing security.</p><p>Compliance with recognised standards can build trust with customers and partners.</p><p>Frameworks offer proven, tested approaches rather than starting from scratch.</p><p>Understanding frameworks supports building genuinely robust security programmes.</p>',q:'What can compliance with recognised security standards help build?',opts:["Trust with customers and partners", "Guaranteed elimination of all possible risk", "A completely new security framework from scratch, every time", "No measurable benefit at all"],correct:0,expl:'Compliance with recognised standards like ISO 27001 can help build trust and credibility with customers and business partners.'},
  {ey:'Q4',ti:'Incident Management at Scale',teach:'<p>Large organisations need formal incident management processes to respond effectively to breaches.</p><p>Clear escalation paths ensure the right people are involved quickly during an incident.</p><p>Post-incident reviews identify lessons learned to prevent similar future incidents.</p><p>Well-managed incidents limit damage and preserve organisational trust.</p>',q:'What does a post-incident review help identify?',opts:["Lessons learned to prevent similar future incidents", "The exact identity of every attacker, always", "A replacement business strategy", "A new company logo"],correct:0,expl:'A post-incident review analyses what happened during a security incident to identify lessons that can prevent similar issues in future.'},
  {ey:'Q5',ti:'Security Awareness Programmes',teach:'<p>Ongoing staff training helps prevent common security mistakes, like falling for phishing.</p><p>Simulated phishing exercises can measure and improve staff awareness over time.</p><p>A strong awareness culture treats security as a shared organisational responsibility.</p><p>Awareness programmes are a cost-effective complement to technical security measures.</p>',q:'What can simulated phishing exercises help measure and improve?',opts:["Staff security awareness over time", "Internet connection speed only", "Employee typing speed only", "Office lighting quality only"],correct:0,expl:'Simulated phishing exercises test and help improve staff ability to recognise and avoid real phishing attempts over time.'},
  {ey:'Q6',ti:'Managing Third-Party and Supply Chain Risk',teach:'<p>Organisations depend on external vendors and partners, who introduce their own security risks.</p><p>Vetting third-party security practices is essential before sharing data or system access.</p><p>Supply chain attacks can compromise an organisation indirectly, through a trusted partner.</p><p>Comprehensive security management must consider risks beyond an organisation\'s own systems.</p>',q:'What can supply chain attacks exploit to compromise an organisation?',opts:["Trusted third-party partners or vendors", "Only the organisation's own internal staff", "Only extremely outdated hardware", "Only physical break-ins"],correct:0,expl:'Supply chain attacks compromise an organisation indirectly, often by exploiting vulnerabilities in a trusted third-party vendor or partner.'},
  {ey:'Q7',ti:'Regulatory and Legal Compliance',teach:'<p>Data protection laws (like Nigeria\'s NDPA) impose legal obligations on organisations handling personal data.</p><p>Non-compliance can result in significant fines, legal action, and reputational damage.</p><p>Compliance requirements often shape how organisations design and manage their security programmes.</p><p>Understanding relevant regulations is essential for responsible, lawful data handling.</p>',q:'What can non-compliance with data protection laws result in?',opts:["Fines, legal action, and reputational damage", "Automatic improvement in customer trust", "No consequences whatsoever", "Immediate, guaranteed business success"],correct:0,expl:'Failing to comply with data protection laws can lead to significant fines, legal consequences, and damage to an organisation\'s reputation.'},
  {ey:'Q8',ti:'Business Continuity and Disaster Recovery',teach:'<p>Business continuity planning ensures critical operations can continue during a disruption.</p><p>Disaster recovery plans specifically address restoring IT systems and data after a major incident.</p><p>Regularly testing these plans ensures they will actually work when genuinely needed.</p><p>Preparedness significantly reduces the impact of major security incidents or disasters.</p>',q:'What does disaster recovery planning specifically address?',opts:["Restoring IT systems and data after a major incident", "Only marketing strategy", "Only staff holiday scheduling", "Only office redecoration"],correct:0,expl:'Disaster recovery planning specifically focuses on restoring IT systems and data following a major disruptive incident.'},
  {ey:'Q9',ti:'Security Metrics and Reporting',teach:'<p>Metrics (like time-to-detect or time-to-respond) help measure security programme effectiveness.</p><p>Clear reporting communicates security posture to leadership and stakeholders.</p><p>Data-driven security management supports better-informed, evidence-based decisions.</p><p>Regular reporting keeps security a visible, ongoing organisational priority.</p>',q:'What might "time-to-detect" measure in cybersecurity metrics?',opts:["How quickly a security threat is identified", "The exact cost of new hardware", "The speed of general internet browsing", "The number of staff holidays taken"],correct:0,expl:'"Time-to-detect" measures how quickly an organisation identifies a security threat or incident after it begins.'},
  {ey:'Q10',ti:'Building a Cybersecurity Management Plan',teach:'<p>Applying governance, risk assessment, and incident planning together creates a genuine management plan.</p><p>Tailoring a plan to an organisation\'s specific size, sector, and risk profile is essential.</p><p>Presenting a clear, well-justified plan demonstrates strong overall cybersecurity understanding.</p><p>This capstone task connects theory to practical, real-world cybersecurity management.</p>',q:'What should a genuine cybersecurity management plan be tailored to?',opts:["An organisation's specific size, sector, and risk profile", "A single fixed template regardless of context", "Only the cheapest available option, regardless of risk", "Nothing — one plan suits every organisation identically"],correct:0,expl:'An effective cybersecurity management plan must be tailored to an organisation\'s specific size, sector, and unique risk profile.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
