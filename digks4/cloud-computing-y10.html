<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Computing — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Cloud Computing</div>
    <div class="strand">Digital Technologies · Web & Software</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Cloud Computing?',teach:'<p>Cloud computing delivers computing services (storage, processing, software) over the internet.</p><p>Instead of owning physical servers, organisations rent computing resources as needed.</p><p>Major cloud providers include AWS, Microsoft Azure, and Google Cloud.</p><p>Cloud computing has transformed how businesses build and scale technology.</p>',q:'What does cloud computing deliver over the internet?',opts:["Computing services like storage and processing", "Only physical hardware delivery", "Only paper documents", "Only television broadcasts"],correct:0,expl:'Cloud computing delivers computing services — like storage, processing power, and software — over the internet.'},
  {ey:'Q2',ti:'Types of Cloud Services: IaaS, PaaS, SaaS',teach:'<p>IaaS (Infrastructure as a Service) provides virtualised computing resources like servers and storage.</p><p>PaaS (Platform as a Service) provides a platform for developing and deploying applications.</p><p>SaaS (Software as a Service) delivers complete software applications over the internet.</p><p>Choosing the right service type depends on how much control versus convenience an organisation needs.</p>',q:'What does SaaS stand for?',opts:["Software as a Service", "Storage as a Service", "System as a Service", "Security as a Service"],correct:0,expl:'SaaS stands for Software as a Service — complete software applications delivered and accessed over the internet.'},
  {ey:'Q3',ti:'Public, Private, and Hybrid Cloud',teach:'<p>Public cloud resources are shared among multiple customers via the internet.</p><p>Private cloud resources are dedicated to a single organisation, often for extra control or compliance.</p><p>Hybrid cloud combines public and private cloud resources together.</p><p>Choosing a cloud model depends on cost, security needs, and regulatory requirements.</p>',q:'What defines a "private cloud"?',opts:["Resources dedicated to a single organisation", "Resources shared among all customers equally", "A cloud with no security at all", "A cloud that only works offline"],correct:0,expl:'A private cloud consists of resources dedicated exclusively to a single organisation, often for greater control or compliance.'},
  {ey:'Q4',ti:'Scalability and Elasticity',teach:'<p>Scalability means a system can handle increased demand by adding resources.</p><p>Elasticity means resources can automatically scale up or down based on real-time demand.</p><p>Cloud computing enables businesses to avoid over-investing in unused capacity.</p><p>This flexibility is a major advantage over traditional, fixed-capacity infrastructure.</p>',q:'What does "elasticity" mean in cloud computing?',opts:["Resources automatically scale up or down based on demand", "A cloud service that never changes capacity", "A type of encryption", "A type of programming language"],correct:0,expl:'Elasticity refers to a cloud system\'s ability to automatically scale resources up or down in response to real-time demand.'},
  {ey:'Q5',ti:'Cloud Storage',teach:'<p>Cloud storage services (like AWS S3, Google Cloud Storage) store data on remote servers.</p><p>Data can be accessed from anywhere with an internet connection.</p><p>Redundancy across multiple locations helps protect against data loss.</p><p>Understanding storage tiers (hot vs cold storage) helps optimise cost and performance.</p>',q:'What is a benefit of storing data across multiple redundant locations in the cloud?',opts:["Protection against data loss", "Guaranteed higher cost with no benefit", "Slower access speeds only", "No security benefit at all"],correct:0,expl:'Storing data redundantly across multiple locations helps protect against loss if one location experiences a failure.'},
  {ey:'Q6',ti:'Cost Models in the Cloud',teach:'<p>Cloud services often use "pay-as-you-go" pricing, charging only for resources actually used.</p><p>This can reduce costs compared to purchasing and maintaining physical infrastructure.</p><p>Poorly managed cloud usage can also lead to unexpectedly high costs.</p><p>Understanding cost models helps organisations use cloud resources efficiently.</p>',q:'What does "pay-as-you-go" cloud pricing typically charge for?',opts:["Only the resources actually used", "A single massive upfront payment only", "Nothing at all", "Only advertising costs"],correct:0,expl:'Pay-as-you-go cloud pricing charges customers based only on the resources they actually consume, rather than a fixed cost.'},
  {ey:'Q7',ti:'Cloud Computing and Businesses in Nigeria',teach:'<p>Nigerian businesses increasingly use cloud services to reduce IT infrastructure costs.</p><p>Cloud adoption supports startups by lowering the barrier to launching new digital services.</p><p>Reliable internet connectivity remains an important factor in cloud adoption across Nigeria.</p><p>Understanding cloud computing supports Nigeria\'s growing digital economy.</p>',q:'What does cloud adoption help lower for startups?',opts:["The barrier to launching new digital services", "The need for any internet connection", "The need for customers", "The need for programming skills entirely"],correct:0,expl:'Cloud services lower the upfront cost and technical barrier for startups to launch new digital services quickly.'},
  {ey:'Q8',ti:'Cloud Security Considerations',teach:'<p>Cloud security requires understanding the shared responsibility model between provider and customer.</p><p>Misconfigured settings are a leading cause of cloud data breaches.</p><p>Strong access controls and encryption remain essential in cloud environments.</p><p>Regular audits help ensure cloud security settings remain appropriate over time.</p>',q:'What is a leading cause of cloud data breaches?',opts:["Misconfigured settings", "Too much encryption", "Excessive redundancy", "Too many security audits"],correct:0,expl:'Misconfigured cloud settings — such as improperly secured storage — are a leading, often preventable, cause of data breaches.'},
  {ey:'Q9',ti:'Migrating to the Cloud',teach:'<p>Cloud migration involves moving data, applications, and processes from on-site to cloud infrastructure.</p><p>Careful planning avoids downtime and data loss during migration.</p><p>Testing thoroughly after migration ensures everything functions as expected.</p><p>Migration strategies vary depending on an organisation\'s specific needs and constraints.</p>',q:'What is an important consideration when migrating to the cloud?',opts:["Careful planning to avoid downtime and data loss", "Migrating with no planning at all", "Deleting all existing data immediately", "Ignoring testing after migration"],correct:0,expl:'Careful planning is essential during cloud migration to avoid downtime, data loss, and other disruptions.'},
  {ey:'Q10',ti:'The Future of Cloud Computing',teach:'<p>Edge computing brings processing closer to where data is generated, reducing latency.</p><p>Serverless computing lets developers run code without managing underlying servers directly.</p><p>Cloud computing continues to evolve alongside AI, IoT, and 5G technologies.</p><p>Staying current with cloud trends supports many modern computing careers.</p>',q:'What does "edge computing" aim to reduce?',opts:["Latency, by processing data closer to its source", "The total amount of available storage", "The need for any internet connection", "The number of connected devices"],correct:0,expl:'Edge computing processes data closer to where it is generated, reducing the latency involved in sending it to distant cloud servers.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
