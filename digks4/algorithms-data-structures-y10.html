<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithms & Data Structures — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Algorithms & Data Structures</div>
    <div class="strand">Digital Technologies · Programming & Algorithms</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Algorithm Efficiency',teach:'<p>Efficiency describes how well an algorithm uses time and memory resources.</p><p>Big-O notation is a common way to describe how an algorithm\'s time grows with input size.</p><p>An algorithm that is O(n) scales linearly; one that is O(n²) scales much more steeply.</p><p>Choosing efficient algorithms matters more as data sizes grow larger.</p>',q:'What does Big-O notation describe?',opts:["How an algorithm's time/resource use grows with input size", "The exact colour of output text", "The programming language used", "The brand of computer used"],correct:0,expl:'Big-O notation describes how the time or resource requirements of an algorithm scale as the input size grows.'},
  {ey:'Q2',ti:'Arrays and Lists',teach:'<p>Arrays store elements of the same type in contiguous memory locations.</p><p>Accessing an array element by index is very fast, since its location can be calculated directly.</p><p>Arrays have a fixed size in many languages; Python lists are more flexible.</p><p>Understanding array structure explains why index-based access is so efficient.</p>',q:'Why is accessing an array element by index typically very fast?',opts:["Its memory location can be calculated directly", "Arrays are always stored in the cloud", "Arrays never contain more than one item", "Arrays require searching through every item first"],correct:0,expl:'Because array elements are stored contiguously in memory, the computer can calculate an element\'s exact location directly, making access very fast.'},
  {ey:'Q3',ti:'Stacks',teach:'<p>A stack follows Last-In-First-Out (LIFO) order — the last item added is the first removed.</p><p>Common stack operations are "push" (add) and "pop" (remove).</p><p>Stacks are used in undo functions, browser history, and function call management.</p><p>Understanding stacks helps explain how programs manage nested function calls.</p>',q:'What order does a stack follow?',opts:["Last-In-First-Out (LIFO)", "First-In-First-Out (FIFO)", "Random order", "Alphabetical order"],correct:0,expl:'A stack follows Last-In-First-Out order — the most recently added item is the first one removed.'},
  {ey:'Q4',ti:'Queues',teach:'<p>A queue follows First-In-First-Out (FIFO) order — the first item added is the first removed.</p><p>Common queue operations are "enqueue" (add) and "dequeue" (remove).</p><p>Queues are used in task scheduling, printer queues, and handling requests in order.</p><p>Choosing between a stack and queue depends on whether order or recency matters more.</p>',q:'What order does a queue follow?',opts:["First-In-First-Out (FIFO)", "Last-In-First-Out (LIFO)", "Random order", "Reverse alphabetical order"],correct:0,expl:'A queue follows First-In-First-Out order — the first item added is the first one removed, like a real queue.'},
  {ey:'Q5',ti:'Linked Lists',teach:'<p>A linked list stores elements as nodes, each pointing to the next node in sequence.</p><p>Unlike arrays, linked lists don\'t require contiguous memory, allowing flexible growth.</p><p>Inserting or removing items from a linked list can be more efficient than with an array.</p><p>Understanding linked lists introduces more advanced, flexible data structures.</p>',q:'What does each node in a linked list contain, alongside its data?',opts:["A pointer/reference to the next node", "A copy of the entire list", "A password", "A colour code"],correct:0,expl:'Each node in a linked list contains its data plus a reference (pointer) to the next node in the sequence.'},
  {ey:'Q6',ti:'Trees',teach:'<p>A tree is a hierarchical data structure with a root node and branching child nodes.</p><p>Binary trees restrict each node to a maximum of two children.</p><p>Trees are used to represent hierarchical data, like file systems or organisational charts.</p><p>Traversing a tree means visiting its nodes in a systematic order.</p>',q:'What best describes a tree data structure?',opts:["A hierarchical structure with a root and branching child nodes", "A simple list with no structure", "A single value with no connections", "A type of file compression"],correct:0,expl:'A tree is a hierarchical data structure starting from a root node, with branching child nodes below it.'},
  {ey:'Q7',ti:'Graphs',teach:'<p>A graph consists of nodes (vertices) connected by edges.</p><p>Graphs can represent networks, maps, social connections, and more.</p><p>Unlike trees, graphs can have cycles and multiple connections between nodes.</p><p>Graph algorithms help solve problems like finding the shortest route between two points.</p>',q:'What are the two main components of a graph data structure?',opts:["Nodes (vertices) and edges", "Rows and columns only", "Keys and values only", "Stacks and queues only"],correct:0,expl:'A graph consists of nodes (vertices) and the edges (connections) between them.'},
  {ey:'Q8',ti:'Recursion',teach:'<p>A recursive function calls itself to solve a smaller version of the same problem.</p><p>Every recursive function needs a "base case" to stop the recursion from continuing forever.</p><p>Recursion can elegantly solve problems like calculating factorials or traversing trees.</p><p>Understanding recursion deepens algorithmic thinking, though it requires careful practice.</p>',q:'What must every recursive function have to avoid running forever?',opts:["A base case", "A loop", "A dictionary", "A file to read"],correct:0,expl:'A base case is essential in recursion — it is the condition that stops the function from calling itself indefinitely.'},
  {ey:'Q9',ti:'Choosing the Right Data Structure',teach:'<p>Different problems suit different data structures — speed, memory use and operations all matter.</p><p>A stack suits undo functionality; a queue suits task scheduling; a tree suits hierarchical data.</p><p>Poor data structure choice can make a program unnecessarily slow or complex.</p><p>Thoughtful data structure choice is a hallmark of skilled programming.</p>',q:'What should influence the choice of data structure for a problem?',opts:["The specific operations, speed, and memory needs of the problem", "Only personal preference with no other consideration", "Random selection", "Always choosing the most complex option available"],correct:0,expl:'Choosing a data structure should be guided by the specific requirements of the problem — including speed, memory, and required operations.'},
  {ey:'Q10',ti:'Algorithms and Data Structures in Practice',teach:'<p>Real software combines multiple data structures and algorithms to solve complex problems.</p><p>Understanding Big-O helps predict how a program will perform as data grows.</p><p>This foundation supports later SS2/SS3 topics like databases and software development.</p><p>Practising with real coding problems builds genuine algorithmic confidence.</p>',q:'What does understanding Big-O notation help a programmer predict?',opts:["How a program will perform as data grows", "The exact programming language to use", "The screen resolution needed", "The colour scheme of an app"],correct:0,expl:'Big-O notation helps predict how a program\'s performance will scale as the size of its input data grows.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
