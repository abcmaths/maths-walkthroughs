<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Networking (Advanced) — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Computer Networking (Advanced)</div>
    <div class="strand">Digital Technologies · Networks & Cybersecurity</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Advanced Network Topologies',teach:'<p>Hybrid topologies combine elements of star, mesh, and other structures for specific needs.</p><p>Software-Defined Networking (SDN) allows networks to be managed more flexibly through software.</p><p>Choosing a topology depends on cost, redundancy needs, and scale.</p><p>Understanding advanced topologies supports designing robust, real-world networks.</p>',q:'What does Software-Defined Networking (SDN) allow?',opts:["Networks to be managed more flexibly through software", "Networks to function with no hardware at all", "Only wireless connections to exist", "Only a single device to connect at once"],correct:0,expl:'SDN allows network management and configuration to be handled flexibly through software, rather than only through physical hardware changes.'},
  {ey:'Q2',ti:'Network Address Translation (NAT)',teach:'<p>NAT allows multiple devices on a private network to share a single public IP address.</p><p>This helps conserve the limited supply of available public IPv4 addresses.</p><p>NAT also adds a layer of security by hiding internal network addresses.</p><p>Most home routers perform NAT automatically for connected devices.</p>',q:'What does NAT allow multiple devices to share?',opts:["A single public IP address", "A single private IP address only", "A single Wi-Fi password only", "A single physical cable only"],correct:0,expl:'NAT (Network Address Translation) allows multiple devices on a private network to share one public IP address when accessing the internet.'},
  {ey:'Q3',ti:'Subnetting',teach:'<p>Subnetting divides a larger network into smaller, more manageable sub-networks.</p><p>This can improve performance, security, and organisation within a larger network.</p><p>Subnet masks define which part of an IP address identifies the network versus the device.</p><p>Understanding subnetting is valuable for network administration and design roles.</p>',q:'What does subnetting help achieve within a larger network?',opts:["Dividing it into smaller, more manageable sub-networks", "Making all devices share one identical IP address", "Removing the need for any IP addressing at all", "Disabling all network security features"],correct:0,expl:'Subnetting divides a larger network into smaller sub-networks, which can improve organisation, performance, and security.'},
  {ey:'Q4',ti:'Wide Area Networks (WANs)',teach:'<p>A WAN connects networks across large geographic distances, such as between cities or countries.</p><p>The internet itself is the largest example of a WAN.</p><p>WAN connections often rely on leased lines, satellite links, or fibre-optic infrastructure.</p><p>Businesses with multiple locations often use WANs to connect their offices together.</p>',q:'What is the internet an example of?',opts:["The largest WAN (Wide Area Network) in existence", "A single LAN covering one building", "A type of hardware device", "A programming language"],correct:0,expl:'The internet is the largest and most well-known example of a WAN, connecting networks across the entire globe.'},
  {ey:'Q5',ti:'Network Monitoring and Management',teach:'<p>Network monitoring tools track performance, usage, and potential issues in real time.</p><p>Alerts can notify administrators of problems like outages or unusual traffic.</p><p>Bandwidth monitoring helps identify and manage congestion.</p><p>Proactive monitoring helps prevent small issues from becoming major outages.</p>',q:'What can bandwidth monitoring help identify?',opts:["Network congestion", "The colour of network cables", "The brand of connected devices only", "The physical location of a server only"],correct:0,expl:'Bandwidth monitoring helps identify congestion — points where network traffic is straining available capacity.'},
  {ey:'Q6',ti:'Quality of Service (QoS)',teach:'<p>QoS prioritises certain types of network traffic over others.</p><p>Video calls or gaming traffic might be prioritised over routine file downloads.</p><p>QoS helps maintain performance for time-sensitive applications on busy networks.</p><p>Understanding QoS is valuable for designing networks that support diverse real-world uses.</p>',q:'What might QoS prioritise on a busy network?',opts:["Time-sensitive traffic like video calls", "Only the slowest possible traffic", "Nothing — QoS treats all traffic identically always", "Only traffic from unknown sources"],correct:0,expl:'QoS (Quality of Service) can prioritise time-sensitive traffic, such as video calls, over less urgent traffic like routine downloads.'},
  {ey:'Q7',ti:'Network Troubleshooting Tools',teach:'<p>Ping tests basic connectivity between two devices.</p><p>Traceroute shows the path data takes across multiple network hops.</p><p>Network analysers (like Wireshark) capture and inspect traffic in detail.</p><p>Systematic troubleshooting narrows down where a network problem actually lies.</p>',q:'What does the "traceroute" tool show?',opts:["The path data takes across multiple network hops", "Only the current time", "Only the CPU temperature", "Only the screen resolution"],correct:0,expl:'Traceroute shows the sequence of network hops (routers) that data passes through on its way to a destination.'},
  {ey:'Q8',ti:'Emerging Network Technologies',teach:'<p>5G networks offer significantly faster speeds and lower latency than previous generations.</p><p>Wi-Fi 6 and beyond improve wireless network speed and efficiency.</p><p>Satellite internet is expanding access to remote and underserved areas.</p><p>Staying informed about emerging technologies helps anticipate future networking needs.</p>',q:'What advantage does 5G offer over previous mobile network generations?',opts:["Significantly faster speeds and lower latency", "Slower speeds intentionally", "No wireless capability at all", "Only wired connections"],correct:0,expl:'5G networks provide significantly faster speeds and lower latency compared to earlier mobile network generations like 4G.'},
  {ey:'Q9',ti:'Network Design for Organisations',teach:'<p>Organisations must balance cost, performance, security, and scalability when designing networks.</p><p>Redundant connections help maintain uptime if part of a network fails.</p><p>Segmenting networks (e.g. separating guest Wi-Fi from internal systems) improves security.</p><p>Good network design anticipates future growth, not just current needs.</p>',q:'Why might an organisation separate guest Wi-Fi from internal systems?',opts:["To improve security by limiting guest access to sensitive systems", "To make the network slower for everyone", "To remove the need for any password at all", "To prevent staff from ever accessing the internet"],correct:0,expl:'Separating guest Wi-Fi from internal systems limits the potential security risk that guest devices could pose to sensitive internal systems.'},
  {ey:'Q10',ti:'Careers in Networking',teach:'<p>Careers include network engineer, network administrator, and network security specialist.</p><p>Certifications (like CCNA) demonstrate recognised networking knowledge and skill.</p><p>Networking skills remain in demand as organisations rely increasingly on connectivity.</p><p>This foundation supports further study or direct entry into networking careers.</p>',q:'What might a recognised certification like CCNA demonstrate?',opts:["Recognised networking knowledge and skill", "Fluency in a foreign language", "Skill in graphic design only", "Skill in cooking only"],correct:0,expl:'A certification like CCNA (Cisco Certified Network Associate) demonstrates recognised, industry-standard networking knowledge.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
