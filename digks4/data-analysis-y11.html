<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analysis — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Data Analysis</div>
    <div class="strand">Digital Technologies · Data & Analysis</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Introduction to Data Analysis',teach:'<p>Data analysis involves inspecting, cleaning, and interpreting data to draw useful conclusions.</p><p>It underpins decision-making across business, science, government, and many other fields.</p><p>Data analysis tools range from spreadsheets to specialised programming libraries.</p><p>Understanding data analysis builds on earlier data representation and database knowledge.</p>',q:'What is the main purpose of data analysis?',opts:["To inspect, clean, and interpret data to draw useful conclusions", "To delete unnecessary data permanently", "To only format documents attractively", "To only design website layouts"],correct:0,expl:'Data analysis involves examining and interpreting data to extract useful, actionable conclusions.'},
  {ey:'Q2',ti:'Data Cleaning',teach:'<p>Data cleaning removes or corrects inaccurate, incomplete, or duplicate data.</p><p>Poor quality data can lead to misleading or incorrect analysis results.</p><p>Common cleaning tasks include handling missing values and standardising formats.</p><p>Careful data cleaning is often the most time-consuming part of analysis work.</p>',q:'What might happen if data analysis is performed on poor quality, uncleaned data?',opts:["The results could be misleading or incorrect", "The results are always automatically perfect", "Cleaning has no effect on results at all", "The data would delete itself automatically"],correct:0,expl:'Analysing poor quality, uncleaned data risks producing misleading or simply incorrect conclusions.'},
  {ey:'Q3',ti:'Descriptive Statistics',teach:'<p>Mean, median, and mode summarise the central tendency of a dataset.</p><p>Range and standard deviation describe how spread out data values are.</p><p>Descriptive statistics provide a quick, useful summary of large datasets.</p><p>Choosing the right statistic depends on the nature of the data being summarised.</p>',q:'What do mean, median, and mode all describe?',opts:["The central tendency of a dataset", "The exact colour of a chart", "The file format of the data", "The internet speed used to collect data"],correct:0,expl:'Mean, median, and mode are all measures of central tendency, describing a "typical" value within a dataset.'},
  {ey:'Q4',ti:'Data Visualisation Revisited',teach:'<p>Effective charts (bar, line, scatter, pie) reveal patterns that raw numbers can hide.</p><p>Choosing the right chart type depends on what relationship you want to highlight.</p><p>Misleading visualisations (like distorted scales) can create false impressions.</p><p>Good visualisation balances clarity, accuracy, and visual appeal.</p>',q:'What can a poorly designed chart with a distorted scale create?',opts:["A false or misleading impression of the data", "A perfectly accurate representation always", "No effect on how data is perceived", "Faster computer processing speeds"],correct:0,expl:'A distorted or misleading scale in a chart can create a false impression of the data, even if the underlying numbers are accurate.'},
  {ey:'Q5',ti:'Working with Spreadsheets for Analysis',teach:'<p>Formulas and functions (SUM, AVERAGE, VLOOKUP) support powerful spreadsheet analysis.</p><p>Pivot tables summarise and explore large datasets interactively.</p><p>Conditional formatting highlights patterns or outliers visually.</p><p>Spreadsheets remain a widely used, accessible tool for everyday data analysis.</p>',q:'What does a pivot table help with?',opts:["Summarising and exploring large datasets interactively", "Only formatting fonts", "Only spell-checking text", "Only connecting to the internet"],correct:0,expl:'A pivot table lets users summarise, group, and explore large datasets interactively without complex formulas.'},
  {ey:'Q6',ti:'Introduction to Python for Data Analysis',teach:'<p>Libraries like pandas provide powerful tools for analysing data in Python.</p><p>DataFrames organise data into labelled rows and columns, similar to a spreadsheet.</p><p>Python analysis can handle much larger datasets than typical spreadsheet software.</p><p>This connects programming skills directly to real-world data analysis tasks.</p>',q:'What does a pandas DataFrame resemble?',opts:["A spreadsheet, with labelled rows and columns", "A single unlabelled number", "A type of image file", "A type of network cable"],correct:0,expl:'A pandas DataFrame organises data into labelled rows and columns, closely resembling a spreadsheet structure.'},
  {ey:'Q7',ti:'Identifying Trends and Patterns',teach:'<p>Time-series analysis examines how data changes over time.</p><p>Correlation identifies whether two variables tend to change together.</p><p>Correlation does not necessarily mean causation — a key analytical caution.</p><p>Recognising genuine patterns (versus coincidence) requires careful, critical analysis.</p>',q:'What important distinction should analysts remember regarding correlation?',opts:["Correlation does not necessarily mean causation", "Correlation always proves causation directly", "Correlation is never useful for analysis", "Correlation only applies to spreadsheets"],correct:0,expl:'A key analytical principle is that correlation between two variables does not necessarily prove that one causes the other.'},
  {ey:'Q8',ti:'Data Ethics in Analysis',teach:'<p>Analysts have a responsibility to represent data honestly and avoid misleading conclusions.</p><p>Bias in data collection can distort analysis results unfairly.</p><p>Respecting privacy when analysing personal data is both ethical and often legally required.</p><p>Transparent methodology helps others verify and trust analytical conclusions.</p>',q:'What responsibility do data analysts have regarding their conclusions?',opts:["To represent data honestly and avoid misleading conclusions", "To always present the most dramatic possible interpretation", "To hide their methodology from everyone", "To ignore any potential bias in the data"],correct:0,expl:'Analysts have an ethical responsibility to represent data honestly and avoid drawing misleading conclusions.'},
  {ey:'Q9',ti:'Business Intelligence and Dashboards',teach:'<p>Dashboards combine multiple visualisations to give an at-a-glance view of key data.</p><p>Business intelligence tools help organisations make data-driven decisions.</p><p>Real-time dashboards can track live metrics like sales or website traffic.</p><p>Well-designed dashboards highlight what matters most, without overwhelming detail.</p>',q:'What is the purpose of a business intelligence dashboard?',opts:["To give an at-a-glance, data-driven view of key metrics", "To store unrelated files randomly", "To replace the need for any data at all", "To design company logos"],correct:0,expl:'A business intelligence dashboard combines visualisations to give decision-makers a quick, clear view of key data.'},
  {ey:'Q10',ti:'Applying Data Analysis to a Real Problem',teach:'<p>Choosing a genuine problem grounds data analysis skills in a real, meaningful context.</p><p>Following a structured process — collect, clean, analyse, visualise, conclude — builds good habits.</p><p>Presenting findings clearly is as important as the analysis itself.</p><p>This project connects data analysis skills to real decision-making scenarios.</p>',q:'What structured process helps guide effective data analysis?',opts:["Collect, clean, analyse, visualise, conclude", "Guess, ignore, delete, repeat", "Format, print, discard, forget", "Encrypt, hide, avoid, delay"],correct:0,expl:'A structured process — collecting, cleaning, analysing, visualising, then concluding — supports effective, reliable data analysis.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
