<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity (Extended) — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Cybersecurity (Extended)</div>
    <div class="strand">Digital Technologies · Networks & Cybersecurity</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'The CIA Triad',teach:'<p>Confidentiality, Integrity, and Availability (CIA) form the foundation of cybersecurity thinking.</p><p>Confidentiality means only authorised people can access information.</p><p>Integrity means data remains accurate and unaltered without authorisation.</p><p>Availability means systems and data remain accessible to authorised users when needed.</p>',q:'What does the "C" in the CIA triad stand for?',opts:["Confidentiality", "Cybersecurity", "Cryptography", "Compliance"],correct:0,expl:'The "C" in the CIA triad stands for Confidentiality — ensuring only authorised people can access information.'},
  {ey:'Q2',ti:'Types of Cyber Attacks',teach:'<p>Denial-of-Service (DoS) attacks overwhelm a system to make it unavailable.</p><p>Man-in-the-middle attacks intercept communication between two parties.</p><p>SQL injection exploits poorly secured database input fields.</p><p>Understanding attack types helps design more effective defences.</p>',q:'What is the goal of a Denial-of-Service (DoS) attack?',opts:["To overwhelm a system, making it unavailable", "To politely request access", "To improve system performance", "To back up data safely"],correct:0,expl:'A Denial-of-Service attack aims to overwhelm a system with traffic or requests, making it unavailable to legitimate users.'},
  {ey:'Q3',ti:'Encryption Basics',teach:'<p>Encryption converts readable data (plaintext) into unreadable form (ciphertext) using a key.</p><p>Symmetric encryption uses the same key for both encrypting and decrypting.</p><p>Asymmetric encryption uses a public key and a private key.</p><p>Encryption protects data both in transit (moving) and at rest (stored).</p>',q:'What does encryption convert readable data into?',opts:["Unreadable ciphertext", "A different file format only", "A compressed file only", "A backup copy"],correct:0,expl:'Encryption transforms readable plaintext data into unreadable ciphertext, protecting it from unauthorised access.'},
  {ey:'Q4',ti:'Public Key Infrastructure',teach:'<p>Public key cryptography uses a mathematically linked public and private key pair.</p><p>Data encrypted with a public key can only be decrypted with its matching private key.</p><p>Digital certificates verify the identity of websites and organisations online.</p><p>HTTPS relies on this system to secure web traffic.</p>',q:'What can decrypt data encrypted with a public key?',opts:["Only its matching private key", "Any public key", "No key at all — it stays encrypted forever", "A username and password"],correct:0,expl:'Only the mathematically matching private key can decrypt data that was encrypted using its corresponding public key.'},
  {ey:'Q5',ti:'Penetration Testing and Ethical Hacking',teach:'<p>Penetration testing involves authorised attempts to find security weaknesses.</p><p>Ethical hackers use the same techniques as attackers, but with permission and for defensive purposes.</p><p>Findings from penetration tests help organisations fix vulnerabilities before attackers exploit them.</p><p>This is a legitimate and growing career path within cybersecurity.</p>',q:'What distinguishes an "ethical hacker" from a malicious attacker?',opts:["They act with permission and for defensive purposes", "They use entirely different technical skills", "They never find any vulnerabilities", "They only work with paper documents"],correct:0,expl:'Ethical hackers use similar techniques to attackers, but do so with authorisation and for the purpose of improving security.'},
  {ey:'Q6',ti:'Security Policies',teach:'<p>Organisations use security policies to define acceptable use, password rules, and incident response.</p><p>Staff training is essential, since human error causes many security breaches.</p><p>Clear policies help ensure consistent, organisation-wide security practices.</p><p>Regularly reviewing and updating policies keeps them relevant to new threats.</p>',q:'Why is staff training an important part of cybersecurity?',opts:["Because human error causes many security breaches", "Because staff never make mistakes", "Because training replaces the need for any technical security", "Because policies are never necessary"],correct:0,expl:'Human error is a major contributor to security breaches, making staff training a genuinely important defensive measure.'},
  {ey:'Q7',ti:'Incident Response',teach:'<p>An incident response plan outlines steps to take when a security breach occurs.</p><p>Quick detection and containment limit the damage a breach can cause.</p><p>Investigating root causes helps prevent similar incidents in future.</p><p>Clear communication during an incident maintains trust with affected users.</p>',q:'What does an incident response plan outline?',opts:["Steps to take when a security breach occurs", "How to design a new website", "How to format a spreadsheet", "How to install new software only"],correct:0,expl:'An incident response plan provides a structured set of steps an organisation follows when responding to a security breach.'},
  {ey:'Q8',ti:'Cloud Security',teach:'<p>Cloud security involves protecting data and applications hosted on cloud platforms.</p><p>Shared responsibility models divide security duties between cloud providers and customers.</p><p>Misconfigured cloud storage is a common, preventable source of data breaches.</p><p>Understanding cloud security is increasingly essential as more services move online.</p>',q:'What does a "shared responsibility model" describe in cloud security?',opts:["How security duties are divided between provider and customer", "A type of encryption algorithm", "A single company's complete control over all security", "A type of malware"],correct:0,expl:'A shared responsibility model defines which security tasks are handled by the cloud provider versus the customer.'},
  {ey:'Q9',ti:'Cybersecurity Careers',teach:'<p>Careers include security analyst, penetration tester, security architect, and incident responder.</p><p>Certifications and hands-on practice both matter for building cybersecurity expertise.</p><p>Demand for skilled cybersecurity professionals continues to grow globally, including in Nigeria.</p><p>This field offers strong opportunities for students interested in problem-solving and technology.</p>',q:'What is one factor that helps build genuine cybersecurity expertise?',opts:["Hands-on practice alongside certifications", "Avoiding all technical practice", "Ignoring new threats entirely", "Ignoring certifications completely"],correct:0,expl:'Building genuine cybersecurity expertise benefits from a combination of hands-on practice and relevant certifications.'},
  {ey:'Q10',ti:'Building a Culture of Security',teach:'<p>Strong cybersecurity depends on both technology and people working together.</p><p>Regular awareness training helps all staff recognise and avoid common threats.</p><p>A "security-first" culture treats good practices as a shared responsibility, not just IT\'s job.</p><p>This holistic approach is more effective than relying on technology alone.</p>',q:'What does a strong "security culture" treat good practices as?',opts:["A shared responsibility across the whole organisation", "Solely the IT department's job", "An unnecessary distraction", "A one-time training exercise with no follow-up"],correct:0,expl:'A strong security culture treats good security practices as a shared responsibility across an entire organisation, not just IT\'s job.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
