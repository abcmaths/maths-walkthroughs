<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Communication — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Digital Communication</div>
    <div class="strand">Digital Technologies · Emerging Technology</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Digital Communication Channels',teach:'<p>Email, messaging apps, video calls, and social media are all digital communication channels.</p><p>Choosing the right channel depends on formality, urgency, and audience.</p><p>Synchronous channels (like calls) happen in real time; asynchronous ones (like email) do not.</p><p>Understanding channel choice is a valuable professional and personal communication skill.</p>',q:'What distinguishes synchronous from asynchronous communication?',opts:["Synchronous happens in real time", " asynchronous does not", "There is no real difference between them", "Synchronous is always written text only", "Asynchronous always requires video"],correct:0,expl:'Synchronous communication happens in real time (like a call), while asynchronous communication does not require an immediate response (like email).'},
  {ey:'Q2',ti:'Professional Digital Communication',teach:'<p>Professional emails typically use clear subject lines, polite tone, and proper structure.</p><p>Video call etiquette includes muting when not speaking and dressing appropriately.</p><p>Written tone can easily be misread online, so clarity matters even more.</p><p>Strong digital communication skills are valued across almost every career.</p>',q:'Why does written tone require extra care in digital communication?',opts:["Written tone can easily be misread online", "Written communication is never read carefully", "Tone never matters in professional settings", "Only spoken communication requires care"],correct:0,expl:'Because written text lacks vocal tone and body language cues, it can easily be misread, so extra care in wording matters.'},
  {ey:'Q3',ti:'Collaboration Platforms',teach:'<p>Tools like Slack, Microsoft Teams, and Google Workspace support team collaboration.</p><p>Shared documents allow real-time collaborative editing and feedback.</p><p>Clear channel/organisation structures help teams stay organised as they grow.</p><p>Effective use of these tools significantly improves remote and hybrid team productivity.</p>',q:'What do shared documents in collaboration platforms typically allow?',opts:["Real-time collaborative editing and feedback", "Only one person to ever view the file", "Automatic deletion after one use", "No editing capability at all"],correct:0,expl:'Shared documents in collaboration platforms typically allow multiple people to edit and give feedback in real time.'},
  {ey:'Q4',ti:'Video Conferencing Technology',teach:'<p>Video conferencing relies on real-time video/audio compression and transmission.</p><p>Bandwidth and latency significantly affect call quality.</p><p>Features like screen sharing and virtual backgrounds enhance video meetings.</p><p>Video conferencing has transformed remote work, education, and global collaboration.</p>',q:'What significantly affects video call quality?',opts:["Bandwidth and latency", "The colour of the background only", "The brand of the webcam exclusively", "The time zone of participants"],correct:0,expl:'Bandwidth (data capacity) and latency (delay) significantly affect the quality and smoothness of video calls.'},
  {ey:'Q5',ti:'Digital Communication Security',teach:'<p>Encrypted messaging protects the privacy of digital conversations.</p><p>Phishing attempts often arrive disguised as legitimate messages or emails.</p><p>Verifying sender identity helps avoid falling for impersonation scams.</p><p>Security awareness remains essential even in everyday digital communication.</p>',q:'What does encrypted messaging primarily protect?',opts:["The privacy of digital conversations", "The speed of message delivery only", "The colour scheme of the messaging app", "The battery life of the device"],correct:0,expl:'Encrypted messaging protects the privacy and confidentiality of digital conversations from unauthorised access.'},
  {ey:'Q6',ti:'Social Media as Communication',teach:'<p>Social media enables mass communication and audience engagement at scale.</p><p>Algorithms determine what content different users are shown.</p><p>Understanding audience and platform norms improves communication effectiveness.</p><p>Businesses and individuals alike use social media for branding and outreach.</p>',q:'What determines what content different users see on social media?',opts:["Algorithms", "A single fixed rule applying to everyone identically", "Random chance only, with no pattern at all", "The time of day exclusively, with no other factor"],correct:0,expl:'Algorithms analyse user behaviour and preferences to determine what content is shown to each individual user.'},
  {ey:'Q7',ti:'Digital Communication Accessibility',teach:'<p>Captions and transcripts make video/audio content accessible to more people.</p><p>Clear, simple language improves accessibility for non-native speakers and all users.</p><p>Accessible design benefits everyone, not just users with disabilities.</p><p>Considering accessibility from the start improves the reach of any communication.</p>',q:'What do captions and transcripts help make video/audio content?',opts:["More accessible to more people", "Impossible to understand at all", "Only available to one specific user", "Automatically shorter in length"],correct:0,expl:'Captions and transcripts improve accessibility, allowing more people — including those with hearing difficulties — to access video/audio content.'},
  {ey:'Q8',ti:'Managing Digital Communication Overload',teach:'<p>Constant notifications can overwhelm and reduce focus and productivity.</p><p>Setting boundaries (like specific email-checking times) can improve wellbeing.</p><p>Prioritising urgent vs non-urgent messages helps manage a busy digital workload.</p><p>Balancing connectivity with focused, uninterrupted work is an increasingly valuable skill.</p>',q:'What can help manage digital communication overload?',opts:["Setting boundaries, like specific email-checking times", "Responding to every single notification instantly, always", "Disabling all communication entirely, permanently", "Ignoring all messages indefinitely with no plan"],correct:0,expl:'Setting clear boundaries, such as designated times for checking email, can help manage digital communication overload effectively.'},
  {ey:'Q9',ti:'Cross-Cultural Digital Communication',teach:'<p>Digital communication often crosses cultural and language boundaries.</p><p>Awareness of cultural norms helps avoid unintentional miscommunication.</p><p>Time zone differences require careful scheduling for global collaboration.</p><p>Respectful, culturally aware communication supports effective global teamwork.</p>',q:'What does awareness of cultural norms help avoid in digital communication?',opts:["Unintentional miscommunication", "All possible communication entirely", "The need for any scheduling at all", "The use of any written text"],correct:0,expl:'Being aware of cultural norms helps avoid unintentional miscommunication when working with people from different backgrounds.'},
  {ey:'Q10',ti:'The Future of Digital Communication',teach:'<p>Emerging technologies (like AI-assisted communication tools) continue to reshape how we connect.</p><p>Virtual and augmented reality may offer new, more immersive communication experiences.</p><p>Balancing innovation with genuine, meaningful human connection remains an ongoing challenge.</p><p>Staying adaptable helps navigate an ever-evolving digital communication landscape.</p>',q:'What ongoing challenge does the future of digital communication present?',opts:["Balancing innovation with genuine human connection", "A complete end to all human communication", "No challenges of any kind remain", "A return to only physical letters exclusively"],correct:0,expl:'A key ongoing challenge is balancing new technological innovation with maintaining genuine, meaningful human connection.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

    }, { onConflict: 'student_id,topic_id' });

</script>
</body>
</html>
