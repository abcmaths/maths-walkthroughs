<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Architecture — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Computer Architecture</div>
    <div class="strand">Digital Technologies · Architecture & OS</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'The Von Neumann Architecture',teach:'<p>Most modern computers follow the Von Neumann architecture, storing both data and instructions in the same memory.</p><p>Key components: CPU, memory (RAM), input/output devices, all connected via a system bus.</p><p>The fetch-decode-execute cycle describes how the CPU processes instructions.</p><p>Understanding this model explains why computers can run any program stored in memory.</p>',q:'What are the main components of Von Neumann architecture?',opts:["CPU, memory, and input/output devices connected by a bus", "Only a keyboard and mouse", "Only a monitor", "Only an internet cable"],correct:0,expl:'Von Neumann architecture connects the CPU, memory, and I/O devices together via a system bus, all sharing common memory for data and instructions.'},
  {ey:'Q2',ti:'The Fetch-Decode-Execute Cycle',teach:'<p>Fetch: the CPU retrieves the next instruction from memory.</p><p>Decode: the CPU interprets what the instruction means.</p><p>Execute: the CPU carries out the instruction.</p><p>This cycle repeats continuously, often billions of times per second.</p>',q:'What is the correct order of the CPU\'s basic cycle?',opts:["Fetch, Decode, Execute", "Execute, Fetch, Decode", "Decode, Execute, Fetch", "Execute, Decode, Fetch"],correct:0,expl:'The CPU repeatedly fetches an instruction, decodes what it means, then executes it — in that specific order.'},
  {ey:'Q3',ti:'CPU Components',teach:'<p>The Arithmetic Logic Unit (ALU) performs calculations and logical operations.</p><p>The Control Unit (CU) directs the operation of the processor, coordinating fetch-decode-execute.</p><p>Registers are small, extremely fast storage locations within the CPU.</p><p>Cache memory sits between the CPU and RAM, storing frequently used data for faster access.</p>',q:'What does the ALU do inside a CPU?',opts:["Performs calculations and logical operations", "Only stores long-term files", "Only manages Wi-Fi", "Only displays graphics"],correct:0,expl:'The Arithmetic Logic Unit (ALU) is responsible for performing calculations and logical operations within the CPU.'},
  {ey:'Q4',ti:'Clock Speed and Performance',teach:'<p>Clock speed (measured in GHz) indicates how many cycles a CPU can perform per second.</p><p>Higher clock speed generally means faster processing, but isn\'t the only factor.</p><p>Multiple cores allow a CPU to process several tasks in parallel.</p><p>Cache size and architecture efficiency also significantly affect real-world performance.</p>',q:'What does a CPU\'s clock speed measure?',opts:["How many cycles it can perform per second", "How much storage it has", "How bright the screen is", "How loud the fan is"],correct:0,expl:'Clock speed, measured in GHz, indicates how many processing cycles a CPU can complete each second.'},
  {ey:'Q5',ti:'Memory Hierarchy',teach:'<p>Registers are the fastest, smallest memory, located directly in the CPU.</p><p>Cache memory is fast and close to the CPU, but smaller than RAM.</p><p>RAM is larger but slower than cache, holding actively used programs and data.</p><p>Secondary storage (SSD/HDD) is the largest and slowest, but retains data permanently.</p>',q:'Which type of memory is generally fastest but smallest?',opts:["Registers", "RAM", "Hard disk drives", "Cloud storage"],correct:0,expl:'CPU registers are the fastest form of memory, though also the smallest in capacity.'},
  {ey:'Q6',ti:'Buses',teach:'<p>A bus is a set of physical connections that transfer data between components.</p><p>The data bus carries the actual data being transferred.</p><p>The address bus carries the location (address) data should be sent to or from.</p><p>The control bus carries control signals coordinating operations between components.</p>',q:'What does the address bus carry?',opts:["The location data should be sent to or from", "The actual data content itself", "Only power/electricity", "Only cooling air"],correct:0,expl:'The address bus carries information about the memory location involved in a data transfer, not the data itself.'},
  {ey:'Q7',ti:'Embedded Systems',teach:'<p>An embedded system is a computer built into a larger device for a specific purpose.</p><p>Examples include the systems inside washing machines, cars, and medical devices.</p><p>Embedded systems are usually optimised for a narrow, specific task rather than general use.</p><p>They often have tighter constraints on power, size, and cost than general-purpose computers.</p>',q:'What best describes an embedded system?',opts:["A computer built into a device for a specific purpose", "A general-purpose desktop computer", "A type of internet cable", "A brand of monitor"],correct:0,expl:'Embedded systems are specialised computers built into larger devices to perform a specific function.'},
  {ey:'Q8',ti:'Parallel Processing',teach:'<p>Parallel processing means performing multiple calculations simultaneously.</p><p>Multi-core processors enable a form of parallel processing within a single chip.</p><p>Some tasks (like video rendering) benefit greatly from parallel processing.</p><p>Not all tasks can be effectively parallelised — some must run in strict sequence.</p>',q:'What does parallel processing allow a computer to do?',opts:["Perform multiple calculations simultaneously", "Only perform one task at a time", "Only store files", "Only connect to Wi-Fi"],correct:0,expl:'Parallel processing allows multiple calculations or tasks to be carried out at the same time, improving performance for suitable workloads.'},
  {ey:'Q9',ti:'GPUs and Specialised Processors',teach:'<p>A GPU (Graphics Processing Unit) is optimised for handling many simple calculations in parallel.</p><p>GPUs excel at rendering graphics and are also used for AI/machine learning workloads.</p><p>Specialised processors can outperform general CPUs for specific tasks.</p><p>Modern systems often combine CPUs and GPUs to balance general and specialised performance.</p>',q:'What are GPUs particularly well-suited for?',opts:["Handling many simple calculations in parallel", "Only word processing", "Only email", "Only file compression"],correct:0,expl:'GPUs are designed to handle many simple calculations simultaneously, making them ideal for graphics rendering and certain AI workloads.'},
  {ey:'Q10',ti:'Architecture and Real-World Performance',teach:'<p>Understanding architecture helps explain why some computers feel faster than others.</p><p>Bottlenecks can occur at any stage — CPU, memory, storage, or bus speed.</p><p>Balanced system design avoids one slow component holding back the whole system.</p><p>This foundational knowledge underlies later topics like operating systems and networking.</p>',q:'What is a "bottleneck" in computer architecture?',opts:["A slow component holding back overall system performance", "A type of storage device", "A type of cable", "A type of software license"],correct:0,expl:'A bottleneck is a component that limits overall system performance because it is significantly slower than the rest of the system.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
