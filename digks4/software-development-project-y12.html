<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software Development Project — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Software Development Project</div>
    <div class="strand">Digital Technologies · Software Engineering</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Software Development Life Cycle',teach:'<p>The SDLC describes the stages software passes through: planning, design, development, testing, deployment, maintenance.</p><p>Following a structured lifecycle reduces risk and improves software quality.</p><p>Different models (Waterfall, Agile) organise these stages in different ways.</p><p>Understanding the SDLC prepares students to manage a substantial software project.</p>',q:'What does SDLC stand for?',opts:["Software Development Life Cycle", "System Data Logic Chart", "Server Data Location Code", "Standard Development Logic Chain"],correct:0,expl:'SDLC stands for Software Development Life Cycle, describing the stages software passes through from planning to maintenance.'},
  {ey:'Q2',ti:'Requirements Gathering',teach:'<p>Requirements define what a software project must achieve, from a user\'s perspective.</p><p>Functional requirements describe what the system should do; non-functional describe qualities like speed or security.</p><p>Clear requirements reduce misunderstandings and wasted development effort.</p><p>Involving stakeholders early improves the accuracy and usefulness of requirements.</p>',q:'What do functional requirements describe?',opts:["What the system should do", "How much the project will cost", "The colour scheme of the interface", "The programming language used"],correct:0,expl:'Functional requirements describe the specific actions and features a system must be able to perform.'},
  {ey:'Q3',ti:'Agile Development',teach:'<p>Agile development breaks work into short, iterative cycles called sprints.</p><p>Regular feedback and adaptation are central to the Agile approach.</p><p>Daily stand-up meetings help teams coordinate and address blockers quickly.</p><p>Agile suits projects where requirements may evolve during development.</p>',q:'What is a short, iterative work cycle in Agile development called?',opts:["A sprint", "A waterfall", "A blueprint", "A firewall"],correct:0,expl:'In Agile development, work is organised into short, iterative cycles known as sprints.'},
  {ey:'Q4',ti:'Version Control with Git',teach:'<p>Git tracks changes to code over time, allowing developers to review history and collaborate safely.</p><p>Branches let developers work on new features without affecting the main codebase.</p><p>Commits record specific snapshots of changes, with descriptive messages explaining them.</p><p>Version control is essential for any serious, collaborative software project.</p>',q:'What does a Git branch allow a developer to do?',opts:["Work on new features without affecting the main codebase", "Delete the entire project history", "Encrypt all source code automatically", "Disable all collaboration features"],correct:0,expl:'A branch lets a developer work on changes in isolation, without affecting the main, stable codebase until ready to merge.'},
  {ey:'Q5',ti:'Software Design Documentation',teach:'<p>Design documents describe a system\'s architecture, components, and how they interact.</p><p>Diagrams (like flowcharts or UML) communicate design decisions clearly to a team.</p><p>Good documentation supports future maintenance, especially by developers who join later.</p><p>Documentation should be updated as a project evolves, not just written once at the start.</p>',q:'What is one benefit of good software design documentation?',opts:["It supports future maintenance and helps new developers understand the system", "It replaces the need for any testing", "It guarantees a bug-free program", "It is only useful before a project starts"],correct:0,expl:'Good documentation supports long-term maintenance and helps new developers understand a system\'s design and structure.'},
  {ey:'Q6',ti:'Testing Strategies',teach:'<p>Unit testing checks individual components in isolation.</p><p>Integration testing checks that different components work correctly together.</p><p>User acceptance testing confirms software meets real user needs before release.</p><p>A combination of testing types provides the most thorough quality assurance.</p>',q:'What does unit testing check?',opts:["Individual components in isolation", "The entire finished product only", "Only the visual design", "Only the marketing plan"],correct:0,expl:'Unit testing checks individual components or functions in isolation, before they are integrated with the rest of the system.'},
  {ey:'Q7',ti:'Debugging Large Projects',teach:'<p>Larger projects require systematic debugging strategies, since issues can span multiple components.</p><p>Logging records what a program is doing, helping trace the source of problems.</p><p>Reproducing a bug reliably is often the first, essential step to fixing it.</p><p>Collaborative debugging benefits from clear communication among team members.</p>',q:'What does logging help a developer do when debugging?',opts:["Trace the source of problems by recording program activity", "Automatically fix all bugs instantly", "Delete the project entirely", "Replace the need for testing"],correct:0,expl:'Logging records what a program is doing as it runs, helping developers trace the source of unexpected behaviour or bugs.'},
  {ey:'Q8',ti:'Deploying a Software Project',teach:'<p>Deployment makes a completed application available for real users to use.</p><p>Staging environments allow final testing before deploying to a live/production environment.</p><p>Continuous Integration/Continuous Deployment (CI/CD) automates testing and deployment steps.</p><p>Careful deployment planning reduces the risk of live, user-facing problems.</p>',q:'What is the purpose of a staging environment?',opts:["Final testing before deploying to the live/production environment", "Permanently storing old, unused code", "Designing marketing materials", "Only for backing up unrelated files"],correct:0,expl:'A staging environment allows a team to perform final testing in a production-like setting before releasing software to real users.'},
  {ey:'Q9',ti:'Project Management for Software',teach:'<p>Effective project management tracks progress, timelines, and resource allocation.</p><p>Tools like Trello, Jira, or Asana help teams organise and track software development tasks.</p><p>Risk management anticipates and plans for potential problems before they occur.</p><p>Good project management balances scope, time, and quality throughout a project.</p>',q:'What does risk management in a software project aim to do?',opts:["Anticipate and plan for potential problems before they occur", "Guarantee a project will have zero issues", "Remove the need for planning entirely", "Only apply after a project is finished"],correct:0,expl:'Risk management involves anticipating potential problems in advance and planning how to address them if they occur.'},
  {ey:'Q10',ti:'Presenting and Defending Your Project',teach:'<p>Clearly explaining design decisions demonstrates genuine understanding of a project.</p><p>Anticipating likely questions helps prepare a confident, thoughtful presentation.</p><p>Reflecting honestly on challenges and limitations shows mature, professional thinking.</p><p>This capstone skill mirrors real-world software project presentations and reviews.</p>',q:'What does reflecting honestly on a project\'s limitations demonstrate?',opts:["Mature, professional thinking", "Complete failure of the project", "A lack of technical skill", "Nothing of value to an audience"],correct:0,expl:'Honestly reflecting on a project\'s challenges and limitations demonstrates mature, professional thinking valued in real software development.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
