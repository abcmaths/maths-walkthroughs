<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Value & Reading Large Numbers — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Bridge Maths: Place Value & Reading Large Numbers</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Understanding place value columns", "teach": ["Every digit in a number has a place value depending on where it sits. In 3,459,102 the columns from right to left are: units, tens, hundreds, thousands, ten-thousands, hundred-thousands, millions.", "So 3,459,102 means: 3 millions + 4 hundred-thousands + 5 ten-thousands + 9 thousands + 1 hundred + 0 tens + 2 units.", "Try saying it out loud in your head, column by column, before moving on."], "yt_prompt": "What is the value of the underlined digit? (we'll show it as [digit] in bold)"}, {"title": "Reading numbers in words", "teach": ["Large numbers are read in groups of three digits, separated by commas: millions, thousands, then the rest.", "3,459,102 is read as: three million, four hundred and fifty-nine thousand, one hundred and two.", "Break the number into its comma groups first, then read each group like a normal 3-digit number, adding 'thousand' or 'million' as needed."], "yt_prompt": "Write this number in digits:"}, {"title": "Rounding to the nearest thousand", "teach": ["To round to the nearest thousand, look at the hundreds digit. If it's 5 or more, round up; if it's less than 5, round down.", "Example: 3,459,102 \u2192 look at the hundreds digit (1) \u2192 round down \u2192 3,459,000.", "Always change all digits after the rounding place to zero."], "yt_prompt": "Round this number to the nearest thousand:"}, {"title": "Rounding to the nearest ten thousand", "teach": ["Same idea, but now look at the thousands digit to decide whether to round up or down.", "Example: 3,459,102 \u2192 thousands digit is 9 \u2192 round up \u2192 3,460,000.", "Remember: everything after the rounding column becomes zero."], "yt_prompt": "Round this number to the nearest ten thousand:"}, {"title": "Comparing large numbers", "teach": ["To compare two large numbers, first compare the number of digits \u2014 more digits usually means a bigger number.", "If they have the same number of digits, compare column by column from the left (millions first, then hundred-thousands, and so on) until you find a difference.", "Example: 3,459,102 vs 3,461,000 \u2014 both start '3,4...' but the next column is 5 vs 6, so 3,461,000 is bigger."], "yt_prompt": "Which number is bigger?"}, {"title": "Ordering numbers with negative values", "teach": ["Negative numbers get smaller the further they are from zero in the negative direction. \u22128 is smaller than \u22125, which is smaller than 0.", "Think of a number line: numbers to the left are always smaller, numbers to the right are always bigger.", "Example: ordering \u22125, 3, \u22128, 0, 2 from smallest to largest gives: \u22128, \u22125, 0, 2, 3."], "yt_prompt": "Which of these is the smallest?"}, {"title": "Negative number addition", "teach": ["Adding a negative number is the same as subtracting. 3 + (\u22125) is the same as 3 \u2212 5 = \u22122.", "Picture a number line: start at 3, then move 5 steps to the left (because we're adding a negative), landing on \u22122.", "Practice: always convert 'add a negative' into 'subtract' in your head first."], "yt_prompt": "Work out the answer:"}, {"title": "Negative number subtraction", "teach": ["Subtracting a negative number is the same as adding. 3 \u2212 (\u22125) is the same as 3 + 5 = 8.", "Two negative signs next to each other flip into a positive \u2014 this is a really common rule to remember.", "Picture the number line again: subtracting a negative moves you to the right, not the left."], "yt_prompt": "Work out the answer:"}, {"title": "Multiplying larger numbers by 10, 100, 1000", "teach": ["Multiplying by 10 moves every digit one place to the left (adds one zero). Multiplying by 100 moves two places (adds two zeros), and so on.", "Example: 3,459 \u00d7 100 = 345,900.", "This works because each place value column is 10 times bigger than the one to its right."], "yt_prompt": "Work out the answer:"}, {"title": "Putting it all together \u2014 mixed practice", "teach": ["You've now covered: place value, rounding, comparing, negative numbers, and multiplying by powers of 10.", "In the real diagnostic and in Year 7 lessons, questions often mix these skills together in one problem \u2014 so it's worth being confident with each piece on its own first.", "Take your time on this final question \u2014 it brings a couple of these ideas together."], "yt_prompt": "Work out the answer:"}];
function ytGen_0() { const n=Math.floor(Math.random()*9)+1; const pos=['thousands','ten-thousands','hundred-thousands'][Math.floor(Math.random()*3)]; const mult={thousands:1000,'ten-thousands':10000,'hundred-thousands':100000}[pos]; return {q:`In the number 4${n}5,203 what is the value of the digit ${n} (in the ${pos} column)?`, answer: n*mult}; }
function ytGen_1() { const m=Math.floor(Math.random()*5)+1; const t=Math.floor(Math.random()*900)+100; return {q:`${m} million, ${t} thousand`, answer: String(m*1000000+t*1000)}; }
function ytGen_2() { const base=Math.floor(Math.random()*900)*1000 + Math.floor(Math.random()*1000); const rounded = Math.round(base/1000)*1000; return {q:String(base), answer:String(rounded)}; }
function ytGen_3() { const base=Math.floor(Math.random()*90)*10000 + Math.floor(Math.random()*10000); const rounded = Math.round(base/10000)*10000; return {q:String(base), answer:String(rounded)}; }
function ytGen_4() { const a=Math.floor(Math.random()*9000000)+100000; const b=a+Math.floor(Math.random()*20000)-10000; const bigger = a>b?a:b; return {q:`${a.toLocaleString()} or ${b.toLocaleString()}? (type the bigger number, no commas)`, answer:String(bigger)}; }
function ytGen_5() { const nums=[-8,-5,0,2,3].sort(()=>Math.random()-0.5); return {q:nums.join(', '), answer:String(Math.min(...nums))}; }
function ytGen_6() { const a=Math.floor(Math.random()*10)-2; const b=Math.floor(Math.random()*8)+1; return {q:`${a} + (−${b})`, answer:String(a-b)}; }
function ytGen_7() { const a=Math.floor(Math.random()*10); const b=Math.floor(Math.random()*8)+1; return {q:`${a} − (−${b})`, answer:String(a+b)}; }
function ytGen_8() { const n=Math.floor(Math.random()*900)+100; const mult=[10,100,1000][Math.floor(Math.random()*3)]; return {q:`${n} × ${mult}`, answer:String(n*mult)}; }
function ytGen_9() { const n=Math.floor(Math.random()*900)*1000+Math.floor(Math.random()*999); const rounded=Math.round(n/1000)*1000; return {q:`Round ${n.toLocaleString()} to the nearest thousand`, answer:String(rounded)}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val == currentYT.answer) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = '<div class="teach"><strong>Well done — topic complete!</strong><br>You can mark this as complete below.</div>';
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) window.markComplete();
}

render();
</script>

</body>
</html>
