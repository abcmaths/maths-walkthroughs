<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adding & Subtracting Fractions — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Bridge Maths: Adding & Subtracting Fractions</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Adding fractions with the same denominator", "teach": ["When denominators match, just add the numerators and keep the denominator the same.", "Example: 2/7 + 3/7 = 5/7.", "Never add the denominators themselves \u2014 only the top numbers change."], "yt_prompt": "Work out the answer:"}, {"title": "Subtracting fractions with the same denominator", "teach": ["Same idea as adding \u2014 subtract the numerators, keep the denominator the same.", "Example: 5/7 \u2212 2/7 = 3/7.", "Always check afterwards whether the answer can be simplified."], "yt_prompt": "Work out the answer:"}, {"title": "Finding a common denominator", "teach": ["To add or subtract fractions with different denominators, you first need to convert them to have the same denominator.", "Example: 1/3 and 1/4 \u2192 common denominator is 12 (3\u00d74) \u2192 1/3 = 4/12, 1/4 = 3/12.", "The easiest common denominator to find is usually the product of the two original denominators."], "yt_prompt": "What common denominator would you use for these two fractions? (type just the number)"}, {"title": "Adding fractions with different denominators", "teach": ["Convert both fractions to the same denominator first, then add the numerators as usual.", "Example: 1/3 + 1/4 = 4/12 + 3/12 = 7/12.", "Take it one step at a time: convert first, then add \u2014 don't try to do both at once."], "yt_prompt": "Work out the answer (as a fraction e.g. 7/12):"}, {"title": "Subtracting fractions with different denominators", "teach": ["Same approach: convert to a common denominator first, then subtract the numerators.", "Example: 3/4 \u2212 1/3 = 9/12 \u2212 4/12 = 5/12.", "Double-check your conversions carefully \u2014 this is where most mistakes happen."], "yt_prompt": "Work out the answer (as a fraction e.g. 5/12):"}, {"title": "Adding mixed numbers", "teach": ["Add the whole numbers together first, then add the fraction parts (converting to a common denominator if needed).", "Example: 1 and 1/4 + 2 and 1/2 \u2192 whole numbers 1+2=3, fractions 1/4+2/4=3/4 \u2192 total 3 and 3/4.", "If the fraction parts add up to more than 1, carry the extra whole number over."], "yt_prompt": "Work out the answer (as e.g. 3 3/4):"}, {"title": "Subtracting mixed numbers (no borrowing)", "teach": ["Subtract the whole numbers, then subtract the fraction parts separately.", "Example: 4 and 3/4 \u2212 1 and 1/4 \u2192 whole numbers 4\u22121=3, fractions 3/4\u22121/4=2/4=1/2 \u2192 total 3 and 1/2.", "Simplify the fraction part at the end if possible."], "yt_prompt": "Work out the answer (as e.g. 3 1/2):"}, {"title": "Fraction word problems \u2014 addition", "teach": ["Look for key words like 'total', 'altogether', or 'combined' \u2014 these usually signal addition.", "Example: 'Ade eats 1/4 of a cake and Bola eats 1/3. How much cake is eaten in total?' \u2192 1/4 + 1/3 = 3/12 + 4/12 = 7/12.", "Always set up the fractions from the word problem before calculating."], "yt_prompt": "Solve the word problem (as a fraction e.g. 7/12):"}, {"title": "Fraction word problems \u2014 subtraction", "teach": ["Look for words like 'left', 'remaining', or 'difference' \u2014 these usually signal subtraction.", "Example: 'A tank is 3/4 full. 1/2 of a full tank is used. How much is left?' \u2192 3/4 \u2212 1/2 = 3/4 \u2212 2/4 = 1/4.", "Set up the fractions carefully, making sure you know which one is being subtracted from which."], "yt_prompt": "Solve the word problem (as a fraction e.g. 1/4):"}, {"title": "Mixed practice \u2014 adding and subtracting fractions", "teach": ["You've now covered same-denominator and different-denominator addition/subtraction, plus mixed numbers.", "The key steps are always: find a common denominator if needed, then add or subtract the numerators, then simplify.", "This last question brings several of those steps together."], "yt_prompt": "Work out the answer (as a fraction e.g. 5/6):"}];
function ytGen_0() { const d=Math.floor(Math.random()*6)+5; const a=Math.floor(Math.random()*(d-2))+1; const b=Math.floor(Math.random()*(d-a-1))+1; return {q:`${a}/${d} + ${b}/${d}`, answer:`${a+b}/${d}`}; }
function ytGen_1() { const d=Math.floor(Math.random()*6)+5; const b=Math.floor(Math.random()*(d-2))+1; const a=b+Math.floor(Math.random()*(d-b))+1; return {q:`${a}/${d} − ${b}/${d}`, answer:`${a-b}/${d}`}; }
function ytGen_2() { const d1=Math.floor(Math.random()*4)+2; const d2=Math.floor(Math.random()*4)+d1+1; return {q:`1/${d1} and 1/${d2}`, answer:String(d1*d2)}; }
function ytGen_3() { const pairs=[[1,3,1,4,'7/12'],[1,2,1,5,'7/10'],[2,3,1,4,'11/12'],[1,4,1,6,'5/12']]; const p=pairs[Math.floor(Math.random()*pairs.length)]; return {q:`${p[0]}/${p[1]} + ${p[2]}/${p[3]}`, answer:p[4]}; }
function ytGen_4() { const pairs=[[3,4,1,3,'5/12'],[2,3,1,4,'5/12'],[4,5,1,2,'3/10'],[3,5,1,3,'4/15']]; const p=pairs[Math.floor(Math.random()*pairs.length)]; return {q:`${p[0]}/${p[1]} − ${p[2]}/${p[3]}`, answer:p[4]}; }
function ytGen_5() { const w1=Math.floor(Math.random()*3)+1; const w2=Math.floor(Math.random()*3)+1; return {q:`${w1} 1/4 + ${w2} 1/2`, answer:`${w1+w2} 3/4`}; }
function ytGen_6() { const w1=Math.floor(Math.random()*3)+3; const w2=Math.floor(Math.random()*2)+1; return {q:`${w1} 3/4 − ${w2} 1/4`, answer:`${w1-w2} 1/2`}; }
function ytGen_7() { return {q:'Ade eats 1/4 of a cake and Bola eats 1/3 of the same cake. How much cake is eaten in total?', answer:'7/12'}; }
function ytGen_8() { return {q:'A water tank is 3/4 full. Then an amount equal to 1/2 of a full tank is used. How much is left in the tank?', answer:'1/4'}; }
function ytGen_9() { return {q:'2/3 + 1/6', answer:'5/6'}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val == currentYT.answer) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = '<div class="teach"><strong>Well done — topic complete!</strong><br>You can mark this as complete below.</div>';
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) window.markComplete();
}

render();
</script>

</body>
</html>
