<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Equivalence & Simplifying — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Bridge Maths: Fraction Equivalence & Simplifying</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What are equivalent fractions?", "teach": ["Equivalent fractions represent the same amount, even though the numbers look different \u2014 like 1/2 and 2/4.", "You get an equivalent fraction by multiplying (or dividing) both the top and bottom by the same number.", "Example: 1/2 \u00d7 (3/3) = 3/6 \u2014 same value, different-looking fraction."], "yt_prompt": "Find the missing number to make an equivalent fraction:"}, {"title": "Simplifying fractions \u2014 finding a common factor", "teach": ["To simplify a fraction, divide the top and bottom by the same number until you can't divide any further.", "Example: 8/12 \u2014 both divide by 4 \u2192 2/3, which can't be simplified any further.", "Look for the highest number that divides into both top and bottom exactly."], "yt_prompt": "Simplify this fraction (write as e.g. 2/3):"}, {"title": "Comparing fractions with the same denominator", "teach": ["When two fractions have the same bottom number, just compare the top numbers \u2014 bigger top number means bigger fraction.", "Example: 3/8 vs 5/8 \u2192 5/8 is bigger, since 5 > 3.", "This only works when the denominators (bottom numbers) match."], "yt_prompt": "Which fraction is bigger?"}, {"title": "Comparing fractions with different denominators", "teach": ["When denominators are different, convert both fractions to the same denominator first, then compare the tops.", "Example: 1/2 vs 2/5 \u2192 convert to tenths: 5/10 vs 4/10 \u2192 1/2 is bigger.", "A quick way to find a common denominator is to multiply the two denominators together."], "yt_prompt": "Which fraction is bigger \u2014 type 'first' or 'second':"}, {"title": "Converting improper fractions to mixed numbers", "teach": ["An improper fraction has a top number bigger than the bottom, like 7/3. This can be rewritten as a mixed number.", "Divide the top by the bottom: 7 \u00f7 3 = 2 remainder 1, so 7/3 = 2 and 1/3.", "The remainder becomes the new numerator, keeping the same denominator."], "yt_prompt": "Convert to a mixed number (write as e.g. 2 1/3):"}, {"title": "Converting mixed numbers to improper fractions", "teach": ["To convert a mixed number to an improper fraction, multiply the whole number by the denominator, then add the numerator.", "Example: 2 and 1/3 \u2192 (2\u00d73)+1 = 7, so it becomes 7/3.", "Keep the same denominator throughout \u2014 only the top number changes."], "yt_prompt": "Convert to an improper fraction (write as e.g. 7/3):"}, {"title": "Finding a fraction of an amount", "teach": ["To find a fraction of a number, divide by the bottom number, then multiply by the top number.", "Example: 3/4 of 20 \u2192 20 \u00f7 4 = 5, then 5 \u00d7 3 = 15.", "Always divide first \u2014 it's usually the easier number to work with."], "yt_prompt": "Work out the fraction of the amount:"}, {"title": "Fraction equivalence with pictures", "teach": ["Two fractions are equivalent if they cover the same amount of a shape, even when split into a different number of parts.", "Example: a shape split into 2 halves, one shaded, is the same amount as a shape split into 4 quarters, 2 shaded.", "This is the same idea as multiplying top and bottom \u2014 just shown visually instead of numerically."], "yt_prompt": "Which fraction is equivalent to 1/2?"}, {"title": "Ordering a set of fractions", "teach": ["To order several fractions, convert them all to a common denominator first, then compare the numerators.", "Example: 1/2, 1/4, 3/4 \u2014 using quarters: 2/4, 1/4, 3/4 \u2192 order is 1/4, 1/2, 3/4.", "This becomes much easier once you're confident finding common denominators."], "yt_prompt": "Which is the smallest of these three fractions?"}, {"title": "Mixed practice \u2014 fractions review", "teach": ["You've now covered equivalence, simplifying, comparing, converting, and finding fractions of amounts.", "These skills combine constantly in Year 7 maths \u2014 especially fraction of an amount and simplifying answers.", "Take this last question as a chance to combine what you've learned."], "yt_prompt": "Simplify this fraction fully:"}];
function ytGen_0() { const a=Math.floor(Math.random()*6)+2; const b=Math.floor(Math.random()*6)+a+1; const mult=Math.floor(Math.random()*4)+2; return {q:`${a}/${b} = ?/${b*mult}`, answer:String(a*mult)}; }
function ytGen_1() { const factor=Math.floor(Math.random()*4)+2; const a=(Math.floor(Math.random()*4)+1)*factor; const b=(Math.floor(Math.random()*4)+a/factor+1)*factor; const g=(x,y)=>y?g(y,x%y):x; const gcd=g(a,b); return {q:`${a}/${b}`, answer:`${a/gcd}/${b/gcd}`}; }
function ytGen_2() { const d=Math.floor(Math.random()*6)+5; const a=Math.floor(Math.random()*(d-1))+1; const b=Math.floor(Math.random()*(d-1))+1; const bigger = a>b?a:b; return {q:`${a}/${d} or ${b}/${d}? (type just the bigger numerator)`, answer:String(bigger)}; }
function ytGen_3() { const pairs=[['1/2','2/5','first'],['3/4','5/8','first'],['1/3','2/7','first'],['3/5','5/9','first']]; const p=pairs[Math.floor(Math.random()*pairs.length)]; return {q:`${p[0]} or ${p[1]}?`, answer:p[2]}; }
function ytGen_4() { const d=Math.floor(Math.random()*5)+3; const whole=Math.floor(Math.random()*4)+1; const rem=Math.floor(Math.random()*(d-1))+1; const n=whole*d+rem; return {q:`${n}/${d}`, answer:`${whole} ${rem}/${d}`}; }
function ytGen_5() { const d=Math.floor(Math.random()*5)+3; const whole=Math.floor(Math.random()*4)+1; const rem=Math.floor(Math.random()*(d-1))+1; const n=whole*d+rem; return {q:`${whole} ${rem}/${d}`, answer:`${n}/${d}`}; }
function ytGen_6() { const d=[2,3,4,5][Math.floor(Math.random()*4)]; const n=Math.floor(Math.random()*(d-1))+1; const amount=d*(Math.floor(Math.random()*8)+2); return {q:`${n}/${d} of ${amount}`, answer:String(amount/d*n)}; }
function ytGen_7() { const opts=['2/4','3/4','2/3','3/5']; return {q:'Which of these is equivalent to 1/2? Type it exactly: 2/4, 3/4, 2/3, or 3/5', answer:'2/4'}; }
function ytGen_8() { const sets=[['1/2','1/4','3/4','1/4'],['2/3','1/6','5/6','1/6'],['3/5','1/5','4/5','1/5']]; const s=sets[Math.floor(Math.random()*sets.length)]; return {q:`${s[0]}, ${s[1]}, ${s[2]}`, answer:s[3]}; }
function ytGen_9() { const factor=Math.floor(Math.random()*5)+2; const a=2*factor; const b=6*factor; const g=(x,y)=>y?g(y,x%y):x; const gcd=g(a,b); return {q:`${a}/${b}`, answer:`${a/gcd}/${b/gcd}`}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val == currentYT.answer) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = '<div class="teach"><strong>Well done — topic complete!</strong><br>You can mark this as complete below.</div>';
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) window.markComplete();
}

render();
</script>
