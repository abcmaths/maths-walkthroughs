<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'International Relations — Key Concepts',ACC,12,'middle',true));
var rows=[['Foreign policy','A state\'s goals and methods for dealing with other states'],['Diplomacy','Non-violent conduct of international relations through negotiations'],['Treaty','Formal agreement between two or more states (bilateral or multilateral)'],['Sovereignty','A state\'s supreme authority within its own territory'],['National interest','Goals a state pursues in foreign policy (security, economy, prestige)'],['International organisation','Bodies with state members: UN, AU, ECOWAS, Commonwealth'],['Globalisation','Increasing interconnection of world economies, cultures, societies']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,28+i*30,460,24,CRM,LINE,1));o.push(T(130,42+i*30,r[0],ACC,8,'middle',true));o.push(T(320,42+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key International Organisations',ACC,12,'middle',true));
var rows=[['UN (1945)','Security + peace; General Assembly; Security Council (5 permanent + 10)'],['AU (2002)','African Unity; HQ Addis Ababa; replaced OAU (1963)'],['ECOWAS (1975)','West African integration; HQ Abuja; ECOMOG peacekeeping'],['Commonwealth','Post-British Empire association; shared values + trade'],['G7/G20','Rich nations economic forum (G7); broader G20'],['WTO','World Trade Organisation; regulates international trade'],['IMF/World Bank','International financial institutions; loans + development']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,28+i*30,460,24,CRM,LINE,1));o.push(T(90,42+i*30,r[0],ACC,8,'middle',true));o.push(T(300,42+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'International Relations — Summary',ACC,13,'middle',true));
var rows=[['Foreign policy','Guided by national interest: security, economy, prestige, ideology'],['Nigeria\'s foreign policy','Africa as centrepiece; Concentric Circles; non-alignment history'],['UN','Founded 1945; Security Council (P5); General Assembly; peacekeeping'],['AU','Founded 2002 (replaced OAU 1963); African solutions; HQ Addis Ababa'],['ECOWAS','Founded 1975; West African integration; ECOMOG; HQ Abuja'],['WAEC tip','Know Nigeria\'s foreign policy principles AND international organisations']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 ELE',ti:'Nigeria\'s Foreign Policy',su:'Examine Nigeria\'s foreign policy and its guiding principles.',steps:[
{lb:'What is foreign policy?',dr:dQ1,ht:'<p><b>Foreign policy</b> is the set of goals, strategies and actions through which a state interacts with other states and the international system. It is shaped by: <b>National interest</b> — the goals a state prioritises (security, economic welfare, prestige, ideology). <b>National power</b> — the capabilities a state has to pursue its interests (military, economic, diplomatic). <b>International environment</b> — the constraints and opportunities presented by the global system. Nigeria\'s foreign policy has evolved since independence (1960) through different governments, but certain constants remain: African solidarity, non-alignment (historically), South-South cooperation, and the primacy of economic diplomacy in recent times.</p>'},
{lb:'Nigeria\'s foreign policy principles',dr:dQ2,ht:'<p>Nigeria\'s core foreign policy principles: (1) <b>"Africa is the centrepiece"</b> — Nigeria prioritises African affairs; it sees itself as a natural leader of Africa. (2) <b>Non-alignment</b> (Cold War period) — Nigeria did not formally join either the US-led or Soviet-led bloc. (3) <b>Anti-apartheid</b> — Nigeria was a leading campaigner against South African apartheid (broke diplomatic relations; sheltered ANC). (4) <b>Respect for sovereignty</b> — non-interference in other states\' internal affairs. (5) <b>Promotion of African unity</b> — Nigeria was a founding supporter of the OAU (now AU). (6) <b>Concentric Circles doctrine</b> — Nigeria\'s foreign policy priority: West Africa → Africa → other developing nations → the world.</p>'},
{lb:'Nigeria\'s foreign policy instruments',dr:dQ1,ht:'<p>Instruments of Nigeria\'s foreign policy: (1) <b>Diplomacy</b> — maintaining embassies and consulates worldwide; bilateral negotiations; multilateral diplomacy (UN, AU, ECOWAS). (2) <b>Economic diplomacy</b> — using trade, investment and aid to advance interests. (3) <b>Peacekeeping</b> — Nigeria is one of the world\'s largest contributors to UN and AU peacekeeping operations (ECOMOG in Liberia/Sierra Leone 1990s; UN missions in Congo, Darfur, Mali). (4) <b>Aid and technical assistance</b> — NCDC (now phased out) provided technical assistance to African countries. (5) <b>Membership of international organisations</b> — UN, AU, ECOWAS, Commonwealth, G20, OPEC. (6) <b>Cultural diplomacy</b> — Nollywood, Afrobeats as soft power.</p>'},
{lb:'Recent challenges to Nigeria\'s foreign policy',dr:dQ2,ht:'<p>Challenges to Nigeria\'s foreign policy: (1) <b>Domestic instability</b> — Boko Haram/ISWAP terrorism; Boko Haram affected Niger, Cameroon, Chad (Lake Chad Basin Commission). (2) <b>Economic difficulties</b> — a declining economy reduces Nigeria\'s diplomatic influence. (3) <b>Xenophobic attacks on Nigerians abroad</b> — especially in South Africa (2019+); Nigeria recalled its ambassador. (4) <b>Diaspora issues</b> — large Nigerian diaspora (particularly USA, UK, South Africa) whose welfare requires diplomatic attention. (5) <b>ECOWAS leadership</b> — Nigeria\'s 2023 response to the Niger coup (threatened military intervention, then backed down) raised questions about its leadership credibility. (6) Piracy in the Gulf of Guinea.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Nigeria\'s foreign policy doctrine known as "Africa is the centrepiece" means:',o:['Nigeria\'s president must always be an African head of state','Nigeria prioritises African affairs and sees itself as a natural leader of the African continent','Nigeria only has diplomatic relations with other African countries','All of Nigeria\'s trade must be with other African countries'],a:2,w:'"Africa is the centrepiece" — Nigeria\'s long-standing doctrine that African affairs are the primary focus and priority of its foreign policy. Nigeria sees leadership of Africa as central to its national identity and interests.'},{q:'The "Concentric Circles" doctrine in Nigeria\'s foreign policy means Nigeria prioritises:',o:['Having circular ambassadorial relationships with all countries equally','West Africa first, then Africa broadly, then developing nations, then the world as its foreign policy priorities','Rotating its membership in international organisations','Maintaining circular trade routes with key trading partners'],a:2,w:'Concentric Circles — Nigeria\'s foreign policy priority rings: (1) West Africa (immediate neighbourhood); (2) Africa broadly; (3) Other developing nations (South-South cooperation); (4) The rest of the world. Each ring matters, but the inner rings are prioritised.'},{q:'Nigeria\'s involvement in ECOMOG (1990s) demonstrated which foreign policy instrument?',o:['Economic diplomacy — using trade to advance interests','Cultural diplomacy — using Nollywood to influence African neighbours','Peacekeeping — military intervention to end civil wars in Liberia and Sierra Leone','Bilateral diplomacy — private negotiations between Nigerian and Liberian governments'],a:3,w:'ECOMOG (ECOWAS Ceasefire Monitoring Group) — Nigeria led this peacekeeping force in Liberia (1990-97) and Sierra Leone (1997-2000), demonstrating Nigeria\'s role as a regional security provider and its peacekeeping diplomacy.'},{q:'Nigeria\'s anti-apartheid foreign policy (Cold War era) included:',o:['Sending military forces to fight in South Africa alongside the ANC','Breaking diplomatic relations with apartheid South Africa and supporting the ANC','Selling oil to South Africa to fund the anti-apartheid movement financially','Organising UN military intervention in South Africa'],a:2,w:'Nigeria was one of apartheid South Africa\'s strongest opponents: it broke diplomatic relations; imposed an oil embargo; provided material support to the ANC; lobbied for sanctions at the UN and Commonwealth; and threatened to expel the UK from the Commonwealth if it did not adopt sanctions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 ELE',ti:'The United Nations',su:'Examine the United Nations — its structure, functions and role.',steps:[
{lb:'What is the United Nations?',dr:dQ2,ht:'<p>The <b>United Nations (UN)</b> was founded in 1945 after World War II to maintain international peace and security, develop friendly relations among nations, achieve international cooperation and harmonise national actions. Headquarters: New York (USA). Current membership: 193 member states. Nigeria joined the UN on 7 October 1960 — the same month it gained independence. The UN is based on the principle of the sovereign equality of all member states. The UN Charter is the founding document. Key bodies: General Assembly, Security Council, Secretariat, International Court of Justice, Economic and Social Council (ECOSOC), Trusteeship Council (largely inactive).</p>'},
{lb:'The UN Security Council',dr:dQ2,ht:'<p>The <b>Security Council</b> is the most powerful UN body — responsible for maintaining international peace and security. 15 members: 5 Permanent Members (P5) with veto power: USA, UK, France, Russia, China. 10 Non-Permanent Members: elected by General Assembly for 2-year terms. The veto: any P5 member can block any Security Council resolution. Key functions: authorise military interventions; impose sanctions; authorise peacekeeping missions. Nigeria has served as a non-permanent member several times. Nigeria has long advocated for Africa to have a permanent seat (the Ezulwini Consensus — two African permanent seats with veto power).</p>'},
{lb:'UN General Assembly and other bodies',dr:dQ1,ht:'<p>The <b>General Assembly</b>: all 193 member states; one country, one vote; passes resolutions (not legally binding like Security Council resolutions); debates all international issues; elects non-permanent Security Council members; approves UN budget. The <b>UN Secretariat</b>: administrative arm led by the Secretary-General (currently António Guterres; previous African SG: Boutros Boutros-Ghali of Egypt and Kofi Annan of Ghana). The <b>International Court of Justice (ICJ)</b>: the principal judicial organ; settles legal disputes between states (e.g. Bakassi Peninsula case — Nigeria vs Cameroon, decided 2002 in Cameroon\'s favour). UN specialised agencies: WHO, UNESCO, UNICEF, FAO, ILO, UNHCR, WFP.</p>'},
{lb:'Nigeria and the UN',dr:dQ2,ht:'<p>Nigeria\'s significant roles in the UN: (1) Major peacekeeping contributor — Nigeria has contributed more troops to UN peacekeeping operations than almost any other country. (2) Bakassi case — Nigeria lost the Bakassi Peninsula to Cameroon (2002 ICJ ruling); the peaceful implementation (2008) was internationally praised. (3) Nigeria has championed African permanent membership of the UN Security Council. (4) Nigeria has served as non-permanent Security Council member multiple times. (5) Nigeria has held senior UN positions — e.g. former Foreign Minister Emeka Anyaoku as Commonwealth Secretary-General. (6) Nigerian diplomats played key roles in drafting UN resolutions on Africa.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The United Nations was founded in:',o:['1919 (after World War I — same time as the League of Nations)','1939 (at the start of World War II)','1945 (after World War II)','1960 (when most African countries gained independence)'],a:3,w:'The United Nations was founded on 24 October 1945, after World War II, to replace the failed League of Nations (1919) and prevent future world wars. Nigeria joined when it became independent in 1960.'},{q:'The five Permanent Members (P5) of the UN Security Council who hold veto power are:',o:['USA, UK, France, Germany, Italy','USA, UK, France, Russia, China','USA, UK, France, Russia, Nigeria','USA, China, Russia, India, Brazil'],a:2,w:'The P5 are: USA, UK, France, Russia and China — the five major Allied powers at the end of World War II. Each has veto power, meaning they can block any Security Council resolution regardless of how other members vote.'},{q:'Nigeria lost the Bakassi Peninsula to Cameroon through a decision by:',o:['The UN Security Council (by resolution)','The African Union arbitration panel','The International Court of Justice (ICJ) in 2002','ECOWAS mediation and a bilateral treaty'],a:3,w:'The International Court of Justice (ICJ) ruled in October 2002 that the Bakassi Peninsula and the Lake Chad boundary belonged to Cameroon. Nigeria implemented the ruling peacefully by 2008, withdrawing its forces.'},{q:'The "Ezulwini Consensus" refers to Africa\'s position that:',o:['Africa should withdraw from the United Nations until African issues are given equal priority','The African Union should replace the United Nations as the main international body for African states','Africa should have at least two permanent seats with veto power on the UN Security Council','All African votes in the UN General Assembly should count twice'],a:3,w:'The Ezulwini Consensus (2005 AU Summit) is Africa\'s common position on UN Security Council reform: Africa demands at least two permanent seats with full veto power, to correct its underrepresentation in the P5.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 ELE',ti:'The African Union (AU)',su:'Examine the African Union — its structure, functions and significance.',steps:[
{lb:'Origins of the AU',dr:dQ3,ht:'<p>The <b>African Union (AU)</b> was established in 2002, replacing the Organisation of African Unity (OAU) which was founded in 1963. Why replace the OAU? The OAU was criticised for: (1) Excessive deference to state sovereignty — the "club of African dictators" that never criticised member governments\' internal abuses. (2) Ineffectiveness — failed to prevent coups, civil wars and genocide (Rwanda 1994). (3) Outdated mandate. The AU was established with a stronger mandate to: (a) Intervene in member states in cases of genocide, war crimes and crimes against humanity (the "Responsibility to Protect" — R2P). (b) Promote democracy and human rights. (c) Achieve African economic integration. Headquarters: Addis Ababa, Ethiopia.</p>'},
{lb:'AU structure and organs',dr:dQ4,ht:'<p>The AU has multiple organs: (1) <b>Assembly of Heads of State and Government</b> — supreme body; meets twice yearly; sets overall AU direction. (2) <b>Executive Council</b> — Foreign Ministers; implements Assembly decisions. (3) <b>African Commission on Human and Peoples\' Rights (ACHPR)</b> — protects human rights. (4) <b>African Court on Human and Peoples\' Rights</b> — judicial body for human rights. (5) <b>Peace and Security Council (PSC)</b> — AU\'s equivalent of the UN Security Council; authorises AU peacekeeping. (6) <b>New Partnership for Africa\'s Development (NEPAD)</b> — economic development framework. (7) <b>Pan-African Parliament (PAP)</b> — advisory legislative body. (8) <b>African Continental Free Trade Area (AfCFTA)</b> — launched 2021; creates the world\'s largest free trade area by number of countries.</p>'},
{lb:'AU and ECOWAS — peacekeeping',dr:dQ3,ht:'<p>The AU has intervened in several African conflicts: Somalia (AMISOM — now AUSSOM); Darfur, Sudan (UNAMID — with UN); Mali (AFISMA); Central African Republic; Burundi; South Sudan. The AU has the African Standby Force (ASF) — a rapid deployment force to be deployed within 14 days of a decision. ECOWAS has similarly intervened: ECOMOG in Liberia (1990-97); Sierra Leone (1997-2000); Guinea-Bissau; Gambia (2017 — Operation Restore Democracy; forced Yahya Jammeh out peacefully). Nigeria leads both AU and ECOWAS peacekeeping, contributing most troops and often funding operations. This peacekeeping leadership is central to Nigeria\'s "Africa as centrepiece" foreign policy.</p>'},
{lb:'Nigeria and the AU',dr:dQ4,ht:'<p>Nigeria\'s role in the AU: (1) Nigeria is the AU\'s largest economy (by some measures) and most populous member. (2) Nigeria contributes significantly to AU budget. (3) Nigerian diplomats and officials play leadership roles in AU institutions. (4) Nigeria championed the Ezulwini Consensus on UN Security Council reform. (5) Nigeria has led AU responses to several African crises. (6) Challenges: Nigeria\'s internal problems (Boko Haram, insecurity, economic difficulties) have sometimes limited its African leadership capacity. The 2023 Niger coup tested Nigeria\'s ECOWAS leadership — Nigeria initially proposed military intervention (as ECOWAS Chair) but ultimately backed down in the face of regional opposition. This reflects the limits of Nigerian leadership even within West Africa.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'The African Union (AU) replaced the OAU in 2002. The OAU was criticised for:',o:['Being too interventionist in member states\' internal affairs','Allowing too many non-African countries to influence African affairs','Excessive deference to state sovereignty — failing to criticise member governments\' abuses or prevent coups and genocides','Having its headquarters in the wrong African country'],a:3,w:'The OAU (1963-2002) was nicknamed the "club of African dictators" because it never criticised member governments\' internal abuses, citing sovereignty. It failed spectacularly during the 1994 Rwanda genocide. The AU was created with a stronger mandate to intervene.'},{q:'The AU\'s Peace and Security Council (PSC) is equivalent to the UN\'s:',o:['General Assembly','International Court of Justice','Security Council','Secretariat'],a:3,w:'The AU\'s Peace and Security Council (PSC) is the AU\'s equivalent of the UN Security Council — it authorises AU peacekeeping missions, imposes sanctions on member states, and decides on AU interventions in crises.'},{q:'AMISOM (now AUSSOM) is the AU peacekeeping mission deployed in:',o:['Sudan (Darfur)','Central African Republic','Somalia','Mali'],a:3,w:'AMISOM (African Union Mission in Somalia, now transitioned to AUSSOM — African Union Support and Stabilisation Mission in Somalia) has been deployed in Somalia since 2007, fighting Al-Shabaab and supporting the Somali government.'},{q:'The African Continental Free Trade Area (AfCFTA) is significant because:',o:['It creates a tariff-free zone between African countries and China','It merges all African central banks into one African currency','It creates the world\'s largest free trade area by number of countries, aiming to boost intra-African trade','It requires all African countries to adopt the same legal system for trade disputes'],a:3,w:'AfCFTA (launched 2021) covers 55 AU member states — creating the world\'s largest free trade area by number of countries. It aims to boost intra-African trade (currently only about 15% of total African trade) by reducing tariffs and trade barriers.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 ELE',ti:'ECOWAS and Regional Integration',su:'Examine ECOWAS and West African regional integration.',steps:[
{lb:'What is ECOWAS?',dr:dQ4,ht:'<p>The <b>Economic Community of West African States (ECOWAS)</b> was established by the Treaty of Lagos on 28 May 1975. Founding members: Nigeria, Ghana, Côte d\'Ivoire, Senegal, Liberia, Sierra Leone, Guinea, Togo, Dahomey (Benin), Upper Volta (Burkina Faso), Niger, Mali, Mauritania, Gambia, Cape Verde. Current membership: 15 member states (Mauritania withdrew in 2000). Headquarters: Abuja, Nigeria (a testament to Nigeria\'s founding leadership role). Goals: economic integration; free movement of people and goods; common market; monetary union (ECOWAS currencies: some members use CFA franc; Nigeria plans ECON). Nigeria was the founding force and remains the dominant member (comprising about 60% of ECOWAS\'s collective GDP).</p>'},
{lb:'ECOWAS achievements',dr:dQ4,ht:'<p>ECOWAS achievements: (1) <b>Free movement of persons</b> — citizens of member states can move within ECOWAS without visas (ECOWAS passport). (2) <b>ECOMOG peacekeeping</b> — successful intervention in Liberia (1990-97) and Sierra Leone (1997-2000) civil wars. (3) <b>Gambia (2017)</b> — peaceful Operation Restore Democracy; Yahya Jammeh forced out after refusing to accept election defeat. (4) Trade protocols facilitating movement of goods. (5) Common external tariff (CET) with the outside world. (6) ECOWAS Standby Force. Ongoing challenges: slow economic integration; different currencies (CFA vs others); political crises (Mali, Burkina Faso, Niger, Guinea — all experienced coups 2020-23).</p>'},
{lb:'ECOWAS challenges — the coup belt',dr:dQ3,ht:'<p>ECOWAS has faced a major challenge since 2020 with a wave of military coups in its Francophone members: Guinea (2021), Mali (2021), Burkina Faso (2022), Niger (2023). This "coup belt" raised questions about ECOWAS\'s effectiveness. ECOWAS responses: Mali — sanctions, threat of military intervention, eventually softened. Burkina Faso — sanctions (later eased). Niger (2023) — ECOWAS threatened military intervention; Nigeria (as ECOWAS chair under President Tinubu) was especially hawkish; ultimately backed down due to: French opposition; Nigerian National Assembly refusing to approve military action; military risks. The coup leaders formed the Alliance of Sahel States (ASS), distancing from ECOWAS.</p>'},
{lb:'Nigeria and ECOWAS',dr:dQ4,ht:'<p>Nigeria\'s role in ECOWAS: Dominant member — 60% of GDP; largest military. Nigeria funded ECOMOG operations in Liberia and Sierra Leone largely out of its own pocket (estimated $10-12 billion). Nigeria has hosted ECOWAS headquarters in Abuja. Nigeria has chaired ECOWAS multiple times. Challenges: Nigeria\'s domestic insecurity makes sustained regional engagement difficult. The Niger coup crisis (2023) exposed limits of Nigerian leadership — ultimately ECOWAS could not force a military reversal. Xenophobic attacks in Nigeria against other ECOWAS citizens (especially Ghanaians, Togolese) create tensions. ECOWAS free movement is not always respected in practice at Nigeria\'s borders.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'ECOWAS was established in:',o:['1963 (same year as the OAU)','1975 by the Treaty of Lagos','1980 when Nigeria joined','2002 when the African Union was created'],a:2,w:'ECOWAS was established on 28 May 1975 by the Treaty of Lagos, with Nigeria as the founding leader. ECOWAS HQ is in Abuja, Nigeria. It has 15 member states (Mauritania withdrew in 2000).'},{q:'ECOMOG\'s main peacekeeping operations were in:',o:['Sudan and Somalia (1990s-2000s)','Congo and Rwanda (1990s)','Liberia and Sierra Leone (1990s)','Kenya and Zimbabwe (2000s)'],a:3,w:'ECOMOG (ECOWAS Monitoring Group) conducted its main peacekeeping operations in: Liberia (1990-97, First Liberian Civil War) and Sierra Leone (1997-2000, helping restore President Kabbah after RUF coup). Nigeria provided most troops and funding.'},{q:'In 2017, ECOWAS successfully restored democracy in which West African country without firing a shot?',o:['Guinea after Alpha Condé\'s coup','Mali after the 2012 military coup','Niger after the 2023 coup','The Gambia, forcing Yahya Jammeh out after he refused to accept election defeat'],a:4,w:'Operation Restore Democracy in The Gambia (January 2017) — ECOWAS deployed troops to Gambia\'s borders and President-elect Adama Barrow was inaugurated in Senegal. Faced with ECOWAS troops and regional isolation, Yahya Jammeh left for Equatorial Guinea without fighting.'},{q:'The headquarters of ECOWAS is located in:',o:['Lagos, Nigeria (original location)','Accra, Ghana','Abuja, Nigeria','Dakar, Senegal'],a:3,w:'ECOWAS headquarters is in Abuja, Nigeria — reflecting Nigeria\'s founding leadership and dominant role. The HQ was originally in Lagos and moved to Abuja when Nigeria\'s capital moved there in 1991.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 ELE',ti:'WAEC Prep — International Relations',su:'Practise WAEC-style questions on international relations.',steps:[
{lb:'WAEC essay structure',dr:dQ5,ht:'<p>For WAEC questions on international relations: (1) Define the concept (foreign policy, diplomacy, etc.). (2) Discuss Nigeria\'s foreign policy principles (Africa as centrepiece; Concentric Circles; non-alignment; anti-apartheid). (3) Discuss international organisations (UN, AU, ECOWAS, Commonwealth) with founding dates, HQ, membership, structure and key functions. (4) Give specific examples of Nigeria\'s involvement. (5) Evaluate achievements and challenges. Common questions: "Examine Nigeria\'s foreign policy." / "Discuss the functions of ECOWAS." / "Assess the role of the UN in maintaining international peace."</p>'},
{lb:'Key facts for WAEC',dr:dQ5,ht:'<p>WAEC fact bank: UN founded 1945; HQ New York; 193 members; Security Council P5 (USA, UK, France, Russia, China); ICJ settled Bakassi case (2002). AU founded 2002; replaced OAU (1963); HQ Addis Ababa; 55 members; AfCFTA (2021); PSC (equivalent of UNSC); Ezulwini Consensus (2 African permanent UNSC seats). ECOWAS founded 1975 (Treaty of Lagos); HQ Abuja; 15 members; ECOMOG (Liberia/Sierra Leone 1990s); Gambia 2017. Nigeria foreign policy: Africa centrepiece; Concentric Circles; peacekeeping leadership; anti-apartheid; Bakassi loss (2002 ICJ). Soft power: Nollywood, Afrobeats.</p>'},
{lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Confusing the OAU (1963) with the AU (2002). Saying the UN was founded after World War I (it was 1945, after WWII; the League of Nations was post-WWI 1919). Saying ECOWAS HQ is in Lagos (it is in Abuja). Saying Nigeria is a P5 member of the UN Security Council (it is not; it has served as non-permanent member). Confusing the Bakassi Peninsula decision (ICJ ruled for Cameroon in 2002) with any other dispute. Not mentioning ECOMOG when discussing ECOWAS peacekeeping. Saying the AU was founded in 1963 (it was the OAU in 1963; the AU was 2002). Always give specific years and locations for international organisations.</p>'},
{lb:'Evaluation questions',dr:dQ2,ht:'<p>WAEC evaluation practice: "Has ECOWAS been successful?" Points FOR: ECOMOG (Liberia/Sierra Leone); Gambia 2017; free movement; common external tariff. Points AGAINST: slow economic integration; 2020-23 coup belt failure; enforcement problems; Nigeria\'s dominance creates imbalances. "Has the UN succeeded in maintaining peace?" Points FOR: peacekeeping missions; decolonisation; humanitarian agencies (WHO, UNICEF, UNHCR). Points AGAINST: failed Rwanda genocide prevention; P5 veto paralyses Security Council; Israel-Palestine; Syria; Sudan failures. WAEC rewards balanced evaluation — state both successes and failures, then give an overall assessment with reasons.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'The Organisation of African Unity (OAU) was replaced by the African Union (AU) primarily because:',o:['The OAU lacked a headquarters in Africa','The OAU was too costly and economically inefficient','The OAU was ineffective due to excessive deference to sovereignty; the AU was given stronger mandate to intervene in genocide and promote democracy','The OAU was dominated by North African countries; the AU shifted power to sub-Saharan Africa'],a:3,w:'The OAU\'s principle of non-interference in member states\' internal affairs led to failures in Rwanda (1994 genocide) and others. The AU replaced it with a stronger mandate: the Responsibility to Protect (R2P) and power to intervene in genocide, war crimes and crimes against humanity.'},{q:'Nigeria contributed most troops and funding to ECOMOG operations in the 1990s, reflecting its foreign policy principle of:',o:['Non-alignment — staying neutral in all international conflicts','Africa as the centrepiece — prioritising African peace and stability as central to Nigeria\'s national interest','Economic diplomacy — expecting trade benefits in return for peacekeeping','Self-determination — supporting the rights of Liberian and Sierra Leonean peoples to independence'],a:2,w:'"Africa as the centrepiece" — Nigeria\'s dominant role in ECOMOG (Liberia and Sierra Leone) reflected its view that African peace and stability are central to its national interest and its self-image as Africa\'s leader.'},{q:'The Bakassi Peninsula case (decided 2002) is an example of which aspect of international relations?',o:['Nigeria winning a territorial dispute through military force','Peaceful resolution of an inter-state boundary dispute through international law (ICJ)','ECOWAS mediating a boundary dispute between two of its members','Nigeria and Cameroon agreeing through bilateral negotiation without third party involvement'],a:2,w:'The Bakassi case illustrates the peaceful resolution of inter-state disputes through international law. Nigeria accepted the ICJ\'s 2002 ruling (which went against Nigeria) and peacefully withdrew its forces from Bakassi by 2008 — widely praised internationally.'},{q:'The Commonwealth of Nations includes Nigeria because:',o:['Nigeria is a major oil producer and the Commonwealth is an energy organisation','Nigeria was a British colony; the Commonwealth links former British territories through shared values and trade','Nigeria joined by invitation from the United Nations in 1960','Nigeria was a founding member when the Commonwealth was established in 1931'],a:2,w:'The Commonwealth is an association of former British territories. Nigeria joined as a Commonwealth member when it gained independence from Britain in 1960. Nigeria has temporarily left (1995 suspension during Abacha; restored 1999) and returned.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 ELE',ti:'Further Practice — International Relations',su:'Extended practice on international relations topics.',steps:[
{lb:'Diplomacy and its methods',dr:dQ6,ht:'<p><b>Diplomacy</b> is the management of international relations through negotiation, communication and other peaceful means. Methods of diplomacy: (1) <b>Bilateral diplomacy</b> — direct negotiations between two states. (2) <b>Multilateral diplomacy</b> — negotiations involving multiple states (e.g. UN climate conferences). (3) <b>Summit diplomacy</b> — direct meetings between heads of state. (4) <b>Public diplomacy</b> — communicating with foreign publics (cultural exchange, media, propaganda). (5) <b>Economic diplomacy</b> — using trade, aid and investment as diplomatic tools. (6) <b>Coercive diplomacy</b> — using threats (sanctions, ultimatums) to change another state\'s behaviour. Nigeria employs all of these methods, but economic diplomacy has become increasingly central as Nigeria seeks foreign investment.</p>'},
{lb:'Nigeria\'s Commonwealth membership',dr:dQ6,ht:'<p>Nigeria is a member of the <b>Commonwealth of Nations</b> — an association of 56 countries, almost all former British territories. Commonwealth benefits: (1) Trade preferences in some areas. (2) Educational exchanges (Commonwealth Scholarships). (3) Technical assistance. (4) A platform for political dialogue. Nigeria\'s Commonwealth history: Member since 1960 independence. Suspended in 1995 (during Abacha\'s military government, following the execution of Ken Saro-Wiwa). Readmitted in 1999 after democracy was restored. Nigeria has hosted Commonwealth Heads of Government meetings. The Commonwealth has been less important to Nigeria than the UN, AU and ECOWAS but remains a useful network.</p>'},
{lb:'Nigeria and international financial institutions',dr:dQ6,ht:'<p>Nigeria\'s relations with the <b>IMF</b> and <b>World Bank</b>: Nigeria has had a mixed relationship — borrowing from both during economic difficulties but also resisting their policy conditionalities. Key events: SAP (Structural Adjustment Programme, 1986-1993) — imposed by the IMF/World Bank in exchange for loans; required devaluation, subsidy removal, privatisation. Very unpopular. 2005 — Nigeria secured $18 billion Paris Club debt relief (negotiated by Finance Minister Ngozi Okonjo-Iweala). Nigeria has been a recipient of World Bank development loans for infrastructure, health and education. Nigeria is a member of the WTO (World Trade Organisation) — governing international trade rules. Nigeria is also a member of OPEC (Organisation of Petroleum Exporting Countries) — the oil cartel that coordinates production levels.</p>'},
{lb:'Globalisation and Nigeria',dr:dQ6,ht:'<p><b>Globalisation</b> is the process of increasing economic, cultural, technological and political interconnection across the world. Effects on Nigeria: (1) Economic integration — Nigerian oil is a global commodity; multinationals (Shell, Chevron, Total) operate in Nigeria. (2) Cultural influence — Nollywood (world\'s second-largest film industry) and Afrobeats (global music phenomenon) project Nigerian culture worldwide. (3) Communication — internet and social media connect Nigerians to global discourse. (4) Migration — large Nigerian diaspora in UK, USA, South Africa. (5) Challenges — global price fluctuations affect Nigeria\'s oil-dependent economy; multinational corporations may drain profits rather than invest locally; cultural homogenisation risks eroding local cultures.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Nigeria was suspended from the Commonwealth of Nations in 1995 because:',o:['Nigeria withdrew voluntarily to protest Commonwealth trade policies','General Sani Abacha\'s military government executed Ken Saro-Wiwa and eight other Ogoni activists, violating Commonwealth human rights values','Nigeria fell behind on its Commonwealth membership dues','Nigeria supported a Commonwealth member that was in violation of sanctions'],a:2,w:'Abacha\'s execution of Ken Saro-Wiwa and the Ogoni Nine in November 1995 led to Nigeria\'s suspension from the Commonwealth. Nigeria was readmitted in 1999 after Obasanjo\'s democratic government was inaugurated.'},{q:'OPEC (which Nigeria is a member of) stands for:',o:['Organisation for Petroleum Exporting Countries','Organisation for Political Economic Cooperation','Organisation of Pan-African Economic Countries','Oil Producing and Exporting Companies'],a:1,w:'OPEC = Organisation of Petroleum Exporting Countries — the cartel of major oil-producing nations that coordinates crude oil production to influence global prices. Nigeria joined OPEC in 1971 and is Africa\'s largest producer.'},{q:'Nigeria\'s "soft power" in international relations is best represented by:',o:['Nigeria\'s military contributions to UN peacekeeping operations','Nigeria\'s oil wealth and the influence it brings in OPEC','Nollywood (world\'s second-largest film industry) and Afrobeats (global music) projecting Nigerian culture internationally','Nigeria\'s foreign aid programmes to poorer African nations'],a:3,w:'Soft power refers to attracting and influencing others through culture, values and appeal rather than force (hard power) or economic incentives. Nollywood and Afrobeats are Nigeria\'s most powerful soft power tools — reaching global audiences.'},{q:'The Structural Adjustment Programme (SAP, 1986-1993) in Nigeria was imposed as a condition of:',o:['ECOWAS membership','Getting debt relief from the Paris Club of creditor nations','IMF/World Bank loans — requiring devaluation, subsidy removal and privatisation','Joining the WTO (World Trade Organisation)'],a:3,w:'Nigeria\'s SAP (1986, Babangida government) was implemented to meet IMF/World Bank conditionalities for loan access. It required: currency devaluation, removal of subsidies, trade liberalisation, privatisation — policies that caused severe economic hardship for ordinary Nigerians.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 ELE',ti:'Deep Revision — International Relations',su:'Advanced revision on international relations.',steps:[
{lb:'National interest and foreign policy',dr:dQ7,ht:'<p>The concept of <b>national interest</b> is the foundation of foreign policy analysis. Nations pursue their interests, not abstract moral principles, in international relations (Realism). Types of national interest: (1) <b>Security interest</b> — protecting the state from military attack. (2) <b>Economic interest</b> — promoting trade, investment and prosperity. (3) <b>Political interest</b> — maintaining sovereignty; gaining international prestige and influence. (4) <b>Ideological interest</b> — promoting values (democracy, human rights). (5) <b>Cultural interest</b> — protecting national culture and promoting it abroad (soft power). Nigeria\'s national interests: territorial integrity; oil revenue; African leadership; diaspora welfare; fighting terrorism (Boko Haram cross-border); economic investment.</p>'},
{lb:'Bilateral vs multilateral relations',dr:dQ7,ht:'<p>Nigeria maintains both bilateral and multilateral international relations: <b>Bilateral key partners</b>: USA (major trade partner; security cooperation; large diaspora). UK (post-colonial ties; trade; education; Commonwealth). China (largest source of infrastructure loans and investment; Belt and Road Initiative). France (Francophone West Africa neighbors). South Africa (major trade partner; tensions from xenophobic attacks). <b>Multilateral forums</b>: UN, AU, ECOWAS, Commonwealth, G20 (Nigeria is one of the world\'s top 20 economies; member of G20 from 2023), OPEC, WTO, African Development Bank. Nigeria\'s G20 membership reflects its economic weight and ambitions for global leadership.</p>'},
{lb:'Terrorism and international security',dr:dQ7,ht:'<p>Terrorism has become a major issue in Nigeria\'s international relations: Boko Haram (and its ISWAP faction) operates across northeast Nigeria and parts of Niger, Cameroon and Chad. This has required: (1) Multinational Joint Task Force (MNJTF) — Nigeria, Niger, Cameroon, Chad and Benin cooperating on security. (2) Intelligence sharing with USA and Western countries. (3) Support from France (Operation Barkhane in the Sahel). (4) AU peacekeeping support. (5) Diplomatic engagement with neighbouring states on counter-terrorism. The Sahel crisis (Boko Haram, JNIM, ISWAP across Mali, Burkina Faso, Niger) is directly linked to Nigeria\'s security — jihadist groups cross borders freely.</p>'},
{lb:'Nigeria\'s 2023 election and international relations',dr:dQ7,ht:'<p>The 2023 Nigerian elections had international implications: (1) Western countries and civil society watched closely — election credibility matters for aid and investment. (2) The disputed presidential result (Atiku, Obi vs Tinubu) raised concerns among partners. (3) The Supreme Court\'s eventual ruling upholding Tinubu\'s election was internationally noted. (4) Tinubu\'s foreign policy: more engagement with the West and China; continued African leadership role; pushed for Nigeria\'s G20 membership; fuel subsidy removal (economic reform to satisfy IMF). (5) Niger coup (2023) — Tinubu\'s hawkish ECOWAS response tested Nigeria\'s relationships with Sahel governments and their (French, then Russian) backers.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Which of these best represents Nigeria\'s "national interest" in international relations?',o:['Promoting the political interests of the current ruling party internationally','Advancing territorial integrity, oil revenue, African leadership, diaspora welfare and investment attraction','Imposing Nigerian cultural values on other African nations','Following the policy preferences of Nigeria\'s largest trade partners'],a:2,w:'National interest refers to the fundamental goals a state pursues internationally. Nigeria\'s national interests include: territorial integrity (no secession); oil revenue; African regional leadership; welfare of Nigerians abroad; attracting foreign investment.'},{q:'The Multinational Joint Task Force (MNJTF) addressing Boko Haram/ISWAP involves:',o:['Only Nigeria and the United States','Nigeria, Niger, Cameroon, Chad and Benin — the Lake Chad Basin countries most affected','All 15 ECOWAS member states equally','The African Union\'s African Standby Force alone'],a:2,w:'The MNJTF involves the Lake Chad Basin countries most directly affected by Boko Haram/ISWAP: Nigeria, Niger, Cameroon, Chad and Benin. This multinational cooperation reflects the cross-border nature of the terrorist threat.'},{q:'China\'s role in Nigeria\'s international relations is primarily through:',o:['Providing military troops for peacekeeping operations','Large infrastructure loans and investment through the Belt and Road Initiative and other channels','Cultural diplomacy — promoting Chinese language and values in Nigeria','Military cooperation and arms sales'],a:2,w:'China is Nigeria\'s largest source of infrastructure loans (for railways, roads, bridges) and foreign direct investment. This relationship has grown rapidly since 2000, with China replacing the West as Nigeria\'s primary infrastructure financier.'},{q:'Nigeria\'s G20 membership (from 2023) is significant because:',o:['It gives Nigeria a veto power in the G20 equivalent to the UN P5','It reflects Nigeria\'s economic weight as one of the world\'s largest economies and its global leadership ambitions','It obligates Nigeria to follow all G20 trade rules without exception','It was awarded as a result of Nigeria\'s peacekeeping contributions'],a:2,w:'G20 membership = one of the world\'s 20 largest economies. Nigeria\'s inclusion reflects its status as Africa\'s largest economy (by GDP in some years). It gives Nigeria a seat at the table for global economic governance discussions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 ELE',ti:'International Relations — Final Revision',su:'Final preparation for WAEC questions on international relations.',steps:[
{lb:'Comparing international organisations',dr:dQ8,ht:'<p>Comparing international organisations: UN (global; 193 members; peace, security, development; SC with P5 veto; founded 1945; HQ New York). AU (African; 55 members; peace, integration, human rights; founded 2002; HQ Addis Ababa; replaced OAU 1963). ECOWAS (West African; 15 members; economic integration, peace; founded 1975; HQ Abuja; ECOMOG). Commonwealth (former British territories; 56 members; shared values, trade; HQ London; Secretary-General). G20 (20 largest economies; economic governance; no permanent HQ). OPEC (oil exporters; production coordination; HQ Vienna). WTO (global trade; 164 members; trade rules; HQ Geneva). Nigeria is a member of all of these.</p>'},
{lb:'Foreign policy determinants',dr:dQ8,ht:'<p>What determines a country\'s foreign policy: (1) <b>National power</b> — military strength, economic size, diplomatic influence. (2) <b>Geography</b> — location; neighbours; access to sea or resources. (3) <b>History</b> — colonial legacy; past wars; alliances. (4) <b>Ideology</b> — values system of the ruling government. (5) <b>Public opinion and pressure groups</b> — domestic pressures on foreign policy decisions. (6) <b>Economic interests</b> — trade, investment, resources. (7) <b>International environment</b> — alliances, rivalries, global trends. Nigeria\'s foreign policy is significantly shaped by: its colonial British legacy; its oil wealth; the diversity of its population (making domestic unity a priority over adventurism); and its historical role as Africa\'s largest country.</p>'},
{lb:'WAEC essay templates',dr:dQ8,ht:'<p>WAEC essay: "Discuss Nigeria\'s foreign policy": (1) Define foreign policy. (2) Guiding principles (Africa centrepiece; Concentric Circles; non-alignment; anti-apartheid; sovereign equality). (3) Instruments (diplomacy; peacekeeping; economic diplomacy; soft power). (4) Specific examples (ECOMOG; Bakassi; AU leadership; anti-apartheid). (5) Achievements (ECOMOG success; Gambia 2017; Bakassi peaceful transfer; debt relief 2005; AfCFTA support). (6) Challenges (Niger coup; xenophobia; domestic insecurity reducing credibility; economic difficulties). (7) Evaluation and conclusion. 25 marks = define + 5 well-developed points + evaluation + conclusion = 25-30 minutes.</p>'},
{lb:'Final revision checklist',dr:dQ8,ht:'<p>Final checklist: Know: (1) Nigeria\'s foreign policy principles (Africa centrepiece, Concentric Circles, non-alignment, anti-apartheid). (2) UN (1945; New York; 193; P5; GA; ICJ; Bakassi). (3) AU (2002; Addis Ababa; 55; replaced OAU 1963; PSC; AfCFTA). (4) ECOWAS (1975; Abuja; 15; ECOMOG; Gambia 2017; coup belt 2020-23). (5) Commonwealth (post-British; 56 members; Nigeria 1995 suspension). (6) OPEC (oil cartel; Nigeria joined 1971; Vienna HQ). (7) IMF/World Bank (SAP 1986; 2005 debt relief). (8) G20 (Nigeria member from 2023). (9) Soft power (Nollywood; Afrobeats). (10) Bakassi (2002 ICJ; Cameroon won; Nigeria peacefully withdrew 2008).</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Nigeria joined the UN in:',o:['1945 — when the UN was founded','1960 — the month it gained independence (October 1960)','1963 — when the OAU was founded','1975 — when ECOWAS was created'],a:2,w:'Nigeria joined the UN on 7 October 1960 — the same month it gained independence from Britain (1 October 1960). Nigeria has been a member since independence, serving multiple times as a non-permanent Security Council member.'},{q:'The AfCFTA (African Continental Free Trade Area) is significant because it:',o:['Creates a single African currency to replace all national currencies','Allows free movement of all people within Africa without passports','Creates the world\'s largest free trade area by number of countries (55 AU members), aiming to boost intra-African trade','Merges all African armed forces into a single continental army'],a:3,w:'AfCFTA (launched 2021) — 55 AU member states forming the world\'s largest free trade area by number of countries. Intra-African trade is currently only ~15% of total African trade; AfCFTA aims to increase this dramatically by reducing tariffs and barriers.'},{q:'Nigeria\'s 2005 Paris Club debt relief ($18 billion) was significantly influenced by which Finance Minister?',o:['Kemi Adeosun','Mansur Muhtar','Ngozi Okonjo-Iweala (now WTO Director-General)','Emefiele Godwin'],a:3,w:'Ngozi Okonjo-Iweala, Nigeria\'s Finance Minister under Obasanjo (2003-2006), negotiated Nigeria\'s $18 billion Paris Club debt relief in 2005 — one of Nigeria\'s biggest foreign policy/economic achievements. She later became the first African and first female Director-General of the WTO.'},{q:'What is the primary purpose of OPEC (which Nigeria joined in 1971)?',o:['To promote democracy among oil-producing nations','To provide development loans to oil-producing countries','To coordinate oil production among member states to influence global oil prices','To train oil company workers across member states'],a:3,w:'OPEC coordinates crude oil production levels among member states to influence global oil prices. When OPEC reduces production, prices typically rise (benefiting exporters like Nigeria). When it increases production, prices fall.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 ELE',ti:'Mixed Questions — International Relations',su:'Mixed revision on international relations topics.',steps:[
{lb:'All organisations summary',dr:dQ9,ht:'<p>Organisation reference: UN (United Nations): founded 1945, HQ New York, 193 members, Security Council (P5 + 10), General Assembly (one state one vote), ICJ. OAU: founded 1963, HQ Addis Ababa, replaced by AU 2002. AU: founded 2002, HQ Addis Ababa, 55 members, PSC, AfCFTA 2021. ECOWAS: founded 1975, Treaty of Lagos, HQ Abuja, 15 members, ECOMOG. Commonwealth: post-British, 56 members, HQ London. OPEC: oil producers, HQ Vienna, Nigeria joined 1971. WTO: trade, HQ Geneva, 164 members. IMF: monetary stability, HQ Washington DC. World Bank: development, HQ Washington DC. G20: 20 largest economies, Nigeria joined 2023.</p>'},
{lb:'Key dates and events',dr:dQ9,ht:'<p>Key dates in Nigeria\'s international relations: 1960 — Independence; joined UN. 1961 — Joined Commonwealth. 1971 — Joined OPEC. 1975 — Co-founded ECOWAS (Treaty of Lagos). 1986-93 — SAP (IMF conditionalities). 1995 — Suspended from Commonwealth (Abacha/Saro-Wiwa). 1990-97 — ECOMOG in Liberia. 1997-2000 — ECOMOG in Sierra Leone. 1999 — Democracy restored; Commonwealth readmission. 2002 — ICJ Bakassi ruling (Cameroon wins). 2005 — Paris Club debt relief ($18 billion). 2008 — Bakassi peacefully transferred to Cameroon. 2017 — ECOWAS Gambia operation. 2019 — Xenophobic attacks by South Africans on Nigerians. 2023 — Niger coup; G20 membership; BVAS elections.</p>'},
{lb:'Analysis questions',dr:dQ9,ht:'<p>Practice analysis: "Nigeria — giant of Africa or paper giant?" Arguments FOR giant: largest African population and economy; ECOMOG leadership; anti-apartheid champion; peacekeeping contributor; Nollywood soft power; G20 member. Arguments AGAINST (paper giant): domestic insecurity (Boko Haram, bandits, separatists); economic difficulties (poverty, inequality, currency collapse); Niger coup failure; corruption undermining credibility; diaspora conditions (xenophobic attacks); failure to convert economic size into consistent diplomatic leadership. Assessment: Nigeria has enormous potential and periodic moments of genuine African leadership, but domestic challenges consistently limit its international impact.</p>'},
{lb:'WAEC exam tips',dr:dQ9,ht:'<p>Top exam tips for international relations questions: (1) Always give founding year, HQ and membership for international organisations. (2) Distinguish AU (2002) from OAU (1963). (3) Know the UN P5 — USA, UK, France, Russia, China. (4) Know ECOWAS HQ is Abuja, not Lagos. (5) Use the Bakassi case as an example of peaceful dispute resolution through international law. (6) Use ECOMOG as Nigeria\'s peacekeeping example. (7) For evaluation questions, always give BOTH achievements and failures before your overall assessment. (8) Link foreign policy to national interest. (9) Use specific examples — WAEC rewards specificity over generality. (10) Proofread for spelling of organisation names.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'The OAU (Organisation of African Unity) was founded in:',o:['1945 (same year as the United Nations)','1960 (year of African independence)','1963 (Addis Ababa, Ethiopia)','1975 (same year as ECOWAS)'],a:3,w:'The OAU was founded on 25 May 1963 in Addis Ababa, Ethiopia, by 32 African independent states. It aimed to decolonise Africa and promote African unity. It was replaced by the AU in 2002. 25 May is now African Union Day.'},{q:'The UN\'s "one country, one vote" principle applies in which body?',o:['The Security Council (P5 + 10)','The General Assembly (all 193 member states have equal votes)','The International Court of Justice','The UN Secretariat'],a:2,w:'The UN General Assembly operates on the principle of "one state, one vote" — each of the 193 member states has equal voting weight. This contrasts with the Security Council where P5 members have veto power.'},{q:'Nigeria\'s primary contribution to ECOMOG operations was in terms of:',o:['Financial and logistical support only — no Nigerian troops were deployed','Providing diplomatic support from New York and Abuja','Most troops and largest share of operational funding (Nigeria bore the majority of ECOMOG costs)','Only providing air support while ground troops came from other ECOWAS members'],a:3,w:'Nigeria provided the vast majority of ECOMOG troops and funded most of the operation. Estimates suggest Nigeria spent $10-12 billion on ECOMOG in Liberia and Sierra Leone in the 1990s — a massive commitment that strained Nigeria\'s own economy.'},{q:'The International Court of Justice (ICJ) is the principal judicial organ of:',o:['The African Union','The United Nations','The Economic Community of West African States','The Commonwealth of Nations'],a:2,w:'The ICJ is the principal judicial organ of the United Nations, established by the UN Charter in 1945. It settles legal disputes between states (e.g. the Bakassi case between Nigeria and Cameroon) and gives advisory opinions on legal questions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 ELE',ti:'Final Mixed — International Relations',su:'Integrated final revision across all GOV-ELE-10 topics.',steps:[
{lb:'Complete summary',dr:dQ10,ht:'<p>Foreign policy = goals and methods for dealing with other states; guided by national interest (security, economy, prestige, ideology). Nigeria: Africa centrepiece; Concentric Circles; non-alignment; anti-apartheid; Concentric Circles; peacekeeping. UN (1945; New York; 193; P5; GA; ICJ; peacekeeping; Bakassi). AU (2002; Addis Ababa; 55; replaced OAU 1963; PSC; AfCFTA 2021). ECOWAS (1975; Treaty of Lagos; HQ Abuja; 15; ECOMOG Liberia/Sierra Leone; Gambia 2017; coup belt 2020-23). Commonwealth (56; post-British; 1995 suspension and 1999 readmission). OPEC (1971; Vienna; oil cartel). IMF/WB (SAP 1986; 2005 debt relief). G20 (2023). Soft power: Nollywood, Afrobeats.</p>'},
{lb:'Major events in Nigeria\'s international history',dr:dQ10,ht:'<p>Major events: 1960 — Independence + UN membership. 1975 — ECOWAS founding. 1986 — SAP (IMF conditions). 1990-2000 — ECOMOG (Liberia + Sierra Leone). 1995 — Commonwealth suspension (Saro-Wiwa). 1999 — Commonwealth return. 2002 — ICJ Bakassi (Cameroon). 2005 — Paris Club debt relief. 2008 — Bakassi peaceful transfer. 2017 — Gambia operation. 2019 — South Africa xenophobia; Nigeria recalled ambassador. 2023 — Niger coup; hawkish then backdown; G20 membership; BVAS elections. These events trace Nigeria\'s engagement from newly independent African leader to complex, challenged middle power with enormous potential but significant domestic constraints.</p>'},
{lb:'Evaluation: is Nigeria fulfilling its potential?',dr:dQ9,ht:'<p>Evaluation of Nigeria\'s international role: Achievements: ECOMOG leadership in West Africa; anti-apartheid champion; Bakassi peaceful resolution; debt relief 2005; G20 membership; Nollywood/Afrobeats soft power; significant UN peacekeeping contributor. Shortfalls: Niger coup failure undermined leadership credibility; domestic insecurity (Boko Haram, bandits) limits external engagement capacity; economic difficulties reduce diplomatic leverage; corruption undermines international image; xenophobic attacks on Nigerians abroad suggest bilateral relationship failures. Verdict: Nigeria has the potential to lead Africa but domestic challenges consistently constrain it. True African leadership requires addressing domestic governance first.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final WAEC tips for international relations: Know all organisations with: name, abbreviation, founding year, HQ, membership number, key functions, Nigeria\'s role. Know Nigeria\'s foreign policy principles by name and explanation. Know the UN P5. Know ECOMOG (Liberia, Sierra Leone) as key peacekeeping examples. Know Bakassi (2002 ICJ; Cameroon; peaceful 2008 withdrawal). Know the OAU-to-AU transition (1963 to 2002). Know ECOWAS founding (1975, Treaty of Lagos). Know Nigeria\'s soft power (Nollywood, Afrobeats). For essays: structure as define → types/organs → functions → Nigeria\'s role → achievements → challenges → evaluation → conclusion. Always give specific years, locations and examples.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'Which of these is the correct chronological order of founding for these organisations?',o:['ECOWAS (1975) → OAU (1963) → UN (1945) → AU (2002)','UN (1945) → OAU (1963) → ECOWAS (1975) → AU (2002)','OAU (1963) → UN (1945) → AU (2002) → ECOWAS (1975)','AU (2002) → ECOWAS (1975) → UN (1945) → OAU (1963)'],a:2,w:'The correct order: UN (1945 — post-WWII) → OAU (1963 — African decolonisation era) → ECOWAS (1975 — West African integration) → AU (2002 — replaced OAU with stronger mandate).'},{q:'Nigeria\'s most powerful soft power tools in international relations today are:',o:['Its military (Africa\'s largest) and oil production','Nollywood (world\'s second-largest film industry) and Afrobeats (global music phenomenon)','Its diplomatic corps (one of Africa\'s largest) and embassies worldwide','Its large population (200+ million) and land mass (most people in Africa)'],a:2,w:'Soft power = influence through attraction and culture. Nollywood (globally distributed films) and Afrobeats (international chart hits and performances) are Nigeria\'s primary soft power tools — projecting Nigerian culture worldwide more effectively than any government diplomacy.'},{q:'The AU\'s Peace and Security Council authorised the AMISOM mission in:',o:['Democratic Republic of Congo — to stop the M23 rebel group','Somalia — to fight Al-Shabaab and support the Somali government','Sudan/Darfur — to stop the genocide and protect civilians','Central African Republic — to protect civilians from armed groups'],a:2,w:'AMISOM (African Union Mission in Somalia) was authorised by the AU\'s Peace and Security Council and deployed since 2007 to fight Al-Shabaab, support the Somali Federal Government and stabilise the country. Now transitioned to AUSSOM.'},{q:'What made Nigeria\'s handling of the Bakassi Peninsula case (2002-2008) internationally noteworthy?',o:['Nigeria\'s successful military defence of the peninsula against Cameroonian forces','Nigeria winning the case at the International Court of Justice','Nigeria peacefully accepting and implementing the ICJ ruling, handing over Bakassi to Cameroon by 2008, despite domestic political pressure not to do so','Nigeria and Cameroon jointly developing the oil resources of Bakassi under a shared sovereignty agreement'],a:3,w:'Nigeria\'s peaceful implementation of the ICJ Bakassi ruling was internationally praised. Despite domestic pressure to retain the peninsula, Nigeria completed the withdrawal by 2008 — demonstrating that African states can resolve territorial disputes through international law rather than war.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
