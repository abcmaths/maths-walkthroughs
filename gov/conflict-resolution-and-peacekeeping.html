.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}

var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});

{ey:'Q1 \u2022 Gov • International Relations',ti:'Meaning and Causes of Conflict',su:'Define conflict and explain its major causes in international relations.',steps:[
{lb:'Defining conflict',dr:dQ1,ht:'<p>In international relations, <b>conflict</b> refers to a serious disagreement or clash of interests between two or more states or groups, ranging from diplomatic disputes to full-scale armed warfare, arising when parties pursue incompatible goals.</p>'},

{lb:'Ethnic, religious and identity-based causes',dr:dQ1,ht:'<p><b>Ethnic and religious tensions</b>, often rooted in colonial-era border-drawing that grouped rival communities within single states, have fuelled conflicts across Africa, including aspects of Nigeria\'s own regional tensions and the Sahel\'s jihadist insurgencies.</p>'},
{lb:'Political and governance-based causes',dr:dQ1,ht:'<p>Conflicts frequently arise from <b>political grievances</b> &mdash; disputed elections, exclusion from power, perceived marginalisation, or authoritarian governance &mdash; as illustrated by Nigeria\'s 1966 political crisis leading to civil war, and more recent Sahel coups linked to governance failures.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the best definition of "conflict" in international relations?',o:['A serious disagreement or clash of interests between states or groups','A synonym for a trade agreement','A type of international treaty','A form of diplomatic celebration'],a:0,w:'Conflict refers to a serious disagreement or clash of interests between states or groups.'},{q:'Which of Nigeria\'s conflicts stems primarily from competition over scarce resources?',o:['Farmer-herder conflicts','The Nigerian Civil War','The #EndSARS protests','The annulled 1993 election'],a:0,w:'Nigeria\'s farmer-herder conflicts stem primarily from competition over scarce resources like land and water.'},{q:'What historical factor is often blamed for grouping rival ethnic communities within single African states?',o:['Colonial-era border-drawing','Post-independence elections','The founding of the AU','The founding of ECOWAS'],a:0,w:'Colonial-era border-drawing is often blamed for grouping rival ethnic communities within single states.'},{q:'Which region has seen conflicts fuelled by jihadist insurgencies linked to identity and religion?',o:['The Sahel','Southern Africa','East Asia','Western Europe'],a:0,w:'The Sahel has seen conflicts fuelled by jihadist insurgencies linked to identity and religion.'},{q:'What kind of political grievance can lead to conflict, according to this lesson?',o:['Disputed elections and exclusion from power','A shared national anthem','A shared currency','A shared national holiday'],a:0,w:'Disputed elections and exclusion from power are political grievances that can lead to conflict.'},{q:'Which historic Nigerian crisis illustrates political grievances leading to conflict?',o:['The 1966 political crisis leading to civil war','The 2021 AfCFTA agreement','The 1975 Treaty of Lagos','The 2005 Paris Club deal'],a:0,w:'Nigeria\'s 1966 political crisis, leading to civil war, illustrates political grievances causing conflict.'},{q:'What recent regional trend is linked to governance failures, according to this lesson?',o:['The Sahel coup wave','The rise of Nollywood','The growth of AfCFTA','The Commonwealth Games'],a:0,w:'The recent Sahel coup wave is linked to governance failures, according to this lesson.'},{q:'Why is it useful to categorise conflict causes into resource, identity and political types?',o:['It provides a clearer framework for analysing the roots of specific conflicts','It replaces the need for any factual examples','It applies only to Nigeria, not other states','It has no analytical value at all'],a:0,w:'Categorising conflict causes provides a clearer framework for analysing the roots of specific conflicts.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'Mediation',dr:dQ2,ht:'<p><b>Mediation</b> involves a neutral third party helping conflicting sides reach agreement, without imposing a binding solution &mdash; a role Nigeria has frequently played in West African conflicts, and a technique closely related to "shuttle diplomacy."</p>'},

icting parties.'},{q:'Under which chapter of the UN Charter can peace enforcement, involving force, be authorised?',o:['Chapter VII','Chapter I','Chapter II','Chapter XV'],a:0,w:'Peace enforcement, involving force, can be authorised under Chapter VII of the UN Charter.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},

{lb:'Multidimensional peacekeeping',dr:dQ1,ht:'<p>Modern <b>multidimensional peacekeeping</b> goes beyond simple ceasefire monitoring to include tasks such as protecting civilians, supporting elections, disarming combatants, and assisting institution-building &mdash; reflecting the complexity of post-Cold War civil conflicts.</p>'},

nd reconciliation efforts after conflict ends?',o:['Peacebuilding','Peace enforcement only','Traditional peacekeeping only','Coercive diplomacy'],a:0,w:'"Peacebuilding" describes longer-term reconstruction and reconciliation efforts after conflict ends.'},{q:'What is the main goal of peacebuilding, distinct from peacekeeping/enforcement?',o:['Preventing conflict from recurring through long-term reconstruction and reconciliation','Only monitoring a ceasefire for a few weeks','Only providing weapons to one side','Ending all international cooperation after conflict'],a:0,w:'Peacebuilding aims to prevent conflict from recurring through long-term reconstruction and reconciliation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'The Mediation and Security Council',dr:dQ2,ht:'<p>The Mechanism established a <b>Mediation and Security Council</b>, empowered to authorise peacekeeping missions, impose sanctions, and coordinate regional responses to conflicts and unconstitutional changes of government.</p>'},
{lb:'Early warning systems',dr:dQ2,ht:'<p>ECOWAS developed the <b>ECOWAS Early Warning and Response Network (ECOWARN)</b> to monitor potential conflict triggers across the region and enable earlier, more proactive diplomatic intervention before crises escalate into open violence.</p>'},
{lb:'Limitations in practice',dr:dQ2,ht:'<p>Despite this formal framework, ECOWAS\'s practical effectiveness remains constrained by <b>limited standing military capacity</b>, reliance on troop contributions from members like Nigeria, and the difficulty of enforcing decisions against determined, resistant regimes, as seen in the 2023 Niger crisis.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'In which year did ECOWAS formalise its conflict resolution role through a legal Mechanism?',o:['1999','1975','1990','2002'],a:0,w:'ECOWAS formalised its conflict resolution role through the 1999 Mechanism.'},{q:'What body did the 1999 Mechanism establish to authorise peacekeeping and sanctions?',o:['The Mediation and Security Council','The ECOWAS Parliament','The ECOWAS Commission alone','The African Union Assembly'],a:0,w:'The 1999 Mechanism established the Mediation and Security Council.'},{q:'What system did ECOWAS develop to monitor potential conflict triggers early?',o:['ECOWARN (the ECOWAS Early Warning and Response Network)','AMISOM','UNAMID','AfCFTA'],a:0,w:'ECOWAS developed ECOWARN to monitor potential conflict triggers early.'},{q:'What is the purpose of an early warning system like ECOWARN?',o:['To enable earlier, more proactive diplomatic intervention before crises escalate','To immediately trigger military invasion in every case','To replace the need for any peacekeeping troops','To abolish all diplomatic communication'],a:0,w:'ECOWARN enables earlier, more proactive diplomatic intervention before crises escalate into open violence.'},{q:'What has ECOWAS\'s practical effectiveness remained constrained by?',o:['Limited standing military capacity and reliance on member troop contributions','Unlimited and always-effective military power','A complete absence of any legal framework','A total lack of interest from any member states'],a:0,w:'ECOWAS\'s effectiveness has been constrained by limited standing military capacity and reliance on member contributions.'},{q:'Which country\'s troop contributions has ECOWAS particularly relied upon?',o:['Nigeria','Senegal','Ghana','Togo'],a:0,w:'ECOWAS has particularly relied upon Nigeria\'s troop contributions.'},{q:'Which 2023 crisis illustrates the difficulty of enforcing ECOWAS decisions against resistant regimes?',o:['The Niger coup crisis','The Nigerian Civil War','The 1993 annulled election','The Aba Women\'s Riots'],a:0,w:'The 2023 Niger coup crisis illustrates the difficulty of enforcing ECOWAS decisions against resistant regimes.'},{q:'What does the Niger crisis reveal about ECOWAS\'s formal legal framework?',o:['A formal framework does not guarantee effective enforcement in practice','A formal framework always guarantees perfect enforcement','ECOWAS has no formal legal framework at all','The framework was created only after the Niger crisis'],a:0,w:'The Niger crisis reveals that a formal legal framework does not guarantee effective enforcement in practice.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • International Relations',ti:'Nigeria\'s Contribution to Peacekeeping',su:'Evaluate Nigeria\'s historical and ongoing contributions to regional and global peacekeeping.',steps:[
{lb:'Early contributions: Congo and beyond',dr:dQ1,ht:'<p>Nigeria contributed troops to the UN\'s <b>Congo mission (ONUC) in the 1960s</b>, among its earliest peacekeeping engagements, establishing a tradition of active international military engagement that has continued for over six decades.</p>'},
{lb:'Leading ECOMOG in Liberia and Sierra Leone',dr:dQ1,ht:'<p>Nigeria provided the <b>overwhelming majority of troops and funding</b> for ECOMOG\'s interventions in Liberia (from 1990) and Sierra Leone (from 1997), positioning itself as West Africa\'s primary security guarantor during those devastating civil wars.</p>'},
{lb:'Contributing to UN missions in Darfur and elsewhere',dr:dQ1,ht:'<p>Nigeria has contributed significant troop numbers to <b>UNAMID</b> (the joint UN-AU mission in Darfur) and other UN peacekeeping operations across Africa, consistently ranking among the UN\'s largest troop-contributing countries.</p>'},
{lb:'Costs and recognition',dr:dQ1,ht:'<p>Nigeria\'s peacekeeping contributions have entailed significant <b>human and financial costs</b>, including troop casualties, but have also earned Nigeria significant international <b>recognition and diplomatic prestige</b> as a leading contributor to African and global peace and security.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which 1960s UN mission did Nigeria contribute troops to, among its earliest peacekeeping engagements?',o:['ONUC (Congo mission)','UNAMID (Darfur)','AMISOM (Somalia)','ECOMOG (Liberia)'],a:0,w:'Nigeria contributed troops to ONUC, the UN\'s Congo mission, in the 1960s.'},{q:'What did Nigeria provide the overwhelming majority of for ECOMOG\'s interventions in Liberia and Sierra Leone?',o:['Troops and funding','Only weapons sold to both sides','Only humanitarian food aid','Nothing at all'],a:0,w:'Nigeria provided the overwhelming majority of troops and funding for ECOMOG\'s interventions.'},{q:'Since which year has Nigeria led ECOMOG\'s engagement in Liberia?',o:['1990','1997','1960','2002'],a:0,w:'Nigeria has led ECOMOG\'s engagement in Liberia since 1990.'},{q:'Which joint UN-AU mission in Darfur has Nigeria contributed significant troops to?',o:['UNAMID','ONUC','AMISOM','ECOMOG'],a:0,w:'Nigeria has contributed significant troops to UNAMID, the joint UN-AU mission in Darfur.'},{q:'How does Nigeria typically rank among UN peacekeeping troop-contributing countries?',o:['Among the largest contributors','Among the smallest contributors','It has never contributed any troops','Only contributing since 2020'],a:0,w:'Nigeria consistently ranks among the UN\'s largest troop-contributing countries.'},{q:'What costs has Nigeria\'s peacekeeping leadership entailed?',o:['Significant human and financial costs, including troop casualties','No costs whatsoever','Only financial costs, with no human casualties ever','Costs borne entirely by foreign donors'],a:0,w:'Nigeria\'s peacekeeping leadership has entailed significant human and financial costs, including troop casualties.'},{q:'What has Nigeria\'s peacekeeping record earned it internationally?',o:['Significant recognition and diplomatic prestige','Widespread international condemnation only','No recognition of any kind','Exclusion from all international organisations'],a:0,w:'Nigeria\'s peacekeeping record has earned it significant international recognition and diplomatic prestige.'},{q:'For how many decades has Nigeria maintained active international peacekeeping engagement?',o:['Over six decades','Less than one decade','Only two years','Only since 1999'],a:0,w:'Nigeria has maintained active international peacekeeping engagement for over six decades.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • International Relations',ti:'Challenges and Criticisms of Peacekeeping',su:'Evaluate the key limitations and criticisms of international peacekeeping.',steps:[
{lb:'Slow deployment and limited mandates',dr:dQ2,ht:'<p>Peacekeeping missions frequently suffer from <b>slow deployment</b> after crises begin and often operate under <b>limited mandates</b> restricting what troops are authorised to do, sometimes preventing timely intervention to protect civilians.</p>'},
{lb:'Historic failures: Rwanda and Srebrenica',dr:dQ2,ht:'<p>The most cited failures of peacekeeping are the <b>Rwandan genocide (1994)</b>, where UNAMIR lacked the mandate and resources to prevent mass killing, and the <b>Srebrenica massacre (1995)</b> in Bosnia, where UN peacekeepers failed to protect civilians under their nominal protection.</p>'},
{lb:'Allegations of misconduct',dr:dQ2,ht:'<p>Some peacekeeping missions have faced serious allegations of <b>misconduct by peacekeeping personnel</b>, including sexual exploitation and abuse, prompting significant UN reforms to accountability and oversight procedures in recent years.</p>'},
{lb:'Funding and political will constraints',dr:dQ2,ht:'<p>Peacekeeping effectiveness is frequently constrained by <b>inconsistent funding</b> and a lack of sustained <b>political will</b> among powerful member states to commit sufficient troops, equipment or mandate authority to genuinely resolve underlying conflicts.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What common problem affects peacekeeping missions after a crisis begins?',o:['Slow deployment','Instant deployment within hours, always','No deployment problems have ever occurred','Deployment before any crisis even begins'],a:0,w:'Slow deployment after a crisis begins is a common problem affecting peacekeeping missions.'},{q:'What can limited mandates sometimes prevent peacekeeping troops from doing?',o:['Timely intervention to protect civilians','Any deployment at all under any circumstances','Signing any treaties','Communicating with their home governments'],a:0,w:'Limited mandates can sometimes prevent timely intervention to protect civilians.'},{q:'Which 1994 event is most cited as a failure of UN peacekeeping?',o:['The Rwandan genocide','The Srebrenica massacre','The Nigerian Civil War','The Sahel coup wave'],a:0,w:'The Rwandan genocide (1994) is most cited as a failure of UN peacekeeping.'},{q:'Which mission lacked the mandate and resources to prevent the Rwandan genocide?',o:['UNAMIR','ECOMOG','UNAMID','AMISOM'],a:0,w:'UNAMIR lacked the mandate and resources to prevent the Rwandan genocide.'},{q:'Which 1995 event in Bosnia is also cited as a peacekeeping failure?',o:['The Srebrenica massacre','The Rwandan genocide','The Nigerian Civil War','The annulled 1993 election'],a:0,w:'The Srebrenica massacre (1995) in Bosnia is also cited as a peacekeeping failure.'},{q:'What serious allegations have some peacekeeping missions faced regarding personnel conduct?',o:['Sexual exploitation and abuse','Excessive humanitarian generosity','Overly strict adherence to mandates','No allegations have ever been made'],a:0,w:'Some peacekeeping missions have faced serious allegations of sexual exploitation and abuse by personnel.'},{q:'What UN response followed these misconduct allegations?',o:['Significant reforms to accountability and oversight procedures','No response of any kind','The immediate abolition of all peacekeeping','A complete transfer of all peacekeeping to NATO'],a:0,w:'Significant reforms to accountability and oversight procedures followed these misconduct allegations.'},{q:'What two factors are cited as constraining peacekeeping effectiveness generally?',o:['Inconsistent funding and lack of sustained political will','Excessive funding and too much political will','A complete absence of any peacekeeping missions','Overwhelming and unlimited troop numbers'],a:0,w:'Inconsistent funding and a lack of sustained political will are cited as constraining peacekeeping effectiveness.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • International Relations',ti:'Case Studies in Conflict Resolution',su:'Apply conflict resolution concepts to specific historical cases.',steps:[
{lb:'The Nigerian Civil War\'s resolution',dr:dQ1,ht:'<p>The <b>Nigerian Civil War (1967-70)</b> ended through military victory rather than negotiated settlement, but the subsequent <b>"no victor, no vanquished"</b> policy and "3 Rs" (reconciliation, reconstruction, rehabilitation) represent a notable post-conflict <b>reconciliation</b> approach, avoiding harsh post-war punishment.</p>'},
{lb:'The Bakassi Peninsula resolution',dr:dQ1,ht:'<p>The <b>Nigeria-Cameroon Bakassi dispute</b> illustrates successful <b>adjudication</b>: both parties accepted the ICJ\'s 2002 ruling and implemented it peacefully by 2008, despite the ruling being unfavourable to Nigeria &mdash; a rare example of a potentially violent territorial dispute resolved entirely through law.</p>'},
{lb:'Sierra Leone\'s Truth and Reconciliation Commission',dr:dQ1,ht:'<p>Following its civil war, Sierra Leone established a <b>Truth and Reconciliation Commission</b> alongside the <b>Special Court for Sierra Leone</b>, combining restorative approaches (public testimony, reconciliation) with criminal accountability (prosecuting figures like Charles Taylor) &mdash; illustrating combined resolution strategies.</p>'},
{lb:'Ongoing challenges: the Sahel',dr:dQ1,ht:'<p>By contrast, ongoing <b>Sahel conflicts</b> (Mali, Burkina Faso, Niger) illustrate the limitations of current conflict resolution approaches, where jihadist insurgency, political instability and weak state capacity have so far resisted both military and diplomatic resolution efforts.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'How did the Nigerian Civil War (1967-70) end?',o:['Through military victory rather than negotiated settlement','Through a UN-mediated peace treaty','Through ICJ adjudication','Through a referendum'],a:0,w:'The Nigerian Civil War ended through military victory rather than negotiated settlement.'},{q:'What post-war policy did Gowon adopt, avoiding harsh punishment of the defeated East?',o:['"No victor, no vanquished" and the "3 Rs"','A policy of total surrender and mass imprisonment','A policy of permanent regional division','A policy of immediate re-invasion'],a:0,w:'Gowon adopted the "no victor, no vanquished" policy and the "3 Rs" (reconciliation, reconstruction, rehabilitation).'},{q:'What method resolved the Nigeria-Cameroon Bakassi Peninsula dispute?',o:['Adjudication by the International Court of Justice','Direct armed conflict between the two countries','A coin toss decided by the AU','No resolution was ever reached'],a:0,w:'The Bakassi Peninsula dispute was resolved through ICJ adjudication.'},{q:'What made the Bakassi resolution a notable example of successful conflict resolution?',o:['Both parties peacefully implemented an unfavourable ruling rather than resorting to violence','Nigeria refused to accept the ruling at all','War broke out immediately after the ruling','The ruling was never actually implemented'],a:0,w:'Both parties peacefully implementing an unfavourable ruling, rather than resorting to violence, made this a notable success.'},{q:'What did Sierra Leone establish alongside the Special Court for Sierra Leone after its civil war?',o:['A Truth and Reconciliation Commission','A permanent military government','A new currency union','A merger with Liberia'],a:0,w:'Sierra Leone established a Truth and Reconciliation Commission alongside the Special Court.'},{q:'Which warlord did the Special Court for Sierra Leone prosecute?',o:['Charles Taylor','Assimi Goïta','Alpha Condé','Mohamed Bazoum'],a:0,w:'The Special Court for Sierra Leone prosecuted Charles Taylor.'},{q:'What does Sierra Leone\'s approach illustrate about conflict resolution strategies?',o:['Combining restorative approaches with criminal accountability can work together','Only criminal prosecution is ever effective','Only restorative approaches are ever effective','Conflict resolution strategies never combine different approaches'],a:0,w:'Sierra Leone\'s approach illustrates that restorative approaches and criminal accountability can be combined effectively.'},{q:'What do ongoing Sahel conflicts illustrate about conflict resolution?',o:['The limitations of current approaches when insurgency, instability and weak state capacity combine','That all conflicts are always resolved quickly and easily','That military solutions always succeed immediately','That diplomatic solutions always succeed immediately'],a:0,w:'Ongoing Sahel conflicts illustrate the limitations of current conflict resolution approaches under these combined pressures.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • International Relations',ti:'The African Union\'s Role in Conflict Resolution',su:'Explain the AU\'s continental-level approach to conflict prevention and resolution.',steps:[
{lb:'The Peace and Security Council',dr:dQ2,ht:'<p>The AU\'s <b>Peace and Security Council (PSC)</b>, established in <b>2004</b>, is the AU\'s key continental body for conflict prevention, management and resolution, authorised to recommend intervention in member states facing war crimes, genocide or crimes against humanity.</p>'},
{lb:'The African Standby Force',dr:dQ2,ht:'<p>The <b>African Standby Force</b>, a planned multinational, multidisciplinary force with peacekeeping and intervention capabilities, was conceived to give the AU a rapid-response capacity, though its full operational readiness has developed more slowly than originally envisioned.</p>'},
{lb:'AU peace support operations in practice',dr:dQ2,ht:'<p>The AU has deployed peace support operations including <b>AMISOM/ATMIS in Somalia</b> (since 2007, against al-Shabaab) and the joint <b>UN-AU mission in Darfur (UNAMID)</b>, demonstrating growing, if still developing, African-led peacekeeping capacity.</p>'},
{lb:'Coordinating with regional bodies',dr:dQ2,ht:'<p>The AU generally works <b>in coordination</b> with regional economic communities like ECOWAS and SADC on conflict resolution, given their often faster, more locally-informed response capacity, creating a layered continental-regional approach to African security.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'In which year was the AU\'s Peace and Security Council established?',o:['2004','2002','1999','1963'],a:0,w:'The AU\'s Peace and Security Council was established in 2004.'},{q:'What can the AU\'s Peace and Security Council recommend regarding member states facing atrocities?',o:['Intervention in states facing war crimes, genocide or crimes against humanity','Immediate expulsion from the United Nations','Permanent colonisation by a foreign power','Nothing at all — it has no such power'],a:0,w:'The Peace and Security Council can recommend intervention in states facing war crimes, genocide or crimes against humanity.'},{q:'What is the African Standby Force intended to provide the AU?',o:['A rapid-response peacekeeping and intervention capacity','A single continental currency','A continental legislature with binding powers over all states','A continental police force with no military function'],a:0,w:'The African Standby Force is intended to provide the AU with a rapid-response peacekeeping and intervention capacity.'},{q:'How has the African Standby Force\'s full operational readiness developed, compared to original plans?',o:['More slowly than originally envisioned','Exactly on schedule with no delays','Faster than originally envisioned','It was never planned at all'],a:0,w:'The African Standby Force\'s full operational readiness has developed more slowly than originally envisioned.'},{q:'Since which year has the AU mission AMISOM/ATMIS operated in Somalia against al-Shabaab?',o:['2007','2004','1999','2002'],a:0,w:'AMISOM/ATMIS has operated in Somalia against al-Shabaab since 2007.'},{q:'Which joint UN-AU mission demonstrates African-led peacekeeping capacity in Darfur?',o:['UNAMID','ECOMOG','AMISOM','ECOWARN'],a:0,w:'UNAMID, the joint UN-AU mission in Darfur, demonstrates African-led peacekeeping capacity.'},{q:'Which regional bodies does the AU generally coordinate with on conflict resolution?',o:['ECOWAS and SADC','Only the United Nations, with no regional coordination','Only NATO','Only the Commonwealth'],a:0,w:'The AU generally coordinates with regional bodies like ECOWAS and SADC on conflict resolution.'},{q:'Why does the AU coordinate with regional bodies rather than acting entirely alone?',o:['Regional bodies often have faster, more locally-informed response capacity','Regional bodies have no relevant capacity at all','The AU is legally forbidden from acting alone under any circumstances','Coordination is required by the United Nations Charter specifically'],a:0,w:'Regional bodies often have faster, more locally-informed response capacity, making coordination valuable.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • International Relations',ti:'WAEC Exam Preparation — Conflict Resolution and Peacekeeping',su:'Practise WAEC-style questions on conflict resolution and peacekeeping.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on conflict resolution/peacekeeping: (1) Define the relevant <b>method or concept</b> clearly. (2) Distinguish it from related methods where relevant (e.g. mediation vs arbitration). (3) Give <b>named, dated examples</b>. (4) Evaluate <b>effectiveness and limitations</b>.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Distinguish between mediation and arbitration as methods of conflict resolution." / "Discuss the role of ECOWAS in regional conflict resolution." / "Examine Nigeria\'s contribution to peacekeeping." / "Account for the failures of UN peacekeeping in specific cases."</p>'},
{lb:'Key vocabulary for essays',dr:dQ2,ht:'<p>Key vocabulary: <b>negotiation, mediation, arbitration, adjudication</b>, <b>peacekeeping, peace enforcement, peacebuilding</b>, <b>Chapter VII</b>, <b>ECOWARN</b>, <b>Truth and Reconciliation Commission</b>. Precise, correctly-spelled terms strengthen WAEC answers significantly.</p>'},
{lb:'Using named, dated case studies',dr:dQ2,ht:'<p>The strongest WAEC essays on this topic use <b>specific case studies</b> &mdash; the Bakassi ICJ ruling, ECOMOG in Liberia, the Rwandan genocide, Sierra Leone\'s TRC &mdash; rather than discussing conflict resolution only in abstract, theoretical terms.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What is the recommended first step for a WAEC essay on conflict resolution or peacekeeping?',o:['Define the relevant method or concept clearly','Immediately give a personal opinion with no facts','List unrelated dates with no explanation','Skip straight to a conclusion'],a:0,w:'A strong essay should begin by clearly defining the relevant method or concept.'},{q:'Which of these is a typical WAEC-style question on this topic?',o:['"Distinguish between mediation and arbitration as methods of conflict resolution."','"Describe the layout of Lagos."','"Define photosynthesis."','"List the rivers of Nigeria."'],a:0,w:'"Distinguish between mediation and arbitration as methods of conflict resolution" is a typical WAEC-style question on this topic.'},{q:'Which term should be used to describe formal legal rulings such as the Bakassi ICJ ruling?',o:['Adjudication','Only mediation','Only negotiation','Only peace enforcement'],a:0,w:'"Adjudication" is the precise term for formal legal rulings such as the Bakassi ICJ ruling.'},{q:'Which system should be mentioned when discussing ECOWAS\'s approach to early conflict detection?',o:['ECOWARN','AfCFTA','The Commonwealth Charter','OPEC+'],a:0,w:'ECOWARN should be mentioned when discussing ECOWAS\'s approach to early conflict detection.'},{q:'Which body should be named when discussing Sierra Leone\'s post-war reconciliation approach?',o:['The Truth and Reconciliation Commission','The African Union Assembly','The UN Security Council','The Commonwealth Secretariat'],a:0,w:'The Truth and Reconciliation Commission should be named when discussing Sierra Leone\'s post-war reconciliation.'},{q:'Which historical failure should be cited when discussing peacekeeping\'s limitations?',o:['The Rwandan genocide (1994)','The Bakassi resolution','The founding of ECOWAS','AfCFTA\'s implementation'],a:0,w:'The Rwandan genocide (1994) should be cited when discussing peacekeeping\'s limitations.'},{q:'Why do the strongest WAEC essays on this topic use specific named case studies?',o:['They demonstrate concrete knowledge rather than only abstract, general claims','Named examples are discouraged by WAEC','Abstract claims always score higher than named examples','Case studies are irrelevant to WAEC marking'],a:0,w:'Named case studies demonstrate concrete knowledge, which is more highly rewarded than abstract claims.'},{q:'What should a WAEC essay on this topic evaluate, according to the recommended structure?',o:['Effectiveness and limitations','Only positive facts with no criticism','Only negative facts with no achievements','Nothing beyond a basic definition'],a:0,w:'A WAEC essay on this topic should evaluate both effectiveness and limitations.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • International Relations',ti:'Mixed Questions — Conflict Resolution and Peacekeeping',su:'Integrated revision across causes of conflict, resolution methods, and peacekeeping.',steps:[
{lb:'Summary of key points',dr:dQ1,ht:'<p>Conflict arises from resource, identity and political causes, resolved through methods ranging from <b>negotiation and mediation</b> to <b>arbitration and adjudication</b>, and where necessary, <b>peacekeeping or peace enforcement</b> &mdash; each illustrated by real cases from Nigeria\'s own experience and the wider region.</p>'},
{lb:'Key names and dates to remember',dr:dQ1,ht:'<p>Must-know facts: <b>1948</b> (UNTSO, first UN peacekeeping mission); <b>1990</b> (ECOMOG\'s first Liberia deployment); <b>1994</b> (Rwandan genocide); <b>1999</b> (ECOWAS Mechanism); <b>2002/2008</b> (Bakassi ICJ ruling/implementation); <b>Sierra Leone\'s TRC and Special Court</b>.</p>'},
{lb:'Lessons for Nigeria today',dr:dQ1,ht:'<p>Nigeria\'s experience &mdash; as both a conflict participant (civil war) and a leading peacekeeping contributor (ECOMOG, UN missions) &mdash; illustrates the full spectrum of conflict resolution challenges and approaches covered in this topic.</p>'},
{lb:'Final exam tips',dr:dQ1,ht:'<p>Always distinguish clearly between <b>resolution methods</b> (negotiation, mediation, arbitration, adjudication) and <b>intervention types</b> (peacekeeping, peace enforcement, peacebuilding), and use named, dated case studies throughout.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which was the UN\'s first peacekeeping mission, established in 1948?',o:['UNTSO','ECOMOG','UNAMID','AMISOM'],a:0,w:'UNTSO, established in 1948, was the UN\'s first peacekeeping mission.'},{q:'In which year did ECOWAS formalise its Mechanism for conflict resolution and security?',o:['1999','1975','1990','2002'],a:0,w:'ECOWAS formalised its Mechanism for conflict resolution and security in 1999.'},{q:'Which method resolved the Nigeria-Cameroon Bakassi Peninsula dispute?',o:['Adjudication by the ICJ','Direct armed conflict','A referendum','Mediation by the Commonwealth'],a:0,w:'Adjudication by the International Court of Justice resolved the Bakassi Peninsula dispute.'},{q:'Which 1994 event is most cited as a failure of international peacekeeping?',o:['The Rwandan genocide','The Bakassi resolution','The founding of ECOWAS','The Nigerian Civil War'],a:0,w:'The Rwandan genocide (1994) is most cited as a failure of international peacekeeping.'},{q:'Which body did Sierra Leone establish for post-war restorative justice, alongside the Special Court?',o:['The Truth and Reconciliation Commission','The African Union Assembly','The UN Security Council','ECOWARN'],a:0,w:'Sierra Leone established the Truth and Reconciliation Commission alongside the Special Court.'},{q:'What term describes a neutral third party helping conflicting sides reach agreement, without a binding decision?',o:['Mediation','Arbitration','Adjudication','Peace enforcement'],a:0,w:'"Mediation" describes a neutral third party helping sides reach agreement without imposing a binding decision.'},{q:'What term describes longer-term reconstruction and reconciliation after conflict ends?',o:['Peacebuilding','Peace enforcement only','Traditional peacekeeping only','Negotiation only'],a:0,w:'"Peacebuilding" describes longer-term reconstruction and reconciliation efforts after conflict ends.'},{q:'What should a strong WAEC essay conclusion on this topic do?',o:['Use named, dated case studies to support a balanced evaluation','Avoid mentioning any specific cases at all','Only discuss ancient history','Only discuss European conflicts'],a:0,w:'A strong conclusion should use named, dated case studies to support a balanced evaluation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
