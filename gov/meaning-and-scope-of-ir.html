var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');

}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;

    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;

    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}

});

{ey:'Q1 \u2022 Gov \u2022 International Relations',ti:'What is International Relations?',su:'Define international relations and describe its nature as a field of study.',steps:[
{lb:'Meaning of International Relations',dr:dQ1,ht:'<p><b>International Relations (IR)</b> is the study of interactions between states and other actors across national boundaries. It examines diplomacy, trade, conflict, cooperation and international law between countries. IR is both an academic discipline taught in universities and a practical field describing how states actually conduct themselves in the world.</p>'},
{lb:'Nature of the discipline',dr:dQ1,ht:'<p>IR is <b>interdisciplinary</b> &mdash; it draws on political science, economics, history, law and sociology to explain global events. It studies both <b>conflict</b> (war, rivalry, tension between states) and <b>cooperation</b> (trade, alliances, treaties, joint projects). No single theory fully explains international behaviour, which is why IR uses multiple perspectives.</p>'},
{lb:'Scope of IR',dr:dQ1,ht:'<p>The scope of IR includes: diplomacy and foreign policy; international organisations (UN, AU, ECOWAS); international law; global economics and trade; security and conflict studies; and increasingly, global issues such as climate change, terrorism, pandemics and migration. WAEC expects students to describe this scope with specific examples.</p>'},
{lb:'Why IR matters',dr:dQ1,ht:'<p>Studying IR helps citizens and leaders understand <b>global interdependence</b> &mdash; how one country\'s actions affect others. It informs foreign policy decisions and equips students to critically analyse international events reported in the news, from trade disputes to peacekeeping missions.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'What is the best definition of International Relations (IR)?',o:['The study of a single country\'s internal politics','The study of interactions between states and other actors across national boundaries','The study of international sports competitions','The study of ancient civilisations'],a:2,w:'IR is the study of interactions between states and other actors across national boundaries &mdash; diplomacy, trade, conflict and cooperation.'},{q:'Which disciplines does IR draw upon as an interdisciplinary field?',o:['Political science, economics, history, law and sociology','Only economics','Only law','Only military science'],a:1,w:'IR is interdisciplinary, drawing on political science, economics, history, law and sociology.'},{q:'IR examines both conflict and what other kind of state interaction?',o:['Cooperation','Isolation','Silence','Neutrality only'],a:1,w:'IR studies both conflict (war, rivalry) and cooperation (trade, alliances, treaties) between states.'},{q:'What does IR study that a single country\'s domestic politics does not typically cover?',o:['Relations and interactions across national borders','Only domestic elections','Only local government','Only individual biographies'],a:1,w:'IR specifically studies relations and interactions that cross national borders.'},{q:'Why is studying IR important for citizens and leaders?',o:['It helps understand global interdependence and informs foreign policy decisions','It has no practical value','It is only useful for diplomats','It replaces the need for domestic policy'],a:1,w:'IR helps citizens and leaders understand global interdependence and informs sound foreign policy decisions.'},{q:'Which of these is an example of "cooperation" as studied in IR?',o:['A trade agreement between two countries','A declaration of war','A civil war within one country','A national election'],a:1,w:'A trade agreement between two countries is a clear example of cooperation studied in IR.'},{q:'Which of these is an example of "conflict" as studied in IR?',o:['A border war between two states','A joint scientific research programme','A free trade agreement','A cultural exchange programme'],a:1,w:'A border war between two states is a clear example of conflict studied in IR.'},{q:'IR is best described as which kind of field of study?',o:['Both an academic discipline and a practical field of state conduct','Only a practical skill with no theory','Only an academic subject with no real-world relevance','A purely historical subject'],a:1,w:'IR is both an academic discipline taught in universities and a practical field describing how states conduct themselves.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 International Relations',ti:'Actors in International Relations — States',su:'Explain the role of states as the primary actors in international relations.',steps:[
{lb:'States as primary actors',dr:dQ2,ht:'<p><b>States (nation-states)</b> are the primary and most important actors in IR. Each possesses <b>sovereignty</b>, a defined territory, a government and a population &mdash; echoing the Montevideo Convention criteria for statehood. Historically, IR has been understood mainly as the study of relations between sovereign states.</p>'},
{lb:'Sovereignty and legal rights',dr:dQ2,ht:'<p><b>Sovereignty</b> gives a state the legal right to conduct its own foreign policy, sign treaties, and defend its territorial integrity without external interference. It is the foundation on which the modern state system, dating back to the Peace of Westphalia (1648), is built.</p>'},
{lb:'How states interact',dr:dQ2,ht:'<p>States interact through <b>diplomacy</b> (embassies and ambassadors), trade agreements, military alliances, and participation in international organisations such as the UN, AU and ECOWAS. These channels allow states to pursue their interests peacefully most of the time.</p>'},
{lb:'Inequality of power among states',dr:dQ2,ht:'<p>Not all states are equal in practical power &mdash; <b>great powers</b> (such as the USA or China) have far greater military and economic influence in IR than smaller states, even though international law formally treats all sovereign states as equal.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'What are the primary actors in International Relations?',o:['States (nation-states)','Individuals only','Sports federations','Universities'],a:1,w:'States (nation-states) are traditionally considered the primary actors in International Relations.'},{q:'According to the Montevideo Convention criteria, which of these is NOT required for statehood?',o:['Population','Territory','Recognition by other states','Government'],a:3,w:'The four Montevideo elements are population, territory, government and sovereignty &mdash; recognition by other states is not one of them.'},{q:'What legal right does sovereignty give a state in IR?',o:['The right to conduct its own foreign policy without external interference','The right to control other countries\' governments','The right to ignore international law entirely','The right to unlimited military power'],a:1,w:'Sovereignty gives a state the right to conduct its own foreign policy free from external interference.'},{q:'Through which means do states typically interact diplomatically?',o:['Embassies and ambassadors','Only through war','Only through the United Nations','Only through trade'],a:1,w:'States typically interact diplomatically through embassies and ambassadors.'},{q:'What is true about the formal equality of states in IR, despite differences in actual power?',o:['All sovereign states are formally equal under international law','Only powerful states have any rights','Weak states have no sovereignty','Sovereignty depends on population size'],a:1,w:'International law formally treats all sovereign states as equal, regardless of their actual power.'},{q:'Which of these is an example of a "great power" with disproportionate influence in IR?',o:['The United States','A small island nation','A landlocked microstate','None — all states have equal influence'],a:1,w:'The United States is a classic example of a great power with disproportionate influence in IR.'},{q:'What must a state possess, according to the Montevideo Convention, to be recognised as a state?',o:['Population, territory, government and sovereignty','Only a flag and an anthem','Only a large population','Only a military'],a:1,w:'The Montevideo Convention requires population, territory, government and sovereignty for statehood.'},{q:'States pursue their interests in IR mainly by exercising which core attribute?',o:['Sovereignty','Colonial status','Dependency on other states','Statelessness'],a:1,w:'States exercise their sovereignty to pursue their interests in the international system.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 International Relations',ti:'Non-State Actors in International Relations',su:'Identify and explain the role of IGOs, NGOs, MNCs and other non-state actors.',steps:[
{lb:'Intergovernmental Organisations (IGOs)',dr:dQ1,ht:'<p><b>Intergovernmental Organisations (IGOs)</b> &mdash; such as the United Nations, African Union and ECOWAS &mdash; are formed by states to pursue common goals. They are important actors in modern IR, providing forums for cooperation, conflict resolution and collective decision-making.</p>'},
{lb:'Non-Governmental Organisations (NGOs)',dr:dQ1,ht:'<p><b>Non-Governmental Organisations (NGOs)</b> &mdash; such as Amnesty International and the Red Cross &mdash; operate across borders on humanitarian, human rights or development issues without direct government control. They influence public opinion and sometimes shape state policy through advocacy.</p>'},
{lb:'Multinational Corporations (MNCs)',dr:dQ1,ht:'<p><b>Multinational Corporations (MNCs)</b> &mdash; such as Shell or the Dangote Group &mdash; wield significant economic power and influence in IR through investment, trade and lobbying, sometimes affecting the policies of the countries in which they operate.</p>'},
{lb:'Other non-state actors',dr:dQ1,ht:'<p>Other non-state actors include <b>terrorist organisations</b> (e.g. Boko Haram), which challenge state authority and complicate international security cooperation, as well as influential individuals and transnational advocacy networks that increasingly shape global events.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'What kind of organisation is the United Nations, in terms of IR actors?',o:['An Intergovernmental Organisation (IGO)','A Non-Governmental Organisation (NGO)','A Multinational Corporation (MNC)','A terrorist organisation'],a:1,w:'The UN is an Intergovernmental Organisation (IGO), formed by states to pursue common goals.'},{q:'Which of the following is an example of a Non-Governmental Organisation (NGO)?',o:['Amnesty International','The African Union','Shell Nigeria','The Nigerian government'],a:1,w:'Amnesty International is a classic example of an NGO, operating independently of direct government control.'},{q:'What distinguishes a Multinational Corporation (MNC) as an actor in IR?',o:['It operates and invests across multiple countries, wielding economic influence','It is a government department','It is a military alliance','It is a religious institution'],a:1,w:'MNCs operate and invest across multiple countries, giving them significant economic influence in IR.'},{q:'Which of these is an example of a non-state actor that challenges state authority through violence?',o:['A terrorist organisation such as Boko Haram','A trade union','A university','A charity'],a:1,w:'Terrorist organisations such as Boko Haram challenge state authority and complicate international security.'},{q:'What is a key feature of IGOs like the AU or ECOWAS?',o:['They are formed by states to pursue common goals','They are owned by private companies','They have no member states','They operate only within one country'],a:1,w:'IGOs like the AU and ECOWAS are formed by member states to pursue shared goals.'},{q:'Which organisation type operates on humanitarian or human rights issues without direct government control?',o:['An NGO','An IGO','An MNC','A state'],a:1,w:'NGOs operate on humanitarian or human rights issues independently of direct government control.'},{q:'Which of these best illustrates the economic power of MNCs in IR?',o:['A large corporation influencing trade policy through investment and lobbying','A small local shop with no international presence','A government ministry','A national army'],a:1,w:'MNCs can influence trade policy through their investment decisions and lobbying power.'},{q:'Why are non-state actors considered increasingly important in modern IR?',o:['They influence global events alongside, and sometimes independently of, states','They have completely replaced states','They have no influence on international affairs','They only exist within one country\'s borders'],a:1,w:'Non-state actors increasingly influence global events alongside, and sometimes independently of, states.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 International Relations',ti:'Key Concepts in International Relations',su:'Explain sovereignty, national interest, power and security as core IR concepts.',steps:[
{lb:'Sovereignty',dr:dQ2,ht:'<p><b>Sovereignty</b> is the supreme authority of a state over its own territory and affairs, free from external interference. It is a foundational concept in IR, underpinning the legal equality of states in the international system.</p>'},
{lb:'National interest',dr:dQ2,ht:'<p><b>National interest</b> refers to the goals and ambitions a state pursues in its international dealings &mdash; typically security, economic prosperity, and international prestige. Foreign policy decisions are usually justified by reference to national interest.</p>'},
{lb:'Power',dr:dQ2,ht:'<p><b>Power</b> in IR is the capacity of a state to influence others\' behaviour. It includes <b>hard power</b> (military and economic strength) and <b>soft power</b> (cultural influence, diplomacy and the ability to persuade rather than coerce).</p>'},
{lb:'Security',dr:dQ2,ht:'<p><b>Security</b> is the protection of a state and its citizens from threats. Traditionally this meant military defence, but modern IR also studies <b>non-traditional security</b> concerns such as economic instability, environmental change and cyber threats.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'What does "sovereignty" mean in the context of IR?',o:['Supreme authority of a state over its territory and affairs, free from external interference','A type of international treaty','A military alliance','A trade agreement'],a:1,w:'Sovereignty is the supreme authority of a state over its own territory and affairs.'},{q:'What is meant by a state\'s "national interest" in IR?',o:['The goals and ambitions a state pursues in its international dealings','The personal interests of one political leader','A type of international law','A synonym for foreign aid'],a:1,w:'National interest refers to the goals a state pursues in its international dealings, such as security and prosperity.'},{q:'In IR, "power" is best described as:',o:['The capacity of a state to influence others\' behaviour','Only military strength','Only economic wealth','A country\'s population size'],a:1,w:'Power in IR is the capacity of a state to influence the behaviour of other actors.'},{q:'Which of these is an example of "soft power," as opposed to military power?',o:['A country\'s cultural influence and diplomacy','A nuclear arsenal','A standing army','An economic blockade'],a:1,w:'Soft power refers to cultural influence and diplomacy, as opposed to hard, coercive power.'},{q:'What does "security" mean in modern IR, beyond just military defence?',o:['Protection from both traditional and non-traditional threats, e.g. economic, environmental, cyber','Only protection from foreign armies','Only protection of a country\'s currency','Only protection of borders from migration'],a:1,w:'Modern security studies cover both traditional military threats and non-traditional threats like cyber and environmental risks.'},{q:'Which concept explains why a state might prioritise economic prosperity in its foreign dealings?',o:['National interest','Sovereignty alone','Isolationism','Colonialism'],a:1,w:'A state\'s pursuit of economic prosperity is typically explained by reference to its national interest.'},{q:'Which of these is a traditional (military) security concern in IR?',o:['The threat of armed invasion by another state','Climate change','A stock market crash','A cultural festival'],a:1,w:'The threat of armed invasion is a classic traditional, military security concern.'},{q:'Which of these is a non-traditional security concern increasingly studied in modern IR?',o:['Cybersecurity threats','Traditional cavalry warfare','Naval blockades only','Ambassadorial protocol'],a:1,w:'Cybersecurity threats are a key non-traditional security concern in modern IR.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 International Relations',ti:'Levels of Analysis in International Relations',su:'Distinguish the individual, state and systemic levels of analysis in IR.',steps:[
{lb:'The individual level',dr:dQ1,ht:'<p>The <b>individual level</b> of analysis focuses on how the personality, beliefs and decisions of specific leaders shape international events &mdash; for example, how a president\'s personal convictions may influence a major treaty decision.</p>'},
{lb:'The state/national level',dr:dQ1,ht:'<p>The <b>state (or national) level</b> of analysis examines how domestic factors &mdash; government type, public opinion, economic interests &mdash; shape a state\'s foreign policy choices, rather than the personality of any one leader.</p>'},
{lb:'The systemic/international level',dr:dQ1,ht:'<p>The <b>systemic (or international) level</b> of analysis looks at the structure of the international system itself &mdash; for example, the balance of power among major states, or how the rise of a new global power affects all other countries.</p>'},
{lb:'Using levels together',dr:dQ1,ht:'<p>Analysts often use <b>multiple levels together</b> to gain a fuller picture. For example, explaining Nigeria\'s Africa-centred foreign policy requires looking at individual leaders\' decisions, Nigeria\'s domestic economic interests, and Nigeria\'s position within the wider international system.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Which level of analysis in IR focuses on the personality and decisions of specific leaders?',o:['The individual level','The systemic level','The state level','The economic level'],a:1,w:'The individual level of analysis focuses on the personality and decisions of specific leaders.'},{q:'Which level of analysis examines domestic factors like government type and public opinion?',o:['The state/national level','The individual level','The systemic level','None of these'],a:1,w:'The state/national level of analysis examines domestic factors shaping foreign policy.'},{q:'Which level of analysis looks at the overall structure of the international system, such as the balance of power?',o:['The systemic/international level','The individual level','The state level only','The religious level'],a:1,w:'The systemic/international level looks at the overall structure of the international system.'},{q:'Why might analysts use multiple levels of analysis together to explain a single foreign policy decision?',o:['To gain a fuller picture combining leaders, domestic factors and the international system','Because only one level is ever relevant','Because levels of analysis are outdated','Because WAEC requires memorising all levels without application'],a:1,w:'Using multiple levels together gives a fuller, more complete picture of a foreign policy decision.'},{q:'Which level of analysis would best explain how a president\'s personal beliefs shaped a specific treaty decision?',o:['The individual level','The systemic level','The state level','The economic level'],a:1,w:'A president\'s personal beliefs shaping a decision is best explained at the individual level.'},{q:'Which level of analysis would best explain how Nigeria\'s need for oil revenue shapes its foreign policy?',o:['The state/national level','The individual level only','The systemic level only','None of these'],a:1,w:'Domestic economic interests like oil revenue are best explained at the state/national level.'},{q:'Which level of analysis would best explain how the rise of new global powers affects all countries\' foreign policy?',o:['The systemic/international level','The individual level','The state level','The cultural level'],a:1,w:'Changes in the global balance of power are best explained at the systemic/international level.'},{q:'What is a key benefit of applying the levels-of-analysis framework in IR?',o:['It provides a structured way to analyse the causes of international events','It eliminates the need to study foreign policy','It applies only to Nigeria','It applies only to military conflicts'],a:1,w:'The levels-of-analysis framework provides a structured way to analyse the causes of international events.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 International Relations',ti:'Theories of International Relations',su:'Compare Realism and Liberalism as approaches to explaining international relations.',steps:[
{lb:'Realism',dr:dQ2,ht:'<p><b>Realism</b> views IR as a struggle for power among self-interested, sovereign states in an <b>anarchic</b> system &mdash; meaning there is no world government above states to enforce order. Realists emphasise that states ultimately rely on their own power to secure their survival.</p>'},
{lb:'Liberalism',dr:dQ2,ht:'<p><b>Liberalism</b> emphasises cooperation, international institutions and interdependence (such as trade) as ways states can achieve mutual benefit and reduce conflict. Liberals point to organisations like the UN as evidence that cooperation can restrain state self-interest.</p>'},
{lb:'Comparing the two theories',dr:dQ2,ht:'<p>Realists stress <b>conflict and self-help</b>; Liberals stress <b>cooperation and institutions</b>. Neither theory alone explains all international behaviour &mdash; both perspectives help illuminate different aspects of global politics, from arms races to trade partnerships.</p>'},
{lb:'Applying theory to examples',dr:dQ2,ht:'<p>WAEC students should be able to briefly describe both theories and give simple examples: the UN Security Council, for instance, reflects both power politics (permanent members with veto power) and cooperative institutions (member states working together on shared problems).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'What is the central idea of Realism in International Relations?',o:['IR is a struggle for power among self-interested states in an anarchic system with no world government','States always cooperate peacefully by nature','International organisations always control state behaviour','War is impossible between sovereign states'],a:1,w:'Realism views IR as a struggle for power among self-interested states in an anarchic system.'},{q:'What is the central idea of Liberalism in International Relations?',o:['Cooperation, international institutions and interdependence help states achieve mutual benefit','States can never cooperate under any circumstances','Only military power matters in IR','International law is irrelevant to state behaviour'],a:1,w:'Liberalism emphasises cooperation, institutions and interdependence as paths to mutual benefit.'},{q:'Which theory would most likely explain the formation of the United Nations as an act of cooperative institution-building?',o:['Liberalism','Pure Realism','Anarchism','Colonial theory'],a:1,w:'Liberalism explains the formation of cooperative institutions like the United Nations.'},{q:'Which theory emphasises that states operate in an "anarchic" system with no central authority above them?',o:['Realism','Liberalism','Marxism','Federalism'],a:1,w:'Realism emphasises the anarchic nature of the international system, with no central world authority.'},{q:'According to Realist theory, what is the primary motivation of states in IR?',o:['The pursuit and preservation of power and security','Charitable cooperation with no self-interest','Religious unity','Cultural exchange'],a:1,w:'Realists see the pursuit and preservation of power and security as the primary motivation of states.'},{q:'What kind of examples would a Liberal theorist point to as evidence for their view of IR?',o:['Trade agreements and international organisations promoting cooperation','Wars and arms races only','The complete absence of international law','The isolation of all states from each other'],a:1,w:'Liberal theorists point to trade agreements and international organisations as evidence of cooperation.'},{q:'Why is it useful for WAEC students to understand both Realism and Liberalism?',o:['Together they help explain different aspects of global politics, from conflict to cooperation','Only one theory is ever correct','They are identical theories with different names','They apply only to Nigeria'],a:1,w:'Understanding both theories helps explain different aspects of global politics, from conflict to cooperation.'},{q:'Which theory best explains why states might still go to war despite the existence of international organisations?',o:['Realism, which emphasises the primacy of state self-interest and power','Liberalism alone','A theory that says war never happens','Colonial theory'],a:1,w:'Realism, emphasising state self-interest and power, best explains continued conflict despite international organisations.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 International Relations',ti:'Foreign Policy — Meaning and Determinants',su:'Define foreign policy and explain its determinants and objectives.',steps:[
{lb:'Meaning of foreign policy',dr:dQ1,ht:'<p><b>Foreign policy</b> is the strategy a government uses to guide its interactions with other states and international actors. It translates a state\'s national interest into specific goals and actions on the world stage.</p>'},
{lb:'Determinants of foreign policy',dr:dQ1,ht:'<p>Determinants of foreign policy include: <b>geography</b> (location and neighbours), <b>economic resources</b>, <b>historical ties</b>, ideology, public opinion, and the personality of individual leaders. These factors together shape what a country prioritises internationally.</p>'},
{lb:'Objectives of foreign policy',dr:dQ1,ht:'<p>Common foreign policy objectives include: protecting sovereignty and territorial integrity; promoting economic interests; maintaining international peace and security; and enhancing national prestige on the world stage.</p>'},
{lb:'Implementing foreign policy',dr:dQ1,ht:'<p>Foreign policy is implemented through <b>diplomacy</b>, treaties, alliances, foreign aid, trade agreements and, in extreme cases, the use or threat of force. Most foreign policy goals are pursued through peaceful means.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'What is the best definition of "foreign policy"?',o:['The strategy a government uses to guide its interactions with other states and international actors','A country\'s internal economic plan','A type of international law','A military alliance only'],a:1,w:'Foreign policy is the strategy a government uses to guide its interactions with other states and actors.'},{q:'Which of the following is a determinant of a state\'s foreign policy?',o:['Geography, economic resources and historical ties','Only the weather','Only its national anthem','Only its flag design'],a:1,w:'Geography, economic resources and historical ties are all key determinants of foreign policy.'},{q:'Which of these is a common objective of foreign policy?',o:['Protecting sovereignty and promoting economic interests','Eliminating all other governments','Ending all international trade','Abolishing diplomacy'],a:1,w:'Protecting sovereignty and promoting economic interests are common foreign policy objectives.'},{q:'Through which of these is foreign policy typically implemented?',o:['Diplomacy, treaties, alliances and foreign aid','Only through domestic elections','Only through local government meetings','Only through the judiciary'],a:1,w:'Foreign policy is typically implemented through diplomacy, treaties, alliances and foreign aid.'},{q:'How can a country\'s history and culture influence its foreign policy determinants?',o:['Historical ties and shared culture can shape alliances and priorities','They have no effect on foreign policy','They only affect domestic policy','They are irrelevant once independence is achieved'],a:1,w:'Historical ties and shared culture can shape a country\'s alliances and foreign policy priorities.'},{q:'What role can public opinion play as a determinant of foreign policy?',o:['It can influence which policies a government feels able to pursue','It has no influence in any country','It only matters in non-democratic states','It determines a country\'s exact GDP'],a:1,w:'Public opinion can influence which foreign policies a government feels able to pursue.'},{q:'Which extreme measure might be used when foreign policy objectives cannot be achieved through diplomacy?',o:['The use or threat of force','Immediate surrender of sovereignty','Abolishing the state','Ignoring international relations entirely'],a:1,w:'The use or threat of force is the extreme measure used when diplomacy fails to achieve objectives.'},{q:'What is the relationship between foreign policy and national interest?',o:['Foreign policy is the strategy used to pursue a state\'s national interest internationally','They are unrelated concepts','Foreign policy replaces the need for national interest','National interest only applies domestically'],a:1,w:'Foreign policy is the strategy a state uses to pursue its national interest on the international stage.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 International Relations',ti:'Instruments of International Relations',su:'Explain diplomacy, treaties, sanctions and force as instruments of IR.',steps:[
{lb:'Diplomacy',dr:dQ2,ht:'<p><b>Diplomacy</b> is generally considered the primary peaceful instrument of IR &mdash; the means by which states communicate, negotiate and resolve disputes through ambassadors and diplomatic missions, without resorting to force.</p>'},
{lb:'Treaties and agreements',dr:dQ2,ht:'<p><b>Treaties and agreements</b> are formal, legally-binding written agreements between states &mdash; such as trade treaties or defence pacts &mdash; that structure and formalise international cooperation.</p>'},
{lb:'Sanctions',dr:dQ2,ht:'<p><b>Sanctions</b> are economic or political penalties imposed by one or more states to pressure another state to change its behaviour, without resorting to war. They are a middle ground between diplomacy and military force.</p>'},
{lb:'War and the use of force',dr:dQ2,ht:'<p><b>War, or the use of force</b>, is the most extreme instrument of IR, used when diplomacy fails. Its use is increasingly regulated by international law, particularly restrictions in the <b>UN Charter</b> on the unilateral use of force between states.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'What is generally considered the primary peaceful instrument of International Relations?',o:['Diplomacy','War','Sanctions only','Propaganda'],a:1,w:'Diplomacy is generally considered the primary peaceful instrument of International Relations.'},{q:'What is a "treaty" in the context of International Relations?',o:['A formal, legally-binding written agreement between states','An informal conversation between leaders','A type of domestic law only','A military uniform code'],a:1,w:'A treaty is a formal, legally-binding written agreement between states.'},{q:'What is the purpose of economic sanctions as an instrument of IR?',o:['To pressure a state to change its behaviour without resorting to war','To formally declare war','To establish a new international organisation','To abolish diplomacy'],a:1,w:'Sanctions pressure a state to change its behaviour without the need for war.'},{q:'Which instrument of IR is considered the most extreme, used when diplomacy fails?',o:['War / the use of force','A trade agreement','A cultural exchange programme','An embassy opening'],a:1,w:'War, or the use of force, is the most extreme instrument, used when diplomacy fails.'},{q:'What international document places restrictions on states\' use of force against one another?',o:['The UN Charter','A trade treaty only','A national constitution only','An NGO charter'],a:1,w:'The UN Charter places restrictions on the unilateral use of force between states.'},{q:'Which of these best illustrates the use of a treaty as an instrument of IR?',o:['A formal defence pact between two allied countries','An informal phone call between two leaders','A newspaper editorial','A domestic court ruling'],a:1,w:'A formal defence pact between two countries is a clear example of a treaty in action.'},{q:'Which of these best illustrates diplomacy as an instrument of IR?',o:['An ambassador negotiating a dispute between two countries','A country launching a military invasion','One state imposing sanctions on another','A trade embargo'],a:1,w:'An ambassador negotiating a dispute is a clear example of diplomacy in action.'},{q:'Why are sanctions generally considered a less extreme instrument than war?',o:['They apply economic or political pressure without direct armed conflict','They always involve military troops','They are identical to a declaration of war','They have no real effect on states'],a:1,w:'Sanctions apply economic or political pressure without the need for direct armed conflict.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 International Relations',ti:'WAEC Exam Preparation — Meaning and Scope of IR',su:'Practise WAEC-style questions on the meaning and scope of international relations.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on IR topics: (1) Define the key term clearly. (2) Explain relevant concepts or actors. (3) Give real-world examples, especially Nigerian or African ones. (4) Draw a conclusion connecting the topic to broader lessons about global politics.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common WAEC question patterns include: "Explain the meaning and scope of international relations." / "Distinguish between state and non-state actors in IR." / "Discuss the importance of studying international relations." Always answer the specific question asked.</p>'},
{lb:'Key vocabulary for essays',dr:dQ1,ht:'<p>Key vocabulary to use: <b>sovereignty</b>, <b>national interest</b>, <b>diplomacy</b>, <b>IGO</b>, <b>NGO</b>, <b>MNC</b>, <b>Realism</b>, <b>Liberalism</b>, <b>foreign policy</b>, <b>unilateral/multilateral</b>, <b>bilateral</b>. Precise vocabulary earns higher marks.</p>'},
{lb:'Applying to Nigeria',dr:dQ1,ht:'<p>Always link back to <b>Nigeria\'s own experience</b> in international relations where relevant, since WAEC frequently rewards local application of global concepts &mdash; for example, referencing Nigeria\'s membership of ECOWAS or the AU.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'What is the recommended first step for a WAEC essay on an IR topic?',o:['Define the key terms clearly','Immediately give a personal opinion','List unrelated facts','Skip straight to a conclusion'],a:1,w:'WAEC essays should always begin by clearly defining the key terms.'},{q:'Which of these WAEC-style questions relates most directly to "meaning and scope of IR"?',o:['"Explain the meaning and scope of international relations."','"Describe the layout of the Nigerian Senate."','"List the states of Nigeria."','"Define photosynthesis."'],a:1,w:'"Explain the meaning and scope of international relations" directly relates to this topic.'},{q:'Which of these terms should a strong WAEC essay on IR make use of?',o:['Sovereignty, national interest, diplomacy, IGO, NGO, MNC','Only "government" and "election"','Only mathematical formulas','Only historical dates with no explanation'],a:1,w:'Precise IR vocabulary such as sovereignty, national interest, diplomacy, IGO, NGO and MNC strengthens a WAEC essay.'},{q:'Why does WAEC reward linking IR concepts back to Nigeria\'s own experience?',o:['It shows the ability to apply general concepts to a specific, relevant example','Nigeria is the only country studied in IR','Other countries are irrelevant to the syllabus','It replaces the need for definitions'],a:1,w:'Linking concepts to Nigeria\'s own experience shows the ability to apply general concepts to a specific example.'},{q:'What does the term "bilateral," often used in IR essays, mean?',o:['Involving two states','Involving all states in the world','Involving no states','Involving only NGOs'],a:1,w:'"Bilateral" means involving two states.'},{q:'What does the term "multilateral" mean, as used in IR essays?',o:['Involving three or more states or parties','Involving exactly one state','Involving no international actors','Involving only individuals'],a:1,w:'"Multilateral" means involving three or more states or parties.'},{q:'Which of the following would WAEC examiners consider a well-structured IR essay conclusion?',o:['A summary of key points with relevance to Nigeria or Africa today','An unrelated joke','A list of unrelated countries','No conclusion at all'],a:1,w:'A strong conclusion summarises key points and links them to relevance for Nigeria or Africa today.'},{q:'What is the benefit of using specific real-world examples in a WAEC IR essay?',o:['It demonstrates concrete knowledge and earns higher marks','It is discouraged by WAEC','It replaces the need for any theory','It is only relevant for essays on Nigeria\'s covenant history'],a:1,w:'Using specific, real-world examples demonstrates concrete knowledge and earns higher WAEC marks.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 International Relations',ti:'Mixed Questions — Meaning and Scope of IR',su:'Integrated revision across all aspects of the meaning and scope of international relations.',steps:[
{lb:'Summary of key points',dr:dQ10,ht:'<p>International Relations studies interactions between states and other global actors, involving both conflict and cooperation across political, economic and social spheres. Its scope spans diplomacy, security, international law, global economics and emerging global issues.</p>'},
{lb:'Key terms to remember',dr:dQ10,ht:'<p>Must-know terms: <b>Sovereignty</b>, <b>national interest</b>, <b>power</b>, <b>IGOs</b> (UN, AU, ECOWAS), <b>NGOs</b>, <b>MNCs</b>, <b>Realism</b>, <b>Liberalism</b>, <b>foreign policy</b>, <b>diplomacy</b>.</p>'},
{lb:'Lessons for Nigeria',dr:dQ10,ht:'<p>As a large, influential African state, Nigeria\'s own foreign policy decisions (covered in later topics) are shaped by these same fundamental IR concepts &mdash; sovereignty, national interest, power and the choice between cooperative and self-interested strategies.</p>'},
{lb:'Final exam tips',dr:dQ10,ht:'<p>Always distinguish clearly between <b>"international relations"</b> (the broad field of study) and <b>"foreign policy"</b> (a specific state\'s strategy within that field). Define terms precisely, use real examples, and conclude with relevance to Nigeria or Africa.</p>'},
