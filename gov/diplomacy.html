<style>

.ht{font-size:15px;font-weight:700;}

.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}

.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}

.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}

.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}

.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}

.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}

var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});

{ey:'Q1 \u2022 Gov • International Relations',ti:'The Meaning and Nature of Diplomacy',su:'Define diplomacy and explain its role as the primary instrument of international relations.',steps:[
{lb:'Definition',dr:dQ1,ht:'<p><b>Diplomacy</b> is the practice of managing relations between states, and between states and other international actors, through <b>negotiation, communication and representation</b>, rather than through force. It is the primary peaceful means by which states pursue their interests internationally.</p>'},
{lb:'Diplomacy as an ancient practice',dr:dQ1,ht:'<p>Diplomacy is one of humanity\'s oldest political practices, with evidence of formal diplomatic exchanges dating back to <b>ancient Egypt and Mesopotamia</b>; modern diplomatic norms developed significantly in Renaissance Italy, where the first <b>permanent resident embassies</b> emerged in the 15th century.</p>'},
{lb:'Key qualities of effective diplomacy',dr:dQ1,ht:'<p>Effective diplomacy requires <b>tact, patience, cultural sensitivity, and clear communication</b>. A skilled diplomat must represent their state\'s interests firmly while maintaining the relationships and trust needed for future cooperation, even amid disagreement.</p>'},
{lb:'Diplomacy versus other instruments',dr:dQ1,ht:'<p>Unlike sanctions or force, diplomacy seeks to resolve differences through <b>dialogue and compromise</b>, generally preserving relationships for future cooperation. It is usually the <b>first instrument</b> attempted before states consider more coercive measures.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the best definition of diplomacy?',o:['The practice of managing relations between states through negotiation and communication','A synonym for military invasion','A type of international treaty only','A form of economic sanction'],a:0,w:'Diplomacy is the practice of managing relations between states through negotiation, communication and representation.'},{q:'In which ancient civilisations is evidence of formal diplomatic exchange found?',o:['Ancient Egypt and Mesopotamia','Ancient Australia and New Zealand','Ancient North America only','Nowhere before the 20th century'],a:0,w:'Evidence of formal diplomatic exchange dates back to ancient Egypt and Mesopotamia.'},{q:'Where did the first permanent resident embassies emerge, in the 15th century?',o:['Renaissance Italy','Ancient Rome','Medieval England','Modern Nigeria'],a:0,w:'The first permanent resident embassies emerged in Renaissance Italy in the 15th century.'},{q:'Which qualities does effective diplomacy require?',o:['Tact, patience, cultural sensitivity and clear communication','Aggression, secrecy and deception only','Complete indifference to other states','Only military training'],a:0,w:'Effective diplomacy requires tact, patience, cultural sensitivity and clear communication.'},{q:'What does diplomacy seek to achieve, unlike sanctions or force?',o:['Resolution of differences through dialogue and compromise','Immediate economic collapse of the other state','Total military defeat of the other party','The permanent severing of all relations'],a:0,w:'Diplomacy seeks to resolve differences through dialogue and compromise, unlike sanctions or force.'},{q:'Which instrument is usually attempted first, before more coercive measures are considered?',o:['Diplomacy','Military invasion','Economic sanctions','Complete isolation'],a:0,w:'Diplomacy is usually the first instrument attempted before states consider more coercive measures.'},{q:'What must a skilled diplomat balance according to this lesson?',o:['Representing their state\'s interests firmly while maintaining relationships and trust','Only representing their own personal interests','Only following orders with no independent judgement','Avoiding any contact with foreign officials'],a:0,w:'A skilled diplomat must balance firmly representing their state\'s interests with maintaining relationships and trust.'},{q:'Why is diplomacy considered the "primary" peaceful instrument of international relations?',o:['It is the main means by which states pursue their interests without resorting to force','It is the only instrument ever used by any state','It always guarantees a state gets everything it wants','It has no relationship to a state\'s national interest'],a:0,w:'Diplomacy is considered primary because it is the main means by which states pursue interests without resorting to force.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'Bilateral diplomacy',dr:dQ2,ht:'<p><b>Bilateral diplomacy</b> involves direct negotiation between exactly two states &mdash; the most traditional and common form, conducted through embassies, high commissions, and direct government-to-government contact.</p>'},
{lb:'Multilateral diplomacy',dr:dQ2,ht:'<p><b>Multilateral diplomacy</b> involves three or more states negotiating together, typically through international organisations such as the <b>United Nations, AU, or ECOWAS</b>, allowing complex issues affecting many states to be addressed collectively.</p>'},

{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What is "bilateral diplomacy"?',o:['Direct negotiation between exactly two states','Negotiation involving ten or more states','A type of economic sanction','A form of military alliance only'],a:0,w:'Bilateral diplomacy involves direct negotiation between exactly two states.'},{q:'What is "multilateral diplomacy"?',o:['Negotiation involving three or more states, often through international organisations','Negotiation between exactly two states','A purely domestic form of policy-making','A synonym for military action'],a:0,w:'Multilateral diplomacy involves three or more states negotiating together, often through international organisations.'},{q:'Which international organisations are commonly used for multilateral diplomacy?',o:['The United Nations, AU and ECOWAS','Only NATO','Only the World Bank','Only the International Court of Justice'],a:0,w:'The United Nations, AU and ECOWAS are commonly used for multilateral diplomacy.'},{q:'What is "shuttle diplomacy"?',o:['A mediator travelling repeatedly between conflicting parties unwilling to meet directly','A form of military transport','A type of economic sanction','A synonym for bilateral diplomacy'],a:0,w:'Shuttle diplomacy involves a mediator travelling repeatedly between conflicting parties unwilling to meet directly.'},{q:'Which US Secretary of State is famously associated with shuttle diplomacy in the 1970s Middle East?',o:['Henry Kissinger','Woodrow Wilson','Franklin Roosevelt','Colin Powell'],a:0,w:'Henry Kissinger is famously associated with shuttle diplomacy in the 1970s Middle East.'},{q:'What does "public diplomacy" involve?',o:['A state communicating directly with foreign publics to build understanding and goodwill','Only secret negotiations between governments','Only military communications','A ban on any communication with foreign citizens'],a:0,w:'Public diplomacy involves a state communicating directly with foreign publics to build understanding and goodwill.'},{q:'What increasingly modern form does public diplomacy take in the 21st century?',o:['Digital/social media diplomacy','Only handwritten letters between leaders','Only in-person state visits, with no other form','Only military parades'],a:0,w:'Digital/social media diplomacy is an increasingly important modern form of public diplomacy.'},{q:'Where has shuttle diplomacy also been used, besides the Middle East?',o:['West African conflict mediation','Only within a single country\'s domestic politics','Only in outer space negotiations','Nowhere else besides the Middle East'],a:0,w:'Shuttle diplomacy has also been used repeatedly in West African conflict mediation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'Embassies and high commissions',dr:dQ1,ht:'<p>An <b>embassy</b> is a state\'s official diplomatic mission in another country\'s capital, headed by an <b>ambassador</b>. Between <b>Commonwealth member states</b> (such as Nigeria and the UK), these missions are instead called <b>High Commissions</b>, headed by a <b>High Commissioner</b>, though functioning identically to embassies.</p>'},

s in over 100 countries worldwide.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'The Vienna Convention on Diplomatic Relations (1961)',dr:dQ2,ht:'<p>The <b>Vienna Convention on Diplomatic Relations (1961)</b> codified longstanding customary international law on diplomatic immunity and privileges, and remains the primary legal framework governing diplomatic relations between states worldwide today.</p>'},
{lb:'What diplomatic immunity means',dr:dQ2,ht:'<p><b>Diplomatic immunity</b> generally protects accredited diplomats from arrest, prosecution and lawsuits in the host country, and grants diplomatic premises (embassies) special protection, on the principle that diplomats must be free to perform their duties without fear of pressure or coercion from the host government.</p>'},
{lb:'Justification: reciprocity and function',dr:dQ2,ht:'<p>Immunity is justified partly by <b>reciprocity</b> (each state benefits from its own diplomats receiving equivalent protection abroad) and partly by <b>functional necessity</b> &mdash; diplomats could not effectively represent their country\'s interests if constantly vulnerable to arrest or harassment by the host state.</p>'},
{lb:'Controversies and limits',dr:dQ2,ht:'<p>Diplomatic immunity is sometimes controversial when diplomats commit serious crimes (e.g. traffic offences, or in rare cases more serious crimes) yet escape prosecution; the usual remedy is that the <b>home country can waive immunity</b> or recall the diplomat, though this is not guaranteed, generating periodic diplomatic disputes.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which 1961 convention codified diplomatic immunity and privileges?',o:['The Vienna Convention on Diplomatic Relations','The Geneva Convention','The Montevideo Convention','The UN Charter'],a:0,w:'The Vienna Convention on Diplomatic Relations (1961) codified diplomatic immunity and privileges.'},{q:'What does diplomatic immunity generally protect accredited diplomats from?',o:['Arrest, prosecution and lawsuits in the host country','Only traffic fines specifically','Only tax obligations in their own country','Nothing at all — it is a purely symbolic concept'],a:0,w:'Diplomatic immunity generally protects accredited diplomats from arrest, prosecution and lawsuits in the host country.'},{q:'What special protection does diplomatic immunity give to embassy premises?',o:['Special legal protection from host-country interference','No protection at all','Protection only during wartime','Protection only for one year after opening'],a:0,w:'Diplomatic immunity gives embassy premises special legal protection from host-country interference.'},{q:'What principle underlies diplomatic immunity, related to states benefiting equally?',o:['Reciprocity','Colonialism','Federalism','Unilateralism'],a:0,w:'Reciprocity — each state benefiting from equivalent protection for its own diplomats abroad — underlies diplomatic immunity.'},{q:'What functional justification is also given for diplomatic immunity?',o:['Diplomats could not effectively represent their country if vulnerable to host-state harassment','Diplomats are legally superior human beings','Immunity has no real justification at all','Immunity exists only for economic reasons'],a:0,w:'Functional necessity — that diplomats could not effectively perform their duties if vulnerable to harassment — justifies immunity.'},{q:'What controversy can arise from diplomatic immunity?',o:['Diplomats committing serious crimes yet escaping prosecution','Diplomats being taxed twice by two countries','Diplomats being unable to travel at all','Diplomats losing their citizenship automatically'],a:0,w:'A key controversy is diplomats committing serious crimes yet escaping prosecution due to immunity.'},{q:'What can a diplomat\'s home country do to address such controversies?',o:['Waive immunity or recall the diplomat','Nothing at all — the situation cannot be addressed','Immediately declare war on the host country','Automatically transfer the case to the UN Security Council'],a:0,w:'A diplomat\'s home country can waive immunity or recall the diplomat to address such controversies.'},{q:'Why does the Vienna Convention remain significant today?',o:['It remains the primary legal framework governing diplomatic relations worldwide','It has been completely replaced by newer treaties','It only applies to European countries','It has never been ratified by any African state'],a:0,w:'The Vienna Convention remains the primary legal framework governing diplomatic relations between states worldwide today.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • International Relations',ti:'The Functions of Diplomacy',su:'Explain the key functions diplomacy performs for states.',steps:[
{lb:'Representation',dr:dQ1,ht:'<p>Diplomacy\'s most basic function is <b>representation</b> &mdash; a diplomat officially represents their state\'s government, communicating its official positions and maintaining formal relations with the host country.</p>'},
{lb:'Negotiation',dr:dQ1,ht:'<p><b>Negotiation</b> is a central diplomatic function: diplomats negotiate treaties, trade agreements, and settlements of disputes, seeking outcomes that serve their state\'s interests while maintaining workable relationships for the future.</p>'},
{lb:'Information gathering (reporting)',dr:dQ1,ht:'<p>Diplomats perform an essential <b>information-gathering (reporting)</b> function &mdash; observing and analysing political, economic and social developments in the host country, and reporting these back to inform their home government\'s policy decisions.</p>'},
{lb:'Protection of citizens and promotion of interests',dr:dQ1,ht:'<p>Diplomatic missions also perform <b>consular protection</b> of citizens abroad (especially during crises), and actively <b>promote their country\'s trade, investment, and cultural interests</b> in the host country, functions increasingly emphasised in modern "economic diplomacy."</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is diplomacy\'s most basic function?',o:['Representation of a state\'s government and positions','Only military coordination','Only tax collection','Only tourism promotion'],a:0,w:'Representation of a state\'s government and positions is diplomacy\'s most basic function.'},{q:'What central diplomatic function involves treaties, trade agreements and dispute settlements?',o:['Negotiation','Only representation, with no negotiation involved','Only information gathering','Only consular protection'],a:0,w:'Negotiation, involving treaties, trade agreements and dispute settlements, is a central diplomatic function.'},{q:'What is the "reporting" function of diplomacy?',o:['Observing and analysing developments in the host country and reporting back home','Reporting crimes to the host country\'s police only','Filing tax returns for diplomats','Reporting weather conditions only'],a:0,w:'The reporting function involves observing and analysing host-country developments and reporting back to the home government.'},{q:'What does the reporting function help inform?',o:['The home government\'s policy decisions','Only the diplomat\'s personal finances','Only tourist recommendations','Only sports events'],a:0,w:'The reporting function helps inform the home government\'s policy decisions.'},{q:'What consular function does a diplomatic mission perform for its own citizens abroad?',o:['Protection of citizens, especially during crises','Only issuing local driving licences','Only providing local weather forecasts','Only selling local souvenirs'],a:0,w:'A diplomatic mission provides protection of citizens abroad, especially during crises.'},{q:'What modern term describes diplomacy\'s active promotion of trade and investment interests?',o:['"Economic diplomacy"','"Military diplomacy" only','"Colonial diplomacy"','"Religious diplomacy" only'],a:0,w:'"Economic diplomacy" describes diplomacy\'s active promotion of trade and investment interests.'},{q:'Which of these best illustrates the negotiation function of diplomacy?',o:['A diplomat negotiating a bilateral trade agreement','A diplomat attending a purely social event with no agenda','A diplomat filing routine paperwork with no external contact','A diplomat on holiday'],a:0,w:'A diplomat negotiating a bilateral trade agreement clearly illustrates the negotiation function of diplomacy.'},{q:'Why are all these diplomatic functions considered important together?',o:['They collectively allow a state to pursue its interests peacefully and effectively abroad','Only one function matters; the others are irrelevant','They apply only to very large, powerful states','They have no connection to a state\'s national interest'],a:0,w:'Together, these functions allow a state to pursue its interests peacefully and effectively abroad.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • International Relations',ti:'Nigeria\'s Diplomatic History and Practice',su:'Trace Nigeria\'s diplomatic engagement since independence.',steps:[
{lb:'Early diplomatic priorities',dr:dQ2,ht:'<p>Since independence in 1960, Nigeria established diplomatic missions across Africa and beyond, with an early emphasis on <b>anti-colonial solidarity</b> and support for liberation movements still fighting colonial rule elsewhere on the continent, especially in Southern Africa.</p>'},
{lb:'Anti-apartheid diplomacy',dr:dQ2,ht:'<p>Nigeria was among the most vocal African states in the international campaign against <b>apartheid South Africa</b> during the 1970s-80s, using diplomatic pressure, funding for the African National Congress, and leadership within the <b>OAU/Commonwealth</b> to isolate the apartheid regime.</p>'},
{lb:'Mediation and peacekeeping diplomacy',dr:dQ2,ht:'<p>Nigerian diplomats have played leading roles in mediating regional conflicts, notably during the <b>Liberian and Sierra Leonean civil wars</b> (1990s-2000s) and, more recently, in responding diplomatically to the wave of Sahel coups (2020-2023).</p>'},
{lb:'Contemporary diplomatic challenges',dr:dQ2,ht:'<p>Nigeria\'s contemporary diplomacy must balance historic Africa-centred priorities with managing relations with major global powers (the <b>USA, China, EU, UK</b>), securing foreign investment, and addressing the diplomatic dimensions of counter-terrorism cooperation against Boko Haram/ISWAP.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What early diplomatic priority did Nigeria emphasise following its 1960 independence?',o:['Anti-colonial solidarity and support for African liberation movements','Complete isolation from all African affairs','Alliance with apartheid South Africa','Rejoining the British Empire'],a:0,w:'Nigeria emphasised anti-colonial solidarity and support for African liberation movements following independence.'},{q:'Against which regime was Nigeria among the most vocal African diplomatic critics during the 1970s-80s?',o:['Apartheid South Africa','The Soviet Union','The United States','Ghana'],a:0,w:'Nigeria was among the most vocal African diplomatic critics of apartheid South Africa during the 1970s-80s.'},{q:'Which liberation movement did Nigeria provide funding to during the anti-apartheid campaign?',o:['The African National Congress (ANC)','Boko Haram','IPOB','MEND'],a:0,w:'Nigeria provided funding to the African National Congress (ANC) during the anti-apartheid campaign.'},{q:'Which regional/international bodies did Nigeria use to help isolate the apartheid regime?',o:['The OAU and Commonwealth','NATO and the EU','The World Bank and IMF only','The International Court of Justice alone'],a:0,w:'Nigeria used the OAU and Commonwealth to help isolate the apartheid regime diplomatically.'},{q:'In which conflicts did Nigerian diplomats play leading mediation roles during the 1990s-2000s?',o:['The Liberian and Sierra Leonean civil wars','The Nigerian Civil War itself','World War II','The Cold War'],a:0,w:'Nigerian diplomats played leading mediation roles during the Liberian and Sierra Leonean civil wars.'},{q:'Which recent regional crisis has Nigeria responded to diplomatically since 2020?',o:['The wave of Sahel coups','A civil war in Ghana','A war between Senegal and Mali','A conflict in Southern Africa'],a:0,w:'Nigeria has responded diplomatically to the wave of Sahel coups since 2020.'},{q:'Which major global powers does Nigeria\'s contemporary diplomacy need to balance relations with?',o:['The USA, China, EU and UK','Only Ghana and Senegal','Only Mali and Niger','Only Sierra Leone and Liberia'],a:0,w:'Nigeria\'s contemporary diplomacy must balance relations with the USA, China, EU and UK, among others.'},{q:'What security-related diplomatic cooperation does Nigeria pursue with foreign partners today?',o:['Counter-terrorism cooperation against Boko Haram/ISWAP','Cooperation to restore apartheid','Cooperation to abolish ECOWAS','Cooperation to leave the United Nations'],a:0,w:'Nigeria pursues counter-terrorism diplomatic cooperation against Boko Haram/ISWAP with foreign partners.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • International Relations',ti:'Diplomacy Compared with Other Instruments',su:'Compare diplomacy with sanctions and the use of force as instruments of IR.',steps:[
{lb:'Diplomacy vs sanctions',dr:dQ1,ht:'<p>Compared with <b>economic sanctions</b>, diplomacy is generally less immediately costly to both parties and preserves the possibility of continued cooperation, whereas sanctions apply direct economic pressure but can harden a target state\'s resistance rather than encouraging genuine compromise.</p>'},
{lb:'Diplomacy vs the use of force',dr:dQ1,ht:'<p>Compared with <b>military force</b>, diplomacy avoids the immense human, financial, and political costs of war, though critics note that diplomacy alone may prove insufficient against determined aggressors unwilling to negotiate in good faith, as seen in some failed pre-war diplomatic efforts historically.</p>'},
{lb:'Combining instruments: coercive diplomacy',dr:dQ1,ht:'<p>States frequently combine instruments through <b>"coercive diplomacy"</b> &mdash; using the credible threat of sanctions or force to strengthen a diplomatic negotiating position, rather than relying on diplomacy or coercion in complete isolation from each other.</p>'},
{lb:'When diplomacy typically prevails',dr:dQ1,ht:'<p>Diplomacy typically prevails as the primary instrument when both parties have <b>some shared interest</b> in avoiding conflict and preserving a working relationship; it becomes less effective when one party has little interest in compromise or perceives overwhelming advantage from confrontation.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'How does diplomacy generally compare with economic sanctions in terms of cost?',o:['It is generally less immediately costly to both parties','It is always far more expensive than sanctions','It has identical costs to sanctions in every case','It has no cost implications at all'],a:0,w:'Diplomacy is generally less immediately costly to both parties than economic sanctions.'},{q:'What risk do economic sanctions sometimes carry, according to this lesson?',o:['They can harden a target state\'s resistance rather than encourage compromise','They always guarantee immediate compromise','They have no effect on any state whatsoever','They are illegal under all circumstances'],a:0,w:'Sanctions can sometimes harden a target state\'s resistance rather than encourage compromise.'},{q:'What costs does diplomacy avoid, compared with military force?',o:['The immense human, financial and political costs of war','All forms of political disagreement','The need for any government to have a foreign policy','The need for embassies to exist at all'],a:0,w:'Diplomacy avoids the immense human, financial and political costs of war, compared with military force.'},{q:'What criticism do critics make of diplomacy alone against determined aggressors?',o:['It may prove insufficient if the aggressor is unwilling to negotiate in good faith','It always guarantees peace under every circumstance','It is illegal under international law','It has no relationship to national interest'],a:0,w:'Critics note that diplomacy alone may prove insufficient against aggressors unwilling to negotiate in good faith.'},{q:'What term describes using the credible threat of sanctions or force to strengthen a diplomatic position?',o:['"Coercive diplomacy"','"Pure pacifism"','"Total isolationism"','"Unconditional surrender"'],a:0,w:'"Coercive diplomacy" describes using the credible threat of sanctions or force to strengthen a diplomatic position.'},{q:'Why do states often combine diplomacy with other instruments, rather than using either alone?',o:['To strengthen their negotiating position through credible pressure','Because diplomacy is always illegal on its own','Because sanctions are always illegal on their own','Because using only one instrument is against international law'],a:0,w:'States combine instruments to strengthen their negotiating position through credible pressure, rather than relying on one alone.'},{q:'When does diplomacy typically prevail as the primary instrument, according to this lesson?',o:['When both parties share some interest in avoiding conflict and preserving relations','Only when one party has overwhelming military superiority','Only when there is no possible common ground at all','Never — diplomacy always fails eventually'],a:0,w:'Diplomacy typically prevails when both parties share some interest in avoiding conflict and preserving relations.'},{q:'When does diplomacy tend to become less effective, according to this lesson?',o:['When one party has little interest in compromise or perceives an advantage from confrontation','When both parties are equally powerful','When an international organisation is involved','When diplomats are highly experienced'],a:0,w:'Diplomacy becomes less effective when one party has little interest in compromise or sees an advantage in confrontation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • International Relations',ti:'Modern Challenges to Diplomacy',su:'Explain how digital communication and summit diplomacy have transformed modern diplomatic practice.',steps:[
{lb:'Summit diplomacy',dr:dQ2,ht:'<p><b>Summit diplomacy</b> &mdash; direct, high-profile meetings between heads of state or government &mdash; has become increasingly common since the mid-20th century, allowing leaders to negotiate personally rather than relying solely on career diplomats, though critics argue it can sometimes bypass careful institutional preparation.</p>'},
{lb:'The rise of digital diplomacy',dr:dQ2,ht:'<p><b>Digital or "Twitter diplomacy"</b> has transformed modern practice, with government leaders and foreign ministries increasingly announcing policy and engaging in public disputes directly via social media &mdash; sometimes bypassing traditional, more measured diplomatic channels entirely.</p>'},
{lb:'Virtual diplomacy during COVID-19',dr:dQ2,ht:'<p>The <b>COVID-19 pandemic (2020-21)</b> accelerated the use of <b>virtual/video-conference diplomacy</b>, with major international meetings (including UN General Assembly sessions) conducted remotely, demonstrating both the resilience and the limits of diplomacy without in-person contact.</p>'},
{lb:'Risks of digital-era diplomacy',dr:dQ2,ht:'<p>Digital-era diplomacy carries risks: <b>misinformation, diplomatic incidents caused by hastily-written public statements</b>, and reduced opportunities for the private, face-to-face trust-building that traditional diplomacy has long relied upon.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What is "summit diplomacy"?',o:['Direct, high-profile meetings between heads of state or government','A form of shuttle diplomacy only','A type of economic sanction','A form of military cooperation only'],a:0,w:'Summit diplomacy refers to direct, high-profile meetings between heads of state or government.'},{q:'What criticism is sometimes made of summit diplomacy?',o:['It can bypass careful institutional preparation','It is always more effective than any other form of diplomacy','It has no relationship to national interest','It is banned under the Vienna Convention'],a:0,w:'Critics argue summit diplomacy can sometimes bypass careful institutional preparation.'},{q:'What term describes leaders announcing policy directly via social media?',o:['"Digital" or "Twitter diplomacy"','"Shuttle diplomacy" only','"Consular diplomacy" only','"Economic diplomacy" only'],a:0,w:'"Digital" or "Twitter diplomacy" describes leaders announcing policy directly via social media.'},{q:'What risk does digital diplomacy carry, compared with traditional channels?',o:['It can bypass more measured, traditional diplomatic channels','It always improves diplomatic outcomes with no risk','It has replaced the need for embassies entirely','It is identical in every way to traditional diplomacy'],a:0,w:'Digital diplomacy can bypass more measured, traditional diplomatic channels, carrying real risks.'},{q:'What global event in 2020-21 accelerated the use of virtual/video-conference diplomacy?',o:['The COVID-19 pandemic','The end of the Cold War','World War II','The Berlin Conference'],a:0,w:'The COVID-19 pandemic (2020-21) accelerated the use of virtual/video-conference diplomacy.'},{q:'Which major international meetings were conducted remotely during the pandemic?',o:['UN General Assembly sessions','Only local town council meetings','Only Nigerian state assembly meetings','No meetings were conducted remotely at all'],a:0,w:'UN General Assembly sessions were among the major international meetings conducted remotely during the pandemic.'},{q:'What did the pandemic-era experience of virtual diplomacy demonstrate?',o:['Both the resilience and the limits of diplomacy without in-person contact','That diplomacy is now entirely unnecessary','That in-person diplomacy will never be needed again','That virtual diplomacy has no limitations whatsoever'],a:0,w:'The pandemic demonstrated both the resilience and the limits of diplomacy conducted without in-person contact.'},{q:'What traditional element of diplomacy can be reduced by heavy reliance on digital-era methods?',o:['Private, face-to-face trust-building','The need for any negotiation at all','The need for national interest','The need for embassies to exist'],a:0,w:'Heavy reliance on digital-era methods can reduce opportunities for private, face-to-face trust-building.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • International Relations',ti:'WAEC Exam Preparation — Diplomacy',su:'Practise WAEC-style questions on the meaning, types and functions of diplomacy.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on diplomacy: (1) Define diplomacy clearly. (2) Identify the <b>relevant type</b> (bilateral, multilateral, shuttle, public) if the question specifies one. (3) Explain <b>functions or personnel</b> as relevant, with precise vocabulary. (4) Give <b>named, dated examples</b>, ideally involving Nigeria.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Explain the meaning and types of diplomacy." / "Distinguish between an ambassador and a consul." / "Discuss the importance of diplomatic immunity." / "Examine Nigeria\'s use of diplomacy in regional conflict resolution."</p>'},
{lb:'Key vocabulary for essays',dr:dQ2,ht:'<p>Key vocabulary: <b>bilateral/multilateral diplomacy</b>, <b>shuttle diplomacy</b>, <b>ambassador</b>, <b>High Commissioner</b>, <b>consul</b>, <b>diplomatic immunity</b>, <b>Vienna Convention (1961)</b>, <b>coercive diplomacy</b>. Precise, correctly-spelled terms strengthen WAEC answers.</p>'},
{lb:'Applying to Nigeria\'s own diplomatic practice',dr:dQ2,ht:'<p>Always connect general diplomatic concepts to <b>Nigeria\'s own diplomatic history</b> &mdash; anti-apartheid diplomacy, ECOWAS mediation, or Nigeria\'s extensive network of embassies and High Commissions &mdash; since WAEC consistently rewards this kind of concrete, locally-relevant application.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What is the recommended first step for a WAEC essay on diplomacy?',o:['Define diplomacy clearly','Immediately give a personal opinion with no facts','List unrelated dates with no explanation','Skip straight to a conclusion'],a:0,w:'A WAEC essay on diplomacy should begin by clearly defining the term.'},{q:'Which of these is a typical WAEC-style question on this topic?',o:['"Distinguish between an ambassador and a consul."','"Describe the layout of Lagos."','"Define photosynthesis."','"List the rivers of Nigeria."'],a:0,w:'"Distinguish between an ambassador and a consul" is a typical WAEC-style question on this topic.'},{q:'Which 1961 convention should be mentioned when discussing diplomatic immunity?',o:['The Vienna Convention on Diplomatic Relations','The Geneva Convention','The Treaty of Lagos','The Montevideo Convention'],a:0,w:'The Vienna Convention on Diplomatic Relations (1961) should be mentioned when discussing diplomatic immunity.'},{q:'Which term should be used to describe combining diplomacy with the threat of sanctions or force?',o:['"Coercive diplomacy"','"Pure pacifism"','"Total isolationism"','"Unconditional diplomacy"'],a:0,w:'"Coercive diplomacy" is the precise term for combining diplomacy with the credible threat of sanctions or force.'},{q:'Which Nigerian diplomatic history example should be mentioned for strong WAEC answers?',o:['Nigeria\'s anti-apartheid diplomacy in the 1970s-80s','A diplomatic history unrelated to Nigeria entirely','Only ancient Egyptian diplomacy','Only European diplomatic history'],a:0,w:'Nigeria\'s anti-apartheid diplomacy in the 1970s-80s is a strong, specific example for WAEC answers.'},{q:'Which type of diplomacy should be named if a WAEC question asks about mediators travelling between conflicting parties?',o:['Shuttle diplomacy','Only bilateral diplomacy','Only public diplomacy','Only economic diplomacy'],a:0,w:'"Shuttle diplomacy" is the precise term for mediators travelling between conflicting parties.'},{q:'Why does WAEC reward connecting diplomatic concepts to Nigeria\'s own practice?',o:['It demonstrates the ability to apply general concepts to a specific, relevant example','Nigeria is the only country ever studied in WAEC Government','Other countries are irrelevant to the syllabus','It replaces the need for any definitions'],a:0,w:'Connecting concepts to Nigeria\'s own practice demonstrates the ability to apply general concepts to a specific example.'},{q:'What should a WAEC essay do if the question specifies a particular type of diplomacy?',o:['Identify and focus on that relevant type specifically','Ignore the type specified and discuss diplomacy generally','Only discuss unrelated historical events','Refuse to answer the question as asked'],a:0,w:'A WAEC essay should identify and focus on the specific type of diplomacy the question asks about.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • International Relations',ti:'Mixed Questions — Diplomacy',su:'Integrated revision across the meaning, types, personnel and functions of diplomacy.',steps:[
{lb:'Summary of key points',dr:dQ1,ht:'<p>Diplomacy is the primary peaceful instrument of international relations, conducted through <b>embassies/High Commissions</b> led by ambassadors/High Commissioners, protected by <b>diplomatic immunity (Vienna Convention, 1961)</b>, and taking various forms &mdash; bilateral, multilateral, shuttle and public diplomacy.</p>'},
{lb:'Key terms and examples to remember',dr:dQ1,ht:'<p>Must-know facts: <b>Vienna Convention (1961)</b>; <b>Henry Kissinger</b> (shuttle diplomacy); ambassador vs consul distinction; Nigeria\'s <b>anti-apartheid diplomacy</b>; Nigeria\'s role in <b>ECOWAS mediation</b>; <b>coercive diplomacy</b> as combining instruments.</p>'},
{lb:'Lessons for Nigeria',dr:dQ1,ht:'<p>Nigeria\'s extensive diplomatic network and historical mediation record demonstrate how a leading regional power uses diplomacy alongside other instruments (economic, security cooperation) to pursue its Africa-centred foreign policy and national interest.</p>'},
{lb:'Final exam tips',dr:dQ1,ht:'<p>Always distinguish clearly between <b>diplomatic personnel</b> (ambassador vs consul), name the <b>specific type</b> of diplomacy relevant to a question, and use Nigeria\'s own diplomatic history as concrete supporting evidence throughout.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is diplomacy generally considered to be, among instruments of international relations?',o:['The primary peaceful instrument','The most costly and violent instrument','An instrument used only by weak states','An instrument banned under international law'],a:0,w:'Diplomacy is generally considered the primary peaceful instrument of international relations.'},{q:'Who heads an embassy?',o:['An ambassador','A consul','A Secretary-General','A Prime Minister only'],a:0,w:'An ambassador heads an embassy.'},{q:'Which 1961 convention governs diplomatic immunity?',o:['The Vienna Convention','The Geneva Convention','The Montevideo Convention','The Treaty of Lagos'],a:0,w:'The Vienna Convention (1961) governs diplomatic immunity.'},{q:'Which US Secretary of State is associated with shuttle diplomacy?',o:['Henry Kissinger','Woodrow Wilson','Franklin Roosevelt','Colin Powell'],a:0,w:'Henry Kissinger is associated with shuttle diplomacy.'},{q:'What does a consul primarily focus on, unlike an ambassador?',o:['Practical services such as visas and citizen assistance','Only high-level treaty negotiations','Only military coordination','Only cultural festivals'],a:0,w:'A consul primarily focuses on practical services such as visas and citizen assistance, unlike an ambassador.'},{q:'Which historic Nigerian diplomatic campaign is a key example for this topic?',o:['Anti-apartheid diplomacy in the 1970s-80s','A campaign to join the Soviet Union','A campaign to rejoin British colonial rule','A campaign against ECOWAS'],a:0,w:'Nigeria\'s anti-apartheid diplomacy in the 1970s-80s is a key example for this topic.'},{q:'What term describes combining diplomacy with the credible threat of sanctions or force?',o:['"Coercive diplomacy"','"Pure diplomacy"','"Total isolationism"','"Unconditional surrender"'],a:0,w:'"Coercive diplomacy" describes combining diplomacy with the credible threat of sanctions or force.'},{q:'What should a strong WAEC essay on diplomacy always do, according to the final exam tips?',o:['Use Nigeria\'s own diplomatic history as concrete supporting evidence','Avoid mentioning Nigeria entirely','Only discuss ancient history','Only discuss European diplomacy'],a:0,w:'A strong essay should use Nigeria\'s own diplomatic history as concrete supporting evidence throughout.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
