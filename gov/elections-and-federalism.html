document.addEventListener('click',function(e){
  var el=e.target;

    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Federalism — Key Concepts',ACC,12,'middle',true));
var rows=[['Federalism','Division of power between central and regional (state/provincial) governments'],['Unitary state','Power concentrated at the centre; regions are subordinate','(UK, France)'],['Federal state','Power divided by constitution between levels','(Nigeria, USA, Germany)'],['Confederation','Loose union; central body is subordinate to states','(rare today)'],['Concurrent list','Powers shared by federal and state governments in Nigeria'],['Exclusive list','Powers held only by the federal government in Nigeria'],['Residual powers','Powers not listed — go to the states in Nigeria']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,30+i*30,460,24,CRM,LINE,1));o.push(T(90,44+i*30,r[0],ACC,8,'middle',true));o.push(T(240,44+i*30,r[1],'#555',7,'middle',false));o.push(T(400,44+i*30,r[2]||'','#999',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Nigeria\'s Federal Structure',ACC,12,'middle',true));
var rows=[['Federal Government','Presidency + National Assembly + Supreme Court'],['36 States + FCT','Governors + State Houses of Assembly + State High Courts'],['774 LGAs','Chairmen + Councillors + local courts'],['Exclusive list','Defence, foreign affairs, immigration, currency, customs'],['Concurrent list','Education, health, agriculture, labour (shared F+S)'],['Revenue allocation','Vertical: Federal 52.68%, States 26.72%, LGAs 20.60%']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(120,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ8(p){dQ2(p);}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Elections and Federalism — Summary',ACC,13,'middle',true));
var rows=[['Federalism','Division of power: Exclusive (federal only) + Concurrent (shared) + Residual (states)'],['Nigeria federal structure','3 tiers: Federal, 36 States + FCT, 774 LGAs'],['Revenue allocation','Federal 52.68%, States 26.72%, LGAs 20.60%; derivation principle'],['Advantages of federalism','Unity in diversity; decentralised power; accommodates ethnic diversity'],['Disadvantages','Inter-governmental conflict; fiscal disparities; weaker states'],['Elections','INEC; FPTP; presidential 25% rule; BVAS (2023)']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 ELE',ti:'What is Federalism?',su:'Define federalism and compare it with unitary and confederal systems.',steps:[
{lb:'Definition of federalism',dr:dQ1,ht:'<p><b>Federalism</b> is a system of government in which power is constitutionally divided between a central (federal/national) government and regional (state/provincial) governments, each of which is supreme within its own area of jurisdiction. Key features: (1) Constitutional division of powers — the constitution specifies which level has which powers. (2) Both levels are supreme within their designated areas. (3) Neither level can unilaterally abolish the other. (4) An independent judiciary arbitrates disputes between levels. Examples: Nigeria, USA, Germany, India, Canada, Australia. First modern federation: USA (1787).</p>'},
{lb:'Federalism vs Unitary vs Confederation',dr:dQ2,ht:'<p>Comparing forms of state: <b>Unitary state</b> — power concentrated at the centre; regional/local governments exist only at the centre\'s discretion and can be abolished by it; regions have only delegated powers. Examples: UK, France, Kenya, Senegal. <b>Federal state</b> — power constitutionally divided; neither level can abolish the other; each supreme in its area. Examples: Nigeria, USA, Germany, India. <b>Confederation</b> — loose union of states where the central body derives its powers from the states and can be overridden; states retain sovereignty. Example: pre-1787 USA, some argue EU resembles this. WAEC: know which countries are which system.</p>'},
{lb:'Nigeria\'s federal structure',dr:dQ1,ht:'<p>Nigeria is a federal republic. Three tiers: (1) <b>Federal Government</b> — President, National Assembly, Supreme Court; located in Abuja (FCT). (2) <b>36 States + FCT</b> — Governor, State House of Assembly, State High Court for each state. (3) <b>774 Local Government Areas (LGAs)</b> — Chairman, Councillors; SIEC conducts their elections. Nigeria\'s federalism has evolved: 1914 (amalgamation); 1954 (first genuine federal constitution — three regions); 1967 (12 states created by Gowon to counter Biafra); 1999 (current 36-state structure). Nigeria is often described as having an "over-centralised" federalism because of the dominance of federal revenue.</p>'},
{lb:'Distribution of powers in Nigeria',dr:dQ2,ht:'<p>Nigeria\'s 1999 Constitution distributes legislative powers through three lists: (1) <b>Exclusive Legislative List</b> (Second Schedule Part I) — 68 items that ONLY the federal government can legislate on: defence, foreign affairs, immigration, customs, currency, aviation, railways, nuclear energy, etc. (2) <b>Concurrent Legislative List</b> (Second Schedule Part II) — areas where BOTH federal and state can legislate: education, health, agriculture, labour, taxation, environment. Federal law prevails in case of conflict. (3) <b>Residual powers</b> — matters NOT on either list go to the states (land use within states, chieftaincy, etc.).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Federalism is a system where:',o:['Power is concentrated entirely in the central government','Power is divided by constitution between central and regional governments, each supreme in its own area','The central government can override all state decisions','States can leave the union at any time they choose'],a:2,w:'Federalism = constitutionally divided power between a central government and regional/state governments. Neither level can abolish the other; each is supreme in its designated area.'},{q:'A unitary state differs from a federal state in that:',o:['Unitary states are always smaller than federal states','In a unitary state, power is concentrated at the centre; regional governments exist only at the centre\'s discretion','Unitary states cannot have regional governments at all','Unitary states are always democracies while federal states can be authoritarian'],a:2,w:'In a UNITARY state, power is concentrated centrally. Regional/local governments exist only because the centre allows them, and the centre can abolish or override them. UK and France are unitary states.'},{q:'Nigeria\'s federal structure has how many tiers of government?',o:['Two — federal and state','Three — federal, state and local government','Four — federal, zonal, state and local','Five — federal, state, LGA, ward and village'],a:2,w:'Nigeria has THREE tiers: Federal Government (Abuja), 36 States + FCT, and 774 Local Government Areas (LGAs). Each tier has its own elected government and constitutional responsibilities.'},{q:'The Exclusive Legislative List in Nigeria\'s 1999 Constitution contains powers that:',o:['Are shared between federal and state governments','Only state governments can legislate on','Only the federal government can legislate on — states cannot make laws on these matters','Are reserved for the Supreme Court to administer'],a:3,w:'The Exclusive Legislative List (Second Schedule Part I) — 68 items only the federal government (National Assembly) can make laws on. These include defence, foreign affairs, currency, immigration, customs, aviation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 ELE',ti:'Revenue Allocation in Nigeria',su:'Examine how revenue is shared between the three tiers of government.',steps:[
{lb:'Importance of revenue allocation',dr:dQ2,ht:'<p><b>Revenue allocation</b> is the process of distributing national revenue (especially from oil) among the three tiers of government. It is one of the most contentious issues in Nigerian federalism. Why it matters: Nigerian states and LGAs depend heavily on federal allocations (from the Federation Account) rather than internally generated revenue. In 2023, oil revenue (from the Niger Delta) accounted for most federal income. The formula for sharing this revenue reflects national politics — more powerful states and regions lobby for higher shares. Revenue allocation is central to national unity: if groups feel cheated of "their" resources, it breeds separatist sentiment.</p>'},
{lb:'Current revenue allocation formula',dr:dQ2,ht:'<p>Nigeria\'s current revenue sharing formula (as of 2023): <b>Federal Government</b>: 52.68%. <b>State Governments</b>: 26.72%. <b>Local Government Councils</b>: 20.60%. Additionally: <b>Derivation principle</b> — states that produce resources (Niger Delta oil states) receive at least 13% of oil revenue directly. This acknowledges that resource-producing communities bear environmental costs and should benefit more. Before 2001 (when derivation was increased from 3% to 13%), Niger Delta states received very little from the oil extracted from their land — a major source of conflict and militancy in the region.</p>'},
{lb:'Principles of revenue allocation',dr:dQ1,ht:'<p>Principles guiding Nigeria\'s revenue allocation: (1) <b>Population</b> — states with more people get more. (2) <b>Equality of states</b> — each state gets a minimum equal share. (3) <b>Land mass and terrain</b> — larger, harder-to-govern states get more. (4) <b>Derivation</b> — resource-producing states get extra (currently 13%). (5) <b>Internally generated revenue</b> — states that tax themselves more effectively get more. (6) <b>Social development</b> — states with lower development indicators get more. The Revenue Mobilisation Allocation and Fiscal Commission (RMAFC) advises on the formula and it requires National Assembly approval to change.</p>'},
{lb:'Revenue allocation controversies',dr:dQ2,ht:'<p>Revenue allocation is perennially controversial in Nigeria: (1) <b>North vs South</b> — northern states tend to prefer population-based allocation (they have more people); southern states prefer derivation (they have more oil and other resources). (2) <b>Over-centralisation</b> — states depend on federal allocations instead of raising their own revenue (only Lagos significantly does). (3) <b>LGA autonomy</b> — state governors often divert LGA allocations, making the third tier ineffective. (4) <b>Resource control</b> — Niger Delta communities argue they should control oil on their land. These controversies reflect the deeper tensions in Nigerian federalism: between unity and diversity; between efficiency and equity.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The current revenue sharing formula gives the Federal Government approximately what percentage?',o:['20.60%','26.72%','52.68%','75.00%'],a:3,w:'The Federal Government receives approximately 52.68% of Federation Account revenues. States receive 26.72% and LGAs receive 20.60%. Additionally, oil-producing states receive at least 13% through the derivation principle.'},{q:'The "derivation principle" in Nigeria\'s revenue allocation means:',o:['Revenue is derived from taxes and not from natural resources','States with more people receive more revenue (population-based allocation)','States that produce oil and other natural resources receive at least 13% of the revenue generated from those resources','The federal government derives all its revenue from states'],a:3,w:'Derivation principle — resource-producing states (primarily Niger Delta oil states) receive at least 13% of the revenue generated from resources in their territory. This acknowledges environmental costs and the fairness of local benefit.'},{q:'Why do Nigerian states depend heavily on federal revenue allocation rather than internally generated revenue?',o:['It is constitutionally prohibited for states to raise their own taxes','States are too small and poor to generate their own revenue','Heavy reliance on oil revenue at the federal level created a culture of dependence; states have not fully developed their own tax and revenue capacity','All Nigerian state economies are too underdeveloped to generate tax revenue'],a:3,w:'Nigeria\'s oil wealth concentrated revenue at the federal level and reduced the pressure on states to develop independent revenue sources. Most states spend only 10-20% of their budget from internally generated revenue (IGR); Lagos is a notable exception.'},{q:'Which body recommends changes to Nigeria\'s revenue sharing formula?',o:['The Federal Ministry of Finance','The Revenue Mobilisation Allocation and Fiscal Commission (RMAFC)','The National Economic Council (NEC)','The Central Bank of Nigeria (CBN)'],a:2,w:'The RMAFC (Revenue Mobilisation Allocation and Fiscal Commission) is the constitutional body that reviews and recommends changes to the revenue allocation formula. Changes require National Assembly approval.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 ELE',ti:'Advantages and Disadvantages of Federalism',su:'Evaluate the merits and demerits of federalism, with reference to Nigeria.',steps:[
{lb:'Advantages of federalism',dr:dQ3,ht:'<p>Advantages of federalism: (1) <b>Unity in diversity</b> — accommodates a diverse society (Nigeria\'s 250+ ethnic groups) within one state. (2) <b>Decentralisation</b> — power distributed; prevents centralised tyranny. (3) <b>Local governance</b> — states can respond to local needs and priorities. (4) <b>Experimentation</b> — states can try different policies; successful ones can be adopted nationally ("laboratories of democracy"). (5) <b>Citizens\' choice</b> — people can vote with their feet (move to states with better policies). (6) <b>Security against tyranny</b> — if the central government becomes oppressive, states provide a check. (7) <b>Participation</b> — more levels means more opportunities to participate.</p>'},
{lb:'Disadvantages of federalism',dr:dQ4,ht:'<p>Disadvantages of federalism: (1) <b>Complexity</b> — multiple governments confuse citizens and create coordination problems. (2) <b>Duplication</b> — different levels may duplicate services and waste resources. (3) <b>Inequality</b> — wealthier states can provide better services than poorer ones; citizens receive different levels of services depending on their state. (4) <b>Inter-governmental conflict</b> — federal-state disputes can paralyse governance. (5) <b>Secessionist tendencies</b> — strong regional identities can become separatist (e.g. Biafra in Nigeria 1967-70). (6) <b>Revenue disputes</b> — as seen in Nigeria, revenue allocation is constantly contested. (7) <b>Weaker national identity</b> — strong state identities may weaken national cohesion.</p>'},
{lb:'Nigerian federalism in practice — strengths',dr:dQ3,ht:'<p>Strengths of Nigerian federalism in practice: (1) Accommodates 250+ ethnic groups and multiple religions within one polity. (2) Allows states to experiment: Lagos has pioneered urban governance reforms; Kaduna has implemented health insurance; some states have expanded social protection. (3) Provides political space for ethnic minorities who might be marginalised in a unitary state. (4) The Revenue Mobilisation system ensures some redistribution from wealthier to poorer states. (5) State governments provide the main channel of democratic accountability for most Nigerians (state elections are often more directly relevant than federal elections).</p>'},
{lb:'Nigerian federalism in practice — weaknesses',dr:dQ4,ht:'<p>Weaknesses of Nigerian federalism: (1) <b>Over-centralisation</b> — federal government controls most revenue (52.68%) and dominates through the Exclusive List. (2) <b>Revenue dependence</b> — states depend heavily on federal allocations, reducing incentive for independent development. (3) <b>LGA weaknesses</b> — the third tier is largely dysfunctional; allocations diverted by governors; elections often manipulated. (4) <b>Federal Character vs merit</b> — geographic representation sometimes sacrifices quality. (5) <b>Resource control conflict</b> — Niger Delta communities feel exploited; militancy and pipeline vandalism have followed. (6) Separatist movements (IPOB in the southeast; Oduduwa Republic advocates in the southwest) reflect unresolved federal tensions.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Which of these is an ADVANTAGE of federalism?',o:['It always produces more efficient government than unitary systems','It accommodates diversity — allowing different ethnic/religious groups to coexist within one country','It eliminates inter-governmental conflict completely','It gives citizens identical levels of public services regardless of their state'],a:2,w:'Accommodating diversity is the most important advantage of federalism for countries like Nigeria. It allows 250+ ethnic groups to maintain some cultural and governmental autonomy within one united state.'},{q:'Which of these is a DISADVANTAGE of Nigerian federalism in practice?',o:['Nigeria has too many ethnic groups for any governance system to work','Over-centralisation — the federal government controls most revenue, reducing state autonomy and creating dependence','States have too much power and frequently override federal decisions','Too many international organisations interfere in Nigeria\'s federal system'],a:2,w:'Over-centralisation is the most commonly cited weakness of Nigerian federalism: the federal government controls ~52.68% of revenue; states have limited tax capacity; the Exclusive List gives extensive powers to the centre.'},{q:'The "laboratories of democracy" argument for federalism suggests that:',o:['Each state should build its own democratic institutions independently','States can experiment with different policies; successful experiments can be adopted nationally','Democracy should be tested in small states before being applied nationally','States serve as training grounds for politicians before they enter federal government'],a:2,w:'"Laboratories of democracy" — US Justice Louis Brandeis\'s phrase arguing that federalism allows states to try new approaches to social/economic problems. Successful state experiments (e.g. healthcare reform in Massachusetts) can then be adopted nationally.'},{q:'Nigeria\'s experience with Biafra (1967-70) illustrates which risk of federalism?',o:['That federalism always leads to excessive central government power','That resource-rich regions will always dominate poorer ones','That strong regional identities in a federal system can become secessionist if groups feel marginalised','That federal systems always collapse within 20 years of establishment'],a:3,w:'Biafra — the Igbo-led secession attempt (1967-70) — illustrates how strong regional/ethnic identity in a federal system can become secessionist when groups feel politically and economically marginalised. This led to Nigeria\'s civil war.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 ELE',ti:'Nigeria\'s Federal History',su:'Examine the evolution of Nigeria\'s federal system.',steps:[
{lb:'Colonial origins (1914-1960)',dr:dQ4,ht:'<p>Nigeria\'s federal system emerged from British colonial rule: 1914 — Amalgamation of Northern and Southern Protectorates into one colonial entity. 1946 — Richards Constitution introduced three regions (North, West, East). 1951 — Macpherson Constitution expanded regional powers. 1954 — <b>Lyttleton Constitution</b> — Nigeria\'s first genuinely federal constitution, with three regions: Northern, Western and Eastern. 1957 — Eastern and Western regions gained self-government. 1958 — Northern Region gained self-government. 1960 — Independence as a federation of three regions. 1963 — Republic; Mid-Western Region created (later became Edo and Delta states) — the fourth region.</p>'},
{lb:'The military and state creation',dr:dQ4,ht:'<p>The military era fundamentally restructured Nigerian federalism: 1967 — General Yakubu Gowon created 12 states from the 4 regions to: (1) pre-empt Biafra\'s secession by creating non-Igbo minority states in the east; (2) weaken the three dominant ethno-regional blocs. 1976 — Murtala/Obasanjo regime created 19 states. 1987 — Babangida created 21 states. 1991 — Babangida created 30 states. 1996 — Abacha created 36 states (current number). The multiplication of states from 4 regions to 36 states fragmented ethnic power bases but also created more viable units for governance. Each state creation was politically motivated — states were created to reward loyalists and divide opposition.</p>'},
{lb:'The 1999 Constitution and current federal structure',dr:dQ3,ht:'<p>Nigeria\'s 1999 Constitution (as amended) establishes: 36 states + FCT, 774 LGAs, three-tier federal system. Key constitutional provisions: Section 2 — Nigeria is "one indivisible and indissoluble sovereign state." Section 3 — lists the 36 states. Second Schedule — Exclusive and Concurrent Legislative Lists. Third Schedule — creates federal commissions including RMAFC. First Schedule — areas within each state and LGAs. The constitution has been amended several times since 1999 (most significantly: 1st-5th alteration acts). Calls for a new constitution through a Sovereign National Conference (CONFAB) have been ongoing since the 1990s — arguing the 1999 constitution was military-imposed and lacks popular legitimacy.</p>'},
{lb:'Federalism and national unity',dr:dQ4,ht:'<p>Federalism and national unity in Nigeria: Nigeria\'s federal structure was designed to manage its diversity and prevent any one group from dominating. Mechanisms for unity: Federal Character Principle; NYSC; Unity Schools; National Council of State. Challenges to unity: separatist movements (IPOB/Biafra in southeast; Oduduwa Republic in southwest); Middle Belt conflicts; Boko Haram/ISWAP in northeast. Key question: is Nigeria\'s federal system robust enough to maintain unity while accommodating diversity? Arguments YES: survived civil war; 60+ years of independence; peaceful 2015 power transfer. Arguments NO: over-centralisation; resource control conflicts; ethnic mobilisation in elections; military interventions.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Nigeria\'s first genuinely federal constitution was the:',o:['Richards Constitution (1946)','Macpherson Constitution (1951)','Lyttleton Constitution (1954)','Independence Constitution (1960)'],a:3,w:'The Lyttleton Constitution (1954) was Nigeria\'s first genuinely federal constitution — it established the three regions (Northern, Western, Eastern) as self-governing entities within a federal structure, with a federal government at the centre.'},{q:'General Gowon created 12 states in 1967 primarily to:',o:['Reward military officers with new governorships','Prepare Nigeria for independence from Britain','Pre-empt Biafra\'s secession by creating minority states in the east and weakening the three dominant regional blocs','Increase the number of senators in the Senate'],a:3,w:'Gowon\'s 1967 state creation was primarily strategic: creating minority states in the east broke Igbo dominance in that region, pre-empting the Biafran secession claim to represent all easterners. It also weakened all three dominant regional ethno-political blocs.'},{q:'Nigeria currently has how many states?',o:['19 states','30 states','36 states plus the Federal Capital Territory','40 states'],a:3,w:'Nigeria currently has 36 states plus the Federal Capital Territory (Abuja/FCT). The current 36-state structure was created in 1996 during Abacha\'s military government and was retained by the 1999 Constitution.'},{q:'Section 2 of Nigeria\'s 1999 Constitution declares Nigeria to be:',o:['A democratic socialist republic','A multi-ethnic federation of 36 equal and sovereign states','One indivisible and indissoluble sovereign state','A constitutional monarchy with a ceremonial president'],a:3,w:'Section 2(1) — "Nigeria is one indivisible and indissoluble sovereign state to be known by the name of the Federal Republic of Nigeria." This explicitly precludes secession by any state or group.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 ELE',ti:'WAEC Prep — Elections and Federalism',su:'Practise WAEC-style questions on elections and federalism.',steps:[
{lb:'WAEC essay structure — federalism',dr:dQ5,ht:'<p>For WAEC questions on federalism: (1) Define federalism. (2) Features (constitutional division; both levels supreme in their areas; independent judiciary; written constitution). (3) Advantages (diversity accommodation; decentralisation; experimentation; checks on tyranny). (4) Disadvantages (complexity; inequality; inter-governmental conflict; secession risk). (5) Compare with unitary state. (6) Nigeria-specific application (3 tiers; 36 states; exclusive/concurrent lists; revenue allocation; over-centralisation). (7) Evaluate Nigerian federalism — what works and what needs reform.</p>'},
{lb:'WAEC essay structure — elections',dr:dQ5,ht:'<p>For WAEC questions on elections: (1) Define election. (2) Types of elections in Nigeria (presidential, gubernatorial, NASS, SHAS, LGA). (3) Electoral system (FPTP; presidential 25% rule). (4) INEC (role; functions; independence; challenges). (5) Electoral malpractice (types; consequences). (6) Electoral reforms (BVAS; IReV; 2022 Electoral Act). (7) Evaluate — progress made; remaining challenges. Key Nigerian examples: 2015 power transfer (first peaceful transfer); 2023 election (BVAS used; significant Labour Party performance; disputed presidential result).</p>'},
{lb:'Key terms comparison',dr:dQ1,ht:'<p>Quick comparison: Federal vs Unitary vs Confederate. Exclusive list (federal only: defence, forex, aviation) vs Concurrent list (both: education, health) vs Residual (states: chieftaincy, land). Revenue: federal 52.68%, states 26.72%, LGAs 20.60%, derivation 13% for oil producers. INEC (federal elections) vs SIEC (LGA elections). FPTP (most votes wins) vs PR (proportional). Presidential 25% rule (most votes + 25% in 24 states). BVAS (biometric verification, 2023). Electoral malpractice (vote buying, ballot snatching, rigging). Party systems: one-party, two-party, multi-party.</p>'},
{lb:'Common WAEC mistakes',dr:dQ2,ht:'<p>Avoid: Saying the Exclusive List is shared with states (it is federal only). Saying the Concurrent List is only for the federal government (it is shared). Saying Nigeria has 37 states (it has 36 states + FCT). Confusing INEC (federal) with SIEC (local government). Saying the presidential election only requires the most votes (must also meet the 25% rule). Confusing derivation (13% extra for oil-producing states) with the general revenue sharing formula. Saying unitary and federal systems are the same. Not giving advantages AND disadvantages of federalism (WAEC expects balanced assessment).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Which of the following is on the Concurrent Legislative List in Nigeria?',o:['Defence (federal only)','Foreign affairs (federal only)','Education (both federal and state governments can make laws)','Immigration (federal only)'],a:3,w:'Education is on the Concurrent List (Second Schedule Part II) — both the federal government and state governments can make laws on education. Defence, foreign affairs and immigration are on the Exclusive List (federal only).'},{q:'Nigeria\'s derivation principle gives oil-producing states:',o:['100% of the oil revenue from their territory','50% of the oil revenue from their territory','At least 13% of the oil revenue generated from their territory','Nothing — all oil revenue goes directly to the federation account'],a:3,w:'The derivation principle gives oil-producing states (primarily Niger Delta states) at least 13% of the oil revenue generated within their territory. This was increased from 3% to 13% in the 2001 revenue allocation formula.'},{q:'For a Nigerian presidential candidate to win in the first round (without a run-off), they must:',o:['Get more than 50% of votes nationwide','Get the most votes nationwide AND at least 25% of votes in at least 24 of the 36 states','Win at least 30 of the 36 states regardless of the total vote','Get more votes than all other candidates combined in each geopolitical zone'],a:2,w:'Section 134 of the 1999 Constitution: presidential winner must get the highest number of votes AND not less than one-quarter (25%) of votes in at least two-thirds of states (24 out of 36). Both conditions must be met.'},{q:'Which body conducts LOCAL GOVERNMENT elections in Nigeria (not federal or state elections)?',o:['INEC (Independent National Electoral Commission)','The National Assembly Elections Committee','SIECs (State Independent Electoral Commissions)','The Federal Ministry of Local Government'],a:3,w:'SIECs (State Independent Electoral Commissions) are created by each state government to conduct local government elections. INEC conducts presidential, gubernatorial and National Assembly elections under the 1999 Constitution.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 ELE',ti:'Further Practice — Federalism and Elections',su:'More practice on elections and federalism topics.',steps:[
{lb:'Devolution vs federalism',dr:dQ6,ht:'<p><b>Devolution</b> is the transfer of powers from central government to regional governments, but WITHOUT creating a fully federal system — the centre retains sovereignty and can take back the devolved powers. Example: UK — Scotland, Wales and Northern Ireland have devolved parliaments/assemblies, but Westminster remains sovereign and could theoretically revoke them. In a federal system, the states\' powers cannot be unilaterally revoked by the centre. Nigeria has a federal system — not devolution. But in practice, Nigeria\'s federalism is sometimes called "quasi-unitary" because the centre dominates revenue and the military historically overrode states.</p>'},
{lb:'Intergovernmental relations in Nigeria',dr:dQ6,ht:'<p>Intergovernmental relations are the formal and informal interactions between the three tiers of government. Formal bodies: (1) <b>National Council of State</b> — President + all Governors + former heads of state. (2) <b>National Economic Council (NEC)</b> — VP + all 36 Governors; coordinates economic policy. (3) <b>Joint Account Committees</b> — coordinate state-LGA revenue sharing. (4) <b>State-Federal Revenue Sharing</b> through FAAC (Federal Account Allocation Committee) — monthly meetings to distribute Federation Account revenues. Informal: presidential consultations with governors; party mechanisms. Federal-state conflict is common: e.g. RMAFC formula disputes; security responsibilities.</p>'},
{lb:'Electoral calendar in Nigeria',dr:dQ6,ht:'<p>Nigeria\'s electoral calendar (every 4 years): Presidential and NASS elections together (e.g. 2023: February). Gubernatorial and State House of Assembly elections (e.g. 2023: March, in most states). Off-cycle state elections: some states hold governorship elections in different years (Anambra, Edo, Ekiti, Osun, Kogi — due to earlier swearing-in dates). Local Government elections: conducted by SIECs on state-determined schedules. The bunching of elections (presidential before governorship) means national results can affect state outcomes (coattail effect). INEC\'s electoral timetable is released well in advance to allow preparation.</p>'},
{lb:'Electoral reforms — 2022 Electoral Act',dr:dQ6,ht:'<p>Key features of the Electoral Act 2022: (1) BVAS — mandatory biometric voter accreditation at polling units. (2) IReV — INEC Results Viewing Portal — polling unit results uploaded in real time and publicly viewable online. (3) Electronic transmission of results — partially implemented (results electronically transmitted to collation centres). (4) Strengthened penalties for electoral offences. (5) Expanded timeline for pre-election activities. (6) Provisions for diaspora voting and voting for persons with disabilities (further work needed). The 2022 Act was a significant reform effort; its implementation in 2023 was partial but improved transparency in many areas.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Devolution differs from federalism in that:',o:['Devolution creates more powerful regional governments than federalism','In devolution, the central government retains sovereignty and can revoke regional powers; in federalism, states have constitutionally protected powers that cannot be unilaterally revoked','Devolution is only possible in very large countries','Federalism always involves only three levels of government while devolution can involve more'],a:2,w:'Devolution (UK model) — centre grants powers to regions but retains sovereignty; can theoretically take them back. Federalism (Nigeria/USA model) — state powers are constitutionally protected; the centre cannot unilaterally abolish or override them.'},{q:'The Federal Account Allocation Committee (FAAC) in Nigeria meets to:',o:['Oversee the federal budget process and approve executive expenditure','Review and recommend changes to the revenue sharing formula','Monthly distribute Federation Account revenues among federal, state and local governments','Audit the accounts of the federal government and all states'],a:3,w:'FAAC meets monthly to distribute revenues in the Federation Account among the three tiers of government (federal, state, LGA) according to the approved revenue sharing formula.'},{q:'Nigeria\'s IReV (INEC Result Viewing Portal) is designed to:',o:['Allow voters to check if their names are on the voter register','Allow voters to check their ballot paper has been correctly counted','Allow the public to view polling unit results in real time, improving transparency and reducing result manipulation','Allow parties to submit candidate names for registration online'],a:3,w:'IReV allows anyone with internet access to view the scanned results form from each polling unit in real time as they are uploaded by polling officials. This makes it harder to manipulate results at collation centres.'},{q:'The National Economic Council (NEC) in Nigeria is chaired by:',o:['The President of Nigeria','The Chief Justice of Nigeria','The President of the Senate','The Vice-President of Nigeria'],a:4,w:'NEC is chaired by the Vice-President and consists of all 36 State Governors. It coordinates economic planning and policy among federal and state governments — a key intergovernmental body.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 ELE',ti:'Deep Revision — Federalism in Nigeria',su:'Advanced revision on Nigerian federalism.',steps:[
{lb:'Resource control debate',dr:dQ7,ht:'<p>The <b>resource control</b> debate is one of Nigeria\'s most persistent federal issues. Niger Delta states (Rivers, Delta, Bayelsa, Akwa Ibom, Cross River, Edo) produce virtually all of Nigeria\'s oil revenue but receive only 13% through derivation, while sharing the rest with all states. Advocates for resource control argue: (1) The communities bearing the environmental cost (oil spills, gas flaring, land degradation) should benefit more. (2) 13% is insufficient given the damage done. (3) The current system incentivises the federal government to extract as much as possible with little accountability to local communities. Opponents argue: (1) Oil is a national resource; (2) All Nigerians should benefit; (3) Higher derivation would widen inequality between states.</p>'},
{lb:'The 2014 National Conference',dr:dQ7,ht:'<p>In 2014, President Jonathan convened a National Conference (CONFAB) to discuss restructuring Nigeria\'s federation. Key recommendations: (1) Return to a more confederal/regional system with six geopolitical zones as federating units. (2) Increase derivation to 18%. (3) Devolve more powers to states. (4) Create a separate legislature for each geopolitical zone. (5) Reduce the items on the Exclusive List, giving more powers to states. These recommendations were never implemented — Jonathan lost the 2015 election before acting on them. The restructuring debate continues: some advocate true federalism (more power to states); others argue Nigeria should remain as is to preserve unity.</p>'},
{lb:'Fiscal federalism and development',dr:dQ7,ht:'<p><b>Fiscal federalism</b> refers to the financial aspects of the federal relationship — how revenue is raised and distributed. Nigeria\'s fiscal federalism challenges: (1) Overdependence on oil revenue — makes all tiers vulnerable to oil price fluctuations. (2) States\' low Internally Generated Revenue (IGR) — most states cannot survive without federal allocations. (3) LGA dysfunction — state governors control LGA funds in most states, making local government ineffective. (4) Tax administration overlap — both federal and state governments levy taxes, creating complexity. (5) Tax policy power — federal government dominates taxation (Exclusive List: customs, import duties, company tax). True fiscal federalism would require states to raise more of their own revenue and bear more accountability to their citizens.</p>'},
{lb:'Calls for restructuring',dr:dQ7,ht:'<p>Calls for "restructuring" Nigeria\'s federation have intensified since 2015. What various groups mean by restructuring: South/Southwest — devolve more powers and revenue to states; states should control their own resources and security. North — current federal structure should be maintained; states should develop their own capacities without changing the constitutional arrangement. Southeast (IPOB and others) — self-determination or outright separation; the 1999 constitution was imposed by the military without popular consent. Middle Belt — equal treatment; protection from Fulani herders; autonomy from northern dominance. Every group sees restructuring differently, reflecting the deep diversity of interests in Nigeria\'s federal system.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'The resource control debate in Nigeria primarily concerns:',o:['Which political party should control the federal Ministry of Petroleum','Whether Niger Delta oil-producing communities should receive a larger share of oil revenue given the environmental costs they bear','Whether Nigeria should sell all its oil reserves to foreign companies','Whether the president or the governor has the right to appoint the heads of oil companies'],a:2,w:'Resource control debate — Niger Delta communities argue they should receive more than the current 13% derivation, given that: (a) they produce Nigeria\'s oil wealth; (b) their communities suffer oil spills, gas flaring and land degradation; (c) the current formula is unfair.'},{q:'The key reason why most Nigerian states cannot survive without federal allocations is:',o:['State governments are constitutionally prohibited from raising their own taxes','Nigeria\'s oil wealth created a culture of dependence on federal revenue, reducing incentives for states to develop their own tax bases and economic activities','Most Nigerian states are geographically too small to have independent economies','The World Bank has prohibited states from levying independent taxes as a condition of its loans'],a:2,w:'Oil revenue created federal dominance of Nigerian finances. States receive allocations without needing to develop their tax capacity. Most Nigerian states (except Lagos) have very low Internally Generated Revenue (IGR) — often below 20% of their budgets.'},{q:'"Fiscal federalism" refers to:',o:['The system by which the military controls federal finances','The financial aspects of federalism — how revenue is raised, distributed and spent across the different tiers of government','The policy of reducing Nigeria\'s dependence on oil revenue','The power of the Federal Ministry of Finance to oversee all government accounts'],a:2,w:'Fiscal federalism refers to the financial dimensions of intergovernmental relations: who raises what taxes, how revenue is distributed, what each tier is responsible for financing, and how fiscal imbalances are addressed.'},{q:'What year did Nigeria\'s National Conference (CONFAB) take place, and what happened to its recommendations?',o:['2011 — recommendations were implemented by President Jonathan in 2012','2014 — recommendations were never implemented; Jonathan lost the 2015 election before acting on them','2017 — recommendations were implemented by President Buhari in 2019','2019 — recommendations are still under review by the National Assembly'],a:2,w:'The 2014 National Conference produced 600+ recommendations on restructuring Nigeria\'s federal system. President Jonathan lost the 2015 election to Buhari, and the new administration did not implement the CONFAB recommendations. The restructuring debate continues.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 ELE',ti:'Election Administration in Detail',su:'Examine the details of election administration in Nigeria.',steps:[
{lb:'Pre-election activities',dr:dQ8,ht:'<p>Pre-election activities by INEC: (1) Voter registration — citizens register to obtain Permanent Voter Cards (PVCs). (2) Voter education — public campaigns on voting procedures, rights and importance. (3) Delimitation — drawing constituency boundaries (must be reviewed every 10 years after census). (4) Party registration — reviewing and registering political parties. (5) Candidate nomination monitoring — ensuring parties follow internal democratic processes. (6) Recruitment and training of electoral officers. (7) Procurement of materials: BVAS machines, ballot papers, result forms (forms EC8A, EC8B, EC8C etc.). (8) Security planning — coordinating with police, military and DSS. Each step is critical to the credibility of the election.</p>'},
{lb:'Election day procedures',dr:dQ8,ht:'<p>Election day procedure in Nigeria: (1) Polling units open at 8am; close at 2pm (or whenever the last person in the queue has voted). (2) Voters are accredited using BVAS — fingerprint or facial recognition. (3) Voters receive ballot papers and vote secretly. (4) Votes counted at the polling unit by the Presiding Officer; agents and observers present. (5) Results recorded on Form EC8A (polling unit results). (6) Signed copies given to party agents; results uploaded to IReV. (7) Results collated at ward, LGA, state and national levels. (8) INEC Returning Officer announces the winner at each level. Irregularities can be challenged at Electoral Petition Tribunals.</p>'},
{lb:'Electoral petition tribunals',dr:dQ8,ht:'<p>Electoral petition tribunals are part of Nigeria\'s judicial arm — specialised courts that hear challenges to election results: (1) The Tribunal for Governorship and NASS elections is the State/Federal High Court or Court of Appeal (depending on the election). (2) The Presidential Election Petition Tribunal is the Court of Appeal sitting as the PEPT. (3) Appeals from the PEPT go to the Supreme Court. (4) Petitions must be filed within 21 days of the declaration of results. (5) Grounds: malpractice; disqualification of a candidate; corrupt practices; non-compliance with electoral law. The 2023 presidential election petition (Atiku and Obi vs INEC/Tinubu) was a major case decided by the Supreme Court.</p>'},
{lb:'Strengthening elections',dr:dQ8,ht:'<p>How to strengthen Nigerian elections: (1) Strengthen INEC independence — secure funding; protect INEC from political interference. (2) Full implementation of BVAS and IReV. (3) Electronic transmission of results — end analogue manipulation. (4) Stronger penalties for vote buying. (5) Civic education — reduce voter apathy. (6) Civil society observation (TMG, Yiaga Africa). (7) International observation (EU, AU, ECOWAS, Carter Center). (8) Campaign finance reform — limit the influence of money. (9) Media freedom — protect journalists reporting on elections. (10) Security sector reform — prevent military and police intimidation. For WAEC: know at least 5 ways to improve elections, with explanation.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Form EC8A in Nigeria\'s electoral process is:',o:['The form on which parties submit their list of candidates','The form on which polling unit results are recorded and publicly declared','The form voters complete to register for their Permanent Voter Card','The form INEC uses to report electoral malpractice to the police'],a:2,w:'Form EC8A is the Polling Unit Result Sheet — the most important electoral document at the basic level. It records the votes cast at each polling unit. Signed copies are given to party agents and the results are uploaded to IReV.'},{q:'An electoral petition in Nigeria must be filed within how many days of the declaration of results?',o:['7 days','14 days','21 days','30 days'],a:3,w:'Under Nigeria\'s Electoral Act, a petitioner must file their election petition within 21 days of the declaration of the result being challenged. Missing this deadline means the petition is struck out as time-barred.'},{q:'The Presidential Election Petition Tribunal (PEPT) in Nigeria is the:',o:['Federal High Court sitting as a special tribunal','Court of Appeal sitting in its special jurisdiction as the tribunal for presidential elections','Supreme Court sitting as a court of first instance','A special tribunal established by INEC for each election'],a:2,w:'The PEPT is the Court of Appeal sitting specially to hear petitions challenging presidential election results. Appeals from the PEPT go directly to the Supreme Court, which is the final arbiter.'},{q:'The International observation of Nigerian elections by groups like the EU, African Union and Carter Center primarily serves to:',o:['Invalidate elections that international observers deem to be not credible','Independently assess electoral credibility and deter malpractice through visibility and reporting','Fund INEC\'s operations when the federal government does not provide sufficient budget','Train INEC officials in international best practices for electoral administration'],a:2,w:'International observers independently assess election credibility and deter malpractice through their presence, visibility and subsequent reports. They do not have power to invalidate elections — that is the role of domestic courts.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 ELE',ti:'WAEC Prep — Final Practice',su:'Final advanced WAEC preparation on elections and federalism.',steps:[
{lb:'Essay structure templates',dr:dQ9,ht:'<p>WAEC essay: "Examine the merits and demerits of federalism as practised in Nigeria": (1) Define federalism. (2) Features of Nigerian federalism (3 tiers; exclusive/concurrent/residual; written constitution; revenue allocation). (3) Merits: unity in diversity (250+ groups); decentralisation; state experimentation; checks on tyranny. (4) Demerits: over-centralisation; revenue dependence; LGA dysfunction; resource control conflict; secession risk. (5) Assessment: has Nigerian federalism worked? Point to 2015 democratic transfer as evidence of stability; point to IPOB/separatist movements as evidence of unresolved tensions. (6) Reform proposals: restructuring; increased derivation; stronger state revenue autonomy. (7) Conclusion.</p>'},
{lb:'Essay structure — elections',dr:dQ9,ht:'<p>WAEC essay: "Discuss the role of INEC in Nigeria\'s electoral system": (1) Define INEC and its constitutional basis (Section 15, Third Schedule). (2) Functions: voter registration; constituency delimitation; party registration; conducting elections; announcing results. (3) Powers: deregister parties; discipline electoral officers; issue electoral guidelines. (4) Challenges: electoral violence; logistics; result manipulation; funding inadequacy; politicisation. (5) Reforms: BVAS (2023); IReV; 2022 Electoral Act; independence strengthening. (6) Assessment: has INEC improved? Credit 2015, 2019, 2023 gradual improvements; note ongoing challenges. (7) Conclusion.</p>'},
{lb:'Key numbers for WAEC',dr:dQ9,ht:'<p>Key numbers to know: 36 states + FCT. 774 LGAs. 109 senators (3 per state + 1 FCT). 360 House of Representatives members. 2 × 4-year presidential terms maximum. 25% in 24 states for presidential 25% rule. 52.68% federal share; 26.72% state share; 20.60% LGA share; 13% minimum derivation for oil states. 21 days to file electoral petition. 4 year election cycle. 1999 Constitution (current). 2022 Electoral Act (current). 1954 Lyttleton Constitution (first federal). 1914 Amalgamation. 1960 Independence. 1967: 12 states created. 1976: 19 states. 1991: 30 states. 1996: 36 states (current).</p>'},
{lb:'Common exam mistakes',dr:dQ1,ht:'<p>Common WAEC mistakes on elections and federalism: Saying Nigeria has 37 states. Confusing Exclusive List (federal only) with Concurrent (shared). Saying INEC conducts LGA elections (SIECs do). Saying the presidential winner just needs the most votes (must also have 25% in 24 states). Confusing the Court of Appeal (PEPT) with the Supreme Court (hears PEPT appeals). Forgetting 2015 was Nigeria\'s first democratic power transfer between parties. Not giving both advantages AND disadvantages of federalism. Saying federal character means equal representation (it means equitable/proportional, not equal). Not mentioning derivation principle when discussing revenue allocation.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'The 1954 Lyttleton Constitution is significant in Nigerian federal history because:',o:['It was the first constitution written by Nigerians without British involvement','It was Nigeria\'s first genuinely federal constitution, establishing three self-governing regions','It created the 36-state structure that Nigeria still uses today','It introduced universal adult suffrage for the first time in Nigeria'],a:2,w:'The Lyttleton Constitution (1954) established Nigeria\'s first genuinely federal structure, with three self-governing regions (Northern, Western, Eastern) within a federal framework. It is the foundation of Nigerian federalism.'},{q:'Under Nigeria\'s revenue allocation formula, what percentage do the 774 Local Government Areas (LGAs) collectively receive from the Federation Account?',o:['13% (same as the derivation percentage for oil states)','20.60%','26.72%','52.68%'],a:2,w:'The 774 LGAs collectively receive 20.60% of Federation Account revenues under the current sharing formula. This is often the most vulnerable allocation — state governors frequently divert LGA funds.'},{q:'The "restructuring" debate in Nigeria primarily concerns:',o:['Whether Nigeria should become a unitary state','How Nigeria\'s federal system should be reformed — particularly devolving more powers and revenue to states and restructuring the three-tier system','Whether to reduce the number of states from 36 to 6 geopolitical zones','Whether to abolish the Local Government system and create a two-tier federal system'],a:2,w:'Restructuring advocates argue for devolving more powers and revenue to states, giving states more autonomy, and possibly reorganising the federation around the 6 geopolitical zones rather than 36 states.'},{q:'Form EC8A must be signed by the Presiding Officer and party agents to be valid. What does this procedure achieve?',o:['It allows INEC to identify which polling officer is responsible if fraud is discovered','It ensures all parties accept the results before leaving the polling unit, reducing manipulation and providing witnesses to the official count','It replaces the need for observers from civil society and international bodies','It allows losing parties to automatically reject the results by refusing to sign'],a:2,w:'Requiring signatures from party agents at the polling unit level means there are multiple witnesses to the count. Copies given to party agents allow them to check whether results are later altered at collation centres — a key anti-fraud measure.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 ELE',ti:'Mixed Revision — Elections and Federalism',su:'Integrated final revision across all GOV-ELE-09 topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Federalism: division of power between central and regional governments by constitution. Features: constitutional basis; both levels supreme in their areas; independent judiciary; written constitution. Types: federal (Nigeria), unitary (UK, France), confederal (historical). Nigerian federalism: 3 tiers (Federal, 36 states + FCT, 774 LGAs); Exclusive List (federal only: 68 items); Concurrent List (shared); Residual (states). Revenue: 52.68%/26.72%/20.60%; derivation 13% for oil states. History: 1914 amalgamation → 1954 Lyttleton (first federal) → 1960 independence → 1967 (12 states) → 1996 (36 states) → 1999 Constitution. Elections: INEC; FPTP; 25% rule; BVAS; IReV; 2022 Electoral Act.</p>'},
{lb:'Advantages and disadvantages — final review',dr:dQ10,ht:'<p>Federalism advantages: unity in diversity; decentralisation; experimentation; checks on tyranny; more participation levels. Disadvantages: complexity; duplication; inequality between states; inter-governmental conflict; secession risk; over-centralisation in Nigeria. Nigerian federalism specific strengths: accommodates diversity; 2015 democratic transfer. Specific weaknesses: state revenue dependence; LGA dysfunction; resource control conflict; separatist movements (IPOB). Elections: INEC strengthened by BVAS and IReV (2023); first democratic transfer 2015; challenges remain: vote buying, voter apathy, results disputes, violence. 2022 Electoral Act improved but not fully implemented.</p>'},
{lb:'Comparing federal and unitary',dr:dQ1,ht:'<p>Federal vs Unitary comparison: Feature | Federal | Unitary. Division of power: constitutionally protected | central grants/revokes. Regional powers: independent | delegated. Constitution: usually written and rigid | can be unwritten/flexible. Examples: Nigeria, USA, Germany | UK, France, Kenya. Centre can abolish regions: NO | YES. Suits: diverse, large countries | homogeneous, smaller countries. Advantages over unitary: accommodates diversity better. Disadvantages vs unitary: more complex; more expensive; potential deadlock. WAEC questions often ask you to compare — know these distinctions clearly with examples for each system.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final tips: Know federalism definition, features, advantages and disadvantages with Nigerian examples. Know the three lists (Exclusive, Concurrent, Residual) with examples on each. Know revenue allocation percentages (52.68/26.72/20.60) and derivation principle (13%). Know Nigerian federal history milestones. Know INEC functions and challenges. Know FPTP and 25% presidential rule. Know BVAS and IReV. Know electoral malpractice types and remedies. For 25-mark essays: define → types/features → advantages → disadvantages → Nigeria-specific application → evaluation/reform proposals → conclusion. Always include specific Nigerian statistics and examples — WAEC rewards context..</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'The key constitutional difference between a federal and a unitary state is:',o:['Federal states are always larger than unitary states','In federal states, neither level of government can unilaterally abolish or override the other; in unitary states, the centre can override or abolish regional governments','Federal states always have more ethnic diversity than unitary states','Unitary states cannot conduct democratic elections at regional level'],a:2,w:'In FEDERAL states, the constitution protects state powers — the centre cannot unilaterally abolish states or override their constitutional powers. In UNITARY states, regional powers are delegated by the centre and can be revoked.'},{q:'Nigeria has 109 senators in its National Assembly because:',o:['The 1999 Constitution requires one senator per LGA (109 of them)','There are 36 states × 3 senators each = 108, plus 1 senator for the FCT = 109','The Senate was designed with 109 as a prime number to prevent tied votes','Each of the six geopolitical zones sends 18 senators, plus 1 for the FCT'],a:2,w:'36 states × 3 senators each = 108 senators, plus 1 senator for the Federal Capital Territory (Abuja) = 109 senators total. The 3-per-state formula ensures equal state representation regardless of population.'},{q:'The "concurrent legislative list" in Nigeria means:',o:['Federal and state governments can legislate on these matters, but federal law prevails in case of conflict','Only the federal government can legislate on these matters','Only state governments can legislate on these matters','These matters are shared equally between all 36 states but not the federal government'],a:1,w:'Concurrent List (Second Schedule Part II) — both the federal government (National Assembly) and state governments (Houses of Assembly) can make laws on these matters. In case of conflict, federal law prevails (Section 4(5)).'},{q:'The 2023 Nigerian presidential election was significant for the use of:',o:['Electronic voting machines (EVMs) for the first time','BVAS (Biometric Voter Accreditation System) and IReV (Results Viewing Portal) to improve transparency','Proportional representation replacing the FPTP system','An independent electoral commission that replaced INEC'],a:2,w:'The 2023 elections marked the first nationwide mandatory use of BVAS (biometric voter verification) and IReV (real-time online results display from polling units) — improving transparency significantly, though implementation was uneven.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
