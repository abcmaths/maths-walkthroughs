<meta charset="UTF-8">

<title>Quadratics · AS Level Pure Mathematics 1</title>
<style>
:root{--red:#C0272D;--dark:#7A1418;--cream:#FBF6F1;--ink:#241A17;--line:#E4D6CE;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.greet{font-size:14px;color:var(--gold);font-weight:600;margin-bottom:10px;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#fdf7f4);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.pnl p{font-size:16px;line-height:1.6;margin:0 0 10px;}
.pnl .as-flag{background:#FFF3E0;border-left:4px solid var(--gold);padding:8px 12px;font-size:14px;color:#7A5A18;margin:10px 0;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:14px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;line-height:1.55;margin-bottom:10px;}
.mc-opts{display:flex;flex-direction:column;gap:8px;}
.mc-opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);}
.mc-opt:disabled{cursor:default;}
.mc-correct{background:#e8f8ee;border-color:#1a7a3a!important;}
.mc-wrong{background:#fde8e8;border-color:#a01820!important;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk{margin-top:10px;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
.try-new{margin-top:10px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:3px;border:none;background:#888;color:#fff;cursor:pointer;font-family:inherit;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ST={};
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Check your understanding</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<button class="try-new" data-tryid="'+id+'">New question</button></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#241A17';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="2"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}

function dQ1(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Completing the square: 2x\u00b2 + 8x + 3','#C0272D',15,'middle',true));
  if(p>=1){o.push(R(40,44,400,40,'#fff5f0','#C0272D',1.5));o.push(T(240,68,'Step 1 \u2014 factor out the coefficient of x\u00b2','#241A17',13));}
  if(p>=2){o.push(T(240,104,'2x\u00b2 + 8x + 3  =  2(x\u00b2 + 4x) + 3','#1a5a8a',15,'middle',true));}
  if(p>=3){o.push(R(40,124,400,40,'#fff5f0','#C0272D',1.5));o.push(T(240,148,'Step 2 \u2014 complete the square inside the bracket','#241A17',13));}
  if(p>=4){o.push(T(240,184,'2(x + 2)\u00b2 \u2212 8 + 3  =  2(x + 2)\u00b2 \u2212 5','#1a5a8a',15,'middle',true));}
  if(p>=5){o.push(R(90,200,300,42,'#e8f8ee','#1a7a3a',2));o.push(T(240,226,'Completed square form','#1a7a3a',18,'middle',true));}
  s.innerHTML=o.join('');}

function dQ2(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'From completed square to the vertex','#C0272D',15,'middle',true));
  if(p>=1){o.push(R(40,44,400,44,'#fff5f0','#C0272D',1.5));o.push(T(240,64,'a(x + p)\u00b2 + q  has vertex at (\u2212p, q)','#241A17',14,'middle',true));o.push(T(240,82,'because (x+p)\u00b2 \u2265 0 always, so the minimum is q','#888',11));}
  if(p>=2){o.push(T(240,116,'For 2(x + 2)\u00b2 \u2212 5:','#241A17',13));o.push(T(240,138,'p = 2,  q = \u22125','#1a5a8a',14,'middle',true));}
  if(p>=3){o.push(R(120,154,240,42,'#e8f8ee','#1a7a3a',2));o.push(T(240,180,'Vertex = (\u22122, \u22125)','#1a7a3a',17,'middle',true));}
  if(p>=4){o.push(T(240,212,'Since a = 2 > 0, this is a minimum point','#888',12));}
  s.innerHTML=o.join('');}

function dQ3(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,22,'AS-Level vs GCSE: what\u2019s different?','#C0272D',15,'middle',true));
  if(p>=1){o.push(R(40,40,400,50,'#e8f4ff','#1a5a8a',1.5));o.push(T(240,58,'GCSE: usually a = 1',' #1a5a8a',13,'middle',true));o.push(T(240,78,'e.g. x\u00b2 + 6x + 5  \u2192  (x+3)\u00b2 \u2212 4','#241A17',12));}
  if(p>=2){o.push(R(40,100,400,50,'#fff5f0','#C0272D',1.5));o.push(T(240,118,'AS Level: a \u2260 1','#C0272D',13,'middle',true));o.push(T(240,138,'You MUST factor a out first \u2014 forgetting this is the #1 error','#241A17',12));}
  if(p>=3){o.push(T(240,172,'Common mistake: 2x\u00b2+8x+3 \u2192 2(x+4)\u00b2 + 3','#a01820',12));o.push(T(240,192,'(forgot to multiply the \u22128 back through by 2)','#888',11));}
  s.innerHTML=o.join('');}

function dQ4(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,22,'The discriminant: b\u00b2 \u2212 4ac','#C0272D',15,'middle',true));
  if(p>=1){o.push(R(40,40,400,44,'#fff5f0','#C0272D',1.5));o.push(T(240,60,'For ax\u00b2+bx+c=0, the quadratic formula is','#241A17',13));o.push(T(240,78,'x = (\u2212b \u00b1 \u221a(b\u00b2\u22124ac)) / 2a','#1a5a8a',13,'middle',true));}
  if(p>=2){o.push(T(240,110,'The part under the root, b\u00b2\u22124ac, is the discriminant.','#241A17',13));o.push(T(240,130,'Its sign tells you how many real roots exist \u2014 before you solve anything.','#888',11));}
  if(p>=3){o.push(R(30,148,130,70,'#e8f8ee','#1a7a3a',1.5));o.push(T(95,168,'> 0','#1a7a3a',15,'middle',true));o.push(T(95,188,'2 real roots','#241A17',11));o.push(T(95,204,'(graph crosses x-axis twice)','#888',9));
    o.push(R(175,148,130,70,'#fff8e1','#C8922A',1.5));o.push(T(240,168,'= 0','#C8922A',15,'middle',true));o.push(T(240,188,'1 repeated root','#241A17',11));o.push(T(240,204,'(graph touches x-axis)','#888',9));
    o.push(R(320,148,130,70,'#fde8e8','#a01820',1.5));o.push(T(385,168,'< 0','#a01820',15,'middle',true));o.push(T(385,188,'No real roots','#241A17',11));o.push(T(385,204,'(graph misses x-axis)','#888',9));}
  s.innerHTML=o.join('');}

function dQ5(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,22,'Worked example: 3x\u00b2 \u2212 2x + 5 = 0','#C0272D',15,'middle',true));
  if(p>=1){o.push(R(40,40,400,40,'#fff5f0','#C0272D',1.5));o.push(T(240,64,'a=3, b=\u22122, c=5','#241A17',14,'middle',true));}
  if(p>=2){o.push(T(240,100,'b\u00b2 \u2212 4ac = (\u22122)\u00b2 \u2212 4(3)(5)','#1a5a8a',14,'middle',true));}
  if(p>=3){o.push(T(240,130,'= 4 \u2212 60 = \u221256','#1a5a8a',15,'middle',true));}
  if(p>=4){o.push(R(120,148,240,44,'#fde8e8','#a01820',2));o.push(T(240,175,'\u221256 < 0  \u2192  no real roots','#a01820',15,'middle',true));}
  s.innerHTML=o.join('');}

function dQ6(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Sketching from completed-square form','#C0272D',15,'middle',true));
  if(p>=1){o.push(T(240,44,'y = (x \u2212 3)\u00b2 \u2212 4','#241A17',14,'middle',true));}
  if(p>=2){
    o.push(L(60,220,420,220,'#888',1.5));o.push(L(60,220,60,60,'#888',1.5));
    o.push(T(430,224,'x','#888',11));o.push(T(56,50,'y','#888',11));
    var pts=[];for(var xv=-1;xv<=7;xv+=0.25){var yv=(xv-3)*(xv-3)-4;var px=60+(xv+1)*45;var py=220-yv*14;if(py>60&&py<220)pts.push(px+','+py);}
    o.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="#C0272D" stroke-width="2.5"/>');
  }
  if(p>=3){o.push(C(60+4*45,220-(-4)*14,4,'#1a7a3a','#1a7a3a'));o.push(T(60+4*45,220-(-4)*14-12,'Vertex (3, \u22124)','#1a7a3a',11,'middle',true));}
  if(p>=4){o.push(C(60+1*45,220,4,'#1a5a8a','#1a5a8a'));o.push(C(60+5*45,220,4,'#1a5a8a','#1a5a8a'));o.push(T(240,240,'Roots at x=1 and x=5 (where curve crosses the x-axis)','#1a5a8a',11,'middle',false));}
  s.innerHTML=o.join('');}

function dQ7(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Solving quadratic inequalities','#C0272D',15,'middle',true));
  if(p>=1){o.push(T(240,44,'Solve x\u00b2 \u2212 2x \u2212 8 > 0','#241A17',14,'middle',true));}
  if(p>=2){o.push(R(40,58,400,40,'#fff5f0','#C0272D',1.5));o.push(T(240,82,'Factorise first: (x\u22124)(x+2) > 0','#1a5a8a',13,'middle',true));}
  if(p>=3){
    o.push(L(60,180,420,180,'#888',1.5));
    o.push(C(160,180,4,'#a01820','#a01820'));o.push(T(160,200,'x=\u22122','#241A17',11));
    o.push(C(320,180,4,'#a01820','#a01820'));o.push(T(320,200,'x=4','#241A17',11));
    o.push('<line x1="60" y1="180" x2="150" y2="180" stroke="#1a7a3a" stroke-width="4"/>');
    o.push('<line x1="330" y1="180" x2="420" y2="180" stroke="#1a7a3a" stroke-width="4"/>');
    o.push(T(240,150,'Positive outside the roots (graph is above the x-axis there)','#241A17',11,'middle',false));
  }
  if(p>=4){o.push(R(110,206,260,40,'#e8f8ee','#1a7a3a',2));o.push(T(240,231,'x < \u22122  or  x > 4','#1a7a3a',15,'middle',true));}
  s.innerHTML=o.join('');}

function dQ8(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Disguised quadratics (function of a function)','#C0272D',14,'middle',true));
  if(p>=1){o.push(T(240,44,'Solve x\u2074 \u2212 5x\u00b2 + 4 = 0','#241A17',14,'middle',true));}
  if(p>=2){o.push(R(30,58,420,40,'#fff5f0','#C0272D',1.5));o.push(T(240,82,'Spot the pattern: let u = x\u00b2, so u\u00b2 = x\u2074','#1a5a8a',13,'middle',true));}
  if(p>=3){o.push(T(240,116,'This becomes: u\u00b2 \u2212 5u + 4 = 0','#241A17',14,'middle',true));o.push(T(240,136,'Factorise: (u\u22121)(u\u22124) = 0  \u2192  u = 1 or u = 4','#1a5a8a',13,'middle',true));}
  if(p>=4){o.push(R(70,152,340,50,'#e8f8ee','#1a7a3a',2));o.push(T(240,172,'x\u00b2 = 1  \u2192  x = \u00b11','#1a7a3a',14,'middle',true));o.push(T(240,192,'x\u00b2 = 4  \u2192  x = \u00b12','#1a7a3a',14,'middle',true));}
  if(p>=5){o.push(T(240,222,'Always substitute back to x \u2014 forgetting this loses easy marks','#888',11));}
  s.innerHTML=o.join('');}

function dQ9(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Line meets curve: using the discriminant','#C0272D',14,'middle',true));
  if(p>=1){o.push(T(240,44,'Find k so that y = 2x + k is tangent to y = x\u00b2','#241A17',13,'middle',true));}
  if(p>=2){o.push(R(30,58,420,40,'#fff5f0','#C0272D',1.5));o.push(T(240,82,'Set equal: x\u00b2 = 2x + k  \u2192  x\u00b2 \u2212 2x \u2212 k = 0','#1a5a8a',13,'middle',true));}
  if(p>=3){o.push(T(240,114,'Tangent means exactly ONE solution \u2192 discriminant = 0','#241A17',13,'middle',true));}

var qi=0,pi=0;
function render(){
  var qq=Q[qi],pp=qq.panels[pi];
  document.getElementById('ey').textContent=qq.ey;
  document.getElementById('ti').textContent=qq.ti;
  document.getElementById('su').textContent=qq.su;
  pp.d(pp.p);
  var pn=document.getElementById('pn');
  pn.innerHTML=pp.html;
  pn.classList.remove('fi');void pn.offsetWidth;pn.classList.add('fi');
  document.getElementById('pb').disabled=(qi===0&&pi===0);
  document.getElementById('nb').textContent=(pi===qq.panels.length-1&&qi===Q.length-1)?'Done':'Next \u2192';
  var dt=document.getElementById('dt');
  dt.innerHTML=qq.panels.map(function(_,i){return '<div class="dot '+(i<pi?'dn':i===pi?'on':'')+'"></div>';}).join('');
  var sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-lbl">Checkpoints</div>'+Q.map(function(q,i){
    return '<button class="qb'+(i===qi?' on':'')+'" data-qi="'+i+'"><span class="qn">'+q.ey+'</span>'+q.ti+'</button>';
  }).join('');
}
document.getElementById('nb').addEventListener('click',function(){
  var qq=Q[qi];
  if(pi<qq.panels.length-1){pi++;}
  else if(qi<Q.length-1){qi++;pi=0;}
  render();
});
document.getElementById('pb').addEventListener('click',function(){
  if(pi>0){pi--;}
  else if(qi>0){qi--;pi=Q[qi].panels.length-1;}
  render();
});
document.getElementById('sb').addEventListener('click',function(e){
  var b=e.target.closest('.qb');if(!b)return;
  qi=parseInt(b.getAttribute('data-qi'),10);pi=0;render();
});
render();
