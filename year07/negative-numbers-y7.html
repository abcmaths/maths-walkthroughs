<script>

var ST={};

function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function htmlFrac(num,den,col,lbl){
  col=col||'#C0272D';
  return '<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;">'
    +(lbl?'<span style="font-size:10px;color:#888;font-style:italic;line-height:1.2;">numerator</span>':'')
    +'<span style="font-size:17px;font-weight:700;color:'+col+';border-bottom:2px solid '+col+';padding:0 4px 1px;min-width:18px;text-align:center;">'+num+'</span>'
    +'<span style="font-size:17px;color:'+col+';padding:1px 4px 0;min-width:18px;text-align:center;">'+den+'</span>'
    +(lbl?'<span style="font-size:10px;color:#888;font-style:italic;line-height:1.2;">denominator</span>':'')
    +'</span>';
}

function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();
  ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}

function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class=\"hl\">'+h+'</ul>':'')+'<div class=\"wk-b\">'+o.working+'</div>';
  var ex=o.extraHTML||'';
  var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  var ansBox=o.frac
    ? '<div class="ar"><div class="fracbox"><input type="number" step="any" placeholder="num" class="try-num" data-tryid="'+id+'"/><div class="fracline"></div><input type="number" step="any" placeholder="den" class="try-den" data-tryid="'+id+'"/></div><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    : '<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>';
  // Use data-tryid attributes instead of inline onclick with dynamic strings
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">✔ Your Turn'
    +' <button class="newq-btn" data-tryid="'+id+'">↻ New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'
    +ex
    +ansBox
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'
    +'<div class="wk-b">'+o.working+'</div></details>'
    +'</div>';
}

function newQ(id){
  var e=ST[id]; if(!e||!e.genFn)return;
  var o=e.genFn(); e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');
  if(!box)return;
  var tmp=document.createElement('div');
  tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);
  ST[id]={o:o,genFn:e.genFn};
}

function ckById(id){
  var e=ST[id]; if(!e)return;
  var o=e.o;
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!fb)return;
  if(o.frac){
    var ni=document.querySelector('.try-num[data-tryid="'+id+'"]');
    var di=document.querySelector('.try-den[data-tryid="'+id+'"]');
    if(!ni||!di)return;
    var nv=parseFloat(ni.value),dv=parseFloat(di.value);
    if(isNaN(nv)||isNaN(dv)||dv===0){fb.className='try-fb fb er';fb.textContent='Enter a valid fraction (numerator and denominator).';return;}
    var ok=o.fracExact?(nv===o.ansN&&dv===o.ansD):(Math.abs(nv/dv-o.ansN/o.ansD)<1e-6);
    if(ok){
      fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
    }else if(o.fracExact&&Math.abs(nv/dv-o.ansN/o.ansD)<1e-6){
      fb.className='try-fb fb er';fb.textContent='That\u2019s an equivalent fraction, but not fully simplified \u2014 try again.';
    }else{
      fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
    }
    return;
  }
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  if(!inp)return;
  var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){
    fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
  }else{
    fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
  }
}

// Single delegated event listener - no inline onclick needed
document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){
    newQ(btn.getAttribute('data-tryid'));
  } else if(btn.classList.contains('try-ck')){
    ckById(btn.getAttribute('data-tryid'));
  }
});

function svgFrac(x,y,num,den,col,sz){
  col=col||'#C0272D';sz=sz||14;
  var hw=Math.max(String(num).length,String(den).length)*sz*0.36+6;
  return '<text x="'+x+'" y="'+(y-2)+'" font-size="'+sz+'" font-family="Arial" fill="'+col+'" text-anchor="middle" font-weight="700">'+num+'</text>'
    +'<line x1="'+(x-hw)+'" y1="'+y+'" x2="'+(x+hw)+'" y2="'+y+'" stroke="'+col+'" stroke-width="1.5"/>'
    +'<text x="'+x+'" y="'+(y+sz+2)+'" font-size="'+sz+'" font-family="Arial" fill="'+col+'" text-anchor="middle">'+den+'</text>';
}

function fracBar(total,num,den,result){
  var bx=40,bw=300,bh=32,pw=bw/den,out='';
  for(var i=0;i<den;i++){
    var fill=(i<num)?'#C0272D':'#f5e6e6';
    out+='<rect x="'+(bx+i*pw)+'" y="0" width="'+(pw-2)+'" height="'+bh+'" fill="'+fill+'" stroke="#C0272D" stroke-width="1.5" rx="2"/>';
    out+='<text x="'+(bx+i*pw+pw/2)+'" y="'+(bh/2+5)+'" font-size="12" font-family="Arial" fill="'+(i<num?'#fff':'#C0272D')+'" text-anchor="middle">'+Math.round(total/den)+'</text>';
  }
  // summary label placed clear of the bar itself (to the right), so it never overlaps a box's own number
  out+='<text x="'+(bx+bw+18)+'" y="'+(bh/2+5)+'" font-size="14" font-family="Arial" fill="#1a7a3a" font-weight="700">= '+result+'</text>';
  return out;
}

function pieSlices(cx,cy,r,den,filled){
  var out='',ang=-90,step=360/den;
  for(var i=0;i<den;i++){
    var a0=(ang+i*step)*Math.PI/180,a1=(ang+(i+1)*step)*Math.PI/180;
    var x0=(cx+r*Math.cos(a0)).toFixed(1),y0=(cy+r*Math.sin(a0)).toFixed(1);
    var x1=(cx+r*Math.cos(a1)).toFixed(1),y1=(cy+r*Math.sin(a1)).toFixed(1);
    var large=step>180?1:0;
    var fill=(i<filled)?'#C0272D':'#fdf1ea';
    out+='<path d="M '+cx+' '+cy+' L '+x0+' '+y0+' A '+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' Z" fill="'+fill+'" stroke="#fff" stroke-width="2"/>';
  }
  return out;
}

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'#fff5f0')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#888')+'" stroke-width="'+(w||1.5)+'"/>';}
function dQ1(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  var ox=40,oy=100,sc=28;
  // axis from -9 to 9
  o.push(L(ox-8,oy,ox+18*sc+8,oy,'#333',2));
  for(var i=-9;i<=9;i++){
    o.push(L(ox+(i+9)*sc,oy-5,ox+(i+9)*sc,oy+5,'#555',1));
    if(i%3===0)o.push(T(ox+(i+9)*sc,oy+16,i,'#555',10));
  }
  o.push(T(ox+18*sc+14,oy+3,'→','#333',12,'start'));
  // problem box always visible
  o.push(R(14,8,452,44,'#fff5f0','#C0272D',1.5));
  o.push(T(240,32,'−7 + 12  on the number line','#C0272D',15,'middle',true));
  if(p>=1){
    // start dot at -7
    var sx=ox+((-7)+9)*sc;
    o.push('<circle cx="'+sx+'" cy="'+oy+'" r="7" fill="#C0272D" stroke="#fff" stroke-width="2"/>');
    o.push(T(sx,oy-16,'start: −7','#C0272D',10,'middle',true));
  }
  if(p>=2){
    // arrow jumping 12 right
    var sx=ox+((-7)+9)*sc, ex=ox+(5+9)*sc;
    o.push('<path d="M '+sx+' '+(oy-10)+' Q '+((sx+ex)/2)+' '+(oy-44)+' '+ex+' '+(oy-10)+'" fill="none" stroke="#C8922A" stroke-width="2.5" marker-end="url(#arr)"/>');
    o.push(T((sx+ex)/2,oy-50,'+ 12','#C8922A',12,'middle',true));
  }
  if(p>=3){
    var ex=ox+(5+9)*sc;
    o.push('<circle cx="'+ex+'" cy="'+oy+'" r="7" fill="#1a7a3a" stroke="#fff" stroke-width="2"/>');
    o.push(T(ex,oy-16,'answer: 5','#1a7a3a',10,'middle',true));
    o.push(R(130,130,220,36,'#e8f8ee','#1a7a3a',2));
    o.push(T(240,152,'−7 + 12 = 5','#1a7a3a',17,'middle',true));
  }
  if(p>=4){
    o.push(T(240,196,'Adding positive → move RIGHT','#C8922A',11,'middle',false));
    o.push(T(240,212,'Subtracting → move LEFT','#1a5a8a',11,'middle',false));
  }
  if(p>=5){
    o.push(T(240,232,'Now try subtracting: −3 − 5','#1a5a8a',12,'middle',true));
    // second number line beneath, dedicated to the subtraction example
    var oy2=280,sc2=28,ox2=ox;
    o.push(L(ox2-8,oy2,ox2+18*sc2+8,oy2,'#333',2));
    for(var j=-9;j<=9;j++){o.push(L(ox2+(j+9)*sc2,oy2-5,ox2+(j+9)*sc2,oy2+5,'#555',1));if(j%3===0)o.push(T(ox2+(j+9)*sc2,oy2+16,j,'#555',10));}
    var sx2=ox2+((-3)+9)*sc2, ex2=ox2+((-8)+9)*sc2;
    o.push('<circle cx="'+sx2+'" cy="'+oy2+'" r="7" fill="#1a5a8a" stroke="#fff" stroke-width="2"/>');
    o.push(T(sx2,oy2-16,'start: −3','#1a5a8a',10,'middle',true));
    o.push('<path d="M '+sx2+' '+(oy2-10)+' Q '+((sx2+ex2)/2)+' '+(oy2-44)+' '+ex2+' '+(oy2-10)+'" fill="none" stroke="#C0272D" stroke-width="2.5" marker-end="url(#arr)"/>');
    o.push(T((sx2+ex2)/2,oy2-50,'− 5 (move left)','#C0272D',12,'middle',true));
    o.push('<circle cx="'+ex2+'" cy="'+oy2+'" r="7" fill="#C0272D" stroke="#fff" stroke-width="2"/>');
    o.push(T(ex2,oy2+34,'answer: −8','#C0272D',11,'middle',true));
  }
  s.setAttribute('viewBox','0 0 480 '+(p>=5?330:260));
  s.innerHTML=o.join('');
}

var QS=[
  {ey:'Q3 · Year 7 · Number',ti:'Negative Numbers',su:'Calculate −7 + 12 on a number line.',steps:[
    {lb:'Number line',dr:dQ1,ht:'<p>Adding positive → move <b>right</b>. Subtracting → move <b>left</b>.</p>'},
    {lb:'Start at −7',dr:dQ1,ht:'<p>Place marker at −7.</p>'},
    {lb:'Move right 12',dr:dQ1,ht:'<p>12 steps right from −7.</p>'},
    {lb:'Answer',dr:dQ1,ht:'<div class="fm">−7 + 12 = 5</div>'},
    {lb:'Adding positive',dr:dQ1,ht:'<p>Adding a positive number always means moving <b>right</b> on the number line. Start at −7, jump 12 right → land on 5.</p>'},
    {lb:'Subtracting / neg + neg',dr:dQ1,ht:'<div class="fm">−3 − 5: start at −3, move 5 LEFT = −8</div><div class="fm">−3 + (−5) = −8  (same thing)</div><p style="margin-top:6px;font-size:13px;color:#6b5750;">Subtracting or adding a negative → move <b>left</b>.</p>'},
    {lb:'Your turn',dr:dQ1,ht:tryIt(function(){
      var types=rPick(['pos','neg']);
      var a,b,ans,q,h1,h2;
      if(types==='pos'){a=rInt(-9,-2);b=rInt(1,12);ans=a+b;q='Calculate <b>'+a+' + '+b+'</b>.';h1='Start at '+a;h2='Move '+b+' steps RIGHT';}
      else{a=rInt(-6,-1);b=rInt(1,7);ans=a-b;q='Calculate <b>'+a+' − '+b+'</b>.';h1='Start at '+a;h2='Move '+b+' steps LEFT → '+(a-b);}
      return{question:q,hints:[h1,h2,'Use the number line'],ans:ans,tol:0.05,unit:'',working:q.replace(/<b>|<\/b>/g,'')+' = '+ans};
    })},
  ]}
];

var qi=0,si=0;
function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
