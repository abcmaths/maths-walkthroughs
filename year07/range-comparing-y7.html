<script>

var ST={};

function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function htmlFrac(num,den,col,lbl){
  col=col||'#C0272D';
  return '<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;">'
    +(lbl?'<span style="font-size:10px;color:#888;font-style:italic;line-height:1.2;">numerator</span>':'')
    +'<span style="font-size:17px;font-weight:700;color:'+col+';border-bottom:2px solid '+col+';padding:0 4px 1px;min-width:18px;text-align:center;">'+num+'</span>'
    +'<span style="font-size:17px;color:'+col+';padding:1px 4px 0;min-width:18px;text-align:center;">'+den+'</span>'
    +(lbl?'<span style="font-size:10px;color:#888;font-style:italic;line-height:1.2;">denominator</span>':'')
    +'</span>';
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();
  ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}

function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class=\"hl\">'+h+'</ul>':'')+'<div class=\"wk-b\">'+o.working+'</div>';
  var ex=o.extraHTML||'';
  var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  var ansBox=o.frac
    ? '<div class="ar"><div class="fracbox"><input type="number" step="any" placeholder="num" class="try-num" data-tryid="'+id+'"/><div class="fracline"></div><input type="number" step="any" placeholder="den" class="try-den" data-tryid="'+id+'"/></div><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    : '<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>';
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">✔ Your Turn'
    +' <button class="newq-btn" data-tryid="'+id+'">↻ New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'
    +ex
    +ansBox
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'
    +'<div class="wk-b">'+o.working+'</div></details>'
    +'</div>';
}

function newQ(id){
  var e=ST[id]; if(!e||!e.genFn)return;
  var o=e.genFn(); e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');
  if(!box)return;
  var tmp=document.createElement('div');
  tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);
  ST[id]={o:o,genFn:e.genFn};
}

function ckById(id){
  var e=ST[id]; if(!e)return;
  var o=e.o;
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!fb)return;
  if(o.frac){
    var ni=document.querySelector('.try-num[data-tryid="'+id+'"]');
    var di=document.querySelector('.try-den[data-tryid="'+id+'"]');
    if(!ni||!di)return;
    var nv=parseFloat(ni.value),dv=parseFloat(di.value);
    if(isNaN(nv)||isNaN(dv)||dv===0){fb.className='try-fb fb er';fb.textContent='Enter a valid fraction (numerator and denominator).';return;}
    var ok=o.fracExact?(nv===o.ansN&&dv===o.ansD):(Math.abs(nv/dv-o.ansN/o.ansD)<1e-6);
    if(ok){
      fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
    }else if(o.fracExact&&Math.abs(nv/dv-o.ansN/o.ansD)<1e-6){
      fb.className='try-fb fb er';fb.textContent='That\u2019s an equivalent fraction, but not fully simplified \u2014 try again.';
    }else{
      fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
    }
    return;
  }
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  if(!inp)return;
  var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){
    fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
  }else{
    fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
  }
}

document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){
    newQ(btn.getAttribute('data-tryid'));
  } else if(btn.classList.contains('try-ck')){
    ckById(btn.getAttribute('data-tryid'));
  }
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#888')+'" stroke-width="'+(w||1.5)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'#fff5f0')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||1.5)+'" rx="2"/>';}

/* Q1 Tally chart */
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  var setA=[3,8,5,11,4,9];var setB=[6,7,7,8,6,7];
  o.push(T(240,22,'Compare two sets of data','#C0272D',15,'middle',true));
  o.push(T(120,44,'Set A: 3, 8, 5, 11, 4, 9','#C0272D',12,'middle',false));
  o.push(T(360,44,'Set B: 6, 7, 7, 8, 6, 7','#1a5a8a',12,'middle',false));
  if(p>=1){
    o.push(T(120,78,'Max=11, Min=3','#C0272D',12,'middle',false));
    o.push(R(40,86,160,36,'#fce8d8','#C0272D',1.5));o.push(T(120,109,'Range A = 8','#C0272D',14,'middle',true));
    o.push(T(360,78,'Max=8, Min=6','#1a5a8a',12,'middle',false));
    o.push(R(280,86,160,36,'#e8f4ff','#1a5a8a',1.5));o.push(T(360,109,'Range B = 2','#1a5a8a',14,'middle',true));
  }
  if(p>=2){
    o.push(T(120,140,'Mean A = 40\u00f76 = 6.67','#C0272D',12,'middle',false));
    o.push(T(360,140,'Mean B = 41\u00f76 = 6.83','#1a5a8a',12,'middle',false));
  }
  if(p>=3){
    o.push(T(240,176,'Set B is more consistent (smaller range)','#1a7a3a',13,'middle',true));
    o.push(T(240,198,'Set A is more spread out (larger range)','#888',12,'middle',false));
    o.push(T(240,228,'Range = largest value \u2212 smallest value','#888',11,'middle',false));
  }
  s.innerHTML=o.join('');
}

var QS=[
  {ey:'Q6 \u00b7 Year 7 \u00b7 Statistics',ti:'Range and Comparing Data Sets',su:'Compare Set A (3,8,5,11,4,9) and Set B (6,7,7,8,6,7) using mean and range.',steps:[
    {lb:'Why compare?',dr:dQ1,ht:'<p>To compare two data sets, we look at both the <b>average</b> (mean or median) and the <b>spread</b> (range). A smaller range means more consistent data.</p>'},
    {lb:'Calculate ranges',dr:dQ1,ht:'<div class="fm">Range A = 11 \u2212 3 = 8</div><div class="fm">Range B = 8 \u2212 6 = 2</div>'},
    {lb:'Calculate means',dr:dQ1,ht:'<div class="fm">Mean A = 40 \u00f7 6 \u2248 6.67</div><div class="fm">Mean B = 41 \u00f7 6 \u2248 6.83</div>'},
    {lb:'Interpret',dr:dQ1,ht:'<p>Set B has a higher mean (slightly better on average) and a much smaller range (more consistent). Set A is more spread out.</p>'},
    {lb:'Your turn',dr:dQ1,ht:tryIt(function(){
  var size = 6;
  var nums = [];
  while(nums.length < size){
    var n = rnd(1,15);
    if(nums.indexOf(n) === -1) nums.push(n);
  }
  var mn = Math.min.apply(null, nums);
  var mx = Math.max.apply(null, nums);
  var ans = mx - mn;
  var display = nums.join(', ');
  return {
    question: 'What is the range of the set: <b>' + display + '</b>?',
    hints: ['Largest value \u2212 smallest value', mx + ' \u2212 ' + mn],
    ans: ans,
    tol: 0,
    unit: '',
    working: 'Range = ' + mx + ' \u2212 ' + mn + ' = ' + ans
  };
})}
  ]}
];

var qi=0,si=0;
function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=(si===0);document.getElementById('nb').textContent=(si===q.steps.length-1)?'Restart':'Next →';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});
document.getElementById('nb').addEventListener('click',function(){var q=QS[qi];si=(si===q.steps.length-1)?0:si+1;render();});
render();

</script>
