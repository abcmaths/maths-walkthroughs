<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argument & Persuasive Writing Techniques — Extension English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Extension English: Argument & Persuasive Writing Techniques</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is persuasive writing?", "teach": ["Persuasive writing aims to convince the reader to agree with a particular viewpoint or take a specific action.", "Example: an advert, a campaign speech, or an opinion article are all forms of persuasive writing.", "Effective persuasive writing uses specific techniques deliberately, not just strong opinions alone."], "yt_prompt": "What is the main goal of persuasive writing?"}, {"title": "Using rhetorical questions to persuade", "teach": ["Rhetorical questions make the reader think and often imply an obvious answer that supports the writer's argument.", "Example: 'Do we really want to leave this problem for future generations?' implies the obvious answer is no.", "This technique engages the reader more actively than a simple statement would."], "yt_prompt": "What effect does a rhetorical question have on the reader?"}, {"title": "Using the rule of three in persuasion", "teach": ["Listing three points together creates a memorable, rhythmic argument.", "Example: 'We need action, we need change, we need it now' \u2014 three short, punchy statements building urgency.", "This technique is common in speeches and campaign writing."], "yt_prompt": "What technique is being used in: 'We need action, we need change, we need it now'?"}, {"title": "Using statistics and facts to persuade", "teach": ["Including specific facts or statistics makes an argument feel more credible and evidence-based.", "Example: 'Over 60% of students reported feeling stressed' is more convincing than simply saying 'lots of students are stressed'.", "Specific numbers carry more persuasive weight than vague generalisations."], "yt_prompt": "Which is more persuasive? Type 'A' or 'B':"}, {"title": "Using emotive language", "teach": ["Emotive language deliberately triggers an emotional reaction in the reader, strengthening the persuasive effect.", "Example: 'innocent children are suffering' is more emotionally charged than 'children are affected'.", "Emotive language is powerful, but should be used carefully \u2014 overuse can feel manipulative to the reader."], "yt_prompt": "Which is more emotive? Type 'A' or 'B':"}, {"title": "Anticipating counter-arguments", "teach": ["Strong persuasive writing acknowledges the opposing viewpoint before explaining why it's less convincing.", "Example: 'Some may argue that costs are too high, but the long-term benefits far outweigh this concern.'", "This technique makes an argument feel more balanced and considered, which can increase its persuasive power."], "yt_prompt": "What is it called when a writer acknowledges an opposing view before countering it?"}, {"title": "Using a direct address to the reader", "teach": ["Speaking directly to the reader (using 'you') creates a personal connection and makes the argument feel more immediate.", "Example: 'You have the power to make a difference today' feels more direct and personal than a general statement.", "This technique is common in campaign and charity appeal writing."], "yt_prompt": "What effect does directly addressing the reader as 'you' create?"}, {"title": "Structuring a persuasive argument", "teach": ["A strong persuasive piece usually opens with a clear position, develops supporting points, and ends with a powerful conclusion or call to action.", "Example: opening line stating the issue, then evidence, then a final call for the reader to act.", "Planning this structure before writing helps keep the argument focused and building toward a clear point."], "yt_prompt": "What usually comes at the very end of a persuasive piece, encouraging the reader to act?"}, {"title": "Balancing logic and emotion", "teach": ["The strongest persuasive writing balances logical evidence (facts, statistics) with emotional appeal (emotive language, personal stories).", "Example: combining a statistic about poverty with a specific, personal story makes both the head and heart engage with the argument.", "Relying only on one or the other usually makes an argument less convincing overall."], "yt_prompt": "What are the two main elements a strong persuasive argument should balance? (two words)"}, {"title": "Mixed practice \u2014 persuasive techniques", "teach": ["You've now covered rhetorical questions, the rule of three, statistics, emotive language, counter-arguments, direct address, structure, and balancing logic with emotion.", "Combining several of these techniques deliberately makes persuasive writing far more effective than relying on just one.", "This final question checks you can identify a persuasive technique confidently."], "yt_prompt": "What technique is being used in: 'Isn't it time we finally took action?'"}];
function ytGen_0() { return {q:'What is the main goal of persuasive writing?', answer:'to convince the reader'}; }
function ytGen_1() { return {q:'What effect does a rhetorical question have on the reader?', answer:'makes them think and often implies an answer'}; }
function ytGen_2() { return {q:'We need action, we need change, we need it now. What technique is being used?', answer:'rule of three'}; }
function ytGen_3() { return {q:'A) Over 60% of students reported feeling stressed. B) Lots of students are stressed. Which is more persuasive?', answer:'A'}; }
function ytGen_4() { return {q:'A) Innocent children are suffering. B) Children are affected. Which is more emotive?', answer:'A'}; }
function ytGen_5() { return {q:'What is it called when a writer acknowledges an opposing view before countering it?', answer:'counter-argument'}; }
function ytGen_6() { return {q:'What effect does directly addressing the reader as "you" create?', answer:'a personal connection'}; }
function ytGen_7() { return {q:'What usually comes at the very end of a persuasive piece, encouraging the reader to act?', answer:'a call to action'}; }
function ytGen_8() { return {q:'What are the two main elements a strong persuasive argument should balance?', answer:'logic and emotion'}; }
function ytGen_9() { return {q:'Isn\'t it time we finally took action? What technique is being used?', answer:'rhetorical question'}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'EXT-ENG-04';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data: topicRow, error: topicErr } = await supabase
    .from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
  if (topicErr || !topicRow) throw new Error('Could not find topic: ' + _abcTopicCode);

  const { error } = await supabase.from('walkthrough_progress').upsert({
    student_id: session.user.id,
    topic_id: topicRow.id,
    status: 'completed',
    last_visited_at: new Date().toISOString()
  }, { onConflict: 'student_id,topic_id' });
  if (error) throw error;
};
</script>
</body>
</html>
