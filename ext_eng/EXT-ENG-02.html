<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writer's Use of Language — Identifying Techniques & Effect — Extension English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

</head>
<body>
<header><h1>Extension English: Writer's Use of Language — Identifying Techniques & Effect</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Simile", "teach": ["A simile compares two things using 'like' or 'as', creating a vivid image for the reader.", "Example: 'The waves crashed like thunder' compares the sound of waves to thunder.", "Always explain what the comparison suggests, not just that a simile is present."], "yt_prompt": "Identify the technique (one word):"}, {"title": "Metaphor", "teach": ["A metaphor states one thing IS another, without using 'like' or 'as' \u2014 a more direct comparison than a simile.", "Example: 'The classroom was a zoo' suggests chaos and noise, without literally meaning it was a zoo.", "Metaphors often feel more intense or direct than similes."], "yt_prompt": "Identify the technique (one word):"}, {"title": "Personification", "teach": ["Personification gives human qualities or actions to non-human things or ideas.", "Example: 'The wind whispered through the trees' gives the wind a human ability (whispering).", "This technique often creates atmosphere or brings a scene to life."], "yt_prompt": "Identify the technique (one word):"}, {"title": "Alliteration", "teach": ["Alliteration repeats the same starting sound across several nearby words, creating a rhythmic or emphatic effect.", "Example: 'the silent, slithering snake' repeats the 's' sound.", "This technique draws attention to the words and can create a specific mood, like tension or playfulness."], "yt_prompt": "Identify the technique (one word):"}, {"title": "Onomatopoeia", "teach": ["Onomatopoeia uses words that imitate the actual sound they describe.", "Example: 'the bacon sizzled' \u2014 'sizzled' sounds like the noise bacon actually makes.", "This technique makes writing feel more vivid and immediate by directly representing sound."], "yt_prompt": "Identify the technique (one word):"}, {"title": "Hyperbole", "teach": ["Hyperbole is deliberate exaggeration, used for emphasis or humour, not meant to be taken literally.", "Example: 'I've told you a million times' \u2014 obviously not literally a million, but emphasises frustration.", "This technique is common in everyday speech as well as creative writing."], "yt_prompt": "Identify the technique (one word):"}, {"title": "Repetition for emphasis", "teach": ["Repeating a word or phrase deliberately emphasises its importance or creates a rhythmic effect.", "Example: 'Never, never, never give up' emphasises determination through repetition.", "Consider what specific idea or feeling the repeated word or phrase is drawing attention to."], "yt_prompt": "Identify the technique (one word):"}, {"title": "Rhetorical questions", "teach": ["A rhetorical question is asked for effect, not to get a literal answer \u2014 it makes the reader think or agree with a point.", "Example: 'How much longer must we wait?' isn't really asking for a number, but expressing frustration.", "Rhetorical questions are common in persuasive writing and speeches."], "yt_prompt": "Identify the technique (two words):"}, {"title": "Identifying the effect, not just the technique", "teach": ["In exams, naming a technique alone isn't enough \u2014 you must also explain its effect on the reader.", "Example: 'the alliteration of \"silent, slithering snake\" creates an unsettling, sinister atmosphere' \u2014 technique PLUS effect.", "Always link the technique back to how it makes the reader feel or think."], "yt_prompt": "What effect does this alliteration most likely create? (a few words)"}, {"title": "Mixed practice \u2014 identifying language techniques", "teach": ["You've now covered simile, metaphor, personification, alliteration, onomatopoeia, hyperbole, repetition, and rhetorical questions.", "Being able to spot these techniques quickly \u2014 and explain their effect \u2014 is essential for language analysis questions.", "This final question checks you can identify the correct technique confidently."], "yt_prompt": "Identify the technique (one word):"}];
function ytGen_0() { return {q:'Her eyes were like diamonds, sharp and bright.', answer:'simile'}; }
function ytGen_1() { return {q:'The classroom was a zoo.', answer:'metaphor'}; }
function ytGen_2() { return {q:'The wind whispered through the trees.', answer:'personification'}; }
function ytGen_3() { return {q:'the silent, slithering snake', answer:'alliteration'}; }
function ytGen_4() { return {q:'the bacon sizzled in the pan', answer:'onomatopoeia'}; }
function ytGen_5() { return {q:"I've told you a million times to tidy your room.", answer:'hyperbole'}; }
function ytGen_6() { return {q:'Never, never, never give up.', answer:'repetition'}; }
function ytGen_7() { return {q:'How much longer must we wait for change?', answer:'rhetorical question'}; }
function ytGen_8() { return {q:'the silent, slithering snake — what effect does this alliteration create?', answer:'unsettling or sinister atmosphere'}; }
function ytGen_9() { return {q:'The city never sleeps.', answer:'personification'}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async () => {

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data: topicRow, error: topicErr } = await supabase
    .from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();

  const { error } = await supabase.from('walkthrough_progress').upsert({
    student_id: session.user.id,
    topic_id: topicRow.id,
    status: 'completed',
    last_visited_at: new Date().toISOString()
  }, { onConflict: 'student_id,topic_id' });
  if (error) throw error;
};
</script>
</body>
</html>
