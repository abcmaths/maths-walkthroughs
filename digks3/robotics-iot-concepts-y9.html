<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotics & IoT Concepts — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Robotics & IoT Concepts</div>
    <div class="strand">Digital Technologies · Emerging Technology</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Robotics?',teach:'<p>Robotics combines engineering, computing and design to build machines that can sense and act in the world.</p><p>A robot typically has sensors (input), a control system (processing), and actuators (output).</p><p>Robots range from simple line-following robots to complex industrial arms.</p><p>Robotics is used in manufacturing, medicine, exploration, and even homes.</p>',q:'What are the three basic components most robots have?',opts:["Sensors, a control system, and actuators", "Only a screen", "Only a keyboard", "Only a battery"],correct:0,expl:'Robots typically combine sensors (input), a control system (processing), and actuators (output) to sense and act on their environment.'},
  {ey:'Q2',ti:'Sensors',teach:'<p>Sensors let a robot detect information about its environment, like light, distance, or temperature.</p><p>Common sensors include ultrasonic (distance), infrared (light/obstacles), and temperature sensors.</p><p>Sensor data feeds into the robot\'s control system to inform decisions.</p><p>More accurate sensors generally allow more precise robot behaviour.</p>',q:'What is the role of a sensor in a robot?',opts:["To detect information about the environment", "To physically move the robot", "To store power only", "To connect to Bluetooth only"],correct:0,expl:'Sensors gather information about the robot\'s surroundings, which feeds into its decision-making.'},
  {ey:'Q3',ti:'Actuators',teach:'<p>Actuators are the parts of a robot that create physical movement or action.</p><p>Examples include motors (for wheels or arms) and servos (for precise angular movement).</p><p>Actuators convert electrical signals into physical motion.</p><p>Choosing the right actuator affects a robot\'s speed, strength and precision.</p>',q:'What do actuators primarily do in a robot?',opts:["Create physical movement or action", "Only display information visually", "Only store data", "Only connect to the internet"],correct:0,expl:'Actuators convert electrical signals into physical movement, such as turning wheels or moving an arm.'},
  {ey:'Q4',ti:'Robot Control Systems',teach:'<p>A robot\'s control system processes sensor input and decides what actuators should do.</p><p>Simple robots use basic programmed rules (if sensor detects X, then do Y).</p><p>More advanced robots may use AI to make more flexible, adaptive decisions.</p><p>The control system is effectively the "brain" connecting sensing to action.</p>',q:'What role does the control system play in a robot?',opts:["Processing sensor input and deciding actuator actions", "Only providing decoration", "Only storing unused data", "Only connecting cables"],correct:0,expl:'The control system processes information from sensors and decides how the actuators should respond — the robot\'s "brain".'},
  {ey:'Q5',ti:'Robots in Industry',teach:'<p>Industrial robots perform repetitive tasks like welding, assembly and packaging with high precision.</p><p>Robots can work continuously without fatigue, improving manufacturing efficiency.</p><p>Robotics has changed manufacturing jobs, automating some roles while creating others.</p><p>Safety systems are essential where robots work alongside humans.</p>',q:'What is an advantage industrial robots have over human workers for repetitive tasks?',opts:["They can work continuously without fatigue", "They require no design at all", "They are always cheaper in every case", "They never need maintenance"],correct:0,expl:'Unlike humans, industrial robots can work continuously without becoming tired, improving manufacturing efficiency.'},
  {ey:'Q6',ti:'What is the Internet of Things (IoT)?',teach:'<p>IoT describes everyday physical objects connected to the internet, able to send and receive data.</p><p>Examples include smart thermostats, connected cars, and wearable fitness trackers.</p><p>IoT devices often work together, automating tasks based on shared data.</p><p>The number of connected IoT devices continues to grow rapidly worldwide.</p>',q:'What best defines the Internet of Things (IoT)?',opts:["Everyday physical objects connected to the internet, sharing data", "A single very powerful computer", "An old analogue radio network", "A type of paper filing system"],correct:0,expl:'IoT refers to a network of everyday physical objects connected to the internet, able to collect and exchange data.'},
  {ey:'Q7',ti:'IoT in Smart Homes',teach:'<p>Smart home IoT devices include lights, thermostats, locks, and security cameras.</p><p>These devices can be controlled remotely via smartphone apps.</p><p>Automation rules let devices react to conditions, like lights turning on at sunset.</p><p>Security is a major concern, since compromised smart devices could expose a home to attack.</p>',q:'What is a major concern with smart home IoT devices?',opts:["Security vulnerabilities if devices are compromised", "They are always completely unhackable", "They never need updates", "They cannot connect to apps"],correct:0,expl:'If IoT devices are not properly secured, they can be compromised, creating security risks in the home.'},
  {ey:'Q8',ti:'IoT in Agriculture',teach:'<p>Sensor-based IoT systems can monitor soil moisture, temperature, and crop health.</p><p>This data helps farmers make more informed decisions about irrigation and fertiliser use.</p><p>IoT in agriculture ("smart farming") can improve yields and reduce waste.</p><p>This is an especially promising area for Nigeria\'s largely agricultural economy.</p>',q:'How can IoT sensors help farmers?',opts:["By monitoring soil moisture and crop health data", "By replacing all farm workers instantly", "By eliminating the need for water entirely", "By making crops grow overnight"],correct:0,expl:'IoT sensors provide real, useful data on conditions like soil moisture, helping farmers make better decisions.'},
  {ey:'Q9',ti:'Robotics and IoT Ethics',teach:'<p>Automation raises questions about job displacement and the need for retraining.</p><p>Data collected by IoT devices raises privacy concerns.</p><p>Responsible design considers safety, security and social impact from the start.</p><p>Ongoing regulation is still catching up with rapidly advancing robotics and IoT technology.</p>',q:'What is one ethical concern raised by increasing automation?',opts:["Job displacement and the need for retraining", "Robots becoming too cheap", "Too few sensors being manufactured", "Nothing — automation has no ethical concerns"],correct:0,expl:'As robots and automation take over more tasks, questions arise about job displacement and the need for worker retraining.'},
  {ey:'Q10',ti:'The Future of Robotics and IoT',teach:'<p>Robots and IoT devices are expected to become more capable and more widespread.</p><p>Combining AI with robotics/IoT is creating increasingly autonomous systems.</p><p>Understanding these technologies helps prepare students for future careers.</p><p>Responsible innovation balances technological advancement with safety and ethics.</p>',q:'What combination is creating increasingly autonomous robotic and IoT systems?',opts:["AI combined with robotics/IoT", "Only faster typing speeds", "Only bigger screens", "Only louder speakers"],correct:0,expl:'The combination of AI with robotics and IoT is enabling increasingly autonomous, intelligent systems.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
