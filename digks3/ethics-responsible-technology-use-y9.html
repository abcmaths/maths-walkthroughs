<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethics & Responsible Use of Technology — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Ethics & Responsible Use of Technology</div>
    <div class="strand">Digital Technologies · Emerging Technology</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Digital Ethics?',teach:'<p>Digital ethics concerns making responsible, fair decisions when using technology.</p><p>It covers issues like privacy, honesty, fairness, and respect for others online.</p><p>As technology becomes more powerful, ethical considerations become more important.</p><p>Good digital citizens think about the impact of their online actions on others.</p>',q:'What does digital ethics primarily concern?',opts:["Making responsible, fair decisions when using technology", "Only technical hardware specifications", "Only internet speed", "Only screen resolution"],correct:0,expl:'Digital ethics is about making responsible and fair choices in how we use technology, considering its impact on others.'},
  {ey:'Q2',ti:'Intellectual Property and Plagiarism',teach:'<p>Intellectual property refers to creative and original work owned by its creator.</p><p>Plagiarism means using someone else\'s work without permission or credit.</p><p>Copying code, images, music or text without attribution can have serious consequences.</p><p>Giving proper credit respects the effort of original creators.</p>',q:'What does plagiarism involve?',opts:["Using someone else's work without permission or credit", "Always crediting every source properly", "Creating entirely original work", "Deleting old files"],correct:0,expl:'Plagiarism is the act of using someone else\'s work without their permission or proper credit.'},
  {ey:'Q3',ti:'Privacy and Data Ethics',teach:'<p>Personal data should be collected and used responsibly, with consent where possible.</p><p>Sharing someone else\'s personal information without permission raises ethical concerns.</p><p>Companies have an ethical (and often legal) responsibility to protect user data.</p><p>Being mindful of privacy protects both yourself and others.</p>',q:'What ethical responsibility do companies have regarding user data?',opts:["To protect it responsibly", "No responsibility at all", "To sell it freely without consent", "To ignore data protection laws"],correct:0,expl:'Companies have an ethical and often legal responsibility to protect the personal data they collect from users.'},
  {ey:'Q4',ti:'Cyberbullying and Online Harassment',teach:'<p>Cyberbullying involves using technology to intimidate, harass or harm others.</p><p>It can have serious emotional and psychological effects on victims.</p><p>Bystanders who witness cyberbullying have a responsibility to report it.</p><p>Schools and platforms often have policies to address cyberbullying.</p>',q:'What responsibility do bystanders have if they witness cyberbullying?',opts:["To report it", "To join in", "To ignore it completely", "To share it further"],correct:0,expl:'Bystanders have a responsibility to report cyberbullying rather than ignoring it or participating.'},
  {ey:'Q5',ti:'Misinformation and Fake News',teach:'<p>Misinformation spreads quickly online, sometimes faster than accurate information.</p><p>Checking multiple reliable sources helps verify information before sharing.</p><p>Sharing unverified information, even accidentally, can cause real harm.</p><p>Critical thinking is an essential defence against misinformation.</p>',q:'What is an essential defence against misinformation?',opts:["Critical thinking and checking multiple sources", "Sharing everything immediately", "Trusting the very first source found", "Ignoring all information entirely"],correct:0,expl:'Critical thinking and verifying information across multiple reliable sources helps combat misinformation.'},
  {ey:'Q6',ti:'AI Ethics for Students',teach:'<p>Submitting AI-generated work as entirely your own can raise academic honesty concerns.</p><p>AI can be a helpful tool for learning when used transparently and appropriately.</p><p>Schools are developing policies on responsible AI use in coursework.</p><p>Using AI tools responsibly means understanding their limitations and biases.</p>',q:'What academic concern can arise from submitting AI-generated work as entirely your own?',opts:["Academic honesty/integrity concerns", "No concern at all", "Improved learning automatically", "Faster grading only"],correct:0,expl:'Submitting AI-generated work as entirely your own can raise serious academic honesty and integrity concerns.'},
  {ey:'Q7',ti:'Digital Footprint',teach:'<p>Your digital footprint is the trail of data you leave through online activity.</p><p>Future employers, universities, or others may view your digital footprint.</p><p>Being thoughtful about what you post helps protect your long-term reputation.</p><p>A positive digital footprint can even support future opportunities.</p>',q:'What is a "digital footprint"?',opts:["The trail of data left through your online activity", "A type of computer virus", "A physical shoe print", "A programming language"],correct:0,expl:'A digital footprint is the record of data and activity you leave behind through your use of the internet.'},
  {ey:'Q8',ti:'Accessibility and Inclusion',teach:'<p>Ethical technology design considers users with different abilities and needs.</p><p>Excluding people through poor design can create real, unfair disadvantages.</p><p>Inclusive design benefits everyone, not just users with disabilities.</p><p>Considering diverse users from the start leads to better overall technology.</p>',q:'What does inclusive technology design consider?',opts:["Users with different abilities and needs", "Only the most technically skilled users", "Only users who can afford the newest devices", "Nothing about the users at all"],correct:0,expl:'Inclusive design deliberately considers a wide range of users, including those with different abilities and needs.'},
  {ey:'Q9',ti:'Environmental Impact of Technology',teach:'<p>Manufacturing and disposing of devices has environmental consequences (e-waste).</p><p>Data centres consume significant amounts of energy.</p><p>Responsible use includes recycling devices and being mindful of energy use.</p><p>Sustainable technology practices are becoming an increasing global priority.</p>',q:'What term describes the environmental problem from discarded electronic devices?',opts:["E-waste", "Data privacy", "Bandwidth", "Cybersecurity"],correct:0,expl:'"E-waste" refers to the environmental problem caused by discarded electronic devices.'},
  {ey:'Q10',ti:'Being a Responsible Digital Citizen',teach:'<p>Responsible digital citizens think before they post, share, or comment.</p><p>They respect others\' privacy, intellectual property, and wellbeing online.</p><p>They verify information and avoid spreading misinformation.</p><p>These habits, practised consistently, build a trustworthy digital reputation over time.</p>',q:'What is a core habit of a responsible digital citizen?',opts:["Thinking before posting, sharing, or commenting", "Posting anything instantly with no thought", "Ignoring the feelings of others online", "Sharing unverified information freely"],correct:0,expl:'Thinking carefully before posting, sharing, or commenting is a core habit of responsible digital citizenship.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
