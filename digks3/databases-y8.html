<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction to Databases — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Introduction to Databases</div>
    <div class="strand">Digital Technologies · Data & Programming</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is a Database?',teach:'<p>A database is an organised collection of related data, stored electronically.</p><p>Databases let large amounts of data be stored, searched, and updated efficiently.</p><p>Examples include a school\'s student records system or a library catalogue.</p><p>Databases are far more powerful than simple spreadsheets for large, complex data.</p>',q:'What best describes a database?',opts:["A random pile of unrelated files", "An organised collection of related data stored electronically", "A type of printer", "A single photograph"],correct:1,expl:'A database is a structured, organised collection of related data designed for efficient storage and retrieval.'},
  {ey:'Q2',ti:'Tables, Records and Fields',teach:'<p>A database table organises data into rows and columns, similar to a spreadsheet.</p><p>Each row is a "record" — one complete set of related data (e.g. one student).</p><p>Each column is a "field" — one type of data (e.g. Name, Age, Year Group).</p><p>Well-designed tables avoid unnecessary duplication of data.</p>',q:'What does one row in a database table typically represent?',opts:["One field", "One record (a complete set of related data)", "The entire database", "A password"],correct:1,expl:'A row (record) represents one complete entry, such as all the information about a single student.'},
  {ey:'Q3',ti:'Primary Keys',teach:'<p>A primary key is a unique identifier for each record in a table (e.g. Student ID).</p><p>Primary keys ensure no two records are mistaken for one another.</p><p>They are essential for linking related tables together correctly.</p><p>A good primary key never changes and is always unique.</p>',q:'What is the purpose of a primary key in a database table?',opts:["To make the table more colourful", "To uniquely identify each record", "To delete duplicate records automatically", "To store passwords only"],correct:1,expl:'A primary key uniquely identifies each record, ensuring no two records can be confused with one another.'},
  {ey:'Q4',ti:'Queries',teach:'<p>A query is a request to search, filter, or retrieve specific data from a database.</p><p>Queries can filter by conditions, like "Year Group = 8".</p><p>Well-written queries return exactly the data needed, nothing more.</p><p>Queries are often written using a language called SQL (in more advanced systems).</p>',q:'What is the purpose of a database query?',opts:["To permanently delete the database", "To search, filter or retrieve specific data", "To design the database's colour scheme", "To connect to Wi-Fi"],correct:1,expl:'A query is a request used to search for, filter, and retrieve specific data from a database.'},
  {ey:'Q5',ti:'Sorting and Filtering Data',teach:'<p>Sorting arranges records in a chosen order (e.g. alphabetically, by date).</p><p>Filtering narrows down records to only those meeting specific criteria.</p><p>Combining sorting and filtering helps quickly find exactly what\'s needed.</p><p>These operations are core to making large databases genuinely useful.</p>',q:'What does filtering do to a set of database records?',opts:["Deletes them permanently", "Narrows records down to only those meeting specific criteria", "Sorts them alphabetically only", "Encrypts them"],correct:1,expl:'Filtering narrows a large set of records down to only those that match specific chosen criteria.'},
  {ey:'Q6',ti:'Relational Databases',teach:'<p>A relational database links multiple related tables together.</p><p>Relationships are usually created using primary and "foreign" keys.</p><p>This avoids duplicating the same data across many separate tables.</p><p>Most large-scale systems (banks, schools, hospitals) use relational databases.</p>',q:'What links tables together in a relational database?',opts:["Primary and foreign keys", "Random chance", "File compression", "The colour of the table"],correct:0,expl:'Primary and foreign keys create the links (relationships) between separate tables in a relational database.'},
  {ey:'Q7',ti:'Data Validation',teach:'<p>Validation checks that data entered into a database meets expected rules.</p><p>Example: a "Year Group" field might only accept numbers 7-12.</p><p>Validation helps prevent errors and maintain data quality.</p><p>Well-designed forms guide users to enter data correctly the first time.</p>',q:'What is the purpose of data validation?',opts:["To make data entry more confusing", "To check that entered data meets expected rules, reducing errors", "To delete valid data", "To slow down the database intentionally"],correct:1,expl:'Validation rules check that entered data is reasonable and correctly formatted, helping prevent errors.'},
  {ey:'Q8',ti:'Databases in Everyday Life',teach:'<p>Schools use databases for student records, attendance, and grades.</p><p>Hospitals use databases to manage patient records securely.</p><p>Online shops use databases to track products, orders, and customers.</p><p>Banks rely on databases to manage millions of accounts and transactions.</p>',q:'Which organisation would most likely use a database to track patient records?',opts:["A hospital", "A single street vendor with no records", "A library with only 5 books", "None of these need databases"],correct:0,expl:'Hospitals rely on databases to securely store and manage large volumes of patient records.'},
  {ey:'Q9',ti:'Data Security in Databases',teach:'<p>Databases often store sensitive information, making security essential.</p><p>Access controls limit who can view or edit specific data.</p><p>Encryption protects data even if it is stolen or intercepted.</p><p>Regular backups protect against data loss from hardware failure or attacks.</p>',q:'Why is security especially important for databases?',opts:["Databases never contain sensitive information", "Databases often store large amounts of sensitive information", "Security slows down data entry unnecessarily", "Only small databases need security"],correct:1,expl:'Databases frequently store sensitive personal or organisational information, making strong security essential.'},
  {ey:'Q10',ti:'Designing a Simple Database',teach:'<p>Good database design starts by identifying what data needs to be stored.</p><p>Deciding on tables, fields, and relationships comes before building the database.</p><p>Avoiding duplicate data (normalisation) improves efficiency and consistency.</p><p>Testing a database with sample data helps confirm the design works well.</p>',q:'What should come first when designing a database?',opts:["Building the final database immediately", "Identifying what data needs to be stored", "Choosing a colour scheme", "Deleting all existing data"],correct:1,expl:'Good design starts by carefully identifying exactly what data needs to be stored before building any structure.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
