<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction to Digital Technologies — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Introduction to Digital Technologies</div>
    <div class="strand">Digital Technologies · Foundations</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Digital Technology?',teach:'<p>Digital technology means using computers and electronic devices to create, store and share information.</p><p>Examples include phones, laptops, tablets, smart TVs and games consoles.</p><p>Digital devices process data using binary — patterns of 0s and 1s.</p><p>Nigeria\'s new curriculum makes this subject compulsory from JS1 to SS3.</p>',q:'Which of these is an example of a digital device?',opts:["A wooden abacus", "A smartphone", "A paper diary", "A wall clock (analogue)"],correct:1,expl:'A smartphone is a digital device — it stores and processes information electronically using binary code.'},
  {ey:'Q2',ti:'Analogue vs Digital',teach:'<p>Analogue signals change smoothly (like a dimmer switch or a vinyl record).</p><p>Digital signals use discrete steps — usually just on/off (1/0).</p><p>Digital signals are easier to copy perfectly and resist noise/interference.</p><p>Most modern devices convert analogue input (sound, light) into digital data.</p>',q:'A digital clock shows exact numbers like 14:32. What signal type is this?',opts:["Analogue", "Digital", "Mechanical", "Manual"],correct:1,expl:'A digital clock jumps between discrete exact values rather than sweeping smoothly like an analogue hand — this is digital.'},
  {ey:'Q3',ti:'History of Computing',teach:'<p>Early computers like ENIAC (1945) filled entire rooms.</p><p>Microchips in the 1970s shrank computers to desktop size.</p><p>Smartphones now hold more computing power than 1969\'s Apollo mission computers.</p><p>Understanding history helps us appreciate how fast technology changes.</p>',q:'What allowed computers to shrink from room-sized to desktop-sized?',opts:["Bigger buildings", "The invention of microchips", "More electricity", "Faster internet"],correct:1,expl:'Microchips (integrated circuits) packed millions of components onto a tiny silicon chip, shrinking computers dramatically.'},
  {ey:'Q4',ti:'Uses of Digital Technology',teach:'<p>Digital technology is used in education, healthcare, banking, agriculture and entertainment.</p><p>In Nigeria, mobile banking (like fintech apps) has transformed how people access money.</p><p>Farmers use digital tools for weather forecasts and market prices.</p><p>Hospitals use digital records to track patient care more safely.</p>',q:'Which sector uses digital technology to give farmers weather and price information?',opts:["Entertainment", "Agriculture", "Fashion", "Sport"],correct:1,expl:'Digital agriculture tools give farmers real-time weather and market data to make better decisions.'},
  {ey:'Q5',ti:'Input, Process, Output',teach:'<p>Every computer system follows Input → Process → Output.</p><p>Input devices bring data in (keyboard, camera, microphone).</p><p>The processor (CPU) carries out the processing step.</p><p>Output devices show results (screen, speaker, printer).</p>',q:'Which of these is an output device?',opts:["Keyboard", "Microphone", "Printer", "Scanner"],correct:2,expl:'A printer produces output — it shows the result of processing, unlike input devices which bring data in.'},
  {ey:'Q6',ti:'Hardware vs Software',teach:'<p>Hardware is the physical parts of a computer you can touch.</p><p>Software is the set of instructions (programs) that tell hardware what to do.</p><p>Examples of hardware: keyboard, monitor, hard drive.</p><p>Examples of software: Word, a web browser, a game.</p>',q:'Which of these is software, not hardware?',opts:["Monitor", "Mouse", "Web browser", "Keyboard"],correct:2,expl:'A web browser is a program (software) — it is a set of instructions, not a physical part.'},
  {ey:'Q7',ti:'Digital Devices Around Us',teach:'<p>Digital devices include smartphones, smart TVs, fitness trackers and smart speakers.</p><p>The "Internet of Things" connects everyday objects to the internet.</p><p>Wearable devices can track steps, heart rate and sleep.</p><p>More devices are becoming "smart" every year.</p>',q:'A fitness tracker that counts your steps and syncs to an app is an example of what?',opts:["A purely analogue device", "An Internet of Things (IoT) device", "A typewriter", "A landline telephone"],correct:1,expl:'It connects to the internet/app and shares data — a hallmark of an IoT device.'},
  {ey:'Q8',ti:'Digital Citizenship Basics',teach:'<p>Digital citizenship means using technology responsibly and respectfully.</p><p>This includes being polite online, protecting privacy, and thinking before posting.</p><p>Cyberbullying is a serious issue that digital citizens must avoid and report.</p><p>Good digital citizens verify information before sharing it.</p>',q:'Which behaviour shows good digital citizenship?',opts:["Sharing someone's private photo without asking", "Verifying a story before sharing it online", "Posting mean comments anonymously", "Ignoring cyberbullying you witness"],correct:1,expl:'Checking facts before sharing helps stop the spread of misinformation — a key digital citizenship skill.'},
  {ey:'Q9',ti:'Safe Use of Technology',teach:'<p>Never share passwords, addresses or personal photos with strangers online.</p><p>Take regular screen breaks to protect your eyes and posture.</p><p>Tell a trusted adult if something online makes you uncomfortable.</p><p>Use strong, unique passwords for different accounts.</p>',q:'What should you do if a stranger online asks for your home address?',opts:["Give it to them if they seem friendly", "Refuse and tell a trusted adult", "Give a fake address instead", "Ask them for their address first"],correct:1,expl:'Never share personal details with strangers online — always refuse and report it to a trusted adult.'},
  {ey:'Q10',ti:'Careers in Digital Technology',teach:'<p>Careers include software developer, network engineer, cybersecurity analyst and data scientist.</p><p>Nigeria\'s tech sector is growing rapidly, especially in fintech and mobile apps.</p><p>Digital skills are useful in almost every career, not just "tech jobs".</p><p>Starting early with coding and digital literacy builds a strong foundation.</p>',q:'Which of these is a career directly in digital technology?',opts:["Farmer", "Cybersecurity analyst", "Tailor", "Carpenter"],correct:1,expl:'A cybersecurity analyst protects digital systems from attack — a core digital technology career.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
