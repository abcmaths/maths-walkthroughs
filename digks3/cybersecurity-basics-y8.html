<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity Basics — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Cybersecurity Basics</div>
    <div class="strand">Digital Technologies · Cybersecurity</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Cybersecurity?',teach:'<p>Cybersecurity is the practice of protecting computer systems, networks, and data from attack.</p><p>Threats include viruses, hackers, phishing, and data theft.</p><p>Cybersecurity matters for individuals, schools, businesses and governments alike.</p><p>As more of life moves online, cybersecurity becomes more important every year.</p>',q:'What does cybersecurity primarily aim to protect?',opts:["Only physical buildings", "Computer systems, networks and data from attack", "Only paper documents", "Nothing important"],correct:1,expl:'Cybersecurity focuses on protecting digital systems, networks, and data from various forms of attack.'},
  {ey:'Q2',ti:'Malware',teach:'<p>Malware is malicious software designed to damage or gain unauthorised access to systems.</p><p>Types include viruses, worms, trojans, ransomware and spyware.</p><p>Malware can spread through infected downloads, email attachments, or removable drives.</p><p>Antivirus software helps detect and remove malware.</p>',q:'What is "malware"?',opts:["Malicious software designed to damage or access systems without permission", "A type of helpful productivity app", "A brand of laptop", "A type of internet cable"],correct:0,expl:'Malware is malicious software created to damage systems or gain unauthorised access.'},
  {ey:'Q3',ti:'Phishing',teach:'<p>Phishing is a scam that tricks users into revealing personal information, like passwords.</p><p>Phishing often arrives as fake emails or messages pretending to be from trusted organisations.</p><p>Warning signs include urgent language, suspicious links, and requests for sensitive data.</p><p>Never click suspicious links or provide personal details from unexpected messages.</p>',q:'What is a common warning sign of a phishing message?',opts:["A calm, expected message from a known friend", "Urgent language demanding personal information immediately", "A message with no links at all", "A message written entirely in your native language"],correct:1,expl:'Phishing messages often use urgent, pressuring language to trick people into revealing sensitive information quickly.'},
  {ey:'Q4',ti:'Passwords and Authentication',teach:'<p>Strong passwords are long, unique, and mix letters, numbers and symbols.</p><p>Never reuse the same password across multiple important accounts.</p><p>Two-factor authentication (2FA) adds an extra layer of protection.</p><p>Password managers can help generate and remember strong, unique passwords.</p>',q:'What makes a password "strong"?',opts:["Being short and simple, like \"1234\"", "Being long, unique, and mixing letters, numbers and symbols", "Being the same across every single account", "Being your name and birthday"],correct:1,expl:'Strong passwords are long, unique to each account, and combine different character types.'},
  {ey:'Q5',ti:'Ransomware',teach:'<p>Ransomware encrypts a victim\'s files and demands payment for the decryption key.</p><p>It can spread through infected email attachments or compromised websites.</p><p>Paying the ransom does not guarantee files will be recovered.</p><p>Regular backups are one of the best defences against ransomware.</p>',q:'What does ransomware typically do to a victim\'s files?',opts:["Deletes them permanently with no trace", "Encrypts them and demands payment for the decryption key", "Makes them load faster", "Automatically backs them up for free"],correct:1,expl:'Ransomware encrypts files, locking the victim out until a ransom is paid — though payment doesn\'t guarantee recovery.'},
  {ey:'Q6',ti:'Social Engineering',teach:'<p>Social engineering manipulates people into revealing information or granting access.</p><p>Attackers may impersonate IT staff, colleagues, or trusted authorities.</p><p>Being cautious and verifying identity before sharing information helps prevent this.</p><p>Social engineering exploits human trust rather than purely technical weaknesses.</p>',q:'What does "social engineering" in cybersecurity mainly exploit?',opts:["Software bugs only", "Human trust and behaviour", "Hardware failures only", "Internet cables"],correct:1,expl:'Social engineering attacks exploit human psychology and trust, rather than purely technical vulnerabilities.'},
  {ey:'Q7',ti:'Firewalls and Antivirus',teach:'<p>A firewall filters network traffic to block unauthorised access.</p><p>Antivirus software scans for and removes known malicious programs.</p><p>Both should be kept updated to recognise the latest threats.</p><p>Using both together provides layered ("defence in depth") protection.</p>',q:'What does antivirus software primarily do?',opts:["Speeds up internet connections", "Scans for and removes malicious software", "Prints documents", "Connects devices to Wi-Fi"],correct:1,expl:'Antivirus software is designed to detect, block, and remove malicious software from a device.'},
  {ey:'Q8',ti:'Safe Browsing Habits',teach:'<p>Look for "https://" and a padlock icon for secure website connections.</p><p>Avoid downloading files or software from untrusted sources.</p><p>Keep browsers and plugins updated to patch security vulnerabilities.</p><p>Be cautious of pop-ups claiming your device is infected — these are often scams.</p>',q:'What indicates a website has a secure connection?',opts:["A blinking red banner", "\"https://\" and a padlock icon in the address bar", "A very colourful design", "Lots of pop-up adverts"],correct:1,expl:'"https://" with a padlock icon indicates the connection between your browser and the site is encrypted and secure.'},
  {ey:'Q9',ti:'Protecting Personal Information',teach:'<p>Limit how much personal information you share publicly online.</p><p>Review privacy settings on social media and apps regularly.</p><p>Be wary of quizzes and apps that request excessive personal data.</p><p>Personal information can be used for identity theft if it falls into the wrong hands.</p>',q:'Why should you review privacy settings on social media regularly?',opts:["To share even more personal data with strangers", "To control who can see your personal information", "Privacy settings never need reviewing", "To make your account easier to hack"],correct:1,expl:'Reviewing privacy settings helps you control and limit who can access your personal information.'},
  {ey:'Q10',ti:'Reporting Cybersecurity Incidents',teach:'<p>If you suspect a hack, phishing attempt, or malware infection, report it immediately.</p><p>Tell a trusted adult, teacher, or IT department about suspicious activity.</p><p>Changing passwords quickly after a suspected breach limits further damage.</p><p>Reporting incidents helps protect not just you, but others who might be targeted too.</p>',q:'What should you do if you suspect your account has been hacked?',opts:["Ignore it and hope it resolves itself", "Report it and change your password immediately", "Share your new password with more people", "Wait one year before doing anything"],correct:1,expl:'Acting quickly — reporting the incident and changing passwords — helps limit damage from a suspected hack.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

    }, { onConflict: 'student_id,topic_id' });

</script>
</body>
</html>
