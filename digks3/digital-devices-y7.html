<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Devices — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Digital Devices</div>
    <div class="strand">Digital Technologies · Foundations</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Categories of Digital Devices',teach:'<p>Digital devices include computers, phones, tablets, wearables and smart appliances.</p><p>Each device type is optimised for particular tasks and portability needs.</p><p>The line between device categories is blurring (e.g. tablets acting like laptops).</p><p>Choosing a device depends on the task, budget and portability needed.</p>',q:'Which of these is a wearable digital device?',opts:["Desktop computer", "Smartwatch", "Server rack", "Router"],correct:1,expl:'A smartwatch is worn on the body and is a clear example of a wearable digital device.'},
  {ey:'Q2',ti:'Smartphones',teach:'<p>Smartphones combine a phone, camera, computer and internet device in one.</p><p>They run apps (applications) for almost every task imaginable.</p><p>Mobile operating systems (Android, iOS) manage smartphone hardware and apps.</p><p>Smartphones have transformed communication, banking and commerce in Nigeria.</p>',q:'What operating systems commonly run on smartphones?',opts:["Windows Server and Linux Server", "Android and iOS", "MS-DOS", "None — phones don't need an OS"],correct:1,expl:'Android and iOS are the two dominant mobile operating systems used on smartphones today.'},
  {ey:'Q3',ti:'Tablets and Laptops',teach:'<p>Tablets are touch-focused, portable, and good for media consumption.</p><p>Laptops offer more processing power and physical keyboards for productivity.</p><p>2-in-1 devices combine features of both tablets and laptops.</p><p>Battery life and portability are key factors when choosing between them.</p>',q:'Which device type typically offers more raw processing power for demanding tasks?',opts:["Tablet", "Laptop", "Smartwatch", "Digital camera"],correct:1,expl:'Laptops generally have more powerful processors and better cooling, suited to demanding tasks.'},
  {ey:'Q4',ti:'Wearable Technology',teach:'<p>Wearables include smartwatches, fitness trackers and smart glasses.</p><p>They often track health data like heart rate, steps and sleep patterns.</p><p>Wearables sync data to smartphone apps via Bluetooth.</p><p>Privacy is an important concern since wearables collect personal health data.</p>',q:'How do wearables typically send their data to a smartphone?',opts:["Via a fax machine", "Via Bluetooth", "Via a landline", "They can't send data"],correct:1,expl:'Wearables commonly use Bluetooth, a short-range wireless technology, to sync with smartphones.'},
  {ey:'Q5',ti:'Smart Home Devices',teach:'<p>Smart home devices include smart speakers, thermostats, lights and cameras.</p><p>They connect to Wi-Fi and can be controlled remotely via apps.</p><p>Voice assistants (like Siri or Google Assistant) let users control devices by voice.</p><p>Smart devices raise privacy and security concerns since they are always listening/connected.</p>',q:'What technology do most smart home devices use to connect?',opts:["Wi-Fi", "A physical wired-only connection with no internet", "Radio waves from the 1980s", "Morse code"],correct:0,expl:'Most smart home devices connect to the internet via Wi-Fi to communicate with apps and services.'},
  {ey:'Q6',ti:'Gaming Devices',teach:'<p>Gaming consoles (like PlayStation, Xbox) are specialised computers for games.</p><p>Gaming PCs use powerful graphics cards (GPUs) for realistic visuals.</p><p>Mobile gaming has grown massively due to widespread smartphone ownership.</p><p>Cloud gaming lets players stream games without powerful local hardware.</p>',q:'What specialised hardware helps produce realistic graphics in gaming devices?',opts:["GPU (Graphics Processing Unit)", "A basic keyboard", "A dot-matrix printer", "A landline modem"],correct:0,expl:'A GPU is specialised hardware designed to render graphics quickly and realistically.'},
  {ey:'Q7',ti:'Digital Cameras',teach:'<p>Digital cameras capture images as data instead of on film.</p><p>Image quality is often measured in megapixels.</p><p>Smartphones have largely replaced standalone cameras for casual photography.</p><p>Professional photographers still prefer dedicated cameras for greater control.</p>',q:'What replaced film in digital cameras?',opts:["Digital sensors that capture images as data", "Nothing — film is still used", "Paper", "Magnetic tape only"],correct:0,expl:'Digital cameras use electronic sensors to capture and store images as digital data instead of on film.'},
  {ey:'Q8',ti:'The Internet of Things (IoT)',teach:'<p>IoT refers to everyday objects connected to the internet, sharing data.</p><p>Examples: smart fridges, connected cars, industrial sensors.</p><p>IoT enables automation, like a thermostat learning your schedule.</p><p>Security is a major concern as more devices connect to networks.</p>',q:'What best describes the Internet of Things?',opts:["Everyday objects connected to the internet, sharing data", "A single very powerful supercomputer", "An old telephone network", "A type of paper filing system"],correct:0,expl:'IoT connects everyday physical objects to the internet so they can collect and share data.'},
  {ey:'Q9',ti:'Choosing the Right Device for a Task',teach:'<p>Consider portability, power, battery life, cost, and intended use.</p><p>A student writing essays may prefer a laptop over a tablet.</p><p>A fitness enthusiast may prioritise a wearable fitness tracker.</p><p>Matching device to task avoids wasted money and frustration.</p>',q:'Which device would best suit someone who mainly needs to write long essays?',opts:["A smartwatch", "A laptop", "A basic feature phone", "A digital camera"],correct:1,expl:'A laptop, with its keyboard and processing power, suits long-form writing tasks better than the alternatives.'},
  {ey:'Q10',ti:'Caring for Digital Devices',teach:'<p>Keep devices clean, charged sensibly, and protected from drops and liquids.</p><p>Update software regularly to keep devices secure and running well.</p><p>Back up important data in case a device is lost, stolen or damaged.</p><p>Recycle old devices responsibly through e-waste programmes.</p>',q:'What should you do with important data in case a device is lost or damaged?',opts:["Nothing, it doesn't matter", "Back it up regularly", "Store it only in one place", "Delete it to save space"],correct:1,expl:'Regular backups protect important data from being lost if a device is damaged, lost or stolen.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</body>
</html>
