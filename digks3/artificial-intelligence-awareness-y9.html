<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artificial Intelligence Awareness — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Artificial Intelligence Awareness</div>
    <div class="strand">Digital Technologies · Emerging Technology</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Artificial Intelligence?',teach:'<p>AI refers to computer systems designed to perform tasks that normally require human intelligence.</p><p>Examples include recognising speech, images, and making recommendations.</p><p>AI is not "thinking" like a human — it identifies patterns in huge amounts of data.</p><p>AI is increasingly present in everyday tools like phones, search engines, and apps.</p>',q:'What best describes Artificial Intelligence?',opts:["Computer systems performing tasks that normally require human intelligence", "A type of physical hardware only", "A brand of smartphone", "A programming language"],correct:0,expl:'AI refers to systems built to carry out tasks — like recognising images or speech — that typically require human-like intelligence.'},
  {ey:'Q2',ti:'Machine Learning Basics',teach:'<p>Machine learning is a type of AI where systems learn patterns from data rather than being explicitly programmed for every rule.</p><p>More (and better) training data generally improves a machine learning model\'s accuracy.</p><p>Machine learning powers things like spam filters and recommendation systems.</p><p>Understanding this helps explain why AI systems sometimes make surprising mistakes.</p>',q:'What does machine learning use to improve its accuracy?',opts:["Training data", "Random guessing only", "More electricity only", "A louder speaker"],correct:0,expl:'Machine learning models learn patterns from training data, and more/better data generally improves their accuracy.'},
  {ey:'Q3',ti:'Everyday Examples of AI',teach:'<p>Voice assistants (like Siri, Alexa, Google Assistant) use AI to understand speech.</p><p>Recommendation systems (Netflix, YouTube, Spotify) use AI to suggest content.</p><p>Face unlock on smartphones uses AI-based image recognition.</p><p>Spam filters use AI to detect and block unwanted emails.</p>',q:'Which of these uses AI to suggest content you might enjoy?',opts:["A recommendation system like Netflix", "A wooden pencil", "A paper map", "A landline phone"],correct:0,expl:'Recommendation systems like Netflix use AI to analyse your viewing habits and suggest content.'},
  {ey:'Q4',ti:'Benefits of AI',teach:'<p>AI can process huge amounts of data far faster than humans.</p><p>AI assists in medicine, helping detect diseases earlier from scans.</p><p>AI can automate repetitive tasks, freeing humans for more creative work.</p><p>AI translation tools help break down language barriers globally.</p>',q:'What is one genuine benefit AI can provide in medicine?',opts:["Helping detect diseases earlier from scans", "Guaranteeing no one ever gets ill", "Replacing all doctors entirely", "Making hospitals disappear"],correct:0,expl:'AI can assist doctors by analysing medical scans and helping detect diseases earlier and more accurately.'},
  {ey:'Q5',ti:'Risks and Limitations of AI',teach:'<p>AI can reflect and amplify biases present in its training data.</p><p>AI-generated content ("deepfakes") can be used to spread misinformation.</p><p>AI systems can make confident-sounding but incorrect statements.</p><p>Over-reliance on AI without human judgement can lead to poor decisions.</p>',q:'What is a genuine risk associated with AI systems?',opts:["They can reflect and amplify biases present in their training data", "They are always perfectly unbiased", "They never make mistakes", "They cannot be misused"],correct:0,expl:'AI systems learn from data, and if that data contains biases, the AI can reflect and even amplify them.'},
  {ey:'Q6',ti:'AI Ethics',teach:'<p>Ethical AI use considers fairness, transparency, privacy, and accountability.</p><p>Who is responsible when an AI system makes a harmful decision is a genuinely debated question.</p><p>Ethical guidelines are still being developed globally as AI rapidly advances.</p><p>Responsible AI development involves diverse teams checking for bias and harm.</p>',q:'Which of these is a key concern in AI ethics?',opts:["Fairness and accountability", "Screen brightness", "Font size", "Cable length"],correct:0,expl:'Fairness, transparency and accountability are core concerns in the ethical development and use of AI.'},
  {ey:'Q7',ti:'AI in Nigeria and Africa',teach:'<p>Nigeria\'s tech sector is exploring AI in fintech, agriculture and healthcare.</p><p>Local language AI tools are being developed to serve Nigerian languages better.</p><p>AI education initiatives aim to build local talent and reduce reliance on foreign tools.</p><p>Africa\'s growing tech ecosystem sees AI as both an opportunity and a challenge.</p>',q:'Which sector in Nigeria is exploring AI use, according to recent trends?',opts:["Fintech", "None — Nigeria has no interest in AI", "Only outside Africa", "Only in outer space"],correct:0,expl:'Nigeria\'s growing fintech sector is among those actively exploring AI applications.'},
  {ey:'Q8',ti:'How AI "Learns"',teach:'<p>AI models are trained by being shown vast amounts of example data.</p><p>During training, the model adjusts internal parameters to improve its predictions.</p><p>After training, the model can make predictions on new, unseen data.</p><p>AI doesn\'t "understand" in a human sense — it identifies statistical patterns.</p>',q:'What happens during AI "training"?',opts:["The model adjusts internal parameters based on example data", "The model becomes a physical robot", "The model deletes all its data", "The model gains human consciousness"],correct:0,expl:'During training, an AI model repeatedly adjusts its internal parameters to improve how well it predicts outcomes from data.'},
  {ey:'Q9',ti:'Recognising AI-Generated Content',teach:'<p>AI can now generate realistic text, images, and even voices.</p><p>Critical thinking is essential to avoid being fooled by AI-generated misinformation.</p><p>Some tools exist to help detect AI-generated content, though detection isn\'t perfect.</p><p>Being AI-literate means understanding both the power and the limits of these tools.</p>',q:'Why is critical thinking important regarding AI-generated content?',opts:["To avoid being fooled by realistic AI-generated misinformation", "It has no importance", "AI content is always clearly labelled", "AI cannot generate realistic content"],correct:0,expl:'Because AI-generated content can look very realistic, critical thinking helps prevent being misled by misinformation.'},
  {ey:'Q10',ti:'The Future of AI',teach:'<p>AI is expected to keep advancing rapidly across many industries.</p><p>Preparing for an AI-influenced future means developing strong digital and critical thinking skills.</p><p>Jobs will likely change, with some tasks automated and new roles emerging.</p><p>Staying informed and adaptable is the best preparation for an uncertain but AI-influenced future.</p>',q:'What is a sensible way to prepare for an AI-influenced future?',opts:["Develop strong digital and critical thinking skills", "Avoid learning about AI entirely", "Assume nothing will ever change", "Refuse to use any modern technology"],correct:0,expl:'Developing strong digital literacy and critical thinking skills is a sensible way to prepare for an AI-influenced future.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
