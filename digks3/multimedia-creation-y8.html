<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multimedia Creation — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Multimedia Creation</div>
    <div class="strand">Digital Technologies · Data & Programming</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Multimedia?',teach:'<p>Multimedia combines different content types: text, images, audio, video and animation.</p><p>Multimedia projects are used in education, marketing, entertainment and journalism.</p><p>Good multimedia projects combine elements purposefully, not just for decoration.</p><p>Multimedia creation builds both technical and creative skills.</p>',q:'Which best describes multimedia?',opts:["Only plain text documents", "A combination of text, images, audio, video and animation", "Only spreadsheets", "A single black and white photo"],correct:1,expl:'Multimedia refers to content that combines multiple media types — text, images, audio, video, and animation.'},
  {ey:'Q2',ti:'Planning a Multimedia Project',teach:'<p>Good projects start with a clear purpose and target audience in mind.</p><p>A storyboard plans out scenes, timing, and content before creation begins.</p><p>Gathering or creating assets (images, audio, footage) comes next.</p><p>Planning saves significant time during the actual production stage.</p>',q:'What is a storyboard used for in multimedia creation?',opts:["Storing passwords", "Planning scenes, timing and content before production", "Compressing files", "Connecting to the internet"],correct:1,expl:'A storyboard is a planning tool that maps out scenes and content before actual production begins.'},
  {ey:'Q3',ti:'Image Editing Basics',teach:'<p>Image editing software allows cropping, resizing, colour adjustment, and retouching.</p><p>Choosing the right image format (JPEG, PNG) affects quality and file size.</p><p>Copyright rules apply to images — always check permission before reuse.</p><p>Good image editing enhances a project without misleading viewers.</p>',q:'Why is checking copyright important before using an image?',opts:["Copyright never applies to digital images", "Using someone's image without permission may be illegal", "Checking copyright makes images load faster", "It has no real importance"],correct:1,expl:'Using copyrighted images without permission can be illegal, so checking rights and licensing matters.'},
  {ey:'Q4',ti:'Audio Editing Basics',teach:'<p>Audio editing software allows trimming, mixing and adjusting volume levels.</p><p>Background music and sound effects can enhance a multimedia project.</p><p>Poor audio quality (background noise, distortion) can ruin an otherwise good project.</p><p>Royalty-free audio libraries provide legally usable music and sound effects.</p>',q:'What is an advantage of using royalty-free audio libraries?',opts:["They are always illegal to use", "They provide legally usable music and sound effects", "They only contain silence", "They cannot be edited"],correct:1,expl:'Royalty-free libraries provide audio that can be legally used in projects without copyright issues.'},
  {ey:'Q5',ti:'Video Editing Basics',teach:'<p>Video editing software allows trimming clips, adding transitions, and combining footage.</p><p>Text overlays and captions can add clarity or accessibility to a video.</p><p>Exporting in the right format and resolution matters for how a video will be viewed.</p><p>Good pacing keeps a video engaging without dragging or rushing.</p>',q:'What might text overlays add to a video besides visual interest?',opts:["Nothing useful at all", "Clarity or accessibility, such as captions", "Slower loading times only", "Automatic copyright removal"],correct:1,expl:'Text overlays like captions can improve clarity and accessibility for viewers, including those with hearing difficulties.'},
  {ey:'Q6',ti:'Animation Basics',teach:'<p>Animation creates the illusion of movement using a sequence of images or frames.</p><p>Frame rate (frames per second) affects how smooth an animation appears.</p><p>Simple animation tools let beginners create moving characters or effects.</p><p>Animation is widely used in games, adverts, and educational content.</p>',q:'What creates the illusion of movement in animation?',opts:["A single unchanging image", "A sequence of images or frames shown quickly", "Deleting all frames", "Increasing file compression only"],correct:1,expl:'Animation works by displaying a rapid sequence of slightly different images/frames, creating the illusion of movement.'},
  {ey:'Q7',ti:'Combining Media Elements',teach:'<p>Multimedia projects often layer images, text, audio and video together.</p><p>Consistent style (colours, fonts) helps a project feel professional and cohesive.</p><p>Balancing different elements avoids overwhelming the audience.</p><p>Testing the final combined project on the intended platform is essential.</p>',q:'What helps a multimedia project feel professional and cohesive?',opts:["Using completely random, inconsistent styles", "Consistent colours and fonts throughout", "Overloading every scene with maximum elements", "Ignoring the target platform entirely"],correct:1,expl:'Consistent visual style across a project helps it feel professional and unified rather than chaotic.'},
  {ey:'Q8',ti:'File Formats for Multimedia',teach:'<p>Common image formats: JPEG, PNG, GIF.</p><p>Common audio formats: MP3, WAV.</p><p>Common video formats: MP4, MOV.</p><p>Choosing the right format balances quality, compatibility and file size.</p>',q:'Which file format is commonly used for video?',opts:[".jpg", ".mp3", ".mp4", ".docx"],correct:2,expl:'.mp4 is one of the most widely used and compatible video file formats.'},
  {ey:'Q9',ti:'Copyright and Attribution',teach:'<p>Always credit the original creator when using someone else\'s work, where required.</p><p>Creative Commons licences specify how content may legally be reused.</p><p>Plagiarism in multimedia includes using someone\'s work without permission or credit.</p><p>Understanding copyright protects both creators and users from legal problems.</p>',q:'What do Creative Commons licences specify?',opts:["Nothing relevant to reuse", "How content may legally be reused", "The exact price of all digital content", "A ban on all multimedia reuse"],correct:1,expl:'Creative Commons licences clearly specify the conditions under which content can be legally reused by others.'},
  {ey:'Q10',ti:'Sharing and Publishing Multimedia',teach:'<p>Multimedia projects can be shared via social media, websites, or school platforms.</p><p>Considering the target audience affects platform and format choices.</p><p>Reviewing and testing before publishing avoids embarrassing mistakes.</p><p>Feedback from others can improve a project before its final release.</p>',q:'What should happen before publishing a multimedia project widely?',opts:["Nothing — publish immediately with no review", "Reviewing and testing the project first", "Deleting the original files", "Removing all audio and video"],correct:1,expl:'Reviewing and testing before publishing helps catch mistakes and improve overall quality.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
