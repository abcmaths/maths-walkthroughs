<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Services — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Internet Services</div>
    <div class="strand">Digital Technologies · Networking</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What are Internet Services?',teach:'<p>Internet services are functions provided over the internet, like email, web browsing and file sharing.</p><p>Common services include the World Wide Web (WWW), email, and cloud storage.</p><p>Streaming services deliver video and audio content over the internet.</p><p>New internet services continue to emerge as technology develops.</p>',q:'Which of these is an internet service?',opts:["Email", "A wooden table", "A paper notebook", "A physical calculator"],correct:0,expl:'Email is a service delivered over the internet, allowing digital communication.'},
  {ey:'Q2',ti:'The Domain Name System (DNS)',teach:'<p>DNS translates human-friendly domain names (like google.com) into IP addresses.</p><p>Without DNS, users would need to remember numeric IP addresses for every website.</p><p>DNS servers act like a phonebook for the internet.</p><p>DNS lookups happen automatically and quickly behind the scenes.</p>',q:'What does DNS translate domain names into?',opts:["Passwords", "IP addresses", "File extensions", "Usernames"],correct:1,expl:'DNS (Domain Name System) translates human-readable domain names into numeric IP addresses.'},
  {ey:'Q3',ti:'Web Hosting',teach:'<p>Websites are stored on servers called web hosts, which make them available online.</p><p>Hosting companies rent server space to individuals and businesses.</p><p>Reliable hosting ensures a website stays available and loads quickly.</p><p>Some hosting is free (with limitations); other hosting is paid for more control.</p>',q:'What does a web hosting company provide?',opts:["Server space to store and serve websites online", "Free laptops", "Physical office space only", "Printer ink"],correct:0,expl:'Web hosting companies provide server space and infrastructure to make websites available on the internet.'},
  {ey:'Q4',ti:'Cloud Services',teach:'<p>Cloud services let users store data and run applications over the internet rather than locally.</p><p>Examples: Google Drive, Dropbox, Microsoft 365, iCloud.</p><p>Cloud services support access from multiple devices and locations.</p><p>Businesses increasingly rely on cloud services to reduce hardware costs.</p>',q:'What is an advantage of using cloud services?',opts:["Access to files from multiple devices and locations", "Data can never be backed up", "It always requires expensive hardware", "Files can only be accessed at one physical location"],correct:0,expl:'Cloud services allow access to stored files and applications from any device with an internet connection.'},
  {ey:'Q5',ti:'Streaming Services',teach:'<p>Streaming delivers audio or video content over the internet in real time.</p><p>Buffering occurs when data can\'t be delivered fast enough to keep up with playback.</p><p>Streaming has changed how people consume music, TV and movies.</p><p>Good streaming quality depends on a stable, sufficient internet connection.</p>',q:'What causes buffering when watching a streaming video?',opts:["Data can't be delivered fast enough to keep up with playback", "The video file is too small", "The device has too much storage", "The screen is too bright"],correct:0,expl:'Buffering happens when the internet connection can\'t supply data fast enough to keep up with playback.'},
  {ey:'Q6',ti:'E-commerce Services',teach:'<p>E-commerce refers to buying and selling goods or services online.</p><p>Online payment systems and digital wallets support secure transactions.</p><p>Nigeria has a rapidly growing e-commerce and fintech sector.</p><p>Trust, security and delivery logistics are key challenges for e-commerce.</p>',q:'What does "e-commerce" refer to?',opts:["Buying and selling goods or services online", "Only sending emails", "Playing video games", "Watching television"],correct:0,expl:'E-commerce refers to conducting commercial transactions — buying and selling — over the internet.'},
  {ey:'Q7',ti:'Social Media Services',teach:'<p>Social media platforms let users create, share and interact with content online.</p><p>Examples include platforms for photos, videos, short messages, and networking.</p><p>Social media has both benefits (connection, information) and risks (misinformation, addiction).</p><p>Responsible use of social media is an important digital citizenship skill.</p>',q:'What is one risk associated with social media use?',opts:["Improved physical fitness automatically", "Exposure to misinformation", "Guaranteed better grades", "Complete elimination of all screen time"],correct:1,expl:'Social media can spread unverified information quickly, making misinformation a genuine risk.'},
  {ey:'Q8',ti:'Messaging and VoIP Services',teach:'<p>Messaging apps let users send text, images, and voice notes instantly.</p><p>VoIP (Voice over Internet Protocol) allows voice calls over the internet instead of traditional phone lines.</p><p>These services often cost less than traditional calling, especially internationally.</p><p>Video calling has become essential for remote work and education.</p>',q:'What does VoIP stand for?',opts:["Voice over Internet Protocol", "Video over Internet Photos", "Virtual Office Internet Portal", "Voice Output Internal Processor"],correct:0,expl:'VoIP stands for Voice over Internet Protocol — making voice calls using the internet rather than traditional phone lines.'},
  {ey:'Q9',ti:'Search and Information Services',teach:'<p>Search engines index and rank billions of webpages to help find information.</p><p>Online encyclopedias and databases provide reference information.</p><p>Not all online information sources are equally trustworthy.</p><p>Cross-checking information across multiple sources improves reliability.</p>',q:'Why should you cross-check information found through a search engine?',opts:["To waste time unnecessarily", "Because not all sources are equally reliable", "Search engines never make mistakes", "Cross-checking is illegal"],correct:1,expl:'Cross-checking helps verify accuracy, since not every online source is equally trustworthy.'},
  {ey:'Q10',ti:'Emerging Internet Services',teach:'<p>New services continue to emerge, like AI chat assistants and smart automation tools.</p><p>5G networks are enabling faster, more responsive internet services.</p><p>The growth of IoT is creating new categories of connected services.</p><p>Staying informed about new services helps users adapt to a changing digital world.</p>',q:'What network technology is enabling faster, more responsive internet services on mobile devices?',opts:["3G", "Dial-up", "5G", "A landline"],correct:2,expl:'5G is a newer generation of mobile network technology offering significantly faster speeds and lower latency.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</body>
</html>
