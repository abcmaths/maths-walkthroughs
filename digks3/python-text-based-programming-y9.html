<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python / Text-Based Programming — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Python / Text-Based Programming</div>
    <div class="strand">Digital Technologies · Computational Thinking</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Introducing Python',teach:'<p>Python is a popular, beginner-friendly text-based programming language.</p><p>It is widely used in web development, data science, AI and automation.</p><p>Python code is written and read left to right, using clear keywords like "print" and "if".</p><p>Moving from Scratch to Python builds on the same core logic learned earlier.</p>',q:'What type of programming language is Python?',opts:["A text-based programming language", "A block-based only language", "A type of hardware", "A type of database"],correct:0,expl:'Python is a widely used text-based (rather than purely block-based) programming language.'},
  {ey:'Q2',ti:'Print Statements and Syntax',teach:'<p>The print() function displays output to the screen.</p><p>Python is sensitive to exact syntax — spelling and punctuation must be correct.</p><p>A syntax error occurs when code doesn\'t follow the language\'s exact rules.</p><p>Simple mistakes like a missing bracket or quote can prevent code from running.</p>',q:'What does the print() function do in Python?',opts:["Displays output to the screen", "Deletes a variable", "Connects to Wi-Fi", "Formats a document"],correct:0,expl:'The print() function outputs text or values to the screen so the programmer/user can see them.'},
  {ey:'Q3',ti:'Variables in Python',teach:'<p>Variables in Python are created simply by assigning a value: e.g. score = 0.</p><p>Python variable names are case-sensitive and cannot start with a number.</p><p>Variables can be reassigned to new values as a program runs.</p><p>Meaningful variable names make Python code far easier to read.</p>',q:'How is a variable typically created in Python?',opts:["By assigning a value, e.g. score = 0", "By printing it first", "By deleting a file", "By opening a browser"],correct:0,expl:'In Python, a variable is created simply by assigning it a value, such as score = 0.'},
  {ey:'Q4',ti:'Input and Output',teach:'<p>The input() function lets a Python program receive typed input from a user.</p><p>Input is received as text (a string) by default, even if it looks like a number.</p><p>Combining input() and print() creates simple, interactive programs.</p><p>Converting input to the correct data type (like int()) avoids type errors.</p>',q:'What data type does input() return by default in Python?',opts:["A string (text)", "An image", "A boolean only", "A file"],correct:0,expl:'Python\'s input() function always returns a string by default, even if the user types numbers.'},
  {ey:'Q5',ti:'If/Else in Python',teach:'<p>Python uses "if", "elif" and "else" to make decisions.</p><p>Indentation (spacing) is essential in Python — it defines code blocks.</p><p>Comparison operators (==, >, <) are used to build conditions.</p><p>Careless indentation is a very common source of errors for beginners.</p>',q:'What is essential in Python for defining which code belongs to an if statement?',opts:["Indentation (consistent spacing)", "Bright colours", "A loud sound effect", "A large monitor"],correct:0,expl:'Python uses indentation to define code blocks, so consistent spacing is essential for if statements to work correctly.'},
  {ey:'Q6',ti:'Loops in Python',teach:'<p>A "for" loop repeats code a specific number of times, often over a range or list.</p><p>A "while" loop repeats code as long as a condition remains true.</p><p>Loops reduce repeated code and are essential for processing lists of data.</p><p>Care must be taken to avoid infinite loops that never end.</p>',q:'Which Python loop is typically used to repeat code a specific number of times over a range?',opts:["A \"for\" loop", "A \"while\" loop only", "An \"if\" statement", "A print statement"],correct:0,expl:'A "for" loop is commonly used in Python to iterate a specific number of times, often over a range or list.'},
  {ey:'Q7',ti:'Lists in Python',teach:'<p>A list stores multiple values together, written in square brackets, e.g. [1,2,3].</p><p>Items in a list can be accessed using their index (position), starting at 0.</p><p>Lists can be looped over to process every item in turn.</p><p>Lists are essential for managing collections of related data.</p>',q:'What index number refers to the first item in a Python list?',opts:["0", "1", "-1", "10"],correct:0,expl:'Python lists are zero-indexed — the first item is at index 0, not index 1.'},
  {ey:'Q8',ti:'Functions in Python',teach:'<p>A function in Python is defined using the "def" keyword.</p><p>Functions can accept parameters and return values using "return".</p><p>Defining functions avoids repeating the same code multiple times.</p><p>Well-named functions make Python programs easier to read and maintain.</p>',q:'What keyword is used to define a function in Python?',opts:["def", "func", "function", "method"],correct:0,expl:'Python uses the "def" keyword to define a new function.'},
  {ey:'Q9',ti:'Debugging Python Code',teach:'<p>Python error messages usually indicate the type and location of a problem.</p><p>Common errors include syntax errors, name errors, and type errors.</p><p>Reading the error message from the bottom up often reveals the real cause.</p><p>Testing small pieces of code separately helps isolate where bugs occur.</p>',q:'What can Python error messages help a programmer do?',opts:["Identify the type and location of a problem", "Nothing useful", "Automatically delete the program", "Guarantee no future errors"],correct:0,expl:'Python error messages typically point to the type and location of the problem, helping the programmer fix it.'},
  {ey:'Q10',ti:'Building a Small Python Program',teach:'<p>Combining variables, input, conditions, loops and functions builds real working programs.</p><p>Starting simple and testing frequently avoids becoming overwhelmed.</p><p>Real Python projects (like simple quizzes or calculators) build genuine confidence.</p><p>This foundation prepares students for the more advanced Python work in SS1.</p>',q:'What is a good strategy when building your first small Python program?',opts:["Start simple and test frequently", "Write the whole thing without ever testing", "Avoid using any variables", "Skip planning entirely"],correct:0,expl:'Starting with simple code and testing frequently helps catch errors early and builds confidence gradually.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
