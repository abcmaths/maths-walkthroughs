<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Technologies — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Web Technologies</div>
    <div class="strand">Digital Technologies · Computational Thinking</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'How the Web Works',teach:'<p>A browser sends a request to a web server, which sends back the webpage.</p><p>This request-response process happens over the internet using HTTP/HTTPS.</p><p>Webpages are typically built from HTML, styled with CSS, and made interactive with JavaScript.</p><p>Understanding this process demystifies how every website you visit actually works.</p>',q:'What protocol is commonly used for requesting and receiving webpages?',opts:["HTTP/HTTPS", "USB", "Bluetooth", "Ethernet only"],correct:0,expl:'HTTP (and its secure version HTTPS) is the protocol used to request and deliver webpages over the internet.'},
  {ey:'Q2',ti:'Introduction to HTML',teach:'<p>HTML (HyperText Markup Language) structures the content of a webpage.</p><p>HTML uses "tags" like <h1>, <p>, and <img> to define different elements.</p><p>Tags usually come in pairs: an opening tag and a matching closing tag.</p><p>HTML alone provides structure, but not styling or interactivity.</p>',q:'What does HTML primarily provide for a webpage?',opts:["Structure/content", "Colour and styling only", "Server hosting", "Internet connectivity"],correct:0,expl:'HTML (HyperText Markup Language) provides the basic structure and content of a webpage.'},
  {ey:'Q3',ti:'Common HTML Tags',teach:'<p>Headings use tags like <h1> for the largest, down to <h6> for the smallest.</p><p>Paragraphs use the <p> tag to group blocks of text.</p><p>Links use the <a> tag with an "href" attribute pointing to a destination.</p><p>Images use the <img> tag with a "src" attribute pointing to the image file.</p>',q:'Which HTML tag is used to create a hyperlink?',opts:["<a>", "<p>", "<h1>", "<img>"],correct:0,expl:'The <a> (anchor) tag is used to create hyperlinks in HTML.'},
  {ey:'Q4',ti:'Introduction to CSS',teach:'<p>CSS (Cascading Style Sheets) controls the visual appearance of a webpage.</p><p>CSS can set colours, fonts, spacing, and layout.</p><p>CSS can be applied inline, internally, or via an external stylesheet file.</p><p>Separating structure (HTML) from style (CSS) is considered good practice.</p>',q:'What does CSS primarily control on a webpage?',opts:["Visual appearance/styling", "Server security", "Internet speed", "Database storage"],correct:0,expl:'CSS (Cascading Style Sheets) is used to control the visual styling and layout of a webpage.'},
  {ey:'Q5',ti:'CSS Selectors and Properties',teach:'<p>CSS selectors target specific HTML elements to style, like all paragraphs or one specific ID.</p><p>Properties (like color, font-size, margin) define exactly how the element should look.</p><p>Class selectors (.classname) can style multiple elements sharing that class.</p><p>ID selectors (#idname) target one single, unique element.</p>',q:'What does a CSS class selector (starting with a dot) typically style?',opts:["Multiple elements sharing that class", "Only one single unique element", "The entire internet", "Nothing at all"],correct:0,expl:'A class selector can be applied to and style multiple HTML elements that share the same class name.'},
  {ey:'Q6',ti:'Introduction to JavaScript',teach:'<p>JavaScript adds interactivity and dynamic behaviour to webpages.</p><p>It can respond to user actions, like clicks, and update the page without reloading.</p><p>JavaScript works alongside HTML (structure) and CSS (style).</p><p>Modern websites rely heavily on JavaScript for interactive features.</p>',q:'What does JavaScript primarily add to a webpage?',opts:["Interactivity and dynamic behaviour", "Only static structure", "Only visual styling", "Server hosting only"],correct:0,expl:'JavaScript is used to add interactivity and dynamic behaviour that responds to user actions.'},
  {ey:'Q7',ti:'Responsive Web Design',teach:'<p>Responsive design ensures websites work well on different screen sizes (phone, tablet, desktop).</p><p>CSS media queries adjust layout based on screen width.</p><p>Mobile-first design considers small screens before larger ones.</p><p>Most users now access the web primarily through mobile devices, making this essential.</p>',q:'What is the goal of responsive web design?',opts:["Websites that work well across different screen sizes", "Websites that only work on one device", "Faster typing speed", "More colourful fonts only"],correct:0,expl:'Responsive design aims to make websites function and look good across phones, tablets and desktops alike.'},
  {ey:'Q8',ti:'Web Accessibility',teach:'<p>Accessible websites can be used by people with a range of abilities and disabilities.</p><p>Alt text on images helps visually impaired users using screen readers.</p><p>Good colour contrast helps users with visual impairments read content clearly.</p><p>Accessibility is both good design practice and, in many places, a legal requirement.</p>',q:'What does "alt text" on an image help with?',opts:["Accessibility for visually impaired users using screen readers", "Making images load slower", "Deleting the image", "Making the webpage less secure"],correct:0,expl:'Alt text provides a text description of an image, which screen readers use to help visually impaired users.'},
  {ey:'Q9',ti:'Publishing a Website',teach:'<p>Web hosting stores your website\'s files so they can be accessed online.</p><p>A domain name provides a memorable address for your website.</p><p>Testing across different browsers ensures your website displays consistently.</p><p>Publishing responsibly includes checking for broken links and other errors.</p>',q:'What does web hosting provide?',opts:["Storage so your website's files can be accessed online", "A domain name generator only", "A type of programming language", "A CSS framework only"],correct:0,expl:'Web hosting stores a website\'s files on a server so they can be accessed by visitors online.'},
  {ey:'Q10',ti:'Building a Simple Webpage',teach:'<p>Combining HTML structure, CSS styling and basic JavaScript builds a real simple webpage.</p><p>Starting with a clear plan (like a simple wireframe) helps guide the build.</p><p>Testing frequently in a browser catches display issues early.</p><p>This foundation connects directly to more advanced web development work in SS1/SS2.</p>',q:'What should come before building a webpage in code?',opts:["A clear plan, such as a simple wireframe", "Nothing — always start coding immediately", "Deleting the internet connection", "Choosing a random file format"],correct:0,expl:'Planning with something like a wireframe before coding helps guide a more successful, organised build.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</body>
</html>
