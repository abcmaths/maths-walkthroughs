<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Hardware — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Computer Hardware</div>
    <div class="strand">Digital Technologies · Foundations</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is Hardware?',teach:'<p>Hardware is any physical part of a computer system.</p><p>It includes things you can see and touch: the case, keyboard, screen.</p><p>Hardware needs software to actually do useful work.</p><p>Without hardware, software has nothing to run on.</p>',q:'Which best defines hardware?',opts:["Instructions that tell a computer what to do", "The physical, touchable parts of a computer", "A type of internet connection", "A computer virus"],correct:1,expl:'Hardware refers to the tangible, physical components of a computer system.'},
  {ey:'Q2',ti:'The CPU',teach:'<p>The CPU (Central Processing Unit) is the "brain" of the computer.</p><p>It carries out instructions and performs calculations.</p><p>CPU speed is measured in gigahertz (GHz).</p><p>Faster CPUs generally process instructions more quickly.</p>',q:'What is the CPU often called?',opts:["The monitor", "The brain of the computer", "The mouse", "The power supply"],correct:1,expl:'The CPU processes instructions and performs calculations, so it is often called the computer\'s "brain".'},
  {ey:'Q3',ti:'Memory: RAM vs Storage',teach:'<p>RAM (Random Access Memory) temporarily holds data the CPU is actively using.</p><p>RAM is cleared when the computer turns off.</p><p>Storage (hard drives/SSDs) keeps data permanently, even without power.</p><p>More RAM lets a computer run more programs smoothly at once.</p>',q:'Which type of memory is cleared when you turn off the computer?',opts:["Hard drive", "SSD", "RAM", "USB flash drive"],correct:2,expl:'RAM is volatile memory — it loses its contents when power is removed, unlike permanent storage.'},
  {ey:'Q4',ti:'Input Devices',teach:'<p>Input devices let users enter data into a computer.</p><p>Examples: keyboard, mouse, microphone, scanner, webcam.</p><p>Touchscreens act as both input and output devices.</p><p>Choosing the right input device depends on the task.</p>',q:'Which of these is purely an input device?',opts:["Monitor", "Speaker", "Scanner", "Printer"],correct:2,expl:'A scanner brings data into the computer (input); monitors, speakers and printers are output devices.'},
  {ey:'Q5',ti:'Output Devices',teach:'<p>Output devices show the results of processing to the user.</p><p>Examples: monitor, printer, speaker, projector.</p><p>Output can be visual, audio, or physical (like a 3D print).</p><p>Good output devices make information clear and useful.</p>',q:'Which device produces audio output?',opts:["Keyboard", "Speaker", "Mouse", "Scanner"],correct:1,expl:'A speaker converts digital signals into sound — this is audio output.'},
  {ey:'Q6',ti:'Storage Devices',teach:'<p>Storage devices keep data permanently: HDDs, SSDs, USB drives, memory cards.</p><p>SSDs (Solid State Drives) are faster and more durable than HDDs (Hard Disk Drives).</p><p>Cloud storage saves data on remote servers accessed via the internet.</p><p>Storage capacity is measured in gigabytes (GB) and terabytes (TB).</p>',q:'Which storage type is generally faster: HDD or SSD?',opts:["HDD", "SSD", "They are always equal", "Neither has speed"],correct:1,expl:'SSDs use flash memory with no moving parts, making them significantly faster than traditional HDDs.'},
  {ey:'Q7',ti:'Motherboard and Connections',teach:'<p>The motherboard connects all hardware components together.</p><p>It contains slots and ports for the CPU, RAM, storage and other parts.</p><p>Ports like USB and HDMI let you connect external devices.</p><p>A well-organised motherboard layout improves airflow and reliability.</p>',q:'What is the main purpose of a motherboard?',opts:["To display graphics", "To connect all hardware components together", "To store long-term files", "To connect to Wi-Fi only"],correct:1,expl:'The motherboard is the central circuit board that links the CPU, memory, storage, and other components.'},
  {ey:'Q8',ti:'Power and Cooling',teach:'<p>Computers need a power supply unit (PSU) to convert mains electricity into usable power.</p><p>Components generate heat, so fans or liquid cooling keep temperatures safe.</p><p>Overheating can damage hardware and slow performance (thermal throttling).</p><p>Dust build-up can block airflow and needs regular cleaning.</p>',q:'Why do computers need cooling systems?',opts:["To make them louder", "To prevent overheating and damage", "To increase storage space", "To improve Wi-Fi signal"],correct:1,expl:'Components generate heat during operation; cooling systems prevent overheating that could damage hardware.'},
  {ey:'Q9',ti:'Peripherals',teach:'<p>Peripherals are external devices connected to a computer.</p><p>Examples: external hard drives, printers, webcams, game controllers.</p><p>Peripherals can be wired (USB) or wireless (Bluetooth).</p><p>Not all peripherals are essential — some just add convenience.</p>',q:'Which of these is a wireless connection method for peripherals?',opts:["HDMI cable", "Bluetooth", "Ethernet cable", "VGA cable"],correct:1,expl:'Bluetooth is a wireless technology commonly used to connect peripherals like keyboards and headphones.'},
  {ey:'Q10',ti:'Choosing the Right Hardware',teach:'<p>Different tasks need different hardware — video editing needs a powerful CPU/GPU.</p><p>Budget, purpose and portability all affect hardware choices.</p><p>Upgrading RAM or storage can extend a computer\'s useful life.</p><p>Understanding specifications helps you make informed choices.</p>',q:'Which upgrade would most help a slow computer run more programs at once?',opts:["Adding more RAM", "Painting the case", "Changing the mouse", "Adding a louder speaker"],correct:0,expl:'More RAM allows a computer to hold more active data, helping it run multiple programs more smoothly.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</body>
</html>
