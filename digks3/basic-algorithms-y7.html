<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--red:#37474F;--dark:#263238;--cream:#ECEFF1;--ink:#0d1b2a;--line:#CFD8DC;--gold:#00ACC1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#f0fbfc;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e0f7fa;color:#00838f;border:1px solid #80deea;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#00838f;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#37474F',DARK='#263238',CRM='#ECEFF1',LINE='#CFD8DC';
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}

var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
  }
});

// Generic progressive diagram: shows one labelled box per revealed teaching point
function makeDiagram(title, points){
  return function(p){
    var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
    o.push(T(240,20,title,ACC,12,'middle',true));
    points.forEach(function(txt,i){
      if(p>=i){
        var y=36+i*44;
        o.push(R(10,y,460,38,i===p?LINE:CRM,ACC,i===p?2:1));
        o.push(T(240,y+23,txt,DARK,10,'middle',false));
      }
    });
    s.innerHTML=o.join('');
  };
}

var dQ1=makeDiagram('What is an Algorithm?',['A precise, step-by-step set of instructions','Recipes, directions, dance steps are everyday examples','Clear, unambiguous, produces a correct result','Computer programs are built from algorithms']);
var dQ2=makeDiagram('Sequencing',['Putting steps in the correct order','Wrong order = algorithm may fail','Example: making tea relies on correct sequencing','Programmers plan instruction order carefully']);
var dQ3=makeDiagram('Decisions (Selection)',['A choice based on a condition (if/else)','Example: IF raining THEN take umbrella','Lets algorithms respond to circumstances','One of three core building blocks']);
var dQ4=makeDiagram('Loops (Iteration)',['Repeating a set of steps multiple times','Saves rewriting the same instructions','Example: Repeat 10 times: do a push-up','Can repeat a fixed number or until a condition']);
var dQ5=makeDiagram('Flowcharts',['Represent algorithms visually with symbols','Ovals = start/end, rectangles = process, diamonds = decision','Arrows show direction of flow','Help plan algorithms before coding']);
var dQ6=makeDiagram('Pseudocode',['Informal, code-like language for algorithms','Focuses on logic, not exact syntax','Plans a program before writing real code','Example: IF score>50 THEN print PASS ELSE FAIL']);
var dQ7=makeDiagram('Searching Algorithms',['Linear search checks items one by one','Binary search repeatedly halves a sorted list','Binary search needs already-sorted data','Choice affects speed with large data']);
var dQ8=makeDiagram('Sorting Algorithms',['Arranges data into a specific order','Bubble sort swaps adjacent out-of-order items','Sorted data is easier to search/analyse','Different algorithms differ in speed']);
var dQ9=makeDiagram('Debugging Algorithms',['A bug is an error causing wrong behaviour','Debugging finds and fixes bugs','Tracing step by step locates errors','Testing varied inputs reveals hidden bugs']);
var dQ10=makeDiagram('Real-World Algorithm Design',['Solves real problems: GPS, timetabling, recipes','Decomposition: break big problems into sub-problems','Edge-case testing reveals weaknesses','Well-designed = efficient, correct, understandable']);

var QS=[
{ey:'Q1 \u2022 Digital Technologies \u2022 Computational Thinking',ti:'What is an Algorithm?',su:'Understand what an algorithm is and why it matters.',steps:[
  {lb:'The basics',dr:dQ1,ht:'<p>An algorithm is a precise, step-by-step set of instructions to solve a problem.</p>'},
  {lb:'Everyday examples',dr:dQ1,ht:'<p>Recipes, directions and dance steps are all everyday examples of algorithms.</p>'},
  {lb:'What makes a good algorithm',dr:dQ1,ht:'<p>Good algorithms are clear, unambiguous, and produce a correct result.</p>'},
  {lb:'Why it matters',dr:dQ1,ht:'<p>Computer programs are built from algorithms — this is the foundation of all programming.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[
    {q:'Which best describes an algorithm?',o:['A random guess','A step-by-step set of instructions to solve a problem','A type of computer virus','A brand of laptop'],a:1,w:'An algorithm is a precise sequence of steps designed to solve a specific problem.'},
    {q:'Which of these is NOT a feature of a good algorithm?',o:['Clear and unambiguous','Produces a correct result','Can be vague about what to do next','Finite — it eventually finishes'],a:2,w:'A good algorithm must never be vague; every step should be precise and unambiguous.'},
    {q:'Which everyday activity is closest to an algorithm?',o:['Daydreaming','Following a recipe step by step','Watching clouds','Feeling hungry'],a:1,w:'A recipe is a step-by-step set of instructions — exactly what an algorithm is.'},
    {q:'What are computer programs ultimately built from?',o:['Random numbers','Algorithms','Pictures only','Internet cables'],a:1,w:'Every computer program is built from one or more algorithms.'}
  ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Digital Technologies \u2022 Computational Thinking',ti:'Sequencing',su:'See why the order of steps in an algorithm matters.',steps:[
  {lb:'Definition',dr:dQ2,ht:'<p>Sequencing means putting steps in the correct order.</p>'},
  {lb:'Why order matters',dr:dQ2,ht:'<p>If steps are out of order, the algorithm may fail or give wrong results.</p>'},
  {lb:'Everyday example',dr:dQ2,ht:'<p>Everyday tasks like making tea rely on correct sequencing.</p>'},
  {lb:'In programming',dr:dQ2,ht:'<p>Programmers must carefully plan the order of instructions.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[
    {q:'What happens if the steps of an algorithm are in the wrong order?',o:['Nothing changes','It may fail or produce incorrect results','It always still works perfectly','It becomes faster'],a:1,w:'Incorrect sequencing can cause an algorithm to fail or produce the wrong outcome.'},
    {q:'What does "sequencing" mean in computing?',o:['Deleting unused steps','Putting instructions in the correct order','Making a random choice','Repeating a step forever'],a:1,w:'Sequencing is the process of arranging instructions in the correct, logical order.'},
    {q:'Why does making tea require correct sequencing?',o:['It does not — order never matters','Boiling water before adding the tea bag gives the wrong result if reversed','Tea has no algorithm','Sequencing only applies to computers'],a:1,w:'Everyday tasks like making tea show why order matters — steps done in the wrong order give a poor result.'},
    {q:'Who is responsible for planning the correct order of instructions in a program?',o:['The computer decides randomly','The programmer','The electricity supply','The monitor'],a:1,w:'Programmers must deliberately plan and check the sequence of instructions in their code.'}
  ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Digital Technologies \u2022 Computational Thinking',ti:'Decisions (Selection)',su:'Learn how algorithms make choices using conditions.',steps:[
  {lb:'Definition',dr:dQ3,ht:'<p>Selection means making a choice based on a condition (if/else).</p>'},
  {lb:'Example',dr:dQ3,ht:'<p>Example: "IF it is raining, THEN take an umbrella."</p>'},
  {lb:'Why it matters',dr:dQ3,ht:'<p>Decisions let algorithms respond differently depending on circumstances.</p>'},
  {lb:'Building block',dr:dQ3,ht:'<p>Selection is one of the three core building blocks of algorithms.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[
    {q:'Which statement is an example of "selection" in an algorithm?',o:['Do step 1, then step 2, then step 3','IF it is raining, THEN take an umbrella','Repeat this 10 times','Print "hello"'],a:1,w:'This is a decision (if/then) — the classic structure of selection in algorithms.'},
    {q:'What does "selection" allow an algorithm to do?',o:['Repeat instructions forever','Make a choice based on a condition','Store data permanently','Delete other algorithms'],a:1,w:'Selection lets an algorithm choose between different actions depending on a condition.'},
    {q:'Which keyword pair is most associated with selection?',o:['REPEAT / UNTIL','IF / THEN','START / END','PRINT / INPUT'],a:1,w:'IF/THEN (with optional ELSE) is the classic structure used for selection.'},
    {q:'How many core building blocks of algorithms are there (sequence, selection, iteration)?',o:['One','Two','Three','Five'],a:2,w:'There are three core building blocks: sequence, selection and iteration.'}
  ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Digital Technologies \u2022 Computational Thinking',ti:'Loops (Iteration)',su:'Explore how algorithms repeat steps efficiently.',steps:[
  {lb:'Definition',dr:dQ4,ht:'<p>Iteration means repeating a set of steps multiple times.</p>'},
  {lb:'Why loops help',dr:dQ4,ht:'<p>Loops save us from writing the same instructions over and over.</p>'},
  {lb:'Example',dr:dQ4,ht:'<p>Example: "Repeat 10 times: do a push-up."</p>'},
  {lb:'Types of loop',dr:dQ4,ht:'<p>Loops can repeat a fixed number of times, or until a condition is met.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[
    {q:'What is another name for repeating steps in an algorithm?',o:['Selection','Sequencing','Iteration (looping)','Debugging'],a:2,w:'Iteration, or looping, is the term for repeating a set of steps multiple times.'},
    {q:'Why are loops useful in algorithms?',o:['They make code run only once','They save us rewriting the same instructions repeatedly','They stop a program from working','They remove the need for variables'],a:1,w:'Loops let us repeat instructions without writing them out many times.'},
    {q:'A loop that repeats until a condition becomes true is an example of what?',o:['Sequencing','Selection','Iteration','Decomposition'],a:2,w:'Repeating steps until a condition is met is a form of iteration (looping).'},
    {q:'"Repeat 10 times: do a push-up" is an example of which building block?',o:['Sequencing','Selection','Iteration','Debugging'],a:2,w:'This repeats an instruction a fixed number of times — a classic example of iteration.'}
  ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Digital Technologies \u2022 Computational Thinking',ti:'Flowcharts',su:'Learn to represent algorithms visually.',steps:[
  {lb:'Definition',dr:dQ5,ht:'<p>Flowcharts represent algorithms visually using standard symbols.</p>'},
  {lb:'Symbols',dr:dQ5,ht:'<p>Ovals show start/end; rectangles show processes; diamonds show decisions.</p>'},
  {lb:'Flow direction',dr:dQ5,ht:'<p>Arrows show the direction/flow of the algorithm.</p>'},
  {lb:'Why use them',dr:dQ5,ht:'<p>Flowcharts help plan and communicate algorithms before coding them.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[
    {q:'What shape is typically used to show a decision in a flowchart?',o:['Rectangle','Oval','Diamond','Circle'],a:2,w:'A diamond shape represents a decision point (yes/no branch) in a flowchart.'},
    {q:'What does an oval shape usually represent in a flowchart?',o:['A process step','Start or end','A decision','An arrow'],a:1,w:'Ovals mark the start and end points of a flowchart.'},
    {q:'What is the purpose of arrows in a flowchart?',o:['To decorate the diagram','To show the direction of flow between steps','To represent decisions','To represent data storage'],a:1,w:'Arrows connect the shapes and show the order/direction the algorithm flows in.'},
    {q:'Why do programmers draw flowcharts before writing code?',o:['To make the code run faster','To plan and communicate the algorithm visually first','Flowcharts replace code entirely','It is required by every programming language'],a:1,w:'Flowcharts help plan and communicate the logic of an algorithm before it is coded.'}
  ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Digital Technologies \u2022 Computational Thinking',ti:'Pseudocode',su:'Write algorithm logic in plain, code-like language.',steps:[
  {lb:'Definition',dr:dQ6,ht:'<p>Pseudocode is a way of writing algorithms using informal, code-like language.</p>'},
  {lb:'Focus on logic',dr:dQ6,ht:'<p>It focuses on logic, not exact programming syntax.</p>'},
  {lb:'Why it helps',dr:dQ6,ht:'<p>Pseudocode makes it easier to plan a program before writing real code.</p>'},
  {lb:'Example',dr:dQ6,ht:'<p>Example: "IF score &gt; 50 THEN print PASS ELSE print FAIL".</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[
    {q:'What is the main purpose of pseudocode?',o:['To confuse programmers','To plan algorithm logic without worrying about exact syntax','To replace all real programming languages','To design graphics'],a:1,w:'Pseudocode lets you plan the logic of an algorithm in plain, code-like language before writing actual code.'},
    {q:'Does pseudocode need to follow strict programming language syntax?',o:['Yes, exactly like Python','Yes, exactly like Java','No — it focuses on logic, not exact syntax','No — it must be written in French'],a:2,w:'Pseudocode is informal; it focuses on the logic rather than exact syntax rules.'},
    {q:'"IF score > 50 THEN print PASS ELSE print FAIL" is an example of what?',o:['A flowchart','Pseudocode','A search algorithm','A sorting algorithm'],a:1,w:'This is pseudocode — plain, code-like language expressing the logic of a decision.'},
    {q:'Why might a programmer write pseudocode before real code?',o:['To make the program run automatically','To plan the logic clearly before dealing with syntax details','Because computers can execute pseudocode directly','To avoid using flowcharts'],a:1,w:'Pseudocode helps plan logic first, separate from the details of a specific programming language.'}
  ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Digital Technologies \u2022 Computational Thinking',ti:'Searching Algorithms',su:'Compare linear and binary search.',steps:[
  {lb:'Linear search',dr:dQ7,ht:'<p>A linear search checks items one by one until it finds a match.</p>'},
  {lb:'Binary search',dr:dQ7,ht:'<p>A binary search repeatedly halves a sorted list to find items faster.</p>'},
  {lb:'A key requirement',dr:dQ7,ht:'<p>Binary search only works on already-sorted data.</p>'},
  {lb:'Why it matters',dr:dQ7,ht:'<p>Choosing the right search algorithm affects speed, especially with large data.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[
    {q:'Which search method requires the data to already be sorted?',o:['Linear search','Binary search','Random search','No search method needs sorted data'],a:1,w:'Binary search relies on the data being sorted so it can repeatedly eliminate half the remaining items.'},
    {q:'How does a linear search find an item?',o:['It halves the list repeatedly','It checks items one by one until it finds a match','It only works on sorted data','It guesses randomly'],a:1,w:'A linear search checks each item in turn until it finds a match (or reaches the end).'},
    {q:'Why is binary search usually faster than linear search on large sorted lists?',o:['It checks every item twice','It repeatedly halves the search area instead of checking one by one','It ignores half the data permanently','It does not actually search anything'],a:1,w:'Binary search eliminates half of the remaining items at each step, making it much faster on large sorted data.'},
    {q:'What matters most when choosing between search algorithms?',o:['The colour of the screen','Speed, especially with large amounts of data','The programmer\'s mood','The size of the monitor'],a:1,w:'Choosing the right search algorithm matters for speed and efficiency, particularly with large datasets.'}
  ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Digital Technologies \u2022 Computational Thinking',ti:'Sorting Algorithms',su:'Understand how sorting arranges data.',steps:[
