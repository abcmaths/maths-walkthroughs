<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Networking Basics — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Computer Networking Basics</div>
    <div class="strand">Digital Technologies · Networking</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is a Network?',teach:'<p>A network connects two or more computers so they can share data and resources.</p><p>Networks allow shared printers, internet access, and file sharing.</p><p>A LAN (Local Area Network) covers a small area, like one school building.</p><p>A WAN (Wide Area Network) covers a large area, like a whole country — the internet is the biggest WAN.</p>',q:'Which network type covers a small area like a single school?',opts:["WAN", "LAN", "The entire internet", "A satellite network"],correct:1,expl:'A LAN (Local Area Network) covers a small, local area such as a single building or school.'},
  {ey:'Q2',ti:'Network Devices',teach:'<p>A router directs data between networks and connects to the internet.</p><p>A switch connects devices within the same local network.</p><p>A modem converts signals between your ISP and your home network.</p><p>Network cables (like Ethernet) provide wired connections.</p>',q:'Which device connects your home network to your Internet Service Provider?',opts:["A switch", "A modem", "A keyboard", "A monitor"],correct:1,expl:'A modem converts signals between the ISP\'s connection and your home network devices.'},
  {ey:'Q3',ti:'Wired vs Wireless Networks',teach:'<p>Wired networks use cables (like Ethernet) for fast, stable connections.</p><p>Wireless networks (Wi-Fi) use radio waves, offering mobility and convenience.</p><p>Wired connections are generally faster and more reliable than Wi-Fi.</p><p>Wi-Fi range and speed can be affected by walls and interference.</p>',q:'Which connection type is generally faster and more stable?',opts:["Wireless (Wi-Fi)", "Wired (Ethernet)", "Bluetooth", "Infrared"],correct:1,expl:'Wired Ethernet connections are typically faster and more stable than wireless connections.'},
  {ey:'Q4',ti:'IP Addresses',teach:'<p>Every device on a network has a unique IP address to identify it.</p><p>IP addresses can be IPv4 (like 192.168.1.1) or the newer IPv6 format.</p><p>IP addresses let data packets find their correct destination.</p><p>Your home router usually assigns local IP addresses to your devices.</p>',q:'What is the purpose of an IP address?',opts:["To identify a device uniquely on a network", "To store photos", "To play music", "To power the device"],correct:0,expl:'An IP address uniquely identifies a device on a network, so data knows where to go.'},
  {ey:'Q5',ti:'Bandwidth and Speed',teach:'<p>Bandwidth is the amount of data that can be transferred per second.</p><p>It is usually measured in Mbps (megabits per second) or Gbps (gigabits per second).</p><p>Higher bandwidth allows more devices to use the network smoothly at once.</p><p>Streaming video requires more bandwidth than simple web browsing.</p>',q:'What does higher bandwidth generally allow?',opts:["Slower internet for everyone", "More data to be transferred per second", "No internet access at all", "Only text-based browsing"],correct:1,expl:'Higher bandwidth means more data can be transferred each second, supporting smoother streaming and multiple devices.'},
  {ey:'Q6',ti:'Network Topologies',teach:'<p>A star topology connects all devices to a central hub or switch.</p><p>A bus topology connects devices along a single central cable.</p><p>A mesh topology connects devices to multiple other devices for redundancy.</p><p>Choice of topology affects reliability, cost, and ease of expansion.</p>',q:'In which topology are all devices connected to one central hub?',opts:["Star topology", "Bus topology", "Ring topology only", "No topology uses a hub"],correct:0,expl:'In a star topology, every device connects individually to a central hub or switch.'},
  {ey:'Q7',ti:'Servers and Clients',teach:'<p>A server provides resources or services (like files, websites, or email) to other computers.</p><p>A client requests and uses those services from the server.</p><p>Your web browser acts as a client when it requests a webpage from a server.</p><p>Schools often use servers to store shared files and manage user accounts.</p>',q:'When your browser loads a webpage, what role is it playing?',opts:["Server", "Client", "Router", "Switch"],correct:1,expl:'The browser requests information from a web server, making it the client in this relationship.'},
  {ey:'Q8',ti:'Network Security Basics',teach:'<p>Firewalls monitor and control incoming and outgoing network traffic.</p><p>Strong Wi-Fi passwords prevent unauthorised access to a network.</p><p>Public Wi-Fi networks carry higher security risks than private ones.</p><p>Keeping router firmware updated helps close security vulnerabilities.</p>',q:'What does a firewall do?',opts:["Physically cools down the router", "Monitors and controls network traffic for security", "Increases internet speed only", "Prints documents"],correct:1,expl:'A firewall monitors and filters network traffic to help block unauthorised or malicious access.'},
  {ey:'Q9',ti:'How the Internet Connects Networks',teach:'<p>The internet is essentially a huge network of interconnected smaller networks.</p><p>Internet backbones use high-capacity fibre-optic cables across countries and oceans.</p><p>Data hops between many routers on its way to its destination.</p><p>Undersea cables physically connect continents for global internet access.</p>',q:'What physically connects continents for much of global internet traffic?',opts:["Undersea fibre-optic cables", "Wooden telegraph poles only", "Nothing — data travels only through satellites", "Paper mail systems"],correct:0,expl:'Undersea fibre-optic cables carry the vast majority of international internet traffic between continents.'},
  {ey:'Q10',ti:'Troubleshooting Network Problems',teach:'<p>Restarting a router often solves temporary connectivity issues.</p><p>Checking cables and Wi-Fi signal strength helps diagnose problems.</p><p>"Ping" tests can check if a device can reach another over a network.</p><p>Contacting your ISP is a good step if problems persist despite troubleshooting.</p>',q:'What is a simple first step when troubleshooting a home network issue?',opts:["Restarting the router", "Buying a completely new house", "Deleting all your files", "Ignoring the problem forever"],correct:0,expl:'Restarting the router is a simple, common first step that resolves many temporary network issues.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
