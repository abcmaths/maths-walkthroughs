<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programming Concepts — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Programming Concepts</div>
    <div class="strand">Digital Technologies · Computational Thinking</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Reviewing Core Concepts',teach:'<p>Programming builds on sequence, selection, and iteration — the three core structures.</p><p>Variables store data that a program can use and change.</p><p>Good programmers plan their logic before writing code.</p><p>This unit deepens understanding built in JS1, adding more structure and complexity.</p>',q:'Which three concepts form the foundation of programming logic?',opts:["Sequence, selection, iteration", "Printing, deleting, formatting", "Typing, clicking, scrolling", "Charging, cooling, powering"],correct:0,expl:'Sequence, selection, and iteration are the three fundamental building blocks of programming logic.'},
  {ey:'Q2',ti:'Data Types Revisited',teach:'<p>Programs work with different data types: integers, floats, strings, booleans.</p><p>Arrays/lists store multiple values together under one variable name.</p><p>Choosing appropriate data types prevents bugs and improves clarity.</p><p>Understanding data types is essential for more advanced programming.</p>',q:'What is used to store multiple related values under one variable name?',opts:["A single integer", "An array/list", "A boolean", "A comment"],correct:1,expl:'An array (or list) allows multiple related values to be stored together under one variable name.'},
  {ey:'Q3',ti:'Nested Selection',teach:'<p>Nested if statements place one decision inside another for more complex logic.</p><p>This allows programs to handle multiple layered conditions.</p><p>Careful indentation helps keep nested logic readable.</p><p>Overly complex nesting can make code harder to understand — simplicity matters.</p>',q:'What is a "nested if statement"?',opts:["An if statement placed inside another if statement", "A loop that never ends", "A type of variable", "A file format"],correct:0,expl:'A nested if statement is one if/else structure placed inside another, allowing more complex decision-making.'},
  {ey:'Q4',ti:'Nested Loops',teach:'<p>A nested loop is a loop placed inside another loop.</p><p>This is useful for working with grids, tables, or repeated patterns.</p><p>Nested loops can significantly increase how many times code runs — plan carefully.</p><p>Understanding nested loops is key for more advanced programs like games.</p>',q:'What might nested loops be useful for?',opts:["Working with grids or tables of data", "Only printing a single line once", "Deleting variables", "Connecting to Wi-Fi"],correct:0,expl:'Nested loops are especially useful for processing two-dimensional data, like grids or tables.'},
  {ey:'Q5',ti:'Functions with Parameters',teach:'<p>Functions can accept parameters — inputs that customise their behaviour.</p><p>Example: a function "greet(name)" could print "Hello, [name]!"</p><p>Parameters make functions flexible and reusable across different situations.</p><p>Return values let functions send a result back to the part of the program that called them.</p>',q:'What do parameters allow a function to do?',opts:["Nothing extra — parameters are decorative only", "Accept inputs that customise its behaviour", "Delete the function immediately", "Automatically connect to the internet"],correct:1,expl:'Parameters let a function accept different inputs, making it flexible and reusable for various situations.'},
  {ey:'Q6',ti:'Boolean Logic',teach:'<p>Boolean logic uses AND, OR, and NOT to combine conditions.</p><p>AND requires both conditions to be true; OR requires at least one to be true.</p><p>NOT reverses a condition\'s truth value.</p><p>Boolean logic underlies decision-making in almost all programs.</p>',q:'In Boolean logic, what does "AND" require?',opts:["Only one condition to be true", "Both conditions to be true", "Neither condition to be true", "Exactly three conditions"],correct:1,expl:'The AND operator requires both connected conditions to be true for the overall statement to be true.'},
  {ey:'Q7',ti:'Debugging Strategies',teach:'<p>Reading error messages carefully often points directly to the problem.</p><p>Adding print statements helps trace what a program is actually doing.</p><p>Testing small sections of code in isolation narrows down where bugs hide.</p><p>Patience and systematic thinking are essential debugging skills.</p>',q:'What is a useful debugging strategy?',opts:["Ignoring all error messages", "Adding print statements to trace program behaviour", "Deleting the entire program immediately", "Never testing small sections separately"],correct:1,expl:'Adding print statements at key points helps reveal what values variables hold as the program runs, aiding debugging.'},
  {ey:'Q8',ti:'Planning Programs',teach:'<p>Good programmers plan before coding, using flowcharts or pseudocode.</p><p>Breaking a problem into smaller parts (decomposition) simplifies development.</p><p>Planning reduces wasted time and prevents major design flaws later.</p><p>Reviewing requirements carefully ensures the program solves the right problem.</p>',q:'Why is planning important before writing a program?',opts:["It wastes time and should be skipped", "It reduces wasted effort and prevents major design flaws", "Planning makes programs run slower", "Planning is only for professional programmers"],correct:1,expl:'Careful planning before coding reduces wasted effort and helps avoid major design flaws discovered too late.'},
  {ey:'Q9',ti:'Comments in Code',teach:'<p>Comments are notes in code that explain what it does, ignored by the computer.</p><p>Good comments explain "why", not just "what" the code is doing.</p><p>Comments help other programmers (and your future self) understand the code.</p><p>Overusing comments to state the obvious can clutter code unnecessarily.</p>',q:'What is the main purpose of comments in code?',opts:["To make the program run faster", "To explain the code to humans reading it", "To be executed as instructions by the computer", "To automatically fix bugs"],correct:1,expl:'Comments are ignored by the computer but help human readers understand the purpose and logic of the code.'},
  {ey:'Q10',ti:'Building a Small Project',teach:'<p>Combining sequence, selection, iteration and functions enables real small projects.</p><p>Start with a clear goal, then build and test incrementally.</p><p>Testing throughout development catches bugs earlier and more cheaply.</p><p>Reflecting on what worked well helps improve future programming projects.</p>',q:'What is a good approach when building a small programming project?',opts:["Write the whole thing at once with no testing", "Build and test incrementally, in small steps", "Avoid having any clear goal", "Never reflect on what worked"],correct:1,expl:'Building and testing incrementally catches bugs early and makes the whole development process more manageable.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</script>
</body>
</html>
