<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Fundamentals — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Internet Fundamentals</div>
    <div class="strand">Digital Technologies · Productivity & Internet</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'What is the Internet?',teach:'<p>The internet is a global network connecting millions of computers together.</p><p>It allows sharing of information, communication and services worldwide.</p><p>The internet is different from the World Wide Web (the web is a service that runs on it).</p><p>Nigeria has seen huge growth in internet access through mobile networks.</p>',q:'What best describes the internet?',opts:["A single computer", "A global network connecting millions of computers", "A type of software application", "A brand of smartphone"],correct:1,expl:'The internet is a vast global network that connects computers and devices around the world.'},
  {ey:'Q2',ti:'The World Wide Web',teach:'<p>The Web is a system of linked documents (webpages) accessed via browsers.</p><p>Web addresses (URLs) identify specific pages, like www.example.com.</p><p>Hyperlinks let users jump between related pages.</p><p>The Web runs on top of the internet but is not the same thing as the internet.</p>',q:'What identifies a specific webpage\'s location?',opts:["A URL (web address)", "A password", "A username", "A file extension"],correct:0,expl:'A URL (Uniform Resource Locator) is the specific address used to locate a webpage.'},
  {ey:'Q3',ti:'Web Browsers',teach:'<p>A web browser is software used to access and view websites.</p><p>Examples: Chrome, Firefox, Safari, Edge.</p><p>Browsers can save bookmarks for quick access to favourite sites.</p><p>Browser history records the sites you have visited.</p>',q:'Which of these is a web browser?',opts:["Chrome", "Excel", "Windows", "A router"],correct:0,expl:'Chrome is a web browser — software specifically designed to access and display websites.'},
  {ey:'Q4',ti:'Search Engines',teach:'<p>Search engines (like Google, Bing) help find information across the web.</p><p>Search results are ranked by relevance using complex algorithms.</p><p>Effective searching uses specific keywords for better results.</p><p>Not all search results are equally reliable — check the source.</p>',q:'What should you do when reviewing search engine results?',opts:["Trust the first result blindly, always", "Check the source for reliability", "Ignore all results", "Only use results with pictures"],correct:1,expl:'It\'s important to critically evaluate the reliability of a source rather than blindly trusting any single result.'},
  {ey:'Q5',ti:'Internet Service Providers (ISPs)',teach:'<p>An ISP provides access to the internet, usually for a monthly fee.</p><p>Connection types include fibre, mobile data, satellite and DSL.</p><p>Internet speed is measured in Mbps (megabits per second).</p><p>Nigeria\'s internet access has expanded rapidly through mobile data providers.</p>',q:'What does an ISP provide?',opts:["Access to the internet", "Free laptops for everyone", "A type of programming language", "A digital camera"],correct:0,expl:'An Internet Service Provider (ISP) is a company that provides customers access to the internet.'},
  {ey:'Q6',ti:'Email Basics',teach:'<p>Email lets users send digital messages and attachments over the internet.</p><p>An email address usually follows the format name@domain.com.</p><p>Email is widely used for formal communication in school and work.</p><p>Be cautious of suspicious emails — they may be phishing attempts.</p>',q:'What might a suspicious, unexpected email asking for your password be?',opts:["A normal, safe request", "A phishing attempt", "Always from a trusted friend", "A software update"],correct:1,expl:'Unexpected requests for passwords are a common sign of phishing — an attempt to steal personal information.'},
  {ey:'Q7',ti:'Online Communication Tools',teach:'<p>Video calls, messaging apps and forums let people communicate over the internet.</p><p>These tools support both real-time (synchronous) and delayed (asynchronous) communication.</p><p>Good online communication etiquette matters just as much as face-to-face manners.</p><p>Nigeria has seen strong growth in messaging apps for both social and business use.</p>',q:'What term describes communication that happens in real time, like a video call?',opts:["Asynchronous", "Synchronous", "Analogue", "Static"],correct:1,expl:'Synchronous communication happens at the same time for both parties, like a live video call.'},
  {ey:'Q8',ti:'The Cloud',teach:'<p>Cloud computing means storing and processing data on remote servers accessed via the internet.</p><p>Cloud services let you access files from any device with internet access.</p><p>Examples: Google Drive, iCloud, OneDrive.</p><p>Cloud storage relies on a stable internet connection to work well.</p>',q:'What is a key benefit of cloud storage?',opts:["You can access files from any device with internet access", "Files can never be lost", "It never requires an internet connection", "It only works on one specific device"],correct:0,expl:'Cloud storage allows access to your files from any device, as long as you have an internet connection.'},
  {ey:'Q9',ti:'Internet Safety Basics',teach:'<p>Never share passwords or personal details with strangers online.</p><p>Use strong, unique passwords for different accounts.</p><p>Be cautious about clicking unknown links or downloading unknown files.</p><p>Report anything that makes you feel unsafe to a trusted adult.</p>',q:'What should you avoid clicking on to stay safe online?',opts:["Links from trusted school websites", "Unknown or suspicious links from strangers", "Your own saved bookmarks", "Nothing — all links are always safe"],correct:1,expl:'Unknown or suspicious links can lead to malware or phishing sites, so they should be avoided.'},
  {ey:'Q10',ti:'How Data Travels Online',teach:'<p>Data is broken into small packets before being sent across the internet.</p><p>Packets travel through routers, which direct them toward their destination.</p><p>At the destination, packets are reassembled into the original data.</p><p>This packet-based system allows the internet to be fast and resilient.</p>',q:'What are small units of data called when sent across the internet?',opts:["Packets", "Pixels", "Passwords", "Processors"],correct:0,expl:'Data is broken into small units called packets, which travel across the network and are reassembled at the destination.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</body>
</html>
