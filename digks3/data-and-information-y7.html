<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data and Information — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Data and Information</div>
    <div class="strand">Digital Technologies · Data & Safety</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Data vs Information',teach:'<p>Data is raw facts and figures with no context (e.g. numbers, letters).</p><p>Information is data that has been processed and given meaning.</p><p>Example: "25" is data; "the temperature is 25°C" is information.</p><p>Computers store and process huge amounts of data every second.</p>',q:'Which of these is "information" rather than raw data?',opts:["42", "\"The class average score was 42%\"", "A random letter \"K\"", "A list of unlabelled numbers"],correct:1,expl:'This gives context and meaning to raw data — turning "42" into useful information.'},
  {ey:'Q2',ti:'Types of Data',teach:'<p>Data can be numeric (numbers), text, image, audio, or video.</p><p>Structured data fits neatly into tables (like a spreadsheet).</p><p>Unstructured data doesn\'t fit a fixed format (like an essay or a photo).</p><p>Choosing the right data type matters for storage and processing.</p>',q:'Which is an example of unstructured data?',opts:["A spreadsheet of exam scores", "A photo of a classroom", "A table of student ID numbers", "A database of dates"],correct:1,expl:'A photo does not fit into neat rows and columns — it is unstructured data.'},
  {ey:'Q3',ti:'How Computers Store Data: Binary',teach:'<p>Computers store all data as binary — sequences of 0s and 1s (bits).</p><p>A byte is 8 bits and can represent 256 different values.</p><p>Binary is used because electronic switches have two states: on and off.</p><p>Everything — text, images, sound — is ultimately stored as binary.</p>',q:'How many bits make up one byte?',opts:["4", "8", "16", "2"],correct:1,expl:'A byte is defined as 8 bits, which together can represent 256 different values (2^8).'},
  {ey:'Q4',ti:'Units of Data Storage',teach:'<p>Data storage is measured in bytes, kilobytes (KB), megabytes (MB), gigabytes (GB), terabytes (TB).</p><p>Each unit is roughly 1000 (or 1024) times bigger than the one before.</p><p>A typical photo might be a few MB; a movie might be several GB.</p><p>Understanding units helps you judge how much storage you need.</p>',q:'Which unit of data storage is the largest?',opts:["Kilobyte (KB)", "Megabyte (MB)", "Gigabyte (GB)", "Terabyte (TB)"],correct:3,expl:'A terabyte is the largest of these units — roughly 1000 gigabytes.'},
  {ey:'Q5',ti:'Collecting Data',teach:'<p>Data can be collected through surveys, sensors, forms, and observations.</p><p>Good data collection avoids bias and asks clear questions.</p><p>Sensors (like temperature or motion sensors) collect data automatically.</p><p>Poorly collected data leads to poor decisions — "garbage in, garbage out".</p>',q:'What does the phrase "garbage in, garbage out" warn us about?',opts:["Computers never make mistakes", "Poor quality input data leads to poor quality results", "Data collection is always accurate", "Sensors never need calibration"],correct:1,expl:'If the data fed into a system is flawed, the results/output will also be flawed — hence "garbage in, garbage out".'},
  {ey:'Q6',ti:'Processing Data',teach:'<p>Processing turns raw data into useful information through calculation, sorting or filtering.</p><p>Spreadsheets can process data using formulas (e.g. SUM, AVERAGE).</p><p>Databases process data through queries that search and filter records.</p><p>Processed data supports decision-making in business, science and government.</p>',q:'Which tool commonly uses formulas like SUM and AVERAGE to process data?',opts:["A spreadsheet", "A printer", "A keyboard", "A monitor"],correct:0,expl:'Spreadsheets are designed for calculations, using formulas like SUM and AVERAGE to process data.'},
  {ey:'Q7',ti:'Data Visualisation',teach:'<p>Charts and graphs help humans understand large datasets quickly.</p><p>Bar charts compare categories; line graphs show trends over time.</p><p>Pie charts show proportions of a whole.</p><p>Good visualisation avoids misleading scales or confusing colours.</p>',q:'Which chart type is best for showing a trend over time?',opts:["Pie chart", "Line graph", "A single number", "A random list"],correct:1,expl:'A line graph is ideal for showing how a value changes over time.'},
  {ey:'Q8',ti:'Data Privacy Basics',teach:'<p>Personal data includes your name, address, photos, and online activity.</p><p>Companies collect data about users, often to personalise services or ads.</p><p>Data protection laws (like Nigeria\'s NDPA) regulate how personal data is used.</p><p>You should think carefully before sharing personal data online.</p>',q:'What does Nigeria\'s NDPA relate to?',opts:["Network Design Protocol Application", "Nigeria Data Protection Act — regulating personal data use", "A new type of internet cable", "A gaming console"],correct:1,expl:'The Nigeria Data Protection Act (NDPA) regulates how organisations collect and use personal data.'},
  {ey:'Q9',ti:'Keeping Data Safe',teach:'<p>Passwords, encryption and backups all help protect data.</p><p>Never share your password with friends, even ones you trust.</p><p>Two-factor authentication (2FA) adds an extra layer of security.</p><p>Losing data can be prevented by regular, automatic backups.</p>',q:'What does two-factor authentication (2FA) add to account security?',opts:["A second layer of proof of identity beyond just a password", "Nothing — it's just decoration", "A faster internet connection", "A bigger storage limit"],correct:0,expl:'2FA requires a second form of verification (like a code sent to your phone), adding extra protection beyond a password.'},
  {ey:'Q10',ti:'Data in Everyday Life',teach:'<p>Data drives recommendations on YouTube, Netflix, and social media.</p><p>Banks use data to detect fraud and unusual spending patterns.</p><p>Hospitals use patient data to improve treatment and track outcomes.</p><p>Understanding how data is used helps you be a more informed digital citizen.</p>',q:'What might a bank use unusual spending pattern data for?',opts:["Sending you more adverts", "Detecting potential fraud", "Choosing your phone wallpaper", "Increasing screen brightness"],correct:1,expl:'Banks analyse spending pattern data to detect fraud, flagging unusual transactions for review.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->
<div id="ey" style="display:none"></div>

</script>
</body>
</html>
