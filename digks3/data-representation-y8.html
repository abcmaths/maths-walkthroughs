<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Representation — Digital Technologies | Adorable Portal</title>
<style>
  :root {
    --red: #37474F; --dark: #263238; --cream: #ECEFF1; --line: #CFD8DC; --gold: #00ACC1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:var(--cream); min-height:100vh; }
  header { background:var(--red); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .title { font-size:1.05rem; font-weight:700; }
  header .strand { font-size:0.8rem; opacity:0.85; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  .card { background:white; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,0.08); padding:26px 28px; margin-bottom:20px; }
  .progress-bar { background:var(--line); border-radius:99px; height:8px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { background:var(--red); height:100%; border-radius:99px; transition:width 0.3s; }
  .step-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--red); margin-bottom:6px; }
  .q-title { font-size:1.15rem; font-weight:700; color:var(--dark); margin-bottom:14px; }
  .teach p { margin-bottom:10px; line-height:1.55; color:#333; font-size:0.95rem; }
  .your-turn { background:var(--cream); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .yt-q { font-weight:600; margin-bottom:12px; color:var(--dark); }
  .opt-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:6px; background:white; cursor:pointer; font-size:0.9rem; color:#333; transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--red); }
  .try-fb { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:0.88rem; display:none; }
  .try-fb.ok { background:#e8f5e9; color:#2e7d32; display:block; }
  .try-fb.er { background:#fde8e8; color:#c0272d; display:block; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .btn { padding:10px 22px; background:var(--red); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-outline { padding:10px 22px; background:white; color:var(--red); border:2px solid var(--red); border-radius:6px; font-weight:700; cursor:pointer; font-size:0.9rem; }
  .sb-lbl { font-size:0.8rem; color:#888; }
  svg.diagram { width:100%; height:auto; max-height:180px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Data Representation</div>
    <div class="strand">Digital Technologies · Data & Programming</div>
  </div>
  <div class="sb-lbl" id="sb">Step 1 / 10</div>
</header>
<main>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:10%"></div></div>
  <div class="card">
    <svg class="diagram" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" id="diagram">
      <rect x="0" y="0" width="700" height="140" fill="var(--cream)"/>
      <circle cx="60" cy="70" r="34" fill="var(--red)" opacity="0.15"/>
      <text x="60" y="78" font-size="28" text-anchor="middle" fill="var(--red)" font-family="Arial">DT</text>
      <text x="130" y="65" font-size="18" fill="var(--dark)" font-family="Arial" font-weight="bold" id="diagram-title"></text>
      <text x="130" y="88" font-size="13" fill="#555" font-family="Arial" id="diagram-sub"></text>
    </svg>
    <div class="step-label" id="step-label">Checkpoint 1 of 10</div>
    <div class="q-title" id="cp-title"></div>
    <div class="teach" id="teach-content"></div>
    <div class="your-turn" id="your-turn" style="display:none">
      <div class="yt-q" id="yt-question"></div>
      <div id="yt-opts"></div>
      <div class="try-fb" id="try-fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" id="prev-btn" onclick="prevStep()">Back</button>
      <button class="btn" id="next-btn" onclick="nextStep()">Continue</button>
    </div>
  </div>
</main>

<script>
  const QS = [
  {ey:'Q1',ti:'Representing Numbers in Binary',teach:'<p>Computers represent all numbers using binary (base 2): only 0s and 1s.</p><p>Each binary digit is called a "bit"; 8 bits make a "byte".</p><p>Binary place values double each time: 1, 2, 4, 8, 16, 32...</p><p>Converting between binary and decimal is a foundational computing skill.</p>',q:'What number base does binary use?',opts:["Base 10", "Base 2", "Base 16", "Base 8"],correct:1,expl:'Binary is a base-2 number system, using only the digits 0 and 1.'},
  {ey:'Q2',ti:'Representing Text',teach:'<p>Text is stored using character encoding systems like ASCII or Unicode.</p><p>ASCII assigns each letter, number and symbol a unique numeric code.</p><p>Unicode extends this to support many more characters and languages worldwide.</p><p>Every letter you type is ultimately stored as a binary number.</p>',q:'What do character encoding systems like ASCII assign to each character?',opts:["A colour", "A unique numeric code", "A sound", "A physical location"],correct:1,expl:'ASCII and similar systems assign each character a unique numeric code so it can be stored digitally.'},
  {ey:'Q3',ti:'Representing Images',teach:'<p>Digital images are made of tiny coloured dots called pixels.</p><p>Each pixel\'s colour is often represented using RGB (Red, Green, Blue) values.</p><p>More pixels generally means higher image resolution and detail.</p><p>Image file size depends on resolution, colour depth, and compression.</p>',q:'What does RGB stand for in image representation?',opts:["Red, Green, Blue", "Red, Grey, Black", "Round, Grid, Binary", "Radio, Graphics, Broadband"],correct:0,expl:'RGB stands for Red, Green, Blue — the three colour channels combined to create the colours in digital images.'},
  {ey:'Q4',ti:'Representing Sound',teach:'<p>Sound is captured by sampling an analogue wave at regular intervals.</p><p>Sample rate (measured in Hz) affects the quality of the digital recording.</p><p>Higher sample rates capture more detail but create larger file sizes.</p><p>Common audio formats include MP3 (compressed) and WAV (uncompressed).</p>',q:'What does a higher audio sample rate generally provide?',opts:["Lower quality recordings", "More detail, at the cost of larger file size", "Smaller file sizes with no quality change", "No effect on quality or size"],correct:1,expl:'A higher sample rate captures sound more accurately, but produces larger file sizes as a trade-off.'},
  {ey:'Q5',ti:'Binary to Decimal Conversion',teach:'<p>To convert binary to decimal, add up the place values where there is a 1.</p><p>Example: 1011 in binary = 8+0+2+1 = 11 in decimal.</p><p>Practising conversions builds a deeper understanding of how computers "think".</p><p>This skill underlies more advanced topics like data structures and networking.</p>',q:'What is the decimal value of the binary number 1010?',opts:["8", "10", "12", "5"],correct:1,expl:'1010 in binary = 8+0+2+0 = 10 in decimal.'},
  {ey:'Q6',ti:'Data Compression Basics',teach:'<p>Compression reduces the size of data for storage or transmission.</p><p>Lossless compression preserves all original data exactly (e.g. ZIP, PNG).</p><p>Lossy compression removes some data to save more space (e.g. JPEG, MP3).</p><p>Choosing lossy vs lossless depends on whether perfect quality is required.</p>',q:'Which compression type removes some data permanently to save more space?',opts:["Lossless compression", "Lossy compression", "No compression", "Encryption"],correct:1,expl:'Lossy compression sacrifices some quality/data to achieve greater file size reduction.'},
  {ey:'Q7',ti:'Hexadecimal',teach:'<p>Hexadecimal is a base-16 number system using digits 0-9 and letters A-F.</p><p>It is often used as a shorthand for binary, since each hex digit represents 4 bits.</p><p>Colour codes in web design (like #FF0000 for red) use hexadecimal.</p><p>Programmers often use hex to represent memory addresses concisely.</p>',q:'What does a web colour code like "#FF0000" use?',opts:["Binary only", "Hexadecimal", "Decimal only", "Roman numerals"],correct:1,expl:'Web colour codes are written in hexadecimal, representing red, green and blue values as hex pairs.'},
  {ey:'Q8',ti:'Data Types in Programming',teach:'<p>Common data types include integers (whole numbers), floats (decimals), strings (text), and booleans (true/false).</p><p>Choosing the correct data type ensures programs behave correctly and efficiently.</p><p>Type errors occur when a program tries to use data of the wrong type incorrectly.</p><p>Understanding data types is essential before writing more advanced programs.</p>',q:'Which data type would best store the value "true" or "false"?',opts:["Integer", "Boolean", "String", "Float"],correct:1,expl:'A Boolean data type is specifically designed to store one of two values: true or false.'},
  {ey:'Q9',ti:'Why Binary Matters',teach:'<p>Electronic circuits naturally have two clear states: on and off, matching binary perfectly.</p><p>This makes binary reliable, since it\'s easy to distinguish just two states electrically.</p><p>All complex data — text, images, sound, video — is ultimately built from binary.</p><p>Understanding binary helps explain how computers can be so reliable and fast.</p>',q:'Why is binary well-suited to electronic computers?',opts:["Because electronic circuits naturally have two clear states: on and off", "Because binary is the prettiest number system", "Because computers cannot understand any other system in theory", "Because binary uses ten different digits"],correct:0,expl:'Binary matches the two clear physical states (on/off) that electronic circuits can reliably distinguish.'},
  {ey:'Q10',ti:'Data Representation in Practice',teach:'<p>Every file you save — document, photo, song — is stored as binary data.</p><p>Understanding representation helps explain file sizes and compatibility issues.</p><p>Corrupted data representation can cause files to become unreadable.</p><p>This foundational knowledge supports later topics like databases and networking.</p>',q:'What is ultimately true about every digital file, whether text, image or sound?',opts:["It is stored as binary data", "It is stored as handwriting", "It requires no storage at all", "It cannot be compressed"],correct:0,expl:'Regardless of file type, all digital files are ultimately represented and stored as binary data.'}
  ];
  const TOTAL = QS.length;
  let idx = 0;
  let answered = new Array(TOTAL).fill(false);

  function render() {
    const q = QS[idx];
    document.getElementById('sb').textContent = 'Step ' + (idx+1) + ' / ' + TOTAL;
    document.getElementById('pfill').style.width = Math.round(((idx+1)/TOTAL)*100) + '%';
    document.getElementById('step-label').textContent = 'Checkpoint ' + (idx+1) + ' of ' + TOTAL;
    document.getElementById('cp-title').textContent = q.ti;
    document.getElementById('ey').innerHTML = q.teach;
    document.getElementById('diagram-title').textContent = q.ti;
    document.getElementById('diagram-sub').textContent = 'Digital Technologies';
    const yt = document.getElementById('your-turn');
    yt.style.display = 'block';
    document.getElementById('yt-question').textContent = q.q;
    const optsDiv = document.getElementById('yt-opts');
    optsDiv.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i, b);
      optsDiv.appendChild(b);
    });
    document.getElementById('try-fb').className = 'try-fb';
    document.getElementById('try-fb').textContent = '';
    document.getElementById('next-btn').textContent = (idx === TOTAL - 1) ? 'Restart' : 'Continue';
    document.getElementById('prev-btn').disabled = (idx === 0);
  }

  function selectAnswer(i, btn) {
    const q = QS[idx];
    const fb = document.getElementById('try-fb');
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');
    if (i === q.correct) {
      btn.style.borderColor = '#2e7d32'; btn.style.background = '#e8f5e9';
      fb.className = 'try-fb ok';
      fb.textContent = '✓ Correct! ' + q.expl;
      answered[idx] = true;
    } else {
      btn.style.borderColor = '#c0272d'; btn.style.background = '#fde8e8';
      fb.className = 'try-fb er';
      fb.textContent = '✗ Not quite. ' + q.expl;
    }
  }

  function nextStep() {
    if (idx === TOTAL - 1) { idx = 0; } else { idx++; }
    render();
  }
  function prevStep() {
    if (idx > 0) { idx--; render(); }
  }

  render();
</script>

<!-- hidden element used by render() per gold-standard pattern -->

</body>
</html>
