<script>
var ST={};
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function nCr(n,r){if(r<0||r>n)return 0;return fact(n)/(fact(r)*fact(n-r));}
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,fn:genFn};return buildTry(id,o);}
function buildTry(id,o){var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');var ph='Answer'+(o.unit?' ('+o.unit+')':'');return '<div class="try" data-tryid="'+id+'"><div class="try-t">\u2714 Your Turn <button class="nq-btn" data-tryid="'+id+'">\u21bb New</button></div><div class="try-q">'+o.question+'</div><ul class="hl">'+(h||'')+'</ul><div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div><div class="try-fb" data-tryid="'+id+'"></div><details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details></div>';}
document.addEventListener('click',function(e){var el=e.target;if(el.classList.contains('nq-btn')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.fn();en.o=o;ST[id]={o:o,fn:en.fn};var wrap=document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);return;}if(el.classList.contains('try-ck')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.o;var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;var v=parseFloat(inp.value);if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}var tol=o.tol!=null?o.tol:0;if(Math.abs(v-o.ans)<=tol){fb.className='try-fb ok';fb.innerHTML='\u2713 Correct! \u00a0'+o.working;}else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}}});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Georgia,serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w){c=c||'#C0272D';w=w||2;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"/>';}

// Session values

var V={};
(function(){
  V.a1=rnd(1,3);V.b1=rnd(2,5);V.c1=rnd(1,4);
  V.p2=rnd(2,4);
  V.d3=rnd(1,3);
  V.n4=rnd(2,4);
})();

function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'Split ('+(V.a1+V.b1)+'x + '+(V.a1*V.c1)+') / [(x+'+V.a1+')(x+'+V.b1+')]','#C0272D',12,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,42,'#f8f8f8','#ccc',1));
    o.push(T(240,78,'Write as: A/(x+'+V.a1+')  +  B/(x+'+V.b1+')','#241A17',13,'middle',true));
  }
  if(p>=2){
    o.push(R(14,102,452,70,'#fff5f0','#C0272D',1.5));
    o.push(T(240,120,'Multiply both sides by (x+'+V.a1+')(x+'+V.b1+'):','#241A17',11,'middle',true));
    o.push(T(240,140,'numerator = A(x+'+V.b1+') + B(x+'+V.a1+')','#241A17',12,'middle',true));
    o.push(T(240,160,'Substitute x=\u2212'+V.a1+' to eliminate B, then x=\u2212'+V.b1+' to eliminate A','#888',9,'middle'));
  }
  if(p>=3){
    o.push(R(14,180,452,72,'#e8f8ee','#1a7a3a',1.5));
    o.push(T(240,200,'x = \u2212'+V.a1+':  numerator = A('+V.b1+'\u2212'+V.a1+')','#1a7a3a',11,'middle',true));
    o.push(T(240,220,'x = \u2212'+V.b1+':  numerator = B('+V.a1+'\u2212'+V.b1+')','#1a7a3a',11,'middle',true));
    o.push(T(240,240,'Solve each equation to find A and B','#888',9,'middle'));
  }
  s.innerHTML=o.join('');
}

function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'Repeated factor: split 1/(x\u2212'+V.p2+')\u00b2 style expressions','#C0272D',12,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,55,'#f8f8f8','#ccc',1));
    o.push(T(240,74,'For a REPEATED linear factor (x\u2212'+V.p2+')\u00b2, you need','#241A17',11,'middle',true));
    o.push(T(240,94,'TWO separate terms: A/(x\u2212'+V.p2+')  +  B/(x\u2212'+V.p2+')\u00b2','#C0272D',12,'middle',true));
  }
  if(p>=2){
    o.push(R(14,116,452,60,'#fff5f0','#C0272D',1.5));
    o.push(T(240,136,'Common mistake: using only one term A/(x\u2212'+V.p2+')\u00b2','#241A17',11,'middle',true));
    o.push(T(240,156,'This misses a whole family of possible numerators!','#888',9,'middle'));
    o.push(T(240,172,'Always use one term per POWER of the repeated factor','#C0272D',10,'middle',true));
  }
  if(p>=3){
    o.push(R(14,184,452,68,'#e8f4ff','#1a5a8a',1.5));
    o.push(T(240,204,'Multiply through by (x\u2212'+V.p2+')\u00b2 and compare','#1a5a8a',11,'middle',true));
    o.push(T(240,224,'coefficients of x, and the constant term,','#1a5a8a',11,'middle',true));
    o.push(T(240,242,'to set up simultaneous equations for A and B','#1a5a8a',11,'middle',true));
  }
  s.innerHTML=o.join('');
}

function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'Irreducible quadratic factor: 1/[(x+'+V.d3+')(x\u00b2+1)]','#C0272D',12,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,55,'#f8f8f8','#ccc',1));
    o.push(T(240,74,'When a factor cannot be split into real linear factors','#241A17',11,'middle',true));
    o.push(T(240,94,'(like x\u00b2+1), use a LINEAR numerator: (Bx+C)/(x\u00b2+1)','#C0272D',12,'middle',true));
  }
  if(p>=2){
    o.push(R(14,116,452,55,'#fff5f0','#C0272D',1.5));
    o.push(T(240,136,'Full split: A/(x+'+V.d3+')  +  (Bx+C)/(x\u00b2+1)','#241A17',12,'middle',true));
    o.push(T(240,156,'Note: the numerator over a quadratic needs 2 unknowns (B,C)','#888',9,'middle'));
  }
  if(p>=3){
    o.push(R(14,178,452,66,'#e8f4ff','#1a5a8a',1.5));
    o.push(T(240,198,'Multiply through, expand, then compare','#1a5a8a',11,'middle',true));
    o.push(T(240,216,'coefficients of x\u00b2, x\u00b9 and x\u2070 (constants)','#1a5a8a',11,'middle',true));
    o.push(T(240,236,'to form simultaneous equations for A, B, C','#1a5a8a',11,'middle',true));
  }
  s.innerHTML=o.join('');
}

function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'Improper fraction: degree of top \u2265 degree of bottom','#C0272D',13,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,50,'#f8f8f8','#ccc',1));
    o.push(T(240,72,'If the numerator\'s highest power \u2265 denominator\'s,','#241A17',11,'middle',true));
    o.push(T(240,92,'the fraction is IMPROPER \u2014 divide first!','#C0272D',12,'middle',true));
  }
  if(p>=2){
    o.push(R(14,112,452,60,'#fff5f0','#C0272D',1.5));
    o.push(T(240,132,'Use algebraic long division (or inspection) to write:','#241A17',11,'middle',true));
    o.push(T(240,152,'improper fraction = polynomial + (proper fraction)','#C0272D',12,'middle',true));
    o.push(T(240,168,'Then split the remaining proper fraction as normal','#888',9,'middle'));
  }
  if(p>=3){
    o.push(R(14,182,452,68,'#e8f8ee','#1a7a3a',1.5));
    o.push(T(240,202,'e.g. (x\u00b3)/(x\u00b2\u22121) has degree 3 on top, degree 2 below','#1a7a3a',11,'middle',true));
    o.push(T(240,222,'\u2192 divide to get: x  +  x/(x\u00b2\u22121)','#1a7a3a',12,'middle',true));
    o.push(T(240,240,'Only the remaining fraction gets split into partial fractions','#888',9,'middle'));
  }
  s.innerHTML=o.join('');
}

var QS=[
  {ey:'Q1 \u00b7 Partial Fractions \u00b7 Further Maths',ti:'Distinct Linear Factors',
   su:'Splitting a fraction with two different linear factors on the bottom.',
   steps:[
    {lb:'Set up the split',dr:dQ1,ht:'<p>For distinct linear factors (x+a)(x+b), write the fraction as A/(x+a) + B/(x+b), where A and B are constants to find.</p>'},
    {lb:'Clear the fractions',dr:dQ1,ht:'<p>Multiply every term by the full denominator (x+a)(x+b) to remove all fractions, leaving an equation in the numerators only.</p>'},
    {lb:'Substitute clever values of x',dr:dQ1,ht:'<p>Substitute x = \u2212a to make the B-term vanish (solving for A), then x = \u2212b to make the A-term vanish (solving for B).</p>'},
    {lb:'Your turn',dr:dQ1,ht:tryIt(function(){
      var a=rnd(1,4),b=rnd(a+1,a+5);
      return {question:'For 1/[(x+'+a+')(x+'+b+')] = A/(x+'+a+') + B/(x+'+b+'), find A by substituting x = \u2212'+a+'. (Answer as a decimal, A = 1/('+b+'\u2212'+a+'))',
        hints:['Substituting x=\u2212'+a+' gives: 1 = A('+b+'\u2212'+a+')'],
        ans:Math.round((1/(b-a))*1000)/1000,tol:0.01,unit:'',working:'1 = A('+b+'\u2212'+a+') \u21d2 A = 1/'+(b-a)+' = '+(1/(b-a)).toFixed(3)};
    })}
   ]},

  {ey:'Q2 \u00b7 Partial Fractions \u00b7 Further Maths',ti:'Repeated Linear Factors',

    {lb:'The correct split',dr:dQ2,ht:'<p>Use A/(x\u2212p) + B/(x\u2212p)\u00b2 \u2014 one term for each power of the repeated factor, from power 1 up to the highest power present.</p>'},

      var p=rnd(2,5);
      return {question:'For 3/(x\u2212'+p+')\u00b2, when split as A/(x\u2212'+p+') + B/(x\u2212'+p+')\u00b2, substituting x='+p+' directly into "3 = A(x\u2212'+p+') + B" gives B = ?',
        hints:['At x='+p+', the A(x\u2212'+p+') term becomes zero, leaving just B'],
        ans:3,tol:0,unit:'',working:'At x='+p+': 3 = A\u00d70 + B \u21d2 B = 3'};
    })}
   ]},

  {ey:'Q3 \u00b7 Partial Fractions \u00b7 Further Maths',ti:'Irreducible Quadratic Factors',
   su:'Splitting fractions with a quadratic that cannot be factorised further.',
   steps:[

    {lb:'Using a linear numerator',dr:dQ3,ht:'<p>Over an irreducible quadratic factor, use a numerator of the form (Bx+C), not just a single constant \u2014 since the numerator could contain an x term.</p>'},
    {lb:'Setting up the full split',dr:dQ3,ht:'<p>Combine with any linear factors present: e.g. A/(x+d) + (Bx+C)/(x\u00b2+1), then clear fractions and compare coefficients.</p>'},
    {lb:'Your turn',dr:dQ3,ht:tryIt(function(){
      var d=rnd(1,4);
      return {question:'When splitting 1/[(x+'+d+')(x\u00b2+1)] as A/(x+'+d+') + (Bx+C)/(x\u00b2+1), how many unknown constants must be found in total?',
        hints:['Count: A, B and C'],
        ans:3,tol:0,unit:'',working:'There are 3 unknowns to find: A (linear factor), and B, C (quadratic factor numerator)'};
    })}
   ]},

  {ey:'Q4 \u00b7 Partial Fractions \u00b7 Further Maths',ti:'Improper Fractions',
   su:'Dividing first when the numerator\u2019s degree is too high.',
   steps:[
    {lb:'Checking if a fraction is improper',dr:dQ4,ht:'<p>Compare the highest power of x on top with the highest power on the bottom. If the top\u2019s degree is greater than or equal to the bottom\u2019s, the fraction is improper.</p>'},
    {lb:'Dividing before splitting',dr:dQ4,ht:'<p>Improper fractions must be divided (polynomial long division, or inspection for simple cases) BEFORE applying partial fractions \u2014 partial fractions only work directly on proper fractions.</p>'},
