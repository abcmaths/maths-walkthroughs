function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');

    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'

}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Jesus\' Teaching on Wealth',ACC,12,'middle',true));
[['Teaching','Summary','Reference'],['You cannot serve God and money','Wealth as a rival lord','Matt 6:24'],['Seek first the Kingdom','Wealth anxiety overcome by priorities','Matt 6:33'],['Rich Young Ruler','Wealth blocked entry to Kingdom','Matt 19:16-22'],['Camel through needle','Extreme difficulty for rich entering Kingdom','Matt 19:24'],['Zacchaeus','Wealth surrendered = salvation arrived','Luke 19:1-10'],['Rich fool','More barns; life demanded this night','Luke 12:16-21'],['Talents','Steward what God gives faithfully','Matt 25:14-30']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(110,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(245,34+i*28,r[1],'#444',7,'middle',false));o.push(T(400,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}

o.push(T(240,20,'Stewardship Principles in the Gospels',ACC,12,'middle',true));
[['Principle','Teaching','Reference'],['Trustworthiness','Faithful in little; faithful in much','Luke 16:10'],['Accountability','Every manager must give an account','Luke 16:2'],['Generosity','Give to the poor; treasure in heaven','Mark 10:21'],['Serving God not wealth','Cannot serve both God and mammon','Matt 6:24'],['Kingdom priority','Seek first Kingdom; rest added','Matt 6:33'],['Giving in secret','Not for human applause','Matt 6:1-4'],['Radical generosity','Zacchaeus gave half his goods to poor','Luke 19:8']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(110,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(245,34+i*28,r[1],'#444',7,'middle',false));o.push(T(400,34+i*28,r[2],'#666',6,'middle',false));}});

[['God vs wealth','Cannot serve both — wealth is a rival lord (Matt 6:24)'],['Kingdom priority','Seek first Kingdom; do not worry about material needs (Matt 6:33)'],['Danger of wealth','Chokes the word (Matt 13:22); camel through needle (19:24)'],['Faithful stewardship','Faithful in little = trusted with more (Luke 16:10)'],['Generous giving','Secret giving (Matt 6:1-4); give to poor = treasure in heaven'],['WAEC tip','Know the specific parables and the references to wealth sayings']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(130,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'Jesus on Wealth and Possessions',su:'Examine what Jesus taught about wealth and possessions.',steps:[
{lb:'The danger of wealth',dr:dQ1,ht:'<p>Jesus taught consistently about the danger of wealth: (1) <em>"You cannot serve both God and money."</em> (Matt.6:24) — wealth as a competing lord. (2) The Sower — seed among thorns: "the worries of this life and the deceitfulness of wealth choke the word, making it unfruitful" (Matt.13:22). (3) The Rich Young Ruler — "he went away sad, because he had great wealth" (Matt.19:22). (4) <em>"It is easier for a camel to go through the eye of a needle than for someone who is rich to enter the Kingdom of God"</em> (Matt.19:24) — the disciples were "greatly astonished." (5) The Parable of the Rich Fool — "a man\'s life does not consist in the abundance of his possessions" (Luke 12:15). Jesus did not condemn wealth as inherently sinful but identified it as the greatest rival to God for the heart\'s loyalty.</p>'},
{lb:'The Rich Fool (Luke 12:16-21)',dr:dQ2,ht:'<p>A rich man had abundant crops, built bigger barns, said to himself: "Take life easy; eat, drink and be merry." God said: "You fool! This very night your life will be demanded from you. Then who will get what you have prepared for yourself?" Jesus concluded: "This is how it will be with whoever stores up things for themselves but is not rich toward God." The Rich Fool\'s errors: (1) He thought his life was secure because of possessions. (2) He accumulated without giving. (3) He made no provision for death and eternity. (4) He was "rich in things" but not "rich toward God." Contrast: the Talents parable rewards faithful stewardship; the Rich Fool is condemned for selfish accumulation. Stewardship means managing wealth for God, not accumulating for self.</p>'},
{lb:'Zacchaeus — wealth surrendered (Luke 19:1-10)',dr:dQ1,ht:'<p>Zacchaeus — a wealthy chief tax collector — climbed a tree to see Jesus. Jesus called him down and visited his house. Zacchaeus declared: <em>"Look, Lord! Here and now I give half of my possessions to the poor, and if I have cheated anybody out of anything, I will pay back four times the amount."</em> Jesus said: "Today salvation has come to this house." The progression: encounter with Jesus → voluntary, immediate, radical redistribution of wealth → declaration of salvation. Zacchaeus shows that wealthy people can enter the Kingdom — when their wealth is surrendered to God\'s priorities rather than hoarded for self. His restitution (fourfold repayment) went beyond legal requirements (Num.5:7 required one-fifth). Salvation transformed his relationship with wealth immediately.</p>'},
{lb:'Do not worry — Kingdom priority (Matt 6:25-34)',dr:dQ1,ht:'<p>Jesus addressed financial anxiety directly: "Do not worry about your life, what you will eat or drink; or about your body, what you will wear" (Matt.6:25). He gave four reasons: (1) Life is more than food and clothing. (2) God feeds the birds — "are you not much more valuable than they?" (3) Worry cannot add to your life span. (4) God clothes the flowers — "will he not much more clothe you?" The conclusion: <em>"Seek first his Kingdom and his righteousness, and all these things will be given to you as well."</em> (Matt.6:33). The antidote to financial anxiety is Kingdom priority: when God\'s reign is the central concern, material needs fall into their proper perspective. This is faith in God\'s provision, not irresponsibility.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Jesus said "You cannot serve both God and money" (Matt 6:24) because:',o:['Christianity requires a vow of poverty and all Christians must give away all possessions','Money is inherently evil and was created by Satan','Wealth functions as a rival lord — total loyalty to God and total trust in wealth are mutually exclusive; Kingdom membership demands that God, not financial security, is the ultimate master','This only applied to the twelve disciples who were required to travel without provisions'],a:3,w:'"Mammon" (Aramaic for wealth/money) is described as a master who demands loyalty — not just a neutral tool. Jesus did not forbid possessions but identified the heart issue: what do you ultimately trust and serve? The Rich Young Ruler trusted his wealth; Zacchaeus surrendered his. The question is not wealth/no wealth but who is lord of your life.'},{q:'The Parable of the Rich Fool (Luke 12:16-21) was told in response to:',o:['A Pharisee asking about the greatest commandment','A man asking Jesus to tell his brother to divide the inheritance — Jesus refused and told the parable to warn against greed','A rich young man asking what he must do to inherit eternal life','The disciples arguing about which of them was the greatest'],a:2,w:'Luke 12:13-15 — someone in the crowd asked Jesus to arbitrate an inheritance dispute. Jesus refused: "Watch out! Be on your guard against all kinds of greed; life does not consist in an abundance of possessions" (12:15). Then the parable of the Rich Fool followed — illustrating the danger of defining life by possessions and accumulating without being "rich toward God."'},{q:'Zacchaeus gave half his possessions to the poor and repaid cheated persons fourfold. Jesus responded by saying:',o:['"Now you must also be baptised to complete your salvation"','"Today salvation has come to this house" — the radical generosity was evidence of genuine encounter with Jesus transforming his relationship with wealth','"Well done — but you should have given all your possessions, not just half"','"Go and tell the Pharisees what you have done so they can learn from your example"'],a:2,w:'Luke 19:9 — "Today salvation has come to this house, because this man, too, is a son of Abraham." The sequence: Jesus visited → Zacchaeus declared generous restitution → Jesus declared salvation. The radical generosity was the fruit of salvation received, not the price paid for it. Note: Jesus did not demand this — Zacchaeus volunteered it. Genuine encounter with Jesus transforms the relationship with wealth.'},{q:'"Seek first his Kingdom and his righteousness, and all these things will be given to you" (Matt 6:33) teaches:',o:['Christians never need to work for food and clothing because God will supply them miraculously','The antidote to material anxiety is Kingdom priority — when God\'s reign is central, material needs fall into proper perspective and God provides','Christians should never make financial plans or savings since this shows lack of trust in God','This promise only applied to the disciples who had given up all income to follow Jesus'],a:2,w:'Matt.6:33 is the climax of the "do not worry" section. The antidote to financial anxiety is not denial ("don\'t think about money") or prosperity thinking ("claim great wealth") but Kingdom priority: seek God\'s reign first; trust that the God who feeds birds and clothes flowers knows your material needs and will provide them. This is faith in God\'s provision, not a prohibition on responsible work or planning.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'Stewardship in the Gospels',su:'Examine what the Gospels teach about faithful stewardship.',steps:[
{lb:'The Parable of the Talents (Matt 25:14-30)',dr:dQ2,ht:'<p>The Talents parable is the primary stewardship parable: a master distributed 5, 2 and 1 talent. The 5-talent and 2-talent servants doubled their amounts; the 1-talent servant buried his. "Well done, good and faithful servant!" for the productive servants; condemnation for the buried one. Stewardship principles: (1) God entrusts resources to his servants. (2) Faithful management is expected. (3) Inaction ("burying") is as culpable as misuse. (4) The same praise given to both the 5-talent and 2-talent servants — reward is for faithfulness, not amount. (5) "You have been faithful with a few things; I will put you in charge of many things" (25:21) — faithful stewardship is the path to greater responsibility.</p>'},
{lb:'The Dishonest Manager (Luke 16:1-13)',dr:dQ2,ht:'<p>A manager accused of wasting his master\'s possessions acted quickly to secure his future: he reduced debtors\' bills, making friends who would help him after he lost his job. The master commended his shrewdness. Jesus applied the lesson: "Use worldly wealth to gain friends for yourselves, so that when it is gone, you will be welcomed into eternal dwellings" (Luke 16:9). The point is not the manager\'s dishonesty but his <b>shrewdness</b> — he used present resources with an eye to future consequences. Christians should be equally shrewd: use present material resources for eternal purposes. Jesus then stated the principle: "Whoever can be trusted with very little can also be trusted with much" (Luke 16:10).</p>'},
{lb:'Faithful in little — Luke 16:10-13',dr:dQ2,ht:'<p><em>"Whoever can be trusted with very little can also be trusted with much, and whoever is dishonest with very little will also be dishonest with much. So if you have not been trustworthy in handling worldly wealth, who will trust you with true riches?"</em> (Luke 16:10-11). Stewardship principles: (1) Character is consistent — the way we handle small things reflects our character in large things. (2) Material faithfulness is a test for spiritual responsibility. (3) Worldly wealth is not our own but on loan — we are managers, not owners. (4) "True riches" (spiritual, eternal) are entrusted to those who demonstrate faithfulness with material things. Jesus connected financial behaviour directly to spiritual character.</p>'},
{lb:'The Widow\'s Offering (Mark 12:41-44)',dr:dQ2,ht:'<p>Jesus sat opposite the temple treasury and watched the crowd put in money. Many rich people put in large amounts. A poor widow came and put in two very small copper coins ("lepta" — each worth a fraction of a penny). Jesus said: "Truly I tell you, this poor widow has put more into the treasury than all the others. They all gave out of their wealth; but she, out of her poverty, put in everything — all she had to live on." (Mark 12:43-44). Teaching: (1) God measures generosity by proportion and sacrifice, not by amount. (2) Giving "out of poverty" surpasses giving "out of wealth" — because sacrifice is greater. (3) The widow gave "all she had to live on" — total trust in God\'s provision. This is the highest standard of stewardship in the Gospels.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'In the Parable of the Talents, the servant who received ONE talent was condemned because:',o:['He invested his talent in a risky project that failed and lost the money','He gave his talent to someone poorer than himself as an act of charity','He buried his talent out of fear — doing nothing with what he was entrusted, which Jesus condemned as wicked and lazy; inaction is as culpable as misuse','He was the youngest servant and therefore had the least experience in financial matters'],a:3,w:'Matt.25:24-27 — the one-talent servant "hid your gold in the ground" (25:25) out of fear. The master replied: "you should have put my money on deposit with the bankers, so that when I returned I would have received it back with interest" (25:27). Even minimal action was better than inaction. God condemns the servant who does nothing with what he has been given — not because the amount was small, but because of the choice to bury rather than use.'},{q:'The Widow\'s Offering (Mark 12:41-44) teaches that God measures generosity by:',o:['The absolute amount given — larger gifts are always more valuable in God\'s sight','The percentage of income given — 10% is the required standard (the tithe)','Sacrifice and proportion — the widow\'s two lepta surpassed all the large gifts because she gave from poverty; she gave all she had to live on','Whether the gift is given to an officially recognised religious institution'],a:3,w:'Mark 12:44 — "They all gave out of their wealth; but she, out of her poverty, put in everything — all she had to live on." The criterion is not the amount but the sacrifice and proportion: the wealthy gave what they did not miss; the widow gave what she needed to survive. Her gift was greater in God\'s measurement — because it cost everything. This is the Gospel\'s highest standard of stewardship.'},{q:'Luke 16:10 — "Whoever can be trusted with very little can also be trusted with much" — teaches that financial behaviour:',o:['Is irrelevant to spiritual life — money and spirituality are entirely separate domains','Directly reflects character — the way people handle material resources reveals whether they can be trusted with spiritual responsibility','Determines salvation — faithful financial management is the primary criterion for entering the Kingdom','Only applies to the twelve apostles who managed the communal fund of Jesus\' ministry'],a:2,w:'Luke 16:10-11 — "if you have not been trustworthy in handling worldly wealth, who will trust you with true riches?" Material faithfulness is a test for spiritual character. Character is consistent: those who cheat in small things cheat in large things; those who are faithful in small things are trusted with greater responsibility. Jesus connected financial integrity directly to spiritual character — they are not separate domains.'},{q:'The Parable of the Dishonest Manager (Luke 16:1-13) is commended because:',o:['His dishonesty in reducing the debtors\' bills was approved by Jesus as ethical','He showed shrewdness — using present resources with an eye to future consequences; Jesus urged disciples to be equally shrewd in using worldly wealth for eternal purposes','He demonstrated that debt forgiveness is always the right thing to do regardless of the legality','The parable was meant to teach about the importance of loyalty to employers'],a:2,w:'Luke 16:8 — "the master commended the dishonest manager because he had acted shrewdly." Jesus was not approving the dishonesty but the shrewdness — planning ahead, using present resources for future security. The application: "use worldly wealth to gain friends for yourselves, so that when it is gone, you will be welcomed into eternal dwellings" (16:9). Use the temporary (money) for the eternal (heavenly welcome). Be as strategic about eternity as the manager was about his earthly future.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Wealth and Stewardship',su:'Practise WAEC questions on wealth and stewardship.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC essays on wealth and stewardship: Common questions: "What did Jesus teach about wealth and possessions?" "Describe the Parable of the Rich Fool and state its lessons." "Examine the teaching of Zacchaeus and what it shows about wealth." "What does the Parable of the Talents teach about stewardship?" Key passages: Matt.6:24 (God vs money); Matt.6:25-33 (do not worry; seek first Kingdom); Luke 12:16-21 (Rich Fool); Matt.19:16-22 (Rich Young Ruler); Matt.19:24 (camel through needle); Luke 19:1-10 (Zacchaeus); Matt.25:14-30 (Talents); Luke 16:1-13 (Dishonest Manager); Luke 16:10-13 (faithful in little); Mark 12:41-44 (Widow\'s Offering); Matt.6:1-4 (giving in secret).</p>'},
{lb:'Key references and final tips',dr:dQ2,ht:'<p>Essential wealth/stewardship references: "You cannot serve both God and money" — Matt.6:24. "Seek first his Kingdom and his righteousness" — Matt.6:33. "It is easier for a camel to go through the eye of a needle" — Matt.19:24. "A man\'s life does not consist in the abundance of his possessions" — Luke 12:15. "This very night your life will be demanded from you" — Luke 12:20. "Today salvation has come to this house" — Luke 19:9 (Zacchaeus). "Well done, good and faithful servant" — Matt.25:21 (Talents). "Whoever can be trusted with very little can also be trusted with much" — Luke 16:10. "She... put in everything — all she had to live on" — Mark 12:44 (Widow). WAEC final tips: Always distinguish between Jesus condemning wealth as evil (he did not) and Jesus warning about wealth as a rival to God (he did repeatedly). Know at least three specific parables with references and teachings.</p>'},
{lb:'Mixed revision',dr:dQ10,ht:'<p>Wealth and stewardship summary: God vs money (Matt.6:24 — competing lords); do not worry (Matt.6:25-34 — seek Kingdom first); Rich Fool (Luke 12:16-21 — accumulation without God); Rich Young Ruler (Matt.19:16-22 — wealth blocked Kingdom); camel (Matt.19:24); Zacchaeus (Luke 19 — salvation transforms wealth-relationship); Talents (Matt.25:14-30 — faithful stewardship; "well done"; 5/2/1 talents; condemned for burying); Dishonest Manager (Luke 16:1-13 — use present for eternal purposes); faithful in little (Luke 16:10 — financial faithfulness = character); Widow\'s Offering (Mark 12:41-44 — sacrifice and proportion); giving in secret (Matt.6:1-4). Key principle: wealth is not inherently evil but is the greatest rival to God for the human heart; stewardship means managing what God has given faithfully, generously and for eternal purposes.</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>WAEC must-knows — wealth and stewardship: (1) Matt.6:24 — cannot serve God and money. (2) Matt.6:33 — seek first the Kingdom. (3) Luke 12:16-21 — Rich Fool (narrative + "this very night"; "rich toward God"). (4) Matt.19:24 — camel through needle (what comes before and after). (5) Luke 19:9 — Zacchaeus (encounter → generosity → salvation). (6) Matt.25:21 — "well done, good and faithful servant" (Talents). (7) Luke 16:10 — faithful in little. (8) Mark 12:43-44 — Widow\'s Offering (gave everything; God measures by sacrifice). (9) Matt.6:1-4 — give in secret. (10) Luke 12:15 — "life does not consist in abundance of possessions." Connect wealth to Kingdom: wealth is the primary rival to Kingdom loyalty. Connect stewardship to character: how you handle money reveals who you are.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'The Rich Fool (Luke 12:16-21) built bigger barns to store his surplus harvest. God called him a fool because:',o:['Building barns was forbidden under Mosaic Law','He built the barns on land that did not belong to him','He defined his life by possessions and made no provision for eternity — he was "rich in things" but not "rich toward God"; and his life would be demanded that very night','He failed to tithe his abundant harvest to the Temple treasury'],a:3,w:'Luke 12:20-21 — God said: "You fool! This very night your life will be demanded from you. Then who will get what you have prepared for yourself?" The fool\'s error: (1) He thought wealth = security. (2) He accumulated without giving. (3) He planned for ease but not for death. (4) He was "rich toward things" but not "rich toward God." His barns were full; his soul was empty.'},{q:'The principle "whoever is faithful with little is faithful with much" (Luke 16:10) applies to stewardship by teaching:',o:['Christians should only give large amounts since small gifts are not noticed by God','The size of one\'s income determines the quality of one\'s spiritual character','Financial integrity in small things is evidence of character and preparedness for greater spiritual responsibility — material faithfulness is a test for spiritual trust','This only applied to the twelve who managed the shared purse of Jesus\' ministry'],a:3,w:'Luke 16:10-11 — character is consistent: those who handle small amounts faithfully demonstrate that they can be trusted with larger amounts. "If you have not been trustworthy in handling worldly wealth, who will trust you with true riches?" Financial behaviour reveals character, and character determines what God entrusts to a person spiritually. Money management is a spiritual test.'},{q:'The widow\'s two lepta (coins) exceeded all the large gifts in the temple treasury (Mark 12:43-44) in God\'s assessment because:',o:['Two is a sacred number in Jewish tradition and doubly blessed by God','She was a widow and God always gives widows special credit','She gave proportionally more — she gave everything she had to live on, while the wealthy gave from their surplus; sacrifice and proportion, not absolute amount, is God\'s measure of generosity','Her prayer accompanied the gift, which was more important than the amount given'],a:3,w:'Mark 12:44 — "They all gave out of their wealth; but she, out of her poverty, put in everything — all she had to live on." The standard is sacrifice and proportion: the rich gave what they did not miss; she gave what she needed to survive. Two lepta given as everything surpasses thousands of shekels given as surplus. God weighs the heart\'s sacrifice, not the hand\'s amount.'},{q:'In the Parable of the Talents (Matt 25:14-30), both the 5-talent and 2-talent servants received identical praise: "Well done, good and faithful servant." This teaches:',o:['God rewards those with greater original gifts more highly','Faithfulness, not the original amount, determines God\'s assessment — the servant with 2 talents who doubled them to 4 received the same praise as the servant with 5 who doubled to 10','God ignores the one-talent servant because his gift was too small to matter','The amount originally given determines the reward received in eternity'],a:2,w:'Both the 5-talent servant and the 2-talent servant received exactly the same commendation: "Well done, good and faithful servant! You have been faithful with a few things; I will put you in charge of many things" (25:21,23). The criterion is faithfulness, not amount. The servant with 2 talents who doubled them was as faithful as the servant with 5 who doubled them. God evaluates what you did with what you had, not what you had.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
