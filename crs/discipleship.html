<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Demands of Discipleship',ACC,12,'middle',true));
[['Demand','Text','Reference'],['Follow me','Immediate; leave everything','Matt 4:18-22'],['Deny yourself','Take up cross daily','Luke 9:23'],['Love more than family','Hate father/mother vs Jesus','Luke 14:26'],['Radical commitment','Foxes have holes — nowhere to lay head','Matt 8:20'],['Count the cost','Tower builder; king going to war','Luke 14:28-33'],['Servant of all','Whoever wants to be first must be slave','Mark 10:44'],['Bear fruit','By this my Father is glorified','John 15:8']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(255,34+i*28,r[1],'#444',7,'middle',false));o.push(T(405,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Cost and Reward of Discipleship',ACC,12,'middle',true));
[['Aspect','Teaching','Reference'],['Cost','Sell all; give to poor (Rich Young Ruler)','Matt 19:21'],['Reward','Hundredfold now; eternal life','Mark 10:29-30'],['Servanthood','Whoever would be great must serve','Matt 20:26'],['Suffering','They will persecute you as they persecuted me','John 15:20'],['Joy','My joy may be in you','John 15:11'],['Fruit','You did not choose me; I chose you to bear fruit','John 15:16'],['Mission','Go and make disciples of all nations','Matt 28:19']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(100,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(245,34+i*28,r[1],'#444',7,'middle',false));o.push(T(405,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Discipleship — Summary',ACC,13,'middle',true));
[['The call','Follow me — immediate, total, personal'],['The cost','Deny self; take up cross; leave all; count the cost first'],['Service','Servant of all; last is first; humble like a child'],['Fruit and mission','Bear fruit (John 15); Go make disciples (Matt 28:19)'],['Reward','Hundredfold now + eternal life (Mark 10:29-30)'],['WAEC tip','Know call narratives, cost sayings, servant passages, and John 15']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(130,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'The Call to Discipleship',su:'Examine how Jesus called his disciples and what the call demanded.',steps:[
{lb:'The call — immediate and total',dr:dQ1,ht:'<p>Jesus called his disciples with two words: "Follow me." The response of the first disciples was immediate: "At once they left their nets and followed him" (Matt.4:20). The call to discipleship in the Gospels is: (1) <b>Personal</b> — Jesus addressed individuals by name (Matt.4:18-19; Luke 19:5 — Zacchaeus). (2) <b>Immediate</b> — no preparation period; "at once" is the repeated word. (3) <b>Total</b> — they left their nets (Peter/Andrew), their father (James/John), their tax booth (Matthew), their wealth (rich young ruler was challenged to). (4) <b>Purposeful</b> — "I will send you out to fish for people" (Matt.4:19) — they were called from one vocation into a greater one.</p>'},
{lb:'The cost of discipleship',dr:dQ1,ht:'<p>Jesus was honest about the cost: (1) <em>"Whoever wants to be my disciple must deny themselves and take up their cross daily and follow me."</em> (Luke 9:23). (2) <em>"Foxes have dens and birds have nests, but the Son of Man has nowhere to lay his head."</em> (Matt.8:20) — Jesus warned a would-be follower of the homeless, uncertain life ahead. (3) <em>"If anyone comes to me and does not hate father and mother... such a person cannot be my disciple."</em> (Luke 14:26) — hyperbolic comparison: love for Jesus must make all other loves look like "hate" by comparison. (4) The parables of the tower builder and king going to war (Luke 14:28-33) — count the cost before committing.</p>'},
{lb:'Servanthood as discipleship',dr:dQ2,ht:'<p>Jesus redefined greatness in discipleship as servanthood: (1) "Whoever wants to become great among you must be your servant, and whoever wants to be first must be slave of all" (Mark 10:43-44). (2) At the Last Supper, Jesus washed the disciples\' feet (John 13:1-17): "I have set you an example that you should do as I have done for you." (3) The dispute about greatness (Luke 22:24-26): Jesus placed a child in their midst — "the one who rules like the one who serves." (4) "The greatest among you will be your servant. For those who exalt themselves will be humbled, and those who humble themselves will be exalted" (Matt.23:11-12). Discipleship inverts worldly hierarchies.</p>'},
{lb:'John 15 — the vine and the branches',dr:dQ2,ht:'<p>John 15:1-17 gives the fullest picture of discipleship: Jesus is the vine; disciples are branches; the Father is the gardener. Key teachings: (1) <b>Abiding</b>: "Remain in me, as I also remain in you. No branch can bear fruit by itself; it must remain in the vine" (15:4). (2) <b>Fruit</b>: "This is to my Father\'s glory, that you bear much fruit, showing yourselves to be my disciples" (15:8). (3) <b>Joy</b>: "I have told you this so that my joy may be in you and that your joy may be complete" (15:11). (4) <b>Love</b>: "My command is this: Love each other as I have loved you" (15:12). (5) <b>Chosen</b>: "You did not choose me, but I chose you and appointed you so that you might go and bear fruit" (15:16).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Jesus said "take up your cross daily and follow me" (Luke 9:23). The cross in this context means:',o:['Carrying a physical wooden cross to the place of execution as Jesus did','A decorative symbol worn as jewellery by all followers of Jesus','Daily self-denial and willingness to suffer for Jesus\' sake — accepting the hardship, rejection and suffering that discipleship brings','The ordinary difficulties of life that everyone faces regardless of faith'],a:3,w:'"Take up your cross" (Luke 9:23) uses the image of a condemned man carrying his execution instrument — a powerful image of accepting social death, rejection and suffering. Daily ("daily" is in Luke) means this is not a one-time decision but a continuous, daily choice to embrace the cost of following Jesus rather than the comfort of self-preservation.'},{q:'In John 15, Jesus said "No branch can bear fruit by itself; it must remain in the vine" (15:4). For disciples this means:',o:['Disciples must stay physically near Jerusalem where Jesus lived','Discipleship requires maintaining the connection with Jesus through prayer, obedience and love — spiritual fruitfulness is impossible apart from this living relationship','The twelve apostles were the branches and only they could bear fruit; later disciples are the gardeners','Christians must join a specific denomination (vine) to be genuine disciples'],a:2,w:'"Remain in me" (abide/meno) is the central command of John 15. Branches disconnected from the vine wither and die — they can produce nothing. Disciples disconnected from Jesus through prayerlessness, disobedience or spiritual neglect produce no fruit. Fruitfulness flows from the living relationship with Jesus, not from human effort or religious activity alone.'},{q:'When Jesus said disciples must "hate" their father and mother compared to their love for him (Luke 14:26), he meant:',o:['Disciples must literally stop loving their families and cut off contact','This was a mistake — Jesus actually said "love your neighbour as yourself" and family are neighbours','Love for Jesus must be so supreme that all other loves — including deep family love — appear as hatred by comparison; this is a Semitic hyperbole for absolute priority','Disciples must refuse to obey their parents in all things once they become Christians'],a:3,w:'Luke 14:26 uses a Semitic hyperbole — a deliberately extreme statement for emphasis. The parallel in Matthew 10:37 softens it: "anyone who loves their father or mother more than me is not worthy of me." The meaning: love for Jesus must be the supreme loyalty that makes all other loyalties — however deep and legitimate — secondary by comparison. Family love is not abolished but subordinated.'},{q:'Jesus washed the disciples\' feet at the Last Supper (John 13:1-17) and said "I have set you an example." This act of discipleship teaches:',o:['Christians must literally wash each other\'s feet as a required church sacrament equivalent to communion','Servanthood is the defining mark of discipleship — the Teacher doing the slave\'s task models what all disciples should be willing to do for one another','Only church leaders should wash feet — the example was addressed specifically to Peter as future leader of the church','This was a practical hygiene practice with no deeper spiritual meaning in the first-century context'],a:2,w:'John 13:15 — "I have set you an example that you should do as I have done for you." Foot-washing was a slave\'s task — deeply humiliating for a respected rabbi to perform. Jesus voluntarily took the lowest social position to serve his disciples. This is the model: greatness in the Kingdom is measured by how far down you are willing to go in service of others.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'The Rewards of Discipleship',su:'Examine what Jesus promised to those who follow him.',steps:[
{lb:'The hundredfold promise (Mark 10:29-30)',dr:dQ2,ht:'<p>Peter reminded Jesus: "We have left everything to follow you!" Jesus replied: "no one who has left home or brothers or sisters or mother or father or children or fields for me and the gospel will fail to receive a hundred times as much in this present age: homes, brothers, sisters, mothers, children and fields — along with persecutions — and in the age to come eternal life." (Mark 10:29-30). The promise: (1) A hundredfold community in this life — the new family of disciples. (2) Persecution alongside blessing — not an escape from suffering. (3) Eternal life in the age to come. Jesus addressed Peter\'s implicit complaint with a comprehensive promise that includes both present community and future hope — though honestly including persecutions as part of the package.</p>'},
{lb:'The Great Commission (Matt 28:18-20)',dr:dQ2,ht:'<p>The risen Jesus gave the Great Commission: "All authority in heaven and on earth has been given to me. Therefore go and make disciples of all nations, baptising them in the name of the Father and of the Son and of the Holy Spirit, and teaching them to obey everything I have commanded you. And surely I am with you always, to the very end of the age." The Commission: (1) Based on Jesus\' authority ("all authority"). (2) Universal scope — "all nations." (3) Method — go, make disciples, baptise, teach to obey. (4) Promise — "I am with you always." Discipleship is not static (receiving) but dynamic (going and making disciples). The disciples become disciple-makers — the community reproduces itself.</p>'},
{lb:'Suffering and joy in discipleship',dr:dQ2,ht:'<p>Jesus was honest that discipleship includes suffering: "They will hand you over to the local councils... you will be hated by all nations because of me" (Matt.10:17,22). Yet suffering is set alongside joy: "Blessed are you when people insult you, persecute you and falsely say all kinds of evil against you because of me. Rejoice and be glad, because great is your reward in heaven" (Matt.5:11-12). In John 15: "I have told you this so that my joy may be in you and that your joy may be complete" (15:11). The Beatitude on persecution (Matt.5:10-12) is the longest Beatitude — persecution is taken seriously as a real prospect and is surrounded with blessing and joy.</p>'},
{lb:'Discipleship and mission',dr:dQ2,ht:'<p>Jesus sent out disciples during his ministry: the twelve (Matt.10:1-15) and the seventy-two (Luke 10:1-20). Instructions: travel light; accept hospitality; heal the sick; proclaim "the Kingdom of God has come near" (Luke 10:9); shake off the dust from your feet if rejected. On return, the seventy-two "returned with joy and said, \'Lord, even the demons submit to us in your name.\'" Jesus replied: "However, do not rejoice that the spirits submit to you, but rejoice that your names are written in heaven" (Luke 10:17-20). Discipleship includes: being sent; proclamation; healing; facing rejection; returning to report. The Great Commission (Matt.28:18-20) extends this mission to all nations and all generations.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'In Mark 10:29-30, Jesus promised the hundredfold reward would include "along with persecutions." This detail is important because:',o:['It shows that persecution is a punishment for leaving family','It demonstrates that Christian discipleship is honest — present blessings come alongside real suffering; the reward is not an escape from persecution but community, blessing and eternal life alongside it','Persecution was only for the first-century disciples and does not apply to modern Christians','The word "persecutions" was added by a later scribe and was not in the original text'],a:2,w:'"Along with persecutions" (Mark 10:30) is deliberately included in the promise. Jesus never promised an easy path — he promised a path of community, blessing and eternal life that passes through suffering. This honesty distinguishes Jesus from prosperity preachers who offer blessing without cost. The hundredfold is real; so is the persecution.'},{q:'The Great Commission (Matt 28:19) commanded the disciples to "make disciples of all nations." This shows discipleship is:',o:['A private, individual experience with no community dimension','Static — receiving teaching for personal benefit only','Dynamic and reproductive — disciples are to make other disciples; the community reproduces itself by going to all nations','Exclusively Jewish — "all nations" referred to the scattered Jewish communities worldwide'],a:3,w:'"Make disciples of all nations" (Matt.28:19) shows discipleship is reproductive: those who have been discipled are commissioned to disciple others. The four actions (go, make disciples, baptise, teach to obey) describe the complete discipleship process. "All nations" (panta ta ethne) means all ethnic groups worldwide — no people group is excluded from the commission.'},{q:'Jesus told the returning seventy-two not to "rejoice that the spirits submit to you, but rejoice that your names are written in heaven" (Luke 10:20) because:',o:['Healing and exorcism were to be kept secret until after the resurrection','Miraculous power is spiritually dangerous and should not be celebrated at all','The ultimate security of the disciple is not spiritual power or ministry success (which can become a source of pride) but the grace of election — that God has included them in his book of life','The seventy-two had used demonic power rather than divine power and were therefore warned'],a:3,w:'Luke 10:20 — Jesus redirected their joy from ministry success (spirits submitting) to grace (names written in heaven). Ministry power and success can become a subtle basis for pride and self-validation. The disciple\'s deepest security is not what they accomplish but who they are in God — chosen, known, included. This protects against both pride in success and despair at failure.'},{q:'John 15:16 — "You did not choose me, but I chose you and appointed you to go and bear fruit" — reveals which aspect of discipleship?',o:['Disciples have no genuine choice in following Jesus — it is entirely determined','Bearing fruit is optional for disciples who are already saved','The initiative in discipleship belongs to Jesus — he chose his disciples before they chose him; discipleship is a response to his call, not an independent human decision; and the purpose of being chosen is to bear fruit','Only the twelve apostles were chosen; all other disciples chose Jesus on their own initiative'],a:3,w:'John 15:16 emphasises the divine initiative: "You did not choose me, but I chose you." This does not eliminate human response (disciples still "follow") but places the initiative with Jesus. Before any disciple responded to Jesus\' call, Jesus had already chosen them. The purpose of being chosen is purposeful: "appointed you to go and bear fruit" — chosen for mission, not just for privilege.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Discipleship',su:'Practise WAEC-style questions on discipleship.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC essays on discipleship: Common questions: "Examine what Jesus taught about the demands of discipleship." "Describe the calling of any TWO disciples and state lessons from each." "What did Jesus teach about servanthood in discipleship?" "Examine the teaching of the vine and branches (John 15:1-17)." For each demand: give the specific teaching, the reference, and one lesson. Key passages: Matt.4:18-22 (call of first disciples); Luke 9:23 (take up cross daily); Mark 10:43-44 (servant of all); Luke 14:26-33 (cost of discipleship); John 15:1-17 (vine and branches); Matt.28:18-20 (Great Commission); Mark 10:29-30 (hundredfold promise).</p>'},
{lb:'Key references',dr:dQ2,ht:'<p>Essential discipleship references: "Follow me and I will make you fishers of people" — Matt.4:19. "Deny themselves and take up their cross daily" — Luke 9:23. "Whoever wants to be great must be your servant" — Mark 10:43. "You are the light of the world" — Matt.5:14 (disciples\' mission). "Remain in me" — John 15:4. "Bear much fruit, showing yourselves to be my disciples" — John 15:8. "Love each other as I have loved you" — John 15:12. "You did not choose me, but I chose you" — John 15:16. "I have set you an example" (feet-washing) — John 13:15. "Hundredfold now... and eternal life" — Mark 10:30. "Make disciples of all nations" — Matt.28:19. "I am with you always" — Matt.28:20. Know these with references.</p>'},
{lb:'Common mistakes and final tips',dr:dQ2,ht:'<p>Avoid: Saying the disciples were professionals who responded slowly (the Gospels say "at once" — Matt.4:20). Forgetting to give references for the calling narratives (Matt.4:18-22 for Peter/Andrew; Matt.4:21-22 for James/John; Matt.9:9 for Matthew). Confusing John 15 (vine and branches — discipleship) with Matthew 13 (sower — Kingdom parables). Saying "take up your cross" means enduring ordinary difficulties (it means willingness to accept rejection and suffering for Jesus\' sake specifically). Missing John 13:1-17 (feet-washing) when discussing servanthood — it is a key text. WAEC final tips: (1) Know the call narrative of at least two disciples with references and specific details. (2) Know Luke 9:23 (deny self, take up cross) and Luke 14:26-33 (cost parables). (3) Know Mark 10:43-44 (servant of all). (4) Know John 15:1-17 — the vine metaphor and the five key teachings.</p>'},
{lb:'Mixed revision — discipleship',dr:dQ10,ht:'<p>Discipleship summary: Call — Matt.4:18-22 (Peter/Andrew; James/John; "follow me; I will make you fishers of people"). Cost — Luke 9:23 (deny self, take up cross daily); Matt.8:20 (nowhere to lay his head); Luke 14:26 (love Jesus supremely); Luke 14:28-33 (count the cost). Servanthood — Mark 10:43-44 (servant of all); John 13:1-17 (feet-washing; "I have set you an example"). John 15 — remain/abide; bear fruit; Father glorified; joy complete; love one another; chosen to bear fruit. Rewards — Mark 10:29-30 (hundredfold + eternal life); John 15:11 (complete joy). Mission — Matt.28:18-20 (Great Commission: go, make disciples, baptise, teach; "I am with you always"). Persecution — Matt.5:10-12 (Beatitude on persecution); John 15:20 (they will persecute you).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Jesus said "whoever wants to be first among you must be slave of all" (Mark 10:44). He demonstrated this by:',o:['Appointing Peter as the leader with authority over the other disciples','Sitting in the most honourable seat at every meal throughout his ministry','Washing the disciples\' feet at the Last Supper — performing the task of a household slave, modelling the servanthood he taught','Refusing to eat at the same table as rulers and wealthy people to identify with the poor'],a:3,w:'Mark 10:44 is modelled in John 13:1-17 — Jesus washed the disciples\' feet, the task of a household slave. A rabbi being served by disciples was normal; a rabbi serving the disciples was shocking and deliberate. "I have set you an example" (John 13:15) — the teaching was embodied in the action. True greatness in the Kingdom is not positional authority but willingness to serve at the lowest level.'},{q:'The Parable of the Tower Builder and King Going to War (Luke 14:28-33) teaches about discipleship by:',o:['Warning that Christians should avoid all ambitious projects because they usually fail','Showing that faith and prayer are sufficient without any prior preparation','Urging people to count the cost of discipleship before beginning — half-committed discipleship is as useless as a half-built tower; full commitment is required from the start','Teaching about the importance of financial stewardship and avoiding debt in the Kingdom'],a:3,w:'Luke 14:28-33 — both parables make the same point: no wise person starts a major project without first calculating whether they can finish it. Applied to discipleship: do not begin following Jesus casually or impulsively; sit down and consider the full cost — "those of you who do not give up everything you have cannot be my disciples" (14:33). This is not a deterrent but a call to genuine, counted, total commitment.'},{q:'John 15:8 — "This is to my Father\'s glory, that you bear much fruit, showing yourselves to be my disciples" — means:',o:['Disciples must grow fruit trees as part of their agricultural responsibility to creation','Bearing fruit means having many children who also become Christians','The fruitfulness of disciples\' lives (in love, obedience, witness and character) is the evidence of genuine discipleship and glorifies God','Only the original twelve apostles could bear fruit since they received the teaching directly from Jesus'],a:3,w:'John 15:8 — fruit-bearing (Greek: karpos) is the evidence of genuine discipleship and the means of God\'s glorification. Fruit includes: love for one another (15:12); joy (15:11); answered prayer (15:7); witness (15:27); and moral character. A fruitless disciple (like a fruitless branch — 15:2) is not abiding in Jesus. The goal of discipleship is not just personal blessing but visible, fruitful, God-glorifying life.'},{q:'After the Great Commission (Matt 28:18-20), Jesus promised:',o:['"You will perform greater miracles than I have done, because I am going to the Father"','"The Father will send you great wealth to fund the mission to all nations"','"I am with you always, to the very end of the age" — a promise of his continual presence with the disciple-making community','"You will not face any opposition or persecution as you go to the nations"'],a:3,w:'"I am with you always, to the very end of the age" (Matt.28:20) — the Commission (go/make disciples/baptise/teach) is grounded in Jesus\' authority (28:18) and sustained by his presence (28:20). The same one who has "all authority in heaven and on earth" accompanies the disciple-making community until the mission is complete. This is the answer to every disciple\'s fear about mission: not sent alone, but sent with the authoritative, ever-present Jesus.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Discipleship',su:'Integrated revision across all discipleship topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Discipleship in the Gospels full summary: The call — "Follow me" (Matt.4:19); immediate (Matt.4:20 — "at once"); purposeful ("I will make you fishers of people"). The cost — deny self (Luke 9:23); take up cross daily; "nowhere to lay his head" (Matt.8:20); hate family by comparison (Luke 14:26); count the cost (Luke 14:28-33). Servanthood — servant of all (Mark 10:43-44); feet-washing (John 13:1-17); "I have set you an example." John 15 — vine/branches; abide in me; bear much fruit (15:8); joy complete (15:11); love one another (15:12); chosen to bear fruit (15:16). Rewards — hundredfold + eternal life (Mark 10:29-30); complete joy (John 15:11); "I am with you always" (Matt.28:20). Mission — Great Commission (Matt.28:18-20). Suffering — persecuted as I was (John 15:20); Beatitude on persecution (Matt.5:10-12).</p>'},
{lb:'Connecting discipleship to other topics',dr:dQ10,ht:'<p>Discipleship connects to all CRS Gospel themes: Faith — leaving nets is an act of faith; "follow me" requires trust without a map. Kingdom — disciples are the community of the Kingdom; they embody its values (servant, child, last-is-first). Forgiveness — Peter denied Jesus (failed discipleship) → restored by Jesus (John 21) — forgiveness enables return. The Passion — disciples fled (Mark 14:50) — discipleship failed at the cross; restored at resurrection. Resurrection — disciples became missionaries (Matt.28:18-20) — the Resurrection transformed them from failures to world-changers. Prayer — "abide in me" (John 15:4) requires prayer; Lord\'s Prayer is a discipleship prayer. Ethics — Sermon on the Mount is the ethics of disciple living. All Gospel topics are discipleship topics — Jesus\' purpose was to make disciples who embodied his teaching.</p>'},
{lb:'WAEC essay practice',dr:dQ1,ht:'<p>Practice essay paragraph: "Jesus taught that discipleship requires servanthood. When James and John asked for the best seats in the Kingdom, Jesus said: \'Whoever wants to become great among you must be your servant, and whoever wants to be first must be slave of all\' (Mark 10:43-44). He then demonstrated this at the Last Supper by washing his disciples\' feet (John 13:1-17), performing the task of a household slave: \'I have set you an example that you should do as I have done for you\' (John 13:15). The lesson for Christians is that greatness in the Kingdom is measured by willingness to serve at the lowest level, not by position, title or authority. Disciples are called to follow their Master\'s example of self-giving service."</p>'},
{lb:'WAEC final tips — discipleship',dr:dQ2,ht:'<p>Final WAEC tips for discipleship: (1) Know the call of at least two disciples with specific references and details. (2) Know the four key cost sayings: deny self (Luke 9:23); cross daily (Luke 9:23); "nowhere to lay his head" (Matt.8:20); count the cost parables (Luke 14:28-33). (3) Know Mark 10:43-44 (servant of all) and John 13:15 (feet-washing example). (4) Know John 15:1-17 — the five key teachings: abide (15:4); bear fruit (15:8); joy (15:11); love one another (15:12); chosen (15:16). (5) Know the hundredfold promise (Mark 10:29-30) and the Great Commission (Matt.28:18-20). (6) Connect discipleship to servanthood, mission and the resurrection. (7) Always give specific references — WAEC rewards chapter and verse throughout.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Jesus said "deny yourselves and take up your cross daily" (Luke 9:23). The word "daily" is unique to Luke\'s version and teaches:',o:['Disciples must physically go to a cross every day as a spiritual exercise','The cross is carried daily until death, after which it is no longer needed','Discipleship is not a one-time decision but a continuous, daily renewed choice to embrace self-denial and the cost of following Jesus','Luke made a copying error — Matthew and Mark do not include "daily" because it was not in the original'],a:3,w:'"Daily" (Luke 9:23 vs Matthew 16:24 and Mark 8:34 which omit it) emphasises the ongoing, habitual nature of self-denial. It is not a once-for-all crisis decision but a lifestyle — each day the disciple renews the choice to put Jesus first and self second, to accept the day\'s particular form of the cross. Discipleship is a daily practice, not just a moment of conversion.'},{q:'The Rich Young Ruler (Matt 19:16-22) who "went away sad" failed at discipleship because:',o:['He had not been properly baptised before approaching Jesus','He asked the wrong question — "what good thing must I do" showed works-based thinking','His possessions had more hold on his heart than Jesus did — when called to sell all and follow, he chose wealth over discipleship','He was too young — Jesus required his followers to be at least 30 years old'],a:3,w:'The Rich Young Ruler kept all the commandments but when Jesus said "sell your possessions and give to the poor, then come, follow me" (19:21), "he went away sad, because he had great wealth" (19:22). His wealth was his real lord — the diagnostic test exposed what truly held his heart. Discipleship requires that Jesus has first place; for the Rich Young Ruler, possessions had first place.'},{q:'In John 15:4, "remain in me as I also remain in you" — "remaining/abiding" (meno) in Jesus means:',o:['Physical proximity — staying in the same geographical region as Jesus lived','A passive, contemplative spirituality that avoids all activity and worldly engagement','A continuous, vital connection with Jesus maintained through prayer, obedience and love — the source from which all fruitfulness flows','A one-time act of baptism that permanently establishes the connection regardless of subsequent choices'],a:3,w:'Meno (remain/abide) in John 15 describes a continuous, vital, living relationship — like the branch connected to the vine. It is maintained through: prayer (15:7 — "if you remain in me and my words remain in you, ask whatever you wish"); obedience (15:10 — "if you keep my commands, you will remain in my love"); love (15:12 — love one another). This ongoing connection is the source of all discipleship fruitfulness.'},{q:'Jesus gave the Great Commission (Matt 28:18-20) based on the statement that "all authority in heaven and on earth has been given to me." This is significant because:',o:['It showed that Jesus had recovered his divine powers after the humiliation of the cross','The authority of the disciples would be equal to that of Jesus — they could also claim all authority','The Commission is grounded in Jesus\' universal authority — disciples go in the name and authority of the risen, all-authoritative Christ, not in their own strength or wisdom','This authority would expire at the end of the apostolic age when the last apostle died'],a:3,w:'Matt.28:18 — "all authority... has been given to me" is the foundation for the Commission. Disciples are not sent on their own initiative with their own authority — they go in the authority of the risen Christ who has conquered death and received universal sovereignty. This authority grounds their confidence: they are not ambassadors of a small movement but of the one who has "all authority in heaven and on earth."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Gospels',ti:'Extended Revision — Discipleship',su:'Further revision on discipleship.',steps:[
{lb:'Discipleship failures and restoration',dr:dQ2,ht:'<p>The disciples failed repeatedly: (1) <b>At the storm</b> — "Where is your faith?" (Luke 8:25). (2) <b>Unable to cast out a demon</b> — "O you of little faith" (Matt.17:17). (3) <b>Arguing about greatness</b> — repeatedly (Mark 9:33-34; Luke 22:24). (4) <b>Gethsemane</b> — fell asleep three times (Mark 14:37-41). (5) <b>At the arrest</b> — all fled (Mark 14:50). (6) <b>Peter denied Jesus</b> — three times (Luke 22:54-62). Yet Jesus restored them: "Do you love me?... Feed my sheep" (John 21:15-17). The disciples\' failures are not edited out of the Gospels — they are part of the honest portrait of what following Jesus looks like. Failure does not disqualify the disciple if they return to Jesus.</p>'},
{lb:'Characteristics of a disciple in the Gospels',dr:dQ1,ht:'<p>From the Gospel accounts, a disciple of Jesus: (1) <b>Answers the call</b> — leaves behind old life to follow. (2) <b>Learns from Jesus</b> — sits at his feet, listens, asks questions. (3) <b>Is sent on mission</b> — the twelve and the seventy-two were sent out. (4) <b>Imitates Jesus</b> — "I have set you an example" (John 13:15); "Love as I have loved" (John 15:12). (5) <b>Bears fruit</b> — visible transformation in character and service. (6) <b>Abides in Jesus</b> — maintained relationship through prayer and obedience. (7) <b>Suffers for Jesus</b> — accepts rejection and persecution. (8) <b>Makes disciples</b> — reproduces the discipleship process (Matt.28:19). Discipleship is comprehensive — it shapes the whole person and all of life.</p>'},
{lb:'Discipleship and community',dr:dQ2,ht:'<p>Discipleship in the Gospels is not individual but communal: (1) Jesus called a group — the twelve — to be with him. (2) He sent them two by two (Mark 6:7; Luke 10:1) — not alone. (3) John 15:12 — "love one another as I have loved you" — the community of disciples is bound by mutual love. (4) "By this everyone will know that you are my disciples, if you love one another" (John 13:35) — love for each other is the distinguishing mark of the community. (5) The Great Commission (Matt.28:18-20) is given to a community — "go and make disciples" — a corporate mission. Discipleship is a shared journey, not a private spiritual path. The visible love of the community is itself a witness to the world.</p>'},
{lb:'Final revision and WAEC tips',dr:dQ2,ht:'<p>Complete discipleship revision: The call (Matt.4:18-22; Matt.9:9). The cost (Luke 9:23; Matt.8:20; Luke 14:26-33). Servanthood (Mark 10:43-44; John 13:1-17). John 15 — abide, fruit, joy, love, chosen. Rewards (Mark 10:29-30; John 15:11; Matt.28:20). Mission (Matt.28:18-20; Luke 10:1-20). Failures and restoration (all four Gospels; John 21:15-17). WAEC final tips: Know the specific calling narratives with details (not vague references to "the disciples"). Know the cost sayings with their specific references. Know John 15:1-17 — the vine and branches is one of the most frequently examined discipleship passages. Know the Great Commission with its four actions and the promise. Always give chapter and verse.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'John 13:35 — "By this everyone will know that you are my disciples, if you love one another" — teaches that the primary evidence of genuine discipleship is:',o:['Speaking in tongues and performing miracles — spiritual gifts identify disciples','Keeping all the Mosaic Law more perfectly than the Pharisees','The visible, mutual love of the disciple community for one another — this is the identifying mark that distinguishes disciples from the world','Wearing distinctive clothing or adopting religious titles that announce Christian identity'],a:3,w:'John 13:35 — the distinguishing mark of disciples is not miracles, doctrine or religious observance but the quality of mutual love within the community. "Everyone will know" — this is a public, visible sign. The disciple community\'s love for each other is itself a testimony to the world of Jesus\' transforming power. This is why John 15:12 ("love one another as I have loved you") is the new commandment, not a new rule.'},{q:'When Jesus said he would make the disciples "fishers of people" (Matt 4:19), he was indicating:',o:['They would become wealthy businessmen in the fish trade','Their mission would be to catch people and imprison them in the Kingdom','Their existing skill (fishing) would be redirected toward a greater purpose — gathering people into the Kingdom; their vocation was fulfilled and transformed, not discarded','Only those who had previously been fishermen were suitable to be disciples'],a:3,w:'"Fishers of people" (Matt.4:19) is a purposeful metaphor: just as they had used their skills to gather fish, they would now use their lives to gather people. Jesus did not dismiss their previous experience but redirected it. This is how calling works in the Gospels: Jesus meets people in their existing context and redirects their capacities toward the Kingdom. Their vocation was transformed, not abolished.'},{q:'The sending of the seventy-two (Luke 10:1-20) demonstrates what aspect of discipleship?',o:['Only specially gifted disciples were sent — the seventy-two were an elite group selected for their spiritual maturity','Discipleship is purely internal — the mission is spiritual transformation, not active going','Discipleship includes active mission — being sent out two by two with specific instructions to proclaim the Kingdom, heal, and accept hospitality; disciples extend Jesus\' own ministry','The seventy-two were sent only to Jewish communities and the mission to Gentiles came only after Pentecost'],a:3,w:'Luke 10:1-20 — Jesus sent seventy-two disciples (not just the twelve) ahead of him to every town. They went two by two; carried no purse, bag or sandals; proclaimed "the Kingdom of God has come near"; healed the sick; and returned with joy reporting that "even the demons submit to us." This shows discipleship is active, participatory mission — disciples are not passive recipients of teaching but active participants in extending the Kingdom.'},{q:'Which of the following is the BEST summary of discipleship in the Gospels?',o:['Discipleship is intellectual agreement with Jesus\' teachings combined with regular attendance at religious gatherings','Discipleship is a private spiritual relationship with Jesus that does not involve community or mission','Discipleship is a total response to Jesus\' personal call — involving leaving the old life, learning from Jesus, serving others, bearing fruit, enduring suffering, making other disciples, and maintaining the vine-branch relationship; it encompasses the whole of life in community and mission','Discipleship is a one-time commitment at baptism after which the disciple is free to live as they choose'],a:3,w:'The Gospels present discipleship as comprehensive: it begins with a call and response (Matt.4:18-22); involves ongoing learning (sitting with Jesus); requires self-denial and cross-bearing (Luke 9:23); expresses itself in service (John 13:15); abides in Jesus (John 15:4); bears fruit (15:8); loves the community (15:12); accepts suffering (15:20); and goes on mission (Matt.28:19). No dimension of life or community is excluded from discipleship\'s reach.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];

window.markComplete=async function(){
  const{data:{session}}=await _sb.auth.getSession();if(!session)return;
  const{data:topic}=await _sb.from('topics').select('id').eq('topic_code','CRS-GO-07').maybeSingle();if(!topic)return;
  window._abcTopicId=topic.id;
  await _sb.from('walkthrough_progress').upsert({student_id:session.user.id,topic_id:topic.id,status:'completed',completed_at:new Date().toISOString(),last_visited_at:new Date().toISOString()},{onConflict:'student_id,topic_id'});
};
</script>
<script src="../abc_feedback_widget.js"></script>
