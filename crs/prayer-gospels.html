<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Prayer in the Gospels — Key Texts',ACC,12,'middle',true));
[['Text','Teaching','Reference'],['Lord\'s Prayer','Model for prayer — six petitions','Matt 6:9-13'],['Persistent Widow','Always pray; do not give up','Luke 18:1-8'],['Friend at Midnight','Bold persistence in prayer','Luke 11:5-8'],['Gethsemane','Surrendered prayer — not as I will','Matt 26:36-46'],['Mountain-moving faith','If you believe, ask in prayer','Matt 21:21-22'],['Ask/seek/knock','Escalating persistent prayer','Matt 7:7-11'],['High Priestly Prayer','Jesus intercedes for all believers','John 17']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(130,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(255,34+i*28,r[1],'#444',7,'middle',false));o.push(T(405,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Lord\'s Prayer — Six Petitions',ACC,12,'middle',true));
[['Petition','Meaning'],['Our Father in heaven','God is personal, communal, transcendent'],['Hallowed be your name','God\'s name/reputation be treated as holy'],['Your Kingdom come','Pray for full establishment of God\'s reign'],['Your will be done','Earth aligned with heaven\'s purposes'],['Give us daily bread','Physical needs; daily dependence on God'],['Forgive us as we forgive','Forgiveness received must be given'],['Lead us not into temptation','Protection from trial and from evil one']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*32,460,28,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(170,38+i*32,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(360,38+i*32,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Prayer in the Gospels — Summary',ACC,13,'middle',true));
[['Lord\'s Prayer','Six petitions; model not formula; Matt 6:9-13'],['Persistence','Persistent widow (Luke 18); Friend at midnight (Luke 11)'],['Gethsemane','Not as I will but as you will — surrender (Matt 26:39)'],['Ask/seek/knock','Escalating persistence; God as good Father (Matt 7:7-11)'],['Jesus\' prayer life','Withdrew to pray alone; prayed before key decisions'],['WAEC tip','Know the six petitions; know Gethsemane; know persistence parables']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(130,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'The Lord\'s Prayer',su:'Examine the Lord\'s Prayer and what it teaches about prayer.',steps:[
{lb:'The context — how NOT to pray',dr:dQ2,ht:'<p>Jesus gave the Lord\'s Prayer after criticising two wrong prayer approaches (Matt.6:5-8): (1) <b>Hypocrites</b> — praying publicly to be seen: "they have received their reward in full." Instead: pray in your room, in secret. (2) <b>Babbling pagans</b> — thinking many words will be heard. Instead: God already knows your needs. Jesus said: "This is how you should pray" — giving the Lord\'s Prayer as a model (not a formula to be mindlessly repeated). It is a pattern for prayer, not a magical incantation.</p>'},
{lb:'The six petitions — God-focused',dr:dQ2,ht:'<p>The Lord\'s Prayer (Matt.6:9-13) has six petitions, the first three entirely God-centred: (1) <em>"Our Father in heaven"</em> — God is personal (Father), communal (our), transcendent (in heaven). (2) <em>"Hallowed be your name"</em> — may God\'s character and reputation be treated as holy by all. (3) <em>"Your Kingdom come"</em> — the central petition: full establishment of God\'s reign. (4) <em>"Your will be done on earth as in heaven"</em> — earth perfectly aligned with heaven\'s purposes. These four statements are God-focused: his Fatherhood, his holiness, his Kingdom, his will — before any human need is mentioned.</p>'},
{lb:'The six petitions — human needs',dr:dQ2,ht:'<p>The human petitions: (5) <em>"Give us today our daily bread"</em> — physical needs; daily dependence (echoing manna — Ex.16 — daily reliance on God, not hoarding). (6) <em>"Forgive us our debts, as we also have forgiven our debtors"</em> — the only petition with a human condition: receiving and giving forgiveness are linked (Matt.6:14-15). (7) <em>"Lead us not into temptation, but deliver us from the evil one"</em> — protection from trial and from Satan. The doxology ("for yours is the Kingdom...") is not in earliest manuscripts but reflects early church liturgy. The prayer covers adoration, submission, provision, forgiveness, and protection.</p>'},
{lb:'Principles of prayer from the Lord\'s Prayer',dr:dQ2,ht:'<p>Principles: (1) <b>God-centredness</b> — start with God (his name, Kingdom, will) before asking for anything. (2) <b>Community</b> — "our" not "my"; prayer is corporate, not individualistic. (3) <b>Daily dependence</b> — "daily bread" challenges self-sufficiency; each day we ask. (4) <b>Conditioned forgiveness</b> — receiving God\'s forgiveness requires extending forgiveness to others. (5) <b>Protection</b> — we are not self-sufficient against temptation and evil; we need divine protection. (6) <b>Simplicity</b> — not babbling; God knows our needs; prayer aligns us with God, not informs him. WAEC: know all six petitions in order, with the meaning of each.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'The Lord\'s Prayer is described by Jesus as a model (not a formula) because:',o:['Jesus said "Pray these exact words and nothing else will be accepted by God"','Matthew and Luke give slightly different versions — indicating it was intended as a pattern for prayer, not a verbatim formula to be repeated mechanically','The prayer is too long to memorise so it must be kept as a general guide only','It was only for the twelve apostles and not for all Christians'],a:2,w:'Matthew 6:9 says "this is how you should pray" — giving a model/pattern. Luke\'s version (11:2-4) differs slightly from Matthew\'s, confirming it was not meant as a verbatim formula. The prayer gives the structure, themes and priorities of prayer — God-centred, communal, dependent, forgiving, protected — to be expressed in the disciple\'s own words as well as these.'},{q:'The first three petitions of the Lord\'s Prayer (hallowed be your name; your Kingdom come; your will be done) are significant because:',o:['They are the least important petitions — the human needs petitions are more practically urgent','They establish that prayer must begin God-centred — God\'s honour, God\'s reign and God\'s will come before any human petition','They were added by the early church and were not in the original prayer Jesus taught','They show that God has three names corresponding to the three petitions'],a:2,w:'The God-centred structure of the Lord\'s Prayer is intentional: before asking for anything (bread, forgiveness, protection), the pray-er focuses entirely on God — his holy name, his coming Kingdom, his perfect will. This God-first orientation prevents prayer from becoming a wish list and establishes the proper posture of dependence on and submission to God.'},{q:'The petition "forgive us our debts as we also have forgiven our debtors" is unique among the petitions because:',o:['It is the longest petition and therefore the most important','It is the only petition with a human condition attached — receiving and giving forgiveness are inseparably linked','It was removed by the early church from Luke\'s version because it was seen as too demanding','It is about financial debts only, not relational offences'],a:2,w:'Matt.6:12 is the only petition with a human condition: "as we also have forgiven." This is reinforced by Jesus immediately after the prayer (Matt.6:14-15): "if you do not forgive others, your Father will not forgive your sins." Forgiveness is not a one-direction transaction — it flows both ways. Receiving God\'s forgiveness produces and requires extending forgiveness to others.'},{q:'Jesus contrasted prayer with "babbling like pagans" (Matt 6:7) because:',o:['Only Hebrew prayer is acceptable to God; other languages are babbling','Long prayers are always spiritually inferior to short prayers','God already knows our needs before we ask — prayer is not to inform God but to align the pray-er with God; babbling treats prayer as a mechanical technique to get results rather than genuine communication with a Father','Pagans were racially inferior and their prayers were automatically rejected'],a:3,w:'Matt.6:7-8 — "your Father knows what you need before you ask him." Prayer does not inform an ignorant God or persuade a reluctant one. Its purpose is relational alignment — bringing the pray-er into God\'s presence, expressing dependence, surrendering to God\'s will. Babbling treats prayer as a magic technique. Jesus called for sincere, God-directed communication with a Father who already knows and loves.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'Persistence in Prayer',su:'Examine what the Gospels teach about persistent prayer.',steps:[
{lb:'The Persistent Widow (Luke 18:1-8)',dr:dQ1,ht:'<p>Jesus told this parable to teach disciples they "should always pray and not give up" (Luke 18:1). A widow kept coming to an unjust judge demanding justice. The judge eventually granted her request — not out of justice but to stop her pestering him. Jesus applied the argument: if even an unjust judge eventually responds, "will not God bring about justice for his chosen ones, who cry out to him day and night?" (18:7). Conclusion: God will respond, and quickly. The parable commends <b>persistent, expectant prayer</b> — not as a technique to wear God down, but as the appropriate expression of faith in a God who is perfectly just and loving.</p>'},
{lb:'The Friend at Midnight (Luke 11:5-8)',dr:dQ1,ht:'<p>A man went to his friend at midnight to ask for bread because a visitor had arrived. The friend refused — "the door is already locked and my children are in bed." Yet because of the man\'s "shameless audacity" (or "bold persistence"), he got up and gave him as much as he needed. Jesus applied the lesson: "Ask and it will be given to you; seek and you will find; knock and the door will be opened to you" (11:9). If a human friend responds to persistence despite inconvenience, how much more will God — who is never inconvenienced, who loves his children — respond. The commended quality: <b>shameless boldness</b> before God, not polite hesitation.</p>'},
{lb:'Ask, Seek, Knock (Matt 7:7-11)',dr:dQ2,ht:'<p>Jesus commanded three escalating actions: "Ask and it will be given to you; seek and you will find; knock and the door will be opened to you. For everyone who asks receives; the one who seeks finds; and to the one who knocks, the door will be opened." (Matt.7:7-8). The Greek verbs are present imperatives — "keep on asking, keep on seeking, keep on knocking." Jesus grounded the promise in God\'s character as a Father: "Which of you, if your son asks for bread, will give him a stone?" (7:9). "How much more will your Father in heaven give good gifts to those who ask him!" (7:11). Prayer is bold, persistent asking to a good Father who gives good gifts.</p>'},
{lb:'Gethsemane — the prayer of surrender',dr:dQ2,ht:'<p>In Gethsemane, Jesus prayed: <em>"My Father, if it is possible, may this cup be taken from me. Yet not as I will, but as you will."</em> (Matt.26:39). He prayed this three times. The disciples fell asleep three times. Gethsemane models: (1) <b>Honest prayer</b> — Jesus expressed his genuine human desire (take this cup). (2) <b>Surrendered prayer</b> — "not as I will, but as you will." (3) <b>Persistent prayer</b> — three times. (4) <b>The limits of prayer</b> — prayer does not always change circumstances; sometimes it changes the pray-er. (5) <b>The disciples\' failure</b> — "could you not watch for one hour?" — they could not support Jesus in prayer at his most critical moment.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'The Parable of the Persistent Widow (Luke 18:1-8) was told to teach disciples:',o:['That God is like an unjust judge who must be pestered into helping','To pray privately and never ask for the same thing twice','To always pray and not give up — if even an unjust human judge responds to persistence, God who is perfectly just and loving will certainly respond to those who cry out to him day and night','That only widows and the poor have prayers answered by God'],a:3,w:'Luke 18:1 states the purpose directly: "to show them that they should always pray and not give up." The argument is from lesser to greater: the unjust judge responds eventually despite having no love for the widow or fear of God. God — who perfectly loves his people and is perfectly just — will certainly respond to persistent prayer. The parable commends expectant, persistent faith, not passive waiting.'},{q:'Jesus praised "shameless audacity" (or bold persistence) in the Friend at Midnight parable (Luke 11:5-8) because:',o:['Being shameless is always a virtue in the Gospels','Politeness and restraint in prayer are signs of unbelief','Approaching God with bold, persistent requests — not timid, halfhearted asking — is the appropriate response to knowing God as a generous, loving Father','The man at midnight was actually in the right and had a legal claim on his friend\'s hospitality'],a:3,w:'The commended quality in Luke 11:8 is "shameless audacity" (Greek: anaideia) — knocking at midnight, refusing to be put off by inconvenience. Jesus urged disciples to bring this same bold persistence to prayer: not because God is reluctant (he is not) but because bold, persistent prayer is the appropriate expression of genuine trust in a good Father who gives good gifts. Timid prayer reflects timid faith.'},{q:'In Gethsemane, Jesus prayed "yet not as I will, but as you will" (Matt 26:39). This is the supreme model of:',o:['Faith that always receives exactly what is asked for in prayer','Prayer that avoids expressing personal desires and only seeks God\'s will','Surrendered prayer that honestly expresses human desire but ultimately submits to God\'s purpose — the highest form of prayer modelled by Jesus himself at his moment of greatest trial','Prayer that should only be prayed in private, never in a group setting'],a:3,w:'Gethsemane combines two elements: honest human petition ("if it is possible, may this cup be taken from me" — expressing genuine desire) and surrendered submission ("yet not as I will, but as you will"). This two-part structure is the model: bring your real desires honestly to God, then submit to his greater wisdom and purpose. The cup was not taken away — but Jesus was strengthened to drink it.'},{q:'The three verbs in Matthew 7:7 — "Ask, seek, knock" — are Greek present imperatives meaning:',o:['Ask once, seek briefly, knock quietly — restrained prayer is most effective','These are three separate types of prayer for three different situations','Keep on asking, keep on seeking, keep on knocking — the persistence implied by the present tense is the key point; prayer is a sustained, ongoing activity, not a one-time event','These apply only to material needs — spiritual requests require only a single prayer'],a:3,w:'The Greek present imperative (aiteo, zeteo, krouo — all present tense) means continuous action: "keep on asking, keep on seeking, keep on knocking." This is why the Friend at Midnight and the Persistent Widow immediately surround this teaching in Luke\'s parallel account (Luke 11:5-10) — both are parables about the persistence that the present-tense imperatives commend.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'Jesus\' Prayer Life and WAEC Prep',su:'Examine Jesus\' own prayer life and practise WAEC questions on prayer.',steps:[
{lb:'Jesus\' prayer habits',dr:dQ1,ht:'<p>Jesus modelled a consistent prayer life: (1) He withdrew regularly to pray alone: "Jesus often withdrew to lonely places and prayed" (Luke 5:16). (2) He prayed before key decisions: before choosing the twelve, "he went out to a mountainside to pray, and spent the night praying to God" (Luke 6:12). (3) He prayed at his baptism (Luke 3:21). (4) He prayed at the Transfiguration (Luke 9:28-29). (5) He prayed at the tomb of Lazarus (John 11:41-42). (6) He prayed the High Priestly Prayer (John 17) before the Passion — interceding for his disciples and all future believers. Jesus\' prayer life shows that prayer is not a religious duty but a vital necessity — even the Son of God needed regular communion with the Father.</p>'},
{lb:'The High Priestly Prayer (John 17)',dr:dQ2,ht:'<p>John 17 records Jesus\' prayer before his arrest — the longest recorded prayer of Jesus. He prayed for: (1) <b>Himself</b> (17:1-5): "Father, the hour has come. Glorify your Son." (2) <b>His disciples</b> (17:6-19): protection ("keep them safe by the power of your name"), sanctification ("sanctify them by the truth; your word is truth"), and mission ("I sent them into the world"). (3) <b>All future believers</b> (17:20-26): unity ("that they may be one, Father, just as you are in me and I am in you") and love. The high priestly prayer reveals Jesus as <b>intercessor</b> — he prays for his people with the same intimacy with the Father he always enjoyed. This prayer is still relevant: Hebrews 7:25 says Jesus "always lives to intercede" for believers.</p>'},
{lb:'WAEC preparation — prayer',dr:dQ2,ht:'<p>For WAEC essays on prayer: Common questions: "Describe the Lord\'s Prayer and what it teaches about prayer." "What did Jesus teach about persistence in prayer?" "How did Jesus demonstrate the importance of prayer in his own life?" "Describe the Parable of the Persistent Widow and state its lessons." Key references: Matt.6:5-15 (teaching context + Lord\'s Prayer + condition on forgiveness); Luke 18:1-8 (Persistent Widow); Luke 11:5-8 (Friend at Midnight); Matt.7:7-11 (Ask/Seek/Knock); Matt.26:36-46 (Gethsemane — "not as I will"); Luke 6:12 (Jesus prayed all night before choosing the twelve); John 17 (High Priestly Prayer). Essential quotes: "This is how you should pray" (Matt.6:9); "not as I will, but as you will" (Matt.26:39); "always pray and not give up" (Luke 18:1).</p>'},
{lb:'Mixed revision — prayer',dr:dQ10,ht:'<p>Prayer in the Gospels summary: Lord\'s Prayer — Matt.6:9-13; six petitions; God-centred first; "how you should pray" (model, not formula); uniquely conditioned petition (forgiveness). Persistence — Persistent Widow (Luke 18:1-8 — always pray, do not give up); Friend at Midnight (Luke 11:5-8 — shameless boldness); Ask/Seek/Knock (Matt.7:7-11 — keep asking; God as good Father). Gethsemane — Matt.26:36-46 — honest desire + surrender; three times; disciples slept. Jesus\' prayer life — withdrew regularly (Luke 5:16); prayed all night before choosing twelve (Luke 6:12); High Priestly Prayer (John 17 — prayed for self, disciples, all future believers). Principles — God-centred; communal (our); daily dependence; linked to forgiveness; persistent; honest; surrendered.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Luke 6:12 records that before choosing the twelve apostles, Jesus:',o:['Consulted the Sanhedrin to ensure the disciples were religiously qualified','Fasted for forty days as he had done before his public ministry began','Spent the entire night in prayer to God on a mountainside — demonstrating that major decisions should be preceded by sustained prayer','Asked John the Baptist to identify which twelve men God had chosen'],a:3,w:'Luke 6:12 — "Jesus went out to a mountainside to pray, and spent the night praying to God. When morning came, he called his disciples to him and chose twelve of them." This shows Jesus did not choose the twelve casually or on human criteria alone — he spent an entire night in prayer first. The pattern: major decisions require sustained prayer. If the sinless Son of God prayed all night before this choice, how much more should human leaders pray before significant decisions.'},{q:'The High Priestly Prayer (John 17) is significant because Jesus prayed specifically for:',o:['The conversion of the Roman Empire and the defeat of all pagan religion','Only the twelve apostles — those who had followed him during his earthly ministry','Himself (glorification), his disciples (protection, sanctification, mission), and all future believers (unity and love) — the prayer includes everyone who will believe through the disciples\' message','The healing of all sick people in Jerusalem before the crucifixion'],a:3,w:'John 17 — Jesus prayed in three stages: for himself (17:1-5 — glorification); for his eleven disciples (17:6-19 — protection, sanctification, mission); and for "all those who will believe in me through their message" (17:20-26 — unity and love). The third section specifically includes all subsequent believers, making John 17 directly relevant to every Christian throughout history. Jesus\' intercession for future believers continues (Heb.7:25).'},{q:'The Lord\'s Prayer begins with "Our Father" rather than "My Father" because:',o:['Jesus was addressing only the male disciples — women were excluded from calling God Father','Using "Our" was a grammatical convention in Aramaic with no theological significance','Prayer is communal — disciples pray as members of the Kingdom community, not isolated individuals; the "our" indicates solidarity with other believers','Jesus himself could not call God "My Father" since he was also fully human'],a:3,w:'"Our Father" establishes the communal nature of prayer in the Gospels. Even private prayer (in "your room" — Matt.6:6) is prayed as a member of the Kingdom community — "our" Father, "our" daily bread, "our" debts, "deliver us." Prayer is not merely a private spiritual practice but the expression of solidarity with the whole people of God who together address the one Father.'},{q:'Gethsemane (Matt 26:36-46) demonstrates that prayer does not always:',o:['Require the presence of other disciples as witnesses','Contain specific petitions — only general submission to God\'s will is appropriate','Change the circumstances prayed about — sometimes prayer changes the pray-er rather than the situation; Jesus was not delivered from the cross but was strengthened to face it through prayer','Need to be repeated — Jesus prayed only once and immediately submitted'],a:3,w:'Jesus prayed three times "may this cup be taken from me" — the cup was not taken away. Yet he rose from Gethsemane with resolve: "Rise! Let us go!" (Matt.26:46). Gethsemane shows that prayer\'s primary function is not always to change external circumstances but to align the pray-er with God\'s will. Sometimes the answer to "take this cup" is not removal but the strength to drink it — which is what Jesus received in Gethsemane.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
