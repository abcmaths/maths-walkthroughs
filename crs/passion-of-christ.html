<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Events of the Passion — Timeline',ACC,12,'middle',true));
[['Event','Key detail','Reference'],['Triumphal Entry','Crowds; palm branches; colt; Hosanna','Matt 21:1-11'],['Temple Cleansing','Tables overturned; den of robbers','Matt 21:12-13'],['Last Supper','New covenant; body/blood; Judas identified','Matt 26:17-30'],['Gethsemane','Not as I will; disciples slept','Matt 26:36-46'],['Arrest','Judas kiss; ear cut/healed; disciples fled','Matt 26:47-56'],['Trial','Sanhedrin; Pilate; Herod; Barabbas','Matt 26-27'],['Crucifixion','Golgotha; 3 hours darkness; cry of desolation','Matt 27:32-56'],['Resurrection','Empty tomb; risen appearances','Matt 28']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(100,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(240,34+i*28,r[1],'#444',7,'middle',false));o.push(T(395,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Seven Last Words from the Cross',ACC,12,'middle',true));
[['Word','Text','Reference'],['1. Forgiveness','Father, forgive them — they know not what they do','Luke 23:34'],['2. Paradise','Today you will be with me in paradise (thief)','Luke 23:43'],['3. Mary and John','Woman, here is your son / Here is your mother','John 19:26-27'],['4. Desolation','My God, my God, why have you forsaken me?','Matt 27:46'],['5. Thirst','I am thirsty','John 19:28'],['6. Finished','It is finished (tetelestai)','John 19:30'],['7. Commendation','Father, into your hands I commit my spirit','Luke 23:46']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(250,34+i*28,r[1],'#444',7,'middle',false));o.push(T(410,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Passion of Christ — Summary',ACC,13,'middle',true));
[['Entry','Triumphal Entry — Messiah comes as servant-king on colt (Zech 9:9)'],['Last Supper','New covenant in my blood; body broken; do this in remembrance'],['Trials','Sanhedrin (blasphemy); Pilate (no guilt found 3x); Barabbas released'],['Cross','Golgotha; darkness; curtain torn; centurion\'s confession; women faithful'],['Resurrection','Empty tomb; risen appearances; Great Commission'],['WAEC tip','Know the events in order; seven last words; OT fulfilments; significance']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(300,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'Holy Week — Entry to Last Supper',su:'Examine the events of Holy Week from the Triumphal Entry to the Last Supper.',steps:[
{lb:'The Triumphal Entry (Matt 21:1-11)',dr:dQ1,ht:'<p>Jesus entered Jerusalem on a colt (a young donkey), fulfilling Zechariah 9:9: "See, your king comes to you, gentle and riding on a donkey." The crowds spread cloaks and palm branches, shouting "Hosanna to the Son of David! Blessed is he who comes in the name of the Lord! Hosanna in the highest!" (Matt.21:9). The entry was deliberately staged by Jesus to make a messianic claim — but on a humble donkey (not a war horse), signalling the kind of Messiah he was: a servant-king, not a military conqueror. This combined royal claim with humble means and was the catalyst for the authorities\' final decision to arrest him.</p>'},
{lb:'Cleansing the Temple (Matt 21:12-13)',dr:dQ1,ht:'<p>Jesus entered the temple courts and drove out all who were buying and selling. He overturned the tables of the money-changers and the seats of those selling doves. He quoted Isaiah 56:7: "My house will be called a house of prayer" and Jeremiah 7:11: "but you are making it a den of robbers." Significance: (1) A prophetic act claiming authority over the Temple — as Son of God, it was "his Father\'s house." (2) A challenge to the religious establishment\'s financial corruption. (3) Fulfilled Malachi 3:1 — "the Lord you are seeking will come to his temple." (4) The chief priests\' indignant reaction (21:15) intensified their plot to kill him.</p>'},
{lb:'The Last Supper (Matt 26:17-30)',dr:dQ1,ht:'<p>On the first day of the Feast of Unleavened Bread, Jesus celebrated the Passover with his twelve disciples. He identified his betrayer (Judas). Then he took bread, broke it and gave it to them: "Take and eat; this is my body." He took the cup: "Drink from it, all of you. This is my blood of the covenant, which is poured out for many for the forgiveness of sins." (Matt.26:26-28). He declared he would not drink from the fruit of the vine again until the Kingdom of God came. They sang a hymn and went to the Mount of Olives. The Passover context is crucial: Jesus was replacing the old Passover (deliverance from Egypt) with the new Passover (deliverance from sin through his blood).</p>'},
{lb:'Gethsemane (Matt 26:36-46)',dr:dQ1,ht:'<p>Jesus took Peter, James and John to Gethsemane and began to be "sorrowful and troubled" — "overwhelmed with sorrow to the point of death." He prayed three times: "My Father, if it is possible, may this cup be taken from me. Yet not as I will, but as you will." Each time he returned to find the three disciples asleep. After the third prayer, he returned: "Rise! Let us go! Here comes my betrayer!" Gethsemane shows: (1) Jesus\' genuine human struggle — the cross was real anguish, not theatrical suffering. (2) The disciples\' failure at prayer. (3) The model of surrendered prayer. (4) Jesus\' resolve after prayer — he moved from struggle to determination.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Jesus entered Jerusalem on a colt (young donkey) to fulfil:',o:['Isaiah 53:3 — "he was despised and rejected by mankind"','Psalm 22:1 — "My God, my God, why have you forsaken me?"','Zechariah 9:9 — "your king comes to you, gentle and riding on a donkey" — a Messiah who is a servant-king, not a military conqueror','Malachi 4:5 — "I will send you the prophet Elijah before the great and dreadful day"'],a:3,w:'Zechariah 9:9 — "Rejoice greatly, Daughter Zion! Shout, Daughter Jerusalem! See, your king comes to you, righteous and victorious, lowly and riding on a donkey, on a colt, the foal of a donkey." Jesus deliberately fulfilled this prophecy: (1) a messianic claim (King of Zion); (2) on a donkey (not a war horse) — peaceful, humble servanthood; (3) crowds\' response with Hosanna confirmed their messianic expectations.'},{q:'At the Last Supper, Jesus said his blood was "poured out for many for the forgiveness of sins" (Matt 26:28). The Passover context is significant because:',o:['The Last Supper replaced the Passover as an annual Jewish festival','Jesus was explaining that the Old Testament was now completely abolished','Just as the Passover lamb\'s blood delivered Israel from Egypt, Jesus\' blood delivers humanity from sin — he is the new Passover Lamb; old deliverance is replaced by new, greater deliverance','The Passover meal had to be completed before any new teaching could be given'],a:3,w:'The Last Supper was the Passover meal (Matt.26:17). Jesus used this context deliberately: the Passover remembered God\'s deliverance through the lamb\'s blood (Ex.12). Jesus announced a greater deliverance — through his own blood. He is the ultimate Passover Lamb (cf. 1 Cor.5:7 — "Christ, our Passover lamb, has been sacrificed"). The old covenant meal (Passover) is replaced by the new covenant meal (Eucharist/Communion).'},{q:'In Gethsemane, Jesus found the disciples sleeping and asked: "Couldn\'t you men keep watch with me for one hour?" (Matt 26:40). This showed:',o:['That prayer is physically exhausting and the disciples needed rest before the arrest','That the disciples were spiritually underprepared for the trial ahead — they could not even sustain one hour of prayer with Jesus at his most vulnerable moment','That Jesus was disappointed they had not memorised the Lord\'s Prayer','That sleeping during prayer was acceptable since the disciples woke up when Jesus returned'],a:2,w:'The disciples\' sleep in Gethsemane (three times) was a spiritual failure at the most critical moment of Jesus\' life. He had specifically asked them to "watch and pray so that you will not fall into temptation" (26:41). Their failure to pray prepared them badly for the trials ahead — Peter would deny Jesus; all would flee. The contrast is stark: Jesus prayed through his struggle and emerged resolved; the disciples slept and were unprepared.'},{q:'The Triumphal Entry crowds shouted "Hosanna to the Son of David!" The title "Son of David" had what significance?',o:['It was a polite greeting meaning "long live the king" with no messianic implication','It acknowledged Jesus as a carpenter like his ancestor David who had built the Temple','It identified Jesus as the Messiah — the promised descendant of David who would restore Israel\'s kingdom, as promised in 2 Samuel 7:12-16','It was a misunderstanding — Jesus was not actually descended from David and Matthew includes the genealogy to correct this error'],a:3,w:'"Son of David" is a messianic title rooted in the Davidic covenant (2 Sam.7:12-16 — God promised David that one of his descendants would reign forever). Calling Jesus "Son of David" identified him as the long-awaited Messiah. The crowd\'s "Hosanna" (meaning "save us, we pray") was simultaneously a welcome and an appeal for the messianic salvation. Matthew emphasises this — his Gospel begins with the genealogy establishing Jesus as "son of David, son of Abraham" (1:1).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'Arrest, Trial and Crucifixion',su:'Examine the arrest, trials and crucifixion of Jesus.',steps:[
{lb:'The arrest (Matt 26:47-56)',dr:dQ2,ht:'<p>Judas came with a crowd armed with swords and clubs, sent by the chief priests. He had arranged a signal: "The one I kiss is the man; arrest him." He greeted Jesus "Greetings, Rabbi!" and kissed him. Jesus said: "Do what you came for, friend." One disciple cut off the ear of the high priest\'s servant; Jesus said: "Those who live by the sword will die by the sword." Jesus asked: could he not pray for twelve legions of angels? "But how then would the Scriptures be fulfilled?" Then all the disciples fled. The betrayal by a kiss — the most intimate greeting — is one of the most poignant details in the Passion narrative. Jesus was arrested in complete control, not helplessly.</p>'},
{lb:'The trials (Matt 26:57-27:26)',dr:dQ2,ht:'<p>Jesus faced multiple trials: (1) <b>Sanhedrin</b> (Jewish court) — accused of threatening the Temple; high priest asked if he was "the Messiah, the Son of God"; Jesus affirmed it and spoke of the Son of Man coming on clouds (Dan.7:13); condemned for blasphemy; mocked and beaten. (2) <b>Pilate</b> — "Are you the king of the Jews?" Jesus answered: "You have said so." Pilate found "no guilt" in Jesus three times yet condemned him. He washed his hands: "I am innocent of this man\'s blood." Crowd: "His blood is on us and on our children." (3) <b>Barabbas released</b> — a known rebel and murderer released instead of Jesus. Pilate\'s cowardice led to the crucifixion of the innocent.</p>'},
{lb:'The crucifixion (Matt 27:32-56)',dr:dQ2,ht:'<p>Key events at the cross: (1) <b>Golgotha</b> — "Place of the Skull." (2) <b>Mockery</b> — "He saved others but he can\'t save himself!" — an ironic truth. (3) <b>Three hours of darkness</b> (noon to 3pm). (4) <b>The cry of desolation</b> — "My God, my God, why have you forsaken me?" (Psalm 22:1). (5) <b>Death</b> — Jesus cried with a loud voice and gave up his spirit. (6) <b>Signs</b> — the temple curtain was torn in two from top to bottom; earth shook; tombs opened. (7) <b>The centurion\'s confession</b> — "Surely he was the Son of God!" — a Gentile Roman soldier made the highest confession at the cross. (8) <b>The women</b> — Mary Magdalene and others watched from a distance.</p>'},
{lb:'The resurrection (Matt 28:1-20)',dr:dQ2,ht:'<p>At dawn on the first day of the week, Mary Magdalene and the other Mary went to the tomb. An earthquake; an angel rolled away the stone and sat on it — "his appearance was like lightning." The guards shook with fear. The angel told the women: "He is not here; he has risen, just as he said." Jesus met them: "Do not be afraid. Go and tell my brothers to go to Galilee; there they will see me." On a mountain in Galilee, the eleven saw Jesus: they worshipped him (though some doubted). He gave the Great Commission: "All authority in heaven and on earth has been given to me. Therefore go and make disciples of all nations...I am with you always, to the very end of the age."</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The tearing of the temple curtain (Matt 27:51) from top to bottom at Jesus\' death symbolised:',o:['The destruction of the Temple that would happen in 70 CE — a prediction fulfilled 40 years later','God\'s anger at the Jewish leaders who had condemned Jesus','The removal of the barrier between God and humanity — direct access to God was now available to all through Christ\'s death; no high priest or sacrificial system needed as intermediary','A natural earthquake coincidence with no theological significance'],a:3,w:'The Temple curtain (the thick veil separating the Holy of Holies from the rest of the Temple) was torn from TOP TO BOTTOM — indicating God\'s act, not human action. This symbolised: (1) Direct access to God — no longer only through the high priest on Yom Kippur; (2) The end of the Temple sacrificial system — Jesus\' death was the final, complete sacrifice; (3) The Gentiles included — the Court of the Gentiles separation removed. Hebrews 10:19-20 applies this: "we have confidence to enter the Most Holy Place by the blood of Jesus."'},{q:'The centurion\'s confession "Surely he was the Son of God!" (Matt 27:54) is significant because:',o:['A Roman soldier\'s testimony was legally valid under Roman law and therefore officially confirmed Jesus\' divine identity','A Gentile pagan soldier was the first person to make the highest confession of Jesus\' identity at the cross — while the Jewish establishment mocked and the disciples had fled','This fulfilled a specific Old Testament prophecy about a Roman centurion at the cross','The centurion had previously met Jesus and was already a secret believer'],a:2,w:'Matthew 27:54 — the centurion who oversaw the crucifixion, on seeing the earthquake and events, said "Surely he was the Son of God!" This is theologically loaded: (1) A Roman Gentile made the highest Gospel confession ("Son of God") at the moment of the death. (2) The Jewish establishment had mocked; the disciples had fled; but a pagan soldier recognised who Jesus was. (3) This foreshadows the mission to the Gentiles — the centurion\'s confession is a preview of Matthew 28:19 ("make disciples of all nations").'},{q:'At the Sanhedrin trial, the high priest asked Jesus "Are you the Messiah, the Son of God?" Jesus replied:',o:['He remained completely silent and gave no answer to any question','He denied being the Messiah to avoid the charge of blasphemy','He affirmed it: "You have said so. And I say to all of you: from now on you will see the Son of Man sitting at the right hand of the Mighty One and coming on the clouds of heaven" (Matt 26:64) — this led to the blasphemy charge and the death sentence','He said only that he was a prophet, not the Messiah or Son of God'],a:3,w:'Matthew 26:64 — Jesus affirmed the high priest\'s question ("You have said so") and added a declaration from Daniel 7:13 and Psalm 110:1: "you will see the Son of Man sitting at the right hand of the Mighty One and coming on the clouds of heaven." The high priest tore his clothes: "He has spoken blasphemy!" (26:65). Jesus\' affirmation of his divine identity — at the moment of maximum vulnerability — was the charge that led to the death sentence.'},{q:'Pilate washed his hands and said "I am innocent of this man\'s blood" (Matt 27:24). This action showed:',o:['Pilate genuinely did not know Jesus was innocent','An act of moral cowardice — Pilate knew Jesus was innocent (finding "no guilt" three times) but surrendered to political pressure from the crowd; hand-washing did not remove his responsibility','A Jewish ritual that Pilate had learned to appease the crowd\'s religious sensibilities','That responsibility for the crucifixion rested entirely with the crowd and none with the Roman governor'],a:2,w:'Pilate declared Jesus not guilty three times (Luke 23:4,14,22), yet released Barabbas and handed Jesus over for crucifixion. His hand-washing was a theatrical gesture of political cowardice: he acknowledged Jesus\' innocence but prioritised political self-preservation over justice. Washing hands could not remove moral responsibility — Pilate condemned an innocent man. His act fulfilled Psalm 26:6 but reversed its meaning: Pilate washed his hands of justice, not righteousness.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'The Seven Last Words and Significance',su:'Examine the seven words from the cross and the significance of the Passion.',steps:[
{lb:'The seven last words from the cross',dr:dQ2,ht:'<p>The seven sayings of Jesus from the cross: (1) "Father, forgive them, for they do not know what they are doing" (Luke 23:34) — forgiveness even of his killers. (2) "Today you will be with me in paradise" (Luke 23:43) — to the repentant thief. (3) "Woman, here is your son... Here is your mother" (John 19:26-27) — entrusting Mary to John. (4) "My God, my God, why have you forsaken me?" (Matt.27:46 — Psalm 22:1) — the cry of desolation. (5) "I am thirsty" (John 19:28) — human reality. (6) "It is finished" (John 19:30 — tetelestai) — the Greek perfect tense: "it has been completed, once for all." (7) "Father, into your hands I commit my spirit" (Luke 23:46 — Psalm 31:5) — trusting surrender.</p>'},
{lb:'The significance of the Passion',dr:dQ2,ht:'<p>The Passion of Christ is theologically central to all Christianity: (1) <b>Fulfilment of prophecy</b> — Isaiah 53 (suffering servant); Psalm 22 (cry of desolation); Zechariah 9:9 (entry on donkey); many others. (2) <b>Sacrifice for sins</b> — "blood poured out for the forgiveness of sins" (Matt.26:28). (3) <b>Victory over death</b> — the resurrection is the proof that the cross was not defeat but conquest. (4) <b>Model of love</b> — "greater love has no one than this: to lay down one\'s life for one\'s friends" (John 15:13). (5) <b>New covenant</b> — Jesus\' blood establishes the new covenant promised in Jeremiah 31. (6) <b>Universal scope</b> — "for many" (Matt.26:28); "all nations" (Matt.28:19).</p>'},
{lb:'WAEC preparation — Passion',dr:dQ1,ht:'<p>WAEC essays on the Passion: Common questions: "Describe the events of the Last Supper and their significance." "Give an account of the trial of Jesus before Pilate." "Describe the crucifixion of Jesus and what happened when he died." "What were the events of the first Easter day?" "Examine the significance of the Passion and Resurrection for Christian faith." Key references: Triumphal Entry — Matt.21:1-11 (Zech.9:9). Last Supper — Matt.26:26-28. Gethsemane — Matt.26:39. Betrayal — Matt.26:47-56. Sanhedrin — Matt.26:57-68. Pilate — Matt.27:11-26. Crucifixion — Matt.27:32-56. Resurrection — Matt.28:1-20. Seven Last Words — from Luke, Matthew and John. Know these in order and with references.</p>'},
{lb:'Mixed revision — Passion',dr:dQ10,ht:'<p>Passion of Christ summary: Triumphal Entry (Matt.21:1-11 — colt; Zech.9:9; Hosanna; Son of David). Temple cleansing (Matt.21:12-13 — Isa.56:7; Jer.7:11). Last Supper (Matt.26:17-30 — body/blood; new covenant; forgiveness of sins; Judas identified). Gethsemane (Matt.26:36-46 — "not as I will"; three prayers; disciples slept). Arrest (Matt.26:47-56 — Judas kiss; disciples fled). Sanhedrin (Matt.26:57-68 — blasphemy; Son of Man on clouds; mocking). Pilate (Matt.27:11-26 — no guilt three times; Barabbas; hand-washing). Crucifixion (Matt.27:32-56 — Golgotha; three hours dark; cry of desolation; curtain torn; centurion\'s confession). Resurrection (Matt.28:1-20 — angel; "He is risen"; Great Commission). Seven Last Words: forgiveness (Luke 23:34); paradise (Luke 23:43); Mary/John (John 19:26-27); desolation (Matt.27:46); thirst (John 19:28); finished/tetelestai (John 19:30); commendation (Luke 23:46).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Jesus\' cry "My God, my God, why have you forsaken me?" (Matt 27:46) was a quotation from:',o:['Isaiah 53:3 — "he was despised and rejected by mankind"','Jeremiah 20:7 — "you deceived me, Lord, and I was deceived"','Psalm 22:1 — a psalm of David that begins with desolation but ends in praise and victory','Lamentations 3:1 — "I am the man who has seen affliction"'],a:3,w:'Psalm 22:1 — "My God, my God, why have you forsaken me?" By quoting this Psalm, Jesus: (1) expressed genuine human experience of God-forsakenness at the cross; (2) identified with the suffering righteous person of Psalm 22; and (3) pointed toward the Psalm\'s resolution — it ends not in abandonment but in vindication and praise (Ps.22:22-31). The whole Psalm describes the crucifixion in remarkable detail: mocking (22:7-8), pierced hands and feet (22:16), casting lots for garments (22:18).'},{q:'"It is finished" (tetelestai — John 19:30) uses the Greek perfect tense to mean:',o:['Jesus admitted defeat — the mission had ended in failure','The physical suffering was finally over after six hours on the cross','The work of salvation has been completed, once for all — tetelestai was a commercial term meaning "paid in full"; sin\'s debt is cancelled, the sacrifice complete, nothing more needed','Jesus was telling his disciples that his teaching ministry was complete and they now had all they needed'],a:3,w:'"Tetelestai" (τετέλεσται) is the Greek perfect tense — indicating a completed action with ongoing effects. It was used on receipts to mean "paid in full." John 19:30 announces: the atonement is complete, the sacrifice is made, the sin debt is cancelled, once for all. Nothing more can be added to what was accomplished at the cross. This word is the theological heart of the Passion — the finished work of Christ.'},{q:'The Barabbas episode (Matt 27:15-26) — releasing a known criminal instead of Jesus — demonstrates:',o:['That Pilate was following standard Roman legal procedure fairly','The substitutionary principle — an innocent man freed while the guilty was condemned; the innocent took the guilty one\'s punishment, mirroring the atonement','That the crowds were correct to prefer Barabbas since he was more popular','Pilate\'s commitment to justice overriding political pressure'],a:2,w:'Barabbas — a "notorious prisoner" (Matt.27:16), a rebel and murderer (Mark 15:7) — was released while Jesus, declared innocent by Pilate three times, was condemned. The innocent died in the guilty man\'s place. Many theologians see this as a picture of substitutionary atonement: Barabbas represents guilty humanity freed by the innocent Jesus taking the punishment. The pattern is the same as Isaiah 53:5 — "he was pierced for our transgressions; he was crushed for our iniquities."'},{q:'The angel said to the women at the tomb "He is not here; he has risen, just as he said" (Matt 28:6). The phrase "just as he said" refers to:',o:['Old Testament prophecies about the resurrection of the dead at the end of the age','Jesus\' specific predictions of his death and resurrection after three days (Matt 16:21; 17:22-23; 20:18-19) — the resurrection was not a surprise but the fulfilment of explicit predictions','The Lord\'s Prayer petition "your kingdom come" which was fulfilled at the resurrection','The covenant God made with Abraham about the resurrection of Isaac'],a:2,w:'"Just as he said" refers to Jesus\' explicit resurrection predictions: "He will be killed and on the third day be raised to life" (Matt.16:21; 17:23; 20:19). The disciples had not believed or understood these predictions (Matt.16:22 — Peter rebuked Jesus for saying this). The resurrection was not a surprise to Jesus — he had announced it repeatedly. The angel\'s "just as he said" vindicates Jesus\' teaching and calls the disciples to remember and believe.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
